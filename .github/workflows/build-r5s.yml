name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_BRANCH: 'openwrt-25.12'
  FLAVOR: 'r5s'
  TARGET_OS: 'friendlywrt25'
  MODEL_NAME: 'R5S-R5C-Series'
  FRIENDLY_VER: '25.12'
  GOPROXY: 'https://goproxy.cn,direct'
  GOFLAGS: '-mod=mod'
  GOMODCACHE: '/tmp/go-mod-cache'
  CCACHE_DIR: '/home/runner/.ccache'
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: '3G'
  ROOTFS_PARTSIZE: '1024'
  ENABLE_DOCKER: 'true'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Reclaim disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    /usr/share/swift /usr/local/.ghcup /opt/az || true
        sudo apt-get clean
        df -h /

    - name: Add swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile > /dev/null
        sudo swapon /swapfile
        free -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-dev python3-distutils python3-setuptools \
          python3-pip python3-venv python3-pyelftools rsync subversion swig time \
          xsltproc zlib1g-dev \
          bison flex libtool libtool-bin pkg-config \
          libgmp-dev libmpc-dev libmpfr-dev \
          gperf patch quilt cpio \
          liblzma-dev libbz2-dev \
          device-tree-compiler u-boot-tools \
          bzip2 xz-utils zip unzip wget curl \
          autoconf automake autopoint texinfo help2man \
          aria2 bc whiptail mercurial lib32stdc++6 \
          android-sdk-libsparse-utils e2fsprogs parted dosfstools mtools lz4
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
        python3 -c "import elftools" 2>/dev/null || pip3 install --quiet pyelftools
        mkdir -p ./artifact
        echo "CPU cores: $(nproc)"
        echo "ccache version: $(ccache --version | head -1)"

    - name: Prepare OpenWrt workspace
      run: |
        mkdir -p project
        cd project
        git clone --depth 1 -b ${{ env.OPENWRT_BRANCH }} \
          https://github.com/openwrt/openwrt.git friendlywrt > /dev/null 2>&1
        cd friendlywrt
        ./scripts/feeds update -a > /dev/null 2>&1 || ./scripts/feeds update -a
        ./scripts/feeds install -a > /dev/null 2>&1
        rm -f feeds.conf
        cd ..
        mkdir -p configs/rockchip
        touch configs/rockchip/01-nanopi
        echo "OpenWrt workspace prepared"

    - name: Initialize .config with R5S target
      run: |
        cd project/friendlywrt
        cat > .config <<EOF
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_CCACHE=y
        CONFIG_CCACHE_DIR="$CCACHE_DIR"
        CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE

        # ===== Docker 相关 =====
        CONFIG_PACKAGE_docker=y
        CONFIG_PACKAGE_dockerd=y
        CONFIG_PACKAGE_docker-compose=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
        CONFIG_PACKAGE_luci-lib-docker=y

        # ===== Docker 内核选项 =====
        CONFIG_DOCKER_KERNEL_OPTIONS=y
        CONFIG_DOCKER_NET_OVERLAY=y
        EOF
        yes "" | make oldconfig > /dev/null 2>&1 || make defconfig > /dev/null 2>&1
        echo "=== 初始配置检查 ==="
        grep -E "^CONFIG_(CCACHE|TARGET_ROOTFS_PARTSIZE|PACKAGE_docker|PACKAGE_dockerd|PACKAGE_luci-app-dockerman|DOCKER_)" .config

    - name: Verify 6.12 kernel availability
      run: |
        cd project/friendlywrt
        if [ -d target/linux/rockchip/patches-6.12 ] && [ -f target/linux/rockchip/armv8/config-6.12 ]; then
          echo "[OK] OpenWrt Rockchip target uses kernel 6.12"
        else
          echo "::error::6.12 kernel artifacts not found"
          exit 1
        fi

    - name: Bridge add_packages.sh kernel config path
      run: |
        cd project/friendlywrt/target/linux/rockchip
        if [ ! -e config-6.1 ]; then
          ln -s armv8/config-6.12 config-6.1
        fi
        ls -la config-6.1

    - name: Apply customizations
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Patch file Makefile dependencies
      run: |
        cd project/friendlywrt
        FILE_MK="feeds/packages/libs/file/Makefile"
        [ -f "$FILE_MK" ] || { echo "::error::$FILE_MK not found"; exit 1; }

        echo "=== file Makefile Package/libmagic 原始定义 ==="
        awk '/^define Package\/libmagic/,/^endef/' "$FILE_MK" || true

        yes "" | make oldconfig > /dev/null 2>&1 || make defconfig > /dev/null 2>&1 || true

        for hint in libbz2 liblzma zlib; do
          echo "--- kconfig ${hint} ---"
          grep -oE "config PACKAGE_${hint}[-0-9._]*" tmp/.config-package.in 2>/dev/null \
            | awk '{print $2}' | sort -u || echo "(none)"
        done

        python3 - "$FILE_MK" <<'PY'
        import re, sys, pathlib
        p = pathlib.Path(sys.argv[1])
        txt = p.read_text()
        m = re.search(r'(define Package/libmagic\b.*?DEPENDS:=)([^\n]*)', txt, flags=re.S)
        if not m:
            print("PATTERN NOT FOUND")
            sys.exit(0)
        deps = m.group(2)
        added = []
        for r in ['+libbz2', '+liblzma']:
            if r not in deps:
                deps += " " + r
                added.append(r)
        if added:
            txt = txt[:m.start(2)] + deps + txt[m.end(2):]
            p.write_text(txt)
            print(f"PATCHED: {added}")
        else:
            print("No change")
        PY

        SYMS="PACKAGE_libbz2 PACKAGE_liblzma PACKAGE_zlib"
        for hint in libbz2 liblzma zlib; do
          found=$(grep -oE "config PACKAGE_${hint}[-0-9._]*" tmp/.config-package.in 2>/dev/null \
                    | awk '{print $2}' | sort -u || true)
          SYMS="${SYMS} ${found}"
        done
        for sym in $SYMS; do
          [ -z "$sym" ] && continue
          sed -i "/^# CONFIG_${sym} is not set/d" .config
          sed -i "/^CONFIG_${sym}=/d" .config
          echo "CONFIG_${sym}=y" >> .config
        done
        yes "" | make oldconfig > /dev/null 2>&1 || make defconfig > /dev/null 2>&1
        echo "依赖已就位"

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ env.OPENWRT_BRANCH }}-${{ env.FLAVOR }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ env.OPENWRT_BRANCH }}-${{ env.FLAVOR }}-
          ccache-${{ env.OPENWRT_BRANCH }}-

    - name: Restore downloads (dl)
      uses: actions/cache@v4
      with:
        path: project/friendlywrt/dl
        key: dl-${{ env.OPENWRT_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          dl-${{ env.OPENWRT_BRANCH }}-

    - name: Restore Go module cache
      uses: actions/cache@v4
      with:
        path: /tmp/go-mod-cache
        key: gomod-${{ env.OPENWRT_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          gomod-${{ env.OPENWRT_BRANCH }}-

    - name: Configure ccache
      run: |
        mkdir -p "$CCACHE_DIR"
        ccache --max-size=3G
        ccache --set-config=compression=true
        ccache --set-config=compiler_check=content
        ccache --set-config=cache_dir="$CCACHE_DIR"
        ccache -s || true

    - name: Force correct .config values
      run: |
        cd project/friendlywrt

        # CCACHE
        sed -i '/^CONFIG_CCACHE_DIR=/d' .config
        sed -i '/^# CONFIG_CCACHE_DIR is not set/d' .config
        echo "CONFIG_CCACHE_DIR=\"$CCACHE_DIR\"" >> .config
        sed -i '/^CONFIG_CCACHE=/d' .config
        sed -i '/^# CONFIG_CCACHE is not set/d' .config
        echo "CONFIG_CCACHE=y" >> .config

        # ROOTFS_PARTSIZE
        sed -i '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d' .config
        sed -i '/^# CONFIG_TARGET_ROOTFS_PARTSIZE is not set/d' .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE" >> .config

        # Docker 相关包
        for pkg in docker dockerd docker-compose luci-app-dockerman luci-i18n-dockerman-zh-cn luci-lib-docker; do
          sed -i "/^CONFIG_PACKAGE_${pkg}=/d" .config
          sed -i "/^# CONFIG_PACKAGE_${pkg} is not set/d" .config
          echo "CONFIG_PACKAGE_${pkg}=y" >> .config
        done

        # Docker 内核选项
        sed -i '/^CONFIG_DOCKER_KERNEL_OPTIONS=/d' .config
        echo "CONFIG_DOCKER_KERNEL_OPTIONS=y" >> .config
        sed -i '/^CONFIG_DOCKER_NET_OVERLAY=/d' .config
        echo "CONFIG_DOCKER_NET_OVERLAY=y" >> .config

        echo "=== 强制修正后的关键配置 ==="
        grep -E "^CONFIG_(CCACHE|TARGET_ROOTFS_PARTSIZE|PACKAGE_docker|PACKAGE_dockerd|PACKAGE_luci-app-dockerman|DOCKER_)" .config

    - name: Download packages
      run: |
        cd project/friendlywrt
        make download -j$(nproc) > /tmp/dl1.log 2>&1 || true
        find dl -type f -size -1024c -delete 2>/dev/null || true
        make download -j$(nproc) > /tmp/dl2.log 2>&1 || true
        echo "dl: $(find dl -type f | wc -l) 文件, $(du -sh dl | awk '{print $1}')"

    - name: Compile OpenWrt
      run: |
        cd project/friendlywrt

        # 强制恢复关键配置（set -e 安全版本）
        restore_critical_cfg() {
          local need_save=false
          if ! grep -q "^CONFIG_CCACHE_DIR=\"$CCACHE_DIR\"" .config; then
            sed -i '/^CONFIG_CCACHE_DIR=/d' .config
            sed -i '/^# CONFIG_CCACHE_DIR is not set/d' .config
            echo "CONFIG_CCACHE_DIR=\"$CCACHE_DIR\"" >> .config
            need_save=true
          fi
          if ! grep -q "^CONFIG_CCACHE=y" .config; then
            echo "CONFIG_CCACHE=y" >> .config
            need_save=true
          fi
          if ! grep -q "^CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE" .config; then
            sed -i '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d' .config
            sed -i '/^# CONFIG_TARGET_ROOTFS_PARTSIZE is not set/d' .config
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE" >> .config
            need_save=true
          fi
          for pkg in docker dockerd docker-compose luci-app-dockerman luci-i18n-dockerman-zh-cn luci-lib-docker; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              sed -i "/^CONFIG_PACKAGE_${pkg}=/d" .config
              sed -i "/^# CONFIG_PACKAGE_${pkg} is not set/d" .config
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
              need_save=true
            fi
          done
          if ! grep -q "^CONFIG_DOCKER_KERNEL_OPTIONS=y" .config; then
            sed -i '/^CONFIG_DOCKER_KERNEL_OPTIONS=/d' .config
            echo "CONFIG_DOCKER_KERNEL_OPTIONS=y" >> .config
            need_save=true
          fi
          if [ "$need_save" = "true" ]; then
            echo "[CFG] 已修复配置："
            grep -E "^CONFIG_(CCACHE|TARGET_ROOTFS_PARTSIZE|PACKAGE_docker|PACKAGE_dockerd|PACKAGE_luci-app-dockerman|DOCKER_)" .config
          fi
          return 0
        }

        echo "===== 编译前关键配置 ====="
        restore_critical_cfg

        # ---- 分阶段编译 ----
        for s in tools/compile toolchain/compile target/compile package/compile; do
          echo "========== STAGE: $s ($(date +%H:%M:%S)) =========="
          restore_critical_cfg > /dev/null 2>&1
          LOG="/tmp/build_$(echo $s|tr '/' '_').log"
          if ! make -j$(nproc) "$s" > "$LOG" 2>&1; then
            echo "::error::STAGE FAILED: $s"
            FAILED=$(grep -oE "ERROR: package/[^ ]+ failed to build" "$LOG" | head -1 | awk '{print $2}')
            tail -80 "$LOG"
            [ -n "$FAILED" ] && { echo "=== Verbose rebuild ==="; make -j1 V=s "$FAILED/compile" 2>&1 | tail -150 || true; }
            exit 1
          fi
          echo "  [DONE] $s ($(date +%H:%M:%S))"
        done

        # ---- 最终 make ----
        echo "========== STAGE: final make ($(date +%H:%M:%S)) =========="
        restore_critical_cfg > /dev/null 2>&1
        LOG="/tmp/build_final.log"
        if make -j$(nproc) > "$LOG" 2>&1; then
          echo "  [DONE] final make ($(date +%H:%M:%S))"
        else
          echo "::warning::首次 final make 失败，启动诊断流程..."
          echo "===== 失败目标 ====="
          grep -E "ERROR: (target|package|toolchain|tool)/[^ ]+ failed" "$LOG" | tail -10 || true
          grep -E "make\[[0-9]+\]: \*\*\*" "$LOG" | tail -10 || true

          # 场景 1：rootfs 磁盘空间不足
          if grep -qE "out of space|failed to allocate" "$LOG"; then
            echo "===== 检测到 rootfs 空间不足，扩大分区 ====="
            grep -E "Size: [0-9]+|out of space" "$LOG" | tail -5 || true

            ROOTFS_DIR=$(find build_dir/target-* -maxdepth 1 -type d -name "root-*" | head -1)
            if [ -n "$ROOTFS_DIR" ]; then
              ACTUAL_MB=$(du -s -m "$ROOTFS_DIR" | awk '{print $1}')
              NEEDED_MB=$(( (ACTUAL_MB + 64 + 63) / 64 * 64 ))
              NEW_PARTSIZE=$(( NEEDED_MB + 256 ))
              echo "当前 rootfs 实际大小: ${ACTUAL_MB} MB"
              echo "新分区大小: ${NEW_PARTSIZE} MB"

              sed -i '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d' .config
              echo "CONFIG_TARGET_ROOTFS_PARTSIZE=$NEW_PARTSIZE" >> .config
              grep -E "^CONFIG_TARGET_ROOTFS_PARTSIZE" .config

              rm -f build_dir/target-*/linux-rockchip_armv8/root.ext4* 2>/dev/null || true
              rm -f build_dir/target-*/linux-rockchip_armv8/root.squashfs 2>/dev/null || true
              rm -f build_dir/target-*/linux-rockchip_armv8/*.img 2>/dev/null || true
            fi
          fi

          # 场景 2：target/linux install 失败（内核配置漂移）
          if grep -qE "ERROR: target/linux failed" "$LOG" && ! grep -qE "out of space" "$LOG"; then
            echo "===== 检测到 target/linux 失败，尝试内核配置同步 ====="
            make defconfig > /dev/null 2>&1 || true
            yes "" | make oldconfig > /dev/null 2>&1 || true
            restore_critical_cfg > /dev/null 2>&1

            echo "----- 详细重跑 target/linux/install -----"
            make -j1 V=s target/linux/install 2>&1 | tee /tmp/kernel_install.log | tail -100 || true
          fi

          # 场景 3：其他包失败
          FAILED_PKG=$(grep -oE "ERROR: package/[^ ]+ failed" "$LOG" | head -1 | sed 's|ERROR: ||; s| failed||')
          if [ -n "$FAILED_PKG" ]; then
            echo "===== $FAILED_PKG 失败，详细重跑 ====="
            make -j1 V=s "$FAILED_PKG/compile" 2>&1 | tail -200 || true
          fi

          echo "===== 诊断完成，重试完整 final make ====="
          restore_critical_cfg > /dev/null 2>&1
          if ! make -j$(nproc) > /tmp/build_final_retry.log 2>&1; then
            echo "::error::最终 make 重试仍失败"
            tail -200 /tmp/build_final_retry.log
            exit 1
          fi
          echo "  [DONE] final make (retry) ($(date +%H:%M:%S))"
        fi

        echo "=== OpenWrt 编译完成 ==="
        ls -la build_dir/target-*/root-* 2>/dev/null | head -5 || echo "(未找到 rootfs)"
        ls -lh bin/targets/rockchip/armv8/*.img.gz 2>/dev/null || echo "(未找到原生镜像)"

    - name: Show ccache stats
      if: always()
      run: |
        echo "=== ccache 最终统计 ==="
        ccache -s || true
        du -sh "$CCACHE_DIR" 2>/dev/null || true

    # ---- 后续步骤保持原样 ----
    - name: Locate kernel artifacts
      run: |
        cd project/friendlywrt

        TRIPLE_DIR=$(find build_dir -maxdepth 1 -type d -name "target-*_musl" | head -1)
        [ -z "$TRIPLE_DIR" ] && { echo "::error::target triple not found"; ls -la build_dir/ | head -20; exit 1; }
        echo "TRIPLE_DIR=$TRIPLE_DIR"
        echo "TRIPLE_DIR=$TRIPLE_DIR" >> $GITHUB_ENV

        KDIR=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "linux-rockchip*" | head -1)
        [ -z "$KDIR" ] && { echo "::error::linux-rockchip dir not found"; ls -la "$TRIPLE_DIR/"; exit 1; }
        echo "KDIR=$KDIR" >> $GITHUB_ENV
        echo "[OK] KDIR: $KDIR"

        IMG=$(find "$KDIR" -path "*/arch/arm64/boot/Image" -type f 2>/dev/null | head -1)
        [ -z "$IMG" ] && IMG=$(find "$KDIR" -maxdepth 4 -name "Image" -type f 2>/dev/null | head -1)
        [ -z "$IMG" ] && { echo "::error::Kernel Image not found"; find "$KDIR" -name Image -type f | head; exit 1; }
        echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV
        echo "[OK] Image: $IMG ($(du -h $IMG | awk '{print $1}'))"

        DTB_DIR=$(find "$KDIR" -path "*/arch/arm64/boot/dts/rockchip" -type d 2>/dev/null | head -1)
        [ -z "$DTB_DIR" ] && DTB_DIR=$(find "$KDIR" -maxdepth 5 -type d -name "rockchip" -path "*dts*" | head -1)
        [ -z "$DTB_DIR" ] && { echo "::error::DTB dir not found"; find "$KDIR" -type d -name "dts*" | head; exit 1; }
        echo "DTB_DIR=$DTB_DIR" >> $GITHUB_ENV
        echo "[OK] DTB dir: $DTB_DIR"

        ROOTFS_SRC=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "root-*" | head -1)
        [ -z "$ROOTFS_SRC" ] && { echo "::error::Rootfs dir not found"; ls "$TRIPLE_DIR/" | head; exit 1; }
        echo "ROOTFS_SRC=$ROOTFS_SRC" >> $GITHUB_ENV
        echo "[OK] Rootfs: $ROOTFS_SRC ($(du -sh $ROOTFS_SRC | awk '{print $1}'))"

        KV=$(ls "$ROOTFS_SRC/lib/modules/" 2>/dev/null | head -1)
        echo "KV=$KV" >> $GITHUB_ENV
        echo "[OK] Kernel modules version: $KV"
        [[ "$KV" == 6.12* ]] || { echo "::error::kernel modules 不是 6.12，实际 $KV"; exit 1; }

    - name: Clone sd-fuse_rk3568
      run: |
        cd project
        git clone --depth 1 https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse
        cd sd-fuse
        [ -f mk-emmc-image.sh ] || { echo "::error::mk-emmc-image.sh missing"; exit 1; }
        echo "[OK] sd-fuse ready"

    - name: Package 6.12 kernel
      run: |
        cd project
        SF="sd-fuse"
        TGT="$SF/$TARGET_OS"
        mkdir -p "$TGT"

        "$SF/tools/mkkrnlimg" "$IMAGE_PATH" "$TGT/kernel.img"
        [ -f "$TGT/kernel.img" ] || { echo "::error::kernel.img 未生成"; exit 1; }
        ls -lh "$TGT/kernel.img"

        cp "$TGT/kernel.img" "$TGT/boot.img"

    - name: Package resource.img
      run: |
        cd project
        SF="sd-fuse"
        TGT="$SF/$TARGET_OS"

        rm -rf /tmp/dtb-pack
        mkdir -p /tmp/dtb-pack
        cp -a "$DTB_DIR"/*.dtb /tmp/dtb-pack/ 2>/dev/null || true

        if [ -f /tmp/dtb-pack/rk3568-nanopi-r5s.dtb ]; then
          cp /tmp/dtb-pack/rk3568-nanopi-r5s.dtb /tmp/dtb-pack/rk-kernel.dtb
        fi

        cd /tmp/dtb-pack
        DTB_LIST=$(ls *.dtb 2>/dev/null | tr '\n' ' ')
        cd - > /dev/null
        [ -z "$DTB_LIST" ] && { echo "::error::no dtb files"; exit 1; }

        "$SF/tools/resource_tool" --pack \
          --root=/tmp/dtb-pack \
          --image="$PWD/$TGT/resource.img" \
          $DTB_LIST

        [ -f "$TGT/resource.img" ] || { echo "::error::resource.img 未生成"; exit 1; }
        ls -lh "$TGT/resource.img"

    - name: Stage U-Boot binaries
      run: |
        cd project/sd-fuse
        TGT="$TARGET_OS"
        for f in uboot.img idbloader.img MiniLoaderAll.bin misc.img dtbo.img; do
          [ -f "prebuilt/$f" ] && cp -v "prebuilt/$f" "$TGT/$f"
        done

    - name: Build rootfs.img
      run: |
        cd project/sd-fuse
        TGT="$TARGET_OS"

        rm -rf /tmp/rootfs-pack
        cp -a "$GITHUB_WORKSPACE/project/friendlywrt/$ROOTFS_SRC" /tmp/rootfs-pack
        (cd /tmp/rootfs-pack/dev && find . ! -type d -exec rm -f {} \; ) 2>/dev/null || true

        echo "=== rootfs 内核模块 ==="
        ls /tmp/rootfs-pack/lib/modules/
        find /tmp/rootfs-pack/lib/modules -name "*.ko" | wc -l

        MKFS="$PWD/tools/mke2fs"
        MKFS_CONF="$PWD/tools/mke2fs.conf"
        ROOTFS_DIR=/tmp/rootfs-pack
        IMG_SIZE=$(( (`du -s -B64M $ROOTFS_DIR | cut -f1` + 3) * 1024 * 1024 * 64 ))
        IMG_BLK=$(( $IMG_SIZE / 4096 ))
        INODE_SIZE=$(( `find $ROOTFS_DIR | wc -l` + 128 ))

        rm -f "$TGT/rootfs.img"
        MKE2FS_CONFIG="$MKFS_CONF" \
          "$MKFS" -N "$INODE_SIZE" \
            -E android_sparse -t ext4 -L rootfs -M /root -b 4096 -0 \
            -d "$ROOTFS_DIR" "$TGT/rootfs.img" "$IMG_BLK"

        [ -f "$TGT/rootfs.img" ] || { echo "::error::rootfs.img 生成失败"; exit 1; }
        ls -lh "$TGT/rootfs.img"
        echo "ROOTFS_SIZE_BYTES=$(stat -c%s "$TGT/rootfs.img")" >> $GITHUB_ENV

    - name: Generate parameter.txt
      run: |
        cd project/sd-fuse
        PARAMETER_TPL="$PWD/prebuilt/parameter.template" \
          ./tools/generate-partmap-txt.sh "$ROOTFS_SIZE_BYTES" "$TARGET_OS"
        echo "=== parameter.txt ==="
        cat "$TARGET_OS/parameter.txt"

    - name: Build SD card image
      run: |
        cd project/sd-fuse
        export SDFUSE_NONINTERACTIVE=y
        sudo -E ./mk-sd-image.sh "$TARGET_OS" 2>&1 | tee /tmp/sd-image.log | tail -40 || {
          echo "::warning::mk-sd-image.sh 非零退出"
          tail -80 /tmp/sd-image.log
        }
        ls -lh out/ 2>/dev/null || echo "(无 out/)"

    - name: Build eMMC flasher image
      run: |
        cd project/sd-fuse
        export SDFUSE_NONINTERACTIVE=y
        sudo -E ./mk-emmc-image.sh "$TARGET_OS" autostart=yes 2>&1 | tee /tmp/emmc-image.log | tail -40 || {
          echo "::warning::mk-emmc-image.sh 非零退出"
          tail -80 /tmp/emmc-image.log
        }
        ls -lh out/images-for-eflasher/ 2>/dev/null || true

    - name: Rename artifacts with clear FriendlyWrt-style names
      run: |
        cd project/sd-fuse

        SRC_IMG=$(find out -maxdepth 1 -name "*.img" -type f | head -1)
        if [ -n "$SRC_IMG" ] && [ -s "$SRC_IMG" ]; then
          DST_NAME="${MODEL_NAME}-FriendlyWrt-${FRIENDLY_VER}.img"
          cp "$SRC_IMG" "/tmp/${DST_NAME}"
          gzip -f "/tmp/${DST_NAME}"
          cp "/tmp/${DST_NAME}.gz" ../../artifact/
          echo "[OK] SD image: ${DST_NAME}.gz"
        else
          echo "::warning::未找到 sd-fuse 生成的 .img"
        fi

        SRC_TGZ=$(find out -maxdepth 3 -name "*-images.tgz" -type f | head -1)
        if [ -n "$SRC_TGZ" ] && [ -s "$SRC_TGZ" ]; then
          DST_NAME="images-${MODEL_NAME}-FriendlyWrt-${FRIENDLY_VER}.tgz"
          cp "$SRC_TGZ" "../../artifact/${DST_NAME}"
          echo "[OK] eMMC pack: ${DST_NAME}"
        else
          echo "::warning::未找到 eMMC 刷机包"
        fi

        OPENWRT_SYSUP=$(find ../friendlywrt/bin/targets/rockchip/armv8 -maxdepth 1 \
          -name "*nanopi-r5s*sysupgrade.img.gz" -type f 2>/dev/null | head -1)
        if [ -n "$OPENWRT_SYSUP" ]; then
          DST_NAME="${MODEL_NAME}-OpenWrt-${FRIENDLY_VER}-sysupgrade.img.gz"
          cp "$OPENWRT_SYSUP" "../../artifact/${DST_NAME}"
          echo "[OK] OpenWrt native: ${DST_NAME}"
        fi

        OPENWRT_MANIFEST=$(find ../friendlywrt/bin/targets/rockchip/armv8 -maxdepth 1 \
          -name "*nanopi-r5s*.manifest" -type f 2>/dev/null | head -1)
        [ -n "$OPENWRT_MANIFEST" ] && cp "$OPENWRT_MANIFEST" "../../artifact/"

    - name: Generate SHA256 and README
      run: |
        cd artifact
        for f in *; do
          [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS
        done

        cat > README.txt <<EOF
        FriendlyWrt for NanoPi R5S — Build $(date +%Y-%m-%d)
        ============================================================
        发行标签: ${{ needs.prepare_release.outputs.release_tag }}
        内核版本: 6.12 (OpenWrt 官方 openwrt-25.12 分支)
        基础系统: OpenWrt 25.12 + Clashoo + Bootstrap 主题
        rootfs 分区: 1024 MB
        Docker: 已集成 (docker + dockerd + docker-compose + LuCI)

        产物说明
        --------
        1. ${MODEL_NAME}-FriendlyWrt-${FRIENDLY_VER}.img.gz
           → SD 卡完整镜像，gunzip 后 dd 到 SD 卡
        2. images-${MODEL_NAME}-FriendlyWrt-${FRIENDLY_VER}.tgz
           → eMMC 刷机包
        3. ${MODEL_NAME}-OpenWrt-${FRIENDLY_VER}-sysupgrade.img.gz
           → OpenWrt 官方原生镜像（备用）
        4. SHA256SUMS
           → 所有产物校验和

        刷机后验证：
        - uname -r 应显示 6.12.x
        - 在 LuCI 中应看到 Docker 菜单项
        - 终端执行 docker --version 应显示 Docker 版本
        EOF

        ls -lh

    - name: Verify 6.12 kernel in final firmware
      run: |
        cd project/sd-fuse
        echo "=== 最终固件内核版本核验 ==="
        strings "$TARGET_OS/kernel.img" 2>/dev/null | grep -oE "Linux version [0-9]+\.[0-9]+\.[0-9]+" | head -1
        ls /tmp/rootfs-pack/lib/modules/ 2>/dev/null

    - name: Upload all artifacts to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/*
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
        file_glob: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}