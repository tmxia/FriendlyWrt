name: Kernel Watcher

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  models: read

jobs:
  check_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit SHA for nanopi6-v6.1.y
        id: sha
        run: |
          SHA=$(curl -s https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/nanopi6-v6.1.y | jq -r .sha)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current SHA: $SHA"

      - name: Read recorded SHA
        id: recorded
        run: |
          if [ -f .kernel-version ]; then
            RECORDED=$(head -n1 .kernel-version | tr -d '[:space:]')
          else
            RECORDED="none"
          fi
          echo "recorded=$RECORDED" >> $GITHUB_OUTPUT
          echo "Recorded SHA: $RECORDED"

      - name: Fetch upstream commit titles
        id: commits
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        run: |
          if [ "${{ steps.recorded.outputs.recorded }}" = "none" ]; then
            TITLES=$(curl -s "https://api.github.com/repos/friendlyarm/kernel-rockchip/commits?sha=${{ steps.sha.outputs.sha }}&per_page=50" \
                     | jq -r '.[] | .commit.message | split("\n")[0]')
          else
            TITLES=$(curl -s "https://api.github.com/repos/friendlyarm/kernel-rockchip/compare/${{ steps.recorded.outputs.recorded }}...${{ steps.sha.outputs.sha }}" \
                     | jq -r '.commits[].commit.message | split("\n")[0]')
          fi
          TITLES=$(printf '%s\n' "$TITLES" | awk 'NF' | head -n 50 | cut -c1-250)
          {
            echo "titles<<__EOF__"
            echo "$TITLES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Commit titles count: $(printf '%s\n' "$TITLES" | wc -l)"

      - name: Generate Chinese summary
        id: summary
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLES: ${{ steps.commits.outputs.titles }}
        run: |
          if [ -z "$TITLES" ]; then
            echo "summary=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$TITLES" > /tmp/titles.txt
          INPUT_COUNT=$(awk 'NF' /tmp/titles.txt | wc -l | tr -d ' ')
          echo "Input titles: $INPUT_COUNT"

          # =================================================================
          # 路径 1：GitHub Models —— LLM 自主翻译
          # =================================================================
          PROMPT=$(cat <<EOF
你是 Linux 内核更新日志翻译助手。请把下列英文提交标题逐条翻译成中文要点。

严格规则：
1. 输入 N 条，输出 N 条，每条一行，以 "- " 开头；不得合并、拆分或遗漏
2. 术语保留英文原文（例如 hci_uart、hci_aic、dts、panfrost、Bifrost、BT_HCIUART_AIC、nanopi-r28s、rtl8822cs-bt、NET_SCH_FQ_CODEL、virtual-connector、cts-detect-wait-ms）
3. 子系统前缀翻译成中文类别：
   - Bluetooth: → 蓝牙
   - dts: rockchip: 或 ARM64: dts: rockchip: → 设备树
   - arm64: configs: 或 ARM64: configs: → 内核配置
   - drm/panfrost: → 图形驱动 panfrost
4. 不输出 Signed-off-by、Reviewed-by、Link、上游 commit id 等元信息
5. 不编造输入中不存在的内容
6. 直接输出要点列表，不要代码块、不要标题、不要前后缀说明

示例输入：
Bluetooth: hci_aic: Add module ready check to setup
ARM64: dts: rockchip: Add dts for nanopi-r28s
arm64: configs: enable BT_HCIUART_AIC for nanopi5/6
drm/panfrost: Set HW_FEATURE_AARCH64_MMU feature flag on Bifrost models

示例输出：
- 蓝牙 hci_aic 在 setup 中增加模块就绪检查
- 设备树新增 nanopi-r28s 的 dts
- 为 nanopi5/6 启用 BT_HCIUART_AIC
- 图形驱动 panfrost 在 Bifrost 模型上设置 HW_FEATURE_AARCH64_MMU 特性标志

现在请翻译以下 ${INPUT_COUNT} 条提交标题：
$TITLES
EOF
)

          SUMMARY=""
          for MODEL in "gpt-4o-mini" "gpt-4o" "gpt-4.1" "gpt-4.1-mini"; do
            for EP in "https://models.github.ai/inference/chat/completions" \
                      "https://models.inference.ai.azure.com/chat/completions"; do
              echo "== Path1: model=$MODEL endpoint=$EP =="
              BODY=$(jq -n --arg p "$PROMPT" --arg m "$MODEL" \
                '{model:$m,temperature:0.1,messages:[{role:"user",content:$p}]}')
              RESP=$(curl -s --max-time 60 "$EP" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$BODY" || true)
              CAND=$(printf '%s' "$RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
              if [ -n "$CAND" ]; then
                CN=$(printf '%s' "$CAND" | grep -oP '[\x{4e00}-\x{9fff}]' | wc -l | tr -d ' ')
                BULLETS=$(printf '%s\n' "$CAND" | grep -c '^- ' || true)
                echo "   candidate: CN=$CN bullets=$BULLETS"
                if [ "$CN" -ge 20 ] && [ "$BULLETS" -ge "$(( INPUT_COUNT * 2 / 3 ))" ]; then
                  SUMMARY="$CAND"
                  echo "   accepted."
                  break 2
                fi
              fi
            done
          done

          # =================================================================
          # 路径 2：deep-translator + Google 免费端点 —— 真正的翻译引擎
          # =================================================================
          if [ -z "$SUMMARY" ]; then
            echo "== Path1 failed; Path2: Google Translate via deep-translator =="
            python3 -m pip install --quiet --disable-pip-version-check deep-translator >/dev/null 2>&1 || true
            if python3 -c "import deep_translator" 2>/dev/null; then
              python3 << 'PYEOF' > /tmp/summary_google.txt 2>/tmp/trans_err.log || true
from deep_translator import GoogleTranslator
import sys

with open('/tmp/titles.txt', encoding='utf-8') as f:
    titles = [l.strip() for l in f if l.strip()]

try:
    tr = GoogleTranslator(source='en', target='zh-CN')
except Exception as e:
    sys.stderr.write(f"init failed: {e}\n")
    sys.exit(1)

for t in titles:
    try:
        zh = tr.translate(t)
    except Exception as e:
        sys.stderr.write(f"translate failed: {t} :: {e}\n")
        zh = t
    print('- ' + (zh or t))
PYEOF
              if [ -s /tmp/summary_google.txt ]; then
                SUMMARY=$(cat /tmp/summary_google.txt)
                echo "   Path2 produced $(printf '%s\n' "$SUMMARY" | grep -c '^- ') bullets."
              else
                echo "   Path2 produced empty output."
              fi
            else
              echo "   deep-translator not available."
            fi
          fi

          # =================================================================
          # 路径 3：最终兜底 —— 原样列出，不做硬编码拼接
          # =================================================================
          if [ -z "$SUMMARY" ]; then
            echo "== All translation engines failed; listing original titles =="
            SUMMARY=$(awk 'NF {print "- " $0}' /tmp/titles.txt)
          fi

          {
            echo "summary<<__EOF__"
            echo "$SUMMARY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Compare and trigger build if changed
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kernel updated, triggering build..."
          gh workflow run build.yml -f version=both -f set=both --repo ${{ github.repository }}

      - name: Update recorded SHA with summary
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          {
            echo "$SHA"
            echo ""
            echo "# 上游更新摘要（UTC $(date -u +%Y-%m-%d)）"
            echo ""
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "- （本次未生成摘要）"
            fi
          } > .kernel-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kernel-version
          git commit -m "chore: update kernel SHA $(echo $SHA | cut -c1-8)"
          git push

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [check_kernel]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs of exactly this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_NAME="Kernel Watcher"
          KEEP=1
          CURRENT_RUN_ID="${{ github.run_id }}"

          WF_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq ".workflows[] | select(.name == \"$TARGET_NAME\") | .id" | head -n1)
          if [ -z "$WF_ID" ]; then
            echo "Workflow '$TARGET_NAME' not found. Skip."
            exit 0
          fi

          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_ID/runs?per_page=100" \
            --jq '.workflow_runs[].id')

          i=0
          for run_id in $RUNS; do
            i=$((i+1))
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then continue; fi
            if [ "$i" -le "$KEEP" ]; then continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done