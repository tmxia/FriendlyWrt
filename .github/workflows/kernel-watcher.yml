name: Kernel Watcher

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit SHA for nanopi6-v6.1.y
        id: sha
        run: |
          SHA=$(curl -s https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/nanopi6-v6.1.y | jq -r .sha)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current SHA: $SHA"

      - name: Read recorded SHA
        id: recorded
        run: |
          if [ -f .kernel-version ]; then
            RECORDED=$(head -n1 .kernel-version | tr -d '[:space:]')
          else
            RECORDED="none"
          fi
          [ -z "$RECORDED" ] && RECORDED="none"
          echo "recorded=$RECORDED" >> $GITHUB_OUTPUT
          echo "Recorded SHA: $RECORDED"

      - name: Fetch latest upstream commit message
        id: commits
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        run: |
          MSG=$(curl -s "https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/${{ steps.sha.outputs.sha }}" \
                | jq -r '.commit.message // empty')
          if [ -z "$MSG" ]; then
            echo "::warning::Cannot fetch commit message."
            MSG="(no message)"
          fi
          echo "Commit message length: ${#MSG}"
          {
            echo "msg<<__EOF__"
            echo "$MSG"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Compare and trigger build if changed
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kernel updated, triggering build..."
          gh workflow run build.yml -f version=both -f set=both --repo ${{ github.repository }}

      - name: Update recorded SHA with latest commit log
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          MSG: ${{ steps.commits.outputs.msg }}
        run: |
          # 同步远端，避免 push 被拒
          git fetch origin master || true

          {
            echo "$SHA"
            echo ""
            echo "# 上游更新日志（UTC $(date -u +%Y-%m-%d)）"
            echo ""
            if [ -n "$MSG" ]; then
              echo "$MSG"
            else
              echo "(no message)"
            fi
          } > .kernel-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kernel-version

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update kernel SHA $(echo $SHA | cut -c1-8)"

          for attempt in 1 2 3; do
            echo "== Push attempt $attempt =="
            if git push origin HEAD:master; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed, syncing with remote..."
            git fetch origin master
            git rebase origin/master || {
              echo "Rebase conflict, aborting."
              git rebase --abort || true
              exit 1
            }
            sleep 3
          done
          echo "::error::Push failed after 3 attempts."
          exit 1

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [check_kernel]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs of exactly this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_NAME="Kernel Watcher"
          KEEP=1
          CURRENT_RUN_ID="${{ github.run_id }}"

          WF_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq ".workflows[] | select(.name == \"$TARGET_NAME\") | .id" | head -n1)

          if [ -z "$WF_ID" ]; then
            echo "Workflow '$TARGET_NAME' not found. Skip."
            exit 0
          fi
          echo "Workflow '$TARGET_NAME' ID: $WF_ID"

          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_ID/runs?per_page=100" \
            --jq '.workflow_runs[].id')

          echo "Runs found:"
          echo "$RUNS"

          i=0
          for run_id in $RUNS; do
            i=$((i+1))
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              echo "Keep current run: $run_id"
              continue
            fi
            if [ "$i" -le "$KEEP" ]; then
              echo "Keep recent run: $run_id"
              continue
            fi
            echo "Deleting run: $run_id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done