name: Validate Linux 6.18 Build for NanoPi R5S

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate kernel and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate kernel repository and get default branch
        id: kernel_repo
        run: |
          REPO_URL="https://github.com/unifreq/linux-6.18.y.git"
          echo "=== Fetching default branch for $REPO_URL ==="
          DEFAULT_BRANCH=$(git ls-remote --symref "$REPO_URL" HEAD 2>/dev/null | awk '/^ref:/{print $2}' | sed 's|refs/heads/||')
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "❌ Cannot determine default branch."
            exit 1
          fi
          echo "✅ Default branch detected: $DEFAULT_BRANCH"
          echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate R5S device tree and in-tree drivers
        env:
          KERNEL_BRANCH: ${{ steps.kernel_repo.outputs.branch }}
        run: |
          echo "=== Checking R5S support in unifreq kernel (branch: $KERNEL_BRANCH) ==="
          BASE_URL="https://raw.githubusercontent.com/unifreq/linux-6.18.y/${KERNEL_BRANCH}"

          check_file() {
            local path="$1" desc="$2"
            if curl -sf "${BASE_URL}/${path}" -o /dev/null; then
              echo "✅ $desc exists"
            else
              echo "❌ $desc NOT found at $path"
              FAILED=1
            fi
          }

          check_file "arch/arm64/boot/dts/rockchip/rk3568-nanopi-r5s.dts" "rk3568-nanopi-r5s.dts"
          check_file "drivers/hwmon/pwm-fan.c" "pwm-fan driver"

          if [ "$FAILED" = "1" ]; then
            echo "❌ Some critical kernel files are missing."
            exit 1
          fi
          echo "✅ All critical kernel files are present."

      - name: Validate OpenWrt r8125 package and 6.18 support
        run: |
          echo "=== Checking OpenWrt r8125 package and rockchip 6.18 support ==="
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git /tmp/openwrt
          cd /tmp/openwrt

          echo "--- r8125 package Makefile ---"
          if [ -f package/kernel/r8125/Makefile ]; then
            echo "✅ r8125 package exists"
            grep -E 'PKG_NAME|PKG_VERSION|KernelPackage' package/kernel/r8125/Makefile | head -5 || true
          else
            echo "❌ r8125 package NOT found"
            FAILED=1
          fi

          echo "--- rockchip KERNEL_PATCHVER ---"
          grep '^KERNEL_PATCHVER' target/linux/rockchip/Makefile || echo "not found"

          echo "--- rockchip patches-6.18 ---"
          ls -d target/linux/rockchip/patches-6.18 2>/dev/null && echo "✅ patches-6.18 exists" || echo "⚠️ patches-6.18 not found (will be created from 6.12)"

          echo "--- generic config-6.18 ---"
          ls -l target/linux/generic/config-6.18 2>/dev/null || echo "⚠️ config-6.18 not found (will be created)"

          if [ "$FAILED" = "1" ]; then
            exit 1
          fi

      - name: Validate sed and config operations
        run: |
          echo "=== Validating sed and config operations ==="
          cd /tmp/openwrt

          # --- 1. 修改 rockchip Makefile ---
          sed -i -E 's/^([[:space:]]*)KERNEL_PATCHVER[[:space:]]*[:+]?=.*/\1KERNEL_PATCHVER:=6.18/' target/linux/rockchip/Makefile
          echo "--- After sed: rockchip Makefile ---"
          grep 'KERNEL_PATCHVER' target/linux/rockchip/Makefile || echo "(not found)"

          # --- 2. 确保 LINUX_VERSION-6.18 存在 ---
          echo "--- Before insert: existing LINUX_VERSION entries ---"
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || echo "(none found)"

          if ! grep -qE '^LINUX_VERSION-6\.18' include/kernel-version.mk; then
            LAST_KV=$(grep -nE '^LINUX_VERSION-' include/kernel-version.mk | tail -1 | cut -d: -f1)
            if [ -n "$LAST_KV" ]; then
              sed -i "${LAST_KV}a LINUX_VERSION-6.18 = .0" include/kernel-version.mk
              echo "inserted after line $LAST_KV"
            else
              echo "LINUX_VERSION-6.18 = .0" >> include/kernel-version.mk
              echo "appended to end (no existing LINUX_VERSION found)"
            fi
          fi

          echo "--- After insert: LINUX_VERSION-6.18 entries ---"
          grep -E '^LINUX_VERSION-6\.18' include/kernel-version.mk || echo "(not found, insert failed)"

          # --- 3. 验证结果 ---
          if ! grep -qE '^LINUX_VERSION-6\.18' include/kernel-version.mk; then
            echo "❌ LINUX_VERSION-6.18 not present after insert"
            exit 1
          fi

          # --- 4. 验证 sanitize_uri 修改 ---
          echo ""
          echo "=== Validating sanitize_uri fix (apk version compatibility) ==="
          echo "--- Before: sanitize_uri ---"
          grep -nE '^sanitize_uri[[:space:]]*=' include/kernel-version.mk || echo "(none)"

          sed -i 's#^sanitize_uri[[:space:]]*=.*#sanitize_uri=$(call qstrip,$(subst _,-,$(subst @,_,$(subst :,_,$(subst .,_,$(subst -,_,$(subst /,_,$(1))))))))#' include/kernel-version.mk

          echo "--- After: sanitize_uri ---"
          grep -nE '^sanitize_uri[[:space:]]*=' include/kernel-version.mk || echo "(none)"

          # 模拟 sanitize_uri 对 unifreq URI 的结果
          echo ""
          echo "--- Simulating sanitize_uri on unifreq URI ---"
          URI="github.com/unifreq/linux-6.18.y.git"
          # 手动模拟 sed 替换链
          SIMULATED=$(echo "$URI" | sed 's|/|_|g; s|\.|_|g; s|-|_|g; s|:|_|g; s|@|_|g' | sed 's|_|-|g')
          echo "input:   $URI"
          echo "output:  $SIMULATED"
          if echo "$SIMULATED" | grep -q '_'; then
            echo "❌ sanitize_uri 结果仍含下划线，apk 将拒绝"
            exit 1
          fi
          echo "✅ sanitize_uri 结果不含下划线，apk 兼容"

          echo ""
          echo "✅ All config operations validated"

      - name: Clone unifreq kernel and detect version
        id: kernel_ver
        env:
          KERNEL_BRANCH: ${{ steps.kernel_repo.outputs.branch }}
        run: |
          echo "=== Cloning unifreq kernel (shallow) ==="
          KERNEL_SRC=/tmp/unifreq-kernel
          rm -rf "$KERNEL_SRC"
          git clone --depth 1 -b "$KERNEL_BRANCH" \
            https://github.com/unifreq/linux-6.18.y.git "$KERNEL_SRC" 2>&1 | tail -3

          KM="$KERNEL_SRC/Makefile"
          if [ ! -f "$KM" ]; then
            echo "❌ 内核顶层 Makefile 不存在"
            exit 1
          fi

          echo ""
          echo "=== 内核 Makefile 头部 ==="
          head -6 "$KM"

          V=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' "$KM" | head -1 | tr -d ' ')
          P=$(sed -n 's/^PATCHLEVEL[[:space:]]*=[[:space:]]*//p' "$KM" | head -1 | tr -d ' ')
          S=$(sed -n 's/^SUBLEVEL[[:space:]]*=[[:space:]]*//p' "$KM" | head -1 | tr -d ' ')
          E=$(sed -n 's/^EXTRAVERSION[[:space:]]*=[[:space:]]*//p' "$KM" | head -1 | tr -d ' ')

          echo ""
          echo "parsed: VERSION=$V PATCHLEVEL=$P SUBLEVEL=$S EXTRAVERSION=$E"

          if [ -z "$V" ] || [ -z "$P" ]; then
            echo "❌ 无法解析 VERSION/PATCHLEVEL"
            exit 1
          fi

          if [ -n "$S" ]; then
            FULL="${V}.${P}.${S}${E}"
          else
            FULL="${V}.${P}${E}"
          fi

          # 校验格式
          if ! echo "$FULL" | grep -qE '^6\.18(\.|$)'; then
            echo "❌ 检测到的版本号 '$FULL' 不是 6.18.x 系列"
            exit 1
          fi

          echo ""
          echo "================================"
          echo "✅ 检测到内核完整版本: $FULL"
          echo "================================"
          echo "full_version=$FULL" >> "$GITHUB_OUTPUT"

          # 额外：检查版本号是否适合用作文件名
          FILENAME_VER=$(echo "$FULL" | tr -d ' ')
          echo ""
          echo "--- 文件名版本（去空格）: $FILENAME_VER ---"
          echo "--- 产物示例: R5S-Linux-${FILENAME_VER}-$(date +%Y-%m-%d)-sdcard.img.gz ---"

      - name: Summary
        run: |
          echo "## 验证结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 内核分支 | \`${{ steps.kernel_repo.outputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 内核完整版本 | \`${{ steps.kernel_ver.outputs.full_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| rk3568-nanopi-r5s.dts | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| pwm-fan 驱动 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| r8125 包 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| KERNEL_PATCHVER 修改 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| LINUX_VERSION-6.18 插入 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| sanitize_uri apk 兼容 | ✅ |" >> $GITHUB_STEP_SUMMARY