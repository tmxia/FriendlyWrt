name: Probe Partition Files (Both Versions)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version: ['v24.10', 'v25.12']
    steps:
      - name: Clone key repos (${{ matrix.version }})
        run: |
          mkdir -p probe
          cd probe
          git clone --depth=1 -b master-${{ matrix.version }} https://github.com/friendlyarm/friendlywrt_device_rk3568 device-rk3568 || echo "device-rk3568 clone failed"
          git clone --depth=1 -b master-${{ matrix.version }} https://github.com/friendlyarm/friendlywrt_configs configs || echo "configs clone failed"
          git clone --depth=1 -b kernel-6.1.y https://github.com/friendlyarm/sd-fuse_rk3568 sd-fuse || echo "sd-fuse clone failed"
          git clone --depth=1 https://github.com/friendlyarm/friendlywrt_scripts scripts || echo "scripts clone failed"
          ls -la

      - name: 1. Files containing mtdparts (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] mtdparts 文件 ====="
          grep -rln "mtdparts" . 2>/dev/null | grep -v "\.git/" | head -40

      - name: 2. Files containing (opt) partition (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] 含 (opt) 的文件 ====="
          grep -rln "(opt)" . 2>/dev/null | grep -v "\.git/" | head -40

      - name: 3. All parameter* files (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] 所有 parameter* 文件 ====="
          find . -iname "parameter*" -type f 2>/dev/null | grep -v "\.git/"

      - name: 4. Dump every parameter* file (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] parameter* 文件内容 ====="
          find . -iname "parameter*" -type f 2>/dev/null | grep -v "\.git/" | while read f; do
            echo ""
            echo "########## FILE: $f ##########"
            cat "$f"
            echo ""
            echo "########## END: $f ##########"
            echo ""
          done

      - name: 5. Partition variables in scripts (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] 分区变量定义 ====="
          grep -rn "USERDATA_SIZE\|ROOTFS_PARTITION_SIZE\|USERDATA_PARTITION_ADDR\|OPT_PARTITION_ADDR\|PARTITION_SIZE" \
            . 2>/dev/null | grep -v "\.git/" | head -60

      - name: 6. sd-fuse structure (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] sd-fuse 目录 ====="
          find sd-fuse -maxdepth 3 -type d 2>/dev/null | head -40
          echo ""
          echo "===== [${{ matrix.version }}] sd-fuse/prebuilt ====="
          ls -la sd-fuse/prebuilt/ 2>/dev/null
          echo ""
          echo "===== [${{ matrix.version }}] 含 generate-partmap-txt.sh 的路径 ====="
          find sd-fuse -name "generate-partmap-txt.sh" 2>/dev/null

      - name: 7. Summary (${{ matrix.version }})
        run: |
          cd probe
          echo "==================== [${{ matrix.version }}] 汇总 ===================="
          echo "mtdparts 文件数：$(grep -rln 'mtdparts' . 2>/dev/null | grep -v '\.git/' | wc -l)"
          echo "(opt) 文件数：$(grep -rln '(opt)' . 2>/dev/null | grep -v '\.git/' | wc -l)"
          echo "parameter* 文件数：$(find . -iname 'parameter*' -type f 2>/dev/null | grep -v '\.git/' | wc -l)"
          echo "generate-partmap-txt.sh 存在：$(find . -name 'generate-partmap-txt.sh' 2>/dev/null | grep -v '\.git/' | wc -l)"
          echo ""
          echo "USERDATA_SIZE 默认值行："
          grep -rn "USERDATA_SIZE=" . 2>/dev/null | grep -v "\.git/" | head -10 || echo "(未找到)"
          echo "============================================================"