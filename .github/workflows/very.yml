name: Verify r5s.config

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Config file to verify'
        required: false
        default: 'scripts/r5s.config'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENWRT_BRANCH: 'openwrt-25.12'
      OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
      CONFIG_FILE: ${{ github.event.inputs.config_file || 'scripts/r5s.config' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-pip python3-setuptools python3-pyelftools unzip wget \
            zip zlib1g-dev libelf-dev subversion flex bison libtool \
            autoconf automake cmake rsync quilt time jq swig zstd

      - name: Prepare workdir
        run: |
          sudo mkdir -p /workdir
          sudo chown -R "$USER:$GROUPS" /workdir

      - name: Clone OpenWrt
        run: |
          git clone -b "$OPENWRT_BRANCH" --single-branch --depth=1 \
            "$OPENWRT_REPO" /workdir/openwrt
          ln -sf /workdir/openwrt openwrt

      - name: Prepare .config
        run: |
          cd /workdir/openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          echo "input lines: $(wc -l < .config)"

      - name: Run defconfig
        run: |
          cd /workdir/openwrt
          make defconfig > /tmp/defconfig.log 2>&1 || true
          tail -5 /tmp/defconfig.log

      - name: Check each option in final .config
        run: |
          cd /workdir/openwrt
          INPUT="$GITHUB_WORKSPACE/$CONFIG_FILE"
          FINAL=/workdir/openwrt/.config
          REPORT=/workdir/verify-report.txt
          : > "$REPORT"

          # 只检查 KERNEL_* 和 PACKAGE_* ，其它(TARGET_/DEFAULT_)由构建系统管理，跳过
          grep -vE '^\s*($|#)' "$INPUT" | while IFS='=' read -r key val; do
            [ -z "$key" ] && continue
            key=$(echo "$key" | tr -d ' ')
            val=$(echo "$val" | tr -d ' ')

            case "$key" in
              CONFIG_KERNEL_*|CONFIG_PACKAGE_*) ;;
              *) continue ;;
            esac

            # 在最终 .config 里精确定位
            if grep -qE "^${key}=${val}$" "$FINAL"; then
              echo "[OK]       $key=$val" >> "$REPORT"
            elif grep -qE "^${key}=" "$FINAL"; then
              fval=$(grep -E "^${key}=" "$FINAL" | head -1 | cut -d= -f2)
              echo "[CHANGED]  $key: input=$val final=$fval" >> "$REPORT"
            elif grep -qE "^# ${key} is not set" "$FINAL"; then
              echo "[DISABLED] $key (explicitly off)" >> "$REPORT"
            else
              # 完全没出现在最终 .config
              echo "[MISSING]  $key" >> "$REPORT"
            fi
          done

      - name: Print summary
        run: |
          R=/workdir/verify-report.txt
          echo "================ SUMMARY ================"
          for tag in OK CHANGED DISABLED MISSING; do
            n=$(grep -c "^\[$tag\]" "$R" 2>/dev/null || echo 0)
            echo "$tag = $n"
          done
          echo ""
          echo "--- MISSING (符号不存在，需要改名或删除) ---"
          grep '^\[MISSING\]' "$R" || echo "(none)"
          echo ""
          echo "--- DISABLED (依赖未满足，被显式关闭) ---"
          grep '^\[DISABLED\]' "$R" || echo "(none)"
          echo ""
          echo "--- CHANGED (值被 defconfig 修改) ---"
          grep '^\[CHANGED\]' "$R" || echo "(none)"
          echo ""
          echo "--- 完整报告 (OK/CHANGED/DISABLED/MISSING) ---"
          cat "$R"
          {
            echo "### Config verification"
            echo ""
            for tag in OK CHANGED DISABLED MISSING; do
              n=$(grep -c "^\[$tag\]" "$R" 2>/dev/null || echo 0)
              echo "- $tag: $n"
            done
            echo ""
            echo '**MISSING:**'
            echo '```'
            grep '^\[MISSING\]' "$R" || echo "(none)"
            echo '```'
            echo '**DISABLED:**'
            echo '```'
            grep '^\[DISABLED\]' "$R" || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            /workdir/verify-report.txt
            /workdir/openwrt/.config
            /tmp/defconfig.log
          retention-days: 14
          if-no-files-found: warn