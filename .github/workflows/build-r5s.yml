name: Build FriendlyWrt with OpenWrt Kernel 6.12

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  KERNEL_REPO: 'https://github.com/openwrt/openwrt.git'
  KERNEL_BRANCH: 'openwrt-25.12'   # OpenWrt 25.12 分支包含内核 6.12
  KERNEL_VERSION: '6.12'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-K6.12-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"
        echo "Kernel: OpenWrt official ${KERNEL_VERSION}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download FriendlyWrt source (excluding kernel)
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        # 注意：不同步 toolchain，因为将使用 OpenWrt 官方工具链
        # repo sync -c toolchain --no-clone-bundle

    - name: Clone OpenWrt official kernel source (6.12)
      run: |
        cd project
        # 克隆 OpenWrt 官方内核源码（包含 6.12 内核）
        git clone --depth 1 -b ${{ env.KERNEL_BRANCH }} \
          ${{ env.KERNEL_REPO }} openwrt-kernel
        # 将官方内核源码放置到 FriendlyWrt 期望的位置
        rm -rf kernel-rockchip
        ln -sf openwrt-kernel kernel-rockchip
        echo "Kernel source prepared: $(ls -la kernel-rockchip | head -5)"

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Configure kernel to 6.12
      run: |
        cd project
        # 修改 Rockchip 目标 Makefile，将 6.12 设为默认内核
        if [ -f kernel-rockchip/target/linux/rockchip/Makefile ]; then
          sed -i 's/KERNEL_PATCHVER:=6.6/KERNEL_PATCHVER:=6.12/' \
            kernel-rockchip/target/linux/rockchip/Makefile
          echo "Kernel version updated to 6.12 in Rockchip target Makefile"
        fi
        # 确保 OpenWrt 使用内核 6.12
        echo "CONFIG_LINUX_6_12=y" >> kernel-rockchip/.config 2>/dev/null || true

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"
        echo "=== Checking kernel version ==="
        grep -E "CONFIG_LINUX_6_12|CONFIG_KERNEL_VERSION" .config || echo "Kernel version config not found"

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt (with OpenWrt kernel 6.12)
      id: compile
      run: |
        cd project/friendlywrt
        # 强制使用 OpenWrt 内核源码
        export KERNEL_SRC=../kernel-rockchip
        make -j$(nproc)

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        if [ -z "$PM_BIN" ]; then
          echo "ERROR: neither apk nor opkg found"
          exit 1
        fi
        host_pm_filename="host-pm-${{ matrix.VERSION }}-k6.12.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    # Build SD image
    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}-k6.12.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}-docker-k6.12.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}-k6.12.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568) MODEL=R5S-R5C-Series ;;
        *) echo "unknow cpu"; exit 1 ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL
        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        tar xzf "../rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}-k6.12.tgz"

    - name: Compile uboot and kernel (OpenWrt 6.12)
      run: |
        cd project
        # 使用 OpenWrt 官方内核源码编译 uboot 和 kernel
        ./build.sh uboot
        ./build.sh kernel

    - name: Build sd image
      id: build_sd_image
      run: |
        cd project
        ./build.sh sd-img
        mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        pushd scripts/sd-fuse/ > /dev/null
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
            echo "ERROR: image directory not found"
            ls -la
            exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null
        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true

    - name: Download FriendlyWrt source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle

    - name: Clone OpenWrt official kernel source (6.12)
      run: |
        cd project
        git clone --depth 1 -b ${{ env.KERNEL_BRANCH }} \
          ${{ env.KERNEL_REPO }} openwrt-kernel
        rm -rf kernel-rockchip
        ln -sf openwrt-kernel kernel-rockchip

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Configure kernel to 6.12
      run: |
        cd project
        if [ -f kernel-rockchip/target/linux/rockchip/Makefile ]; then
          sed -i 's/KERNEL_PATCHVER:=6.6/KERNEL_PATCHVER:=6.12/' \
            kernel-rockchip/target/linux/rockchip/Makefile
        fi

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap)" .config || echo "WARNING: Some packages not found"

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt (OpenWrt kernel 6.12)
      run: |
        cd project/friendlywrt
        export KERNEL_SRC=../kernel-rockchip
        make -j$(nproc)

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        if [ -z "$PM_BIN" ]; then echo "ERROR: PM not found"; exit 1; fi
        host_pm_filename="host-pm-${{ matrix.VERSION }}-k6.12.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}-k6.12.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}-docker-k6.12.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}-k6.12.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568) MODEL=R5S-R5C-Series ;;
        *) echo "unknow cpu"; exit 1 ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL
        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        tar xzf "../rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}-k6.12.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}-k6.12.tgz"

    - name: Compile uboot and kernel (OpenWrt 6.12)
      run: |
        cd project
        ./build.sh uboot
        ./build.sh kernel

    - name: Build sd image
      id: build_sd_image
      run: |
        cd project
        ./build.sh sd-img
        mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        pushd scripts/sd-fuse/ > /dev/null
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
            echo "ERROR: image directory not found"; ls -la; exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null
        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate_assets:
    needs: [prepare_release, build_manual, build_auto]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-friendlywrt-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build_manual, build_auto, cleanup_intermediate_assets]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build FriendlyWrt with OpenWrt Kernel 6.12"
          repository: ${{ github.repository }}