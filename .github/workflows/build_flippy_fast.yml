name: Build FriendlyWrt With Flippy Kernel (Fast)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag with auto-increment or overwrite
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-flippy-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              NEXT=$((MAX_NUM + 1))
              TAG="${BASE_TAG}-${NEXT}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  # ---------- 手动触发构建 ----------
  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment (lightweight)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          dosfstools e2fsprogs parted
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568)
          MODEL=R5S-R5C-Series
          ;;
        *)
          echo "unknow cpu"
          exit 1
          ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Download rootfs package (required)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        DATES=(
          $(date +%Y-%m-%d)
          $(date -d "1 day ago" +%Y-%m-%d)
          $(date -d "2 days ago" +%Y-%m-%d)
        )
        FOUND=false
        for DATE in "${DATES[@]}"; do
          BASE_TAG="FriendlyWrt-flippy-${DATE}"
          if gh release view "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "^${ROOTFS_FILE}$"; then
            echo "Found $ROOTFS_FILE in release $BASE_TAG, downloading..."
            gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ROOTFS_FILE" --dir ../artifact/
            FOUND=true
            break
          fi
          TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" | sort -V -r || true)
          for tag in $TAGS; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q "^${ROOTFS_FILE}$"; then
              echo "Found $ROOTFS_FILE in release $tag, downloading..."
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$ROOTFS_FILE" --dir ../artifact/
              FOUND=true
              break 2
            fi
          done
        done
        if [ "$FOUND" = "false" ]; then
          echo "ERROR: No rootfs package found in any release (checked dates: ${DATES[*]}). Please run a full build first to generate rootfs-friendlywrt-*.tgz."
          exit 1
        fi

    # ---------- 核心修改：解压 rootfs 到官方构建目录，并替换内核 ----------
    - name: Prepare rootfs and inject flippy kernel
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        
        # 1. 确定官方 rootfs 目录（与 build.sh 一致）
        ROOTFS_DIR="friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip"
        mkdir -p "$ROOTFS_DIR"
        
        # 2. 解压 rootfs 到该目录（不带 strip-components，保留完整结构）
        echo "Extracting rootfs to $ROOTFS_DIR ..."
        tar xzf "../artifact/$ROOTFS_FILE" -C "$ROOTFS_DIR"
        
        # 3. 注入 flippy 内核模块（覆盖官方模块）
        if [ -d /tmp/flippy_modules ]; then
          MODULES_DIR_NAME=$(ls /tmp/flippy_modules | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-flippy-[0-9]+\+?$' | head -1)
          if [ -n "$MODULES_DIR_NAME" ]; then
            echo "Injecting flippy modules to $ROOTFS_DIR/lib/modules ..."
            rm -rf "$ROOTFS_DIR/lib/modules"
            mkdir -p "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME"
            cp -r /tmp/flippy_modules/$MODULES_DIR_NAME/* "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME/"
            find "$ROOTFS_DIR/lib/modules" -type f -exec chmod 644 {} \;
            echo "Flippy modules injected."
          else
            echo "WARNING: Could not determine modules directory name, skipping injection."
          fi
        else
          echo "WARNING: /tmp/flippy_modules not found, skipping module injection."
        fi
        
        # 4. 部署 flippy kernel boot/dtb 到 sd-fuse 目录
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        BOOT_TAR=$(find /tmp/flippy_extract -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find /tmp/flippy_extract -name "dtb-rockchip-*.tar.gz" | head -1)
        if [ -n "$BOOT_TAR" ] && [ -n "$DTB_TAR" ]; then
          echo "Deploying flippy kernel boot/dtb to scripts/sd-fuse/${DIST_DIR} ..."
          mkdir -p scripts/sd-fuse/${DIST_DIR}/boot/
          tar xzf "$BOOT_TAR" -C scripts/sd-fuse/${DIST_DIR}/boot/ --strip-components=1
          mkdir -p scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/
          tar xzf "$DTB_TAR" -C scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ --strip-components=1
        else
          echo "WARNING: flippy kernel boot/dtb not found, skipping deployment."
        fi
        
        # 5. 创建 kernel/.built 标记（跳过 kernel 编译）
        mkdir -p friendlywrt/kernel
        touch friendlywrt/kernel/.built

    - name: Compile uboot (if needed)
      run: |
        cd project
        # 如果之前没有编译 uboot，这里编译一次
        if [ ! -f friendlywrt/u-boot/.built ]; then
          ./build.sh uboot
          touch friendlywrt/u-boot/.built
        fi
        echo "U-boot ready."

    # ---------- 调用官方 sd-img 构建命令 ----------
    - name: Build sd image with flippy kernel
      id: build_sd_image
      run: |
        cd project
        # 确保环境变量
        export TOPDIR=$(pwd)
        export FRIENDLYWRT_SRC=$TOPDIR
        # 运行官方 sd-img 命令
        ./build.sh sd-img
        
        # 检查生成的镜像
        if [ -f "out/${{ steps.config.outputs.img_filename }}" ]; then
          echo "Image generated successfully: out/${{ steps.config.outputs.img_filename }}"
          mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        else
          echo "ERROR: Image file not found: out/${{ steps.config.outputs.img_filename }}"
          ls -la out/ || true
          exit 1
        fi
        
        # 打包 tgz（与官方一致）
        cd scripts/sd-fuse
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
          echo "ERROR: image directory ${{ steps.config.outputs.dist_dir }} not found"
          ls -la
          exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../artifact/
        cd ../..
        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ---------- 自动触发构建（watch 事件） ----------
  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    - name: Show build configuration
      run: |
        echo "Auto building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment (lightweight)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
