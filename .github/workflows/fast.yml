name: Quick Verify Flippy Kernel

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Rootfs version'
        required: true
        default: '24.10'
        type: choice
        options:
          - '24.10'
          - '25.12'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker

jobs:
  quick_verify:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget git rsync time file unzip bc bzip2 xxd \
          python3 dosfstools e2fsprogs parted \
          android-sdk-libsparse-utils
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git clone https://github.com/friendlyarm/repo /tmp/repo
        sudo -E cp /tmp/repo/repo /usr/bin/
        mkdir -p $GITHUB_WORKSPACE/artifact
        chmod +x scripts/flippy-kernel.sh scripts/quick-build.sh

    - name: Fetch sd-fuse scripts
      run: |
        cd /tmp
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests \
          -b master-v${{ inputs.version }} -m rk3568.xml \
          --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        echo "=== sd-fuse 目录 ==="
        ls -la /tmp/scripts/sd-fuse/

    - name: Find and download rootfs tgz
      id: rootfs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SUFFIX=""
        [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
        PATTERN="rootfs-friendlywrt-${{ inputs.version }}${SUFFIX}.tgz"
        echo "查找: $PATTERN"

        TAGS=$(gh release list --limit 30 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
        FOUND=""
        for TAG in $TAGS; do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
            FOUND="$TAG"; break
          fi
        done
        [ -z "$FOUND" ] && { echo "ERROR: 找不到 $PATTERN"; exit 1; }
        echo "使用 release: $FOUND"

        mkdir -p /tmp/inputs
        cd /tmp/inputs
        gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
        ls -la

        echo "rootfs_tgz=/tmp/inputs/$PATTERN" >> $GITHUB_OUTPUT

    - name: Run quick-build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SUFFIX=""
        [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
        DIST_NAME="friendlywrt$(echo ${{ inputs.version }} | awk -F . '{print $1}')${SUFFIX}"
        IMG_NAME="R5S-R5C-Series-FriendlyWrt-flippy-${{ inputs.version }}${SUFFIX}.img"

        bash $GITHUB_WORKSPACE/scripts/quick-build.sh \
          "${{ steps.rootfs.outputs.rootfs_tgz }}" \
          "/tmp/scripts/sd-fuse" \
          "$DIST_NAME" \
          "$GITHUB_WORKSPACE/artifact/$IMG_NAME"

        echo "img_name=$IMG_NAME" >> $GITHUB_ENV

    - name: Compress and list
      run: |
        cd $GITHUB_WORKSPACE/artifact
        gzip -f *.img
        ls -la

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: flippy-img-${{ inputs.version }}-${{ inputs.set }}
        path: |
          ${{ github.workspace }}/artifact/*.img.gz