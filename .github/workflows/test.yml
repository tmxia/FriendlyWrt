name: Diagnostic - Full Kernel Structure Extraction

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '24.10'
        type: choice
        options:
          - '24.10'
          - '25.12'
      set:
        description: 'Type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            file xxd binwalk p7zip-full u-boot-tools \
            device-tree-compiler cpio gzip xz-utils lz4 zstd \
            python3 python3-pyelftools binutils-aarch64-linux-gnu

      - name: Find and download existing images tgz
        id: find_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUFFIX=""
          [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
          PATTERN="images-R5S-R5C-Series-FriendlyWrt-${{ inputs.version }}${SUFFIX}.tgz"
          TAGS=$(gh release list --limit 30 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
          FOUND=""
          for TAG in $TAGS; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
              FOUND="$TAG"; break
            fi
          done
          [ -z "$FOUND" ] && { echo "Not found: $PATTERN"; exit 1; }
          mkdir -p /tmp/existing
          cd /tmp/existing
          gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
          tar xzf "$PATTERN"
          echo "release_tag=$FOUND" >> $GITHUB_OUTPUT

      - name: Step 1 - KRNL header analysis
        run: |
          set -e
          KIMG=$(find /tmp/existing -name "kernel.img" | head -1)
          echo "########## STEP 1: KRNL header ##########"
          echo "File: $KIMG"
          SIZE=$(stat -c%s "$KIMG")
          echo "Size: $SIZE bytes"
          echo ""
          echo "--- First 128 bytes ---"
          xxd -l 128 "$KIMG"
          echo ""
          python3 << PYEOF
          with open("$KIMG", 'rb') as f:
              data = f.read(128)
          magic = data[0:4]
          print(f"Magic: {magic} ({magic.hex()})")
          size_field_le = int.from_bytes(data[4:8], 'little')
          print(f"Size field (LE u32 @ 0x04): {size_field_le}")
          print(f"File size: $SIZE")
          print(f"File size - 8: {$SIZE - 8}")
          print(f"Match file-8: {size_field_le == $SIZE - 8}")
          arm64_magic_off = data.find(b'ARM\x64')
          print(f"ARM64 magic at file offset: 0x{arm64_magic_off:x}")
          PYEOF

      - name: Step 2 - boot.img structure
        run: |
          set -e
          BIMG=$(find /tmp/existing -name "boot.img" | head -1)
          echo "########## STEP 2: boot.img ##########"
          echo "Size: $(stat -c%s "$BIMG")"
          echo "--- First 32 bytes ---"
          xxd -l 32 "$BIMG"
          echo ""
          # 提取 payload 并解压
          dd if="$BIMG" of=/tmp/boot_payload.gz bs=1 skip=8 status=none
          echo "Payload (after 8-byte header) size: $(stat -c%s /tmp/boot_payload.gz)"
          file /tmp/boot_payload.gz
          echo ""
          if zcat /tmp/boot_payload.gz > /tmp/boot_extracted 2>/dev/null; then
            echo "Decompressed size: $(stat -c%s /tmp/boot_extracted)"
            echo "--- First 64 bytes ---"
            xxd -l 64 /tmp/boot_extracted
            echo ""
            file /tmp/boot_extracted
            echo ""
            EXT4_MAGIC=$(xxd -s 0x438 -l 2 -p /tmp/boot_extracted)
            echo "Magic at offset 0x438 (ext4 check): $EXT4_MAGIC"
            if [ "$EXT4_MAGIC" = "53ef" ]; then
              echo ">>> ext4 filesystem"
              cp /tmp/boot_extracted /tmp/boot_fs.img
              sudo mkdir -p /tmp/boot_mnt
              if sudo mount -o loop,ro /tmp/boot_fs.img /tmp/boot_mnt 2>/dev/null; then
                echo "--- boot.img contents ---"
                sudo ls -la /tmp/boot_mnt/
                echo ""
                echo "--- File types inside boot ---"
                for f in /tmp/boot_mnt/*; do
                  [ -e "$f" ] && echo "$(sudo file "$f" 2>/dev/null | sed 's|/tmp/boot_mnt/||')"
                done
                sudo umount /tmp/boot_mnt
              fi
            else
              echo ">>> Not ext4, first bytes: $(xxd -l 4 -p /tmp/boot_extracted)"
              if [ "$(xxd -l 4 -p /tmp/boot_extracted)" = "d00dfeed" ]; then
                echo ">>> FIT image detected"
                fdtdump /tmp/boot_extracted 2>/dev/null | head -80 || true
                dumpimage -l /tmp/boot_extracted 2>&1 | head -40 || true
              fi
            fi
          fi

      - name: Step 3 - parameter.txt partition table
        run: |
          set -e
          PARAM=$(find /tmp/existing -name "parameter.txt" | head -1)
          echo "########## STEP 3: parameter.txt ##########"
          cat "$PARAM"
          echo ""
          python3 << 'PYEOF'
          import re, glob
          params = glob.glob("/tmp/existing/*/parameter.txt") + glob.glob("/tmp/existing/*/*/parameter.txt")
          if params:
              with open(params[0]) as f:
                  content = f.read()
              m = re.search(r'CMDLINE:\s*mtdparts=([^:]+):(.+)$', content, re.M)
              if m:
                  print(f"{'Partition':<15} {'Offset':>12} {'Size':>14} {'Size(MB)':>10}")
                  print("-" * 60)
                  for p in m.group(2).split(','):
                      pm = re.match(r'(-|0x[0-9a-fA-F]+)@(0x[0-9a-fA-F]+)\(([^)]+)\)', p)
                      if pm:
                          size, offset, name = pm.group(1), pm.group(2), pm.group(3)
                          if size == '-':
                              print(f"{name:<15} {offset:>12} {'rest':>14} {'-':>10}")
                          else:
                              mb = int(size, 16) * 512 / 1024 / 1024
                              print(f"{name:<15} {offset:>12} {size:>14} {mb:>10.2f}")
          PYEOF

      - name: Step 4 - flippy vmlinuz structure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/flippy && cd /tmp/flippy
          ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
          LATEST=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//' | sort -V | tail -1)
          echo "Latest flippy: $LATEST"
          wget -q "https://github.com/ophub/kernel/releases/download/kernel_flippy/${LATEST}.tar.gz" -O /tmp/flippy/flippy.tar.gz
          cd /tmp/flippy
          tar xzf flippy.tar.gz
          mkdir -p boot dtb
          tar xzf "$(find /tmp/flippy/$LATEST -name 'boot-*.tar.gz' | head -1)" -C boot
          tar xzf "$(find /tmp/flippy/$LATEST -name 'dtb-rockchip-*.tar.gz' | head -1)" -C dtb
          
          echo "########## STEP 4: flippy vmlinuz ##########"
          ls -la /tmp/flippy/boot/
          echo ""
          VMLINUZ=$(find /tmp/flippy/boot -name "vmlinuz-*" | head -1)
          echo "Path: $VMLINUZ"
          echo "Size: $(stat -c%s "$VMLINUZ")"
          echo ""
          echo "--- First 128 bytes ---"
          xxd -l 128 "$VMLINUZ"
          echo ""
          echo "--- R5S/R5C dtb files ---"
          ls /tmp/flippy/dtb/ | grep -iE "r5s|r5c" | head -20

      - name: Step 5 - Compare and construct kernel.img preview
        run: |
          set -e
          echo "########## STEP 5: COMPARISON ##########"
          KIMG=$(find /tmp/existing -name "kernel.img" | head -1)
          VMLINUZ=$(find /tmp/flippy/boot -name "vmlinuz-*" | head -1)
          
          KIMG_SIZE=$(stat -c%s "$KIMG")
          VMLINUZ_SIZE=$(stat -c%s "$VMLINUZ")
          
          echo "=========== FriendlyWrt ==========="
          echo "kernel.img path:        $KIMG"
          echo "kernel.img size:        $KIMG_SIZE bytes"
          echo "kernel.img header:      $(xxd -l 8 -p "$KIMG")"
          echo ""
          echo "=========== flippy ==========="
          echo "vmlinuz path:           $VMLINUZ"
          echo "vmlinuz size:           $VMLINUZ_SIZE bytes"
          echo "vmlinuz header:         $(xxd -l 8 -p "$VMLINUZ")"
          echo ""
          echo "=========== Kernel partition capacity ==========="
          PARAM=$(find /tmp/existing -name "parameter.txt" | head -1)
          KERNEL_SIZE_HEX=$(grep -oE '0x[0-9a-fA-F]+@0x[0-9a-fA-F]+\(kernel\)' "$PARAM" | head -1 | cut -d@ -f1)
          if [ -n "$KERNEL_SIZE_HEX" ]; then
            KERNEL_SIZE_BYTES=$((KERNEL_SIZE_HEX * 512))
            echo "kernel partition:       $KERNEL_SIZE_BYTES bytes ($((KERNEL_SIZE_BYTES / 1024 / 1024)) MiB)"
            echo "vmlinuz + 8 bytes:      $((VMLINUZ_SIZE + 8)) bytes"
            if [ $((VMLINUZ_SIZE + 8)) -le $KERNEL_SIZE_BYTES ]; then
              echo ">>> ✓ FITS in kernel partition"
            else
              echo ">>> ✗ TOO BIG for kernel partition"
            fi
          fi
          echo ""
          echo "=========== Constructed kernel.img preview ==========="
          SIZE_HEX=$(printf '%08x' $VMLINUZ_SIZE)
          SIZE_LE=$(echo "$SIZE_HEX" | sed 's/\(..\)\(..\)\(..\)\(..\)/\4\3\2\1/')
          printf 'KRNL' > /tmp/preview_kernel.img
          printf "$SIZE_LE" | xxd -r -p >> /tmp/preview_kernel.img
          cat "$VMLINUZ" >> /tmp/preview_kernel.img
          echo "Constructed size: $(stat -c%s /tmp/preview_kernel.img) bytes"
          echo "First 16 bytes:   $(xxd -l 16 -p /tmp/preview_kernel.img)"
          python3 << 'PYEOF'
          data = open('/tmp/preview_kernel.img','rb').read(2048)
          idx = data.find(b'ARM\x64')
          print(f"ARM64 magic at:   0x{idx:x}")
          print(f"Expected:         0x40")
          print('✓ MATCH' if idx == 0x40 else f'✗ MISMATCH')
          PYEOF

      - name: Step 6 - vmlinuz ARM64 header fields
        run: |
          set -e
          VMLINUZ=$(find /tmp/flippy/boot -name "vmlinuz-*" | head -1)
          echo "########## STEP 6: vmlinuz ARM64 header ##########"
          python3 << PYEOF
          with open("$VMLINUZ", 'rb') as f:
              data = f.read(512)
          arm64_off = data.find(b'ARM\x64')
          print(f"ARM64 magic at: 0x{arm64_off:x}")
          base = arm64_off
          print(f"\nARM64 Image header starts at 0x{base:x}:")
          for name, off in [("code0", 0), ("code1", 4), ("text_offset", 8), ("image_size", 16), ("flags", 24), ("res2", 32), ("res3", 40), ("res4", 48), ("magic", 56)]:
              pos = base + off
              if pos + 8 <= len(data):
                  if off in (0, 4):
                      val = int.from_bytes(data[pos:pos+4], 'little')
                      print(f"  {name:<12} @ +0x{off:02x}: 0x{val:08x}")
                  else:
                      val = int.from_bytes(data[pos:pos+8], 'little')
                      print(f"  {name:<12} @ +0x{off:02x}: 0x{val:016x} ({val})")
          PYEOF

      - name: Step 7 - Constructed kernel.img ARM64 header
        run: |
          set -e
          echo "########## STEP 7: preview kernel.img ARM64 header ##########"
          python3 << 'PYEOF'
          data = open('/tmp/preview_kernel.img','rb').read(512)
          arm64_off = data.find(b'ARM\x64')
          print(f"ARM64 magic at: 0x{arm64_off:x}")
          base = arm64_off
          print(f"\nARM64 Image header:")
          for name, off in [("code0", 0), ("code1", 4), ("text_offset", 8), ("image_size", 16), ("flags", 24), ("magic", 56)]:
              pos = base + off
              if pos + 8 <= len(data):
                  if off in (0, 4):
                      val = int.from_bytes(data[pos:pos+4], 'little')
                      print(f"  {name:<12} @ +0x{off:02x}: 0x{val:08x}")
                  else:
                      val = int.from_bytes(data[pos:pos+8], 'little')
                      print(f"  {name:<12} @ +0x{off:02x}: 0x{val:016x} ({val})")
          PYEOF

      - name: Step 8 - Summary
        run: |
          echo ""
          echo "==================================================================="
          echo "                       DIAGNOSTIC COMPLETE"
          echo "==================================================================="
          echo ""
          KIMG=$(find /tmp/existing -name "kernel.img" | head -1)
          VMLINUZ=$(find /tmp/flippy/boot -name "vmlinuz-*" | head -1)
          echo "FriendlyWrt kernel.img: $(stat -c%s "$KIMG") bytes"
          echo "flippy vmlinuz:         $(stat -c%s "$VMLINUZ") bytes"
          echo ""
          echo "Constructed kernel.img preview: $(stat -c%s /tmp/preview_kernel.img) bytes"
          echo ""
          echo "Please provide the full log output to determine the exact strategy."