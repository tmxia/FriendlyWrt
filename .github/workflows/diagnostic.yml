name: Diagnostic - Full Kernel Structure Extraction

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '24.10'
        type: choice
        options:
          - '24.10'
          - '25.12'
      set:
        description: 'Type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            file xxd binwalk p7zip-full u-boot-tools \
            device-tree-compiler cpio gzip xz-utils lz4 zstd \
            python3 python3-pyelftools binutils-aarch64-linux-gnu \
            e2fsprogs util-linux kmod \
            android-sdk-libsparse-utils
          echo "=== tools check ==="
          which simg2img img2simg fdtdump dumpimage || true

      # ============================================================
      # ==============  A: FriendlyWrt 产物分析  ===================
      # ============================================================

      - name: A0 - Download existing images tgz
        id: find_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUFFIX=""
          [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
          PATTERN="images-R5S-R5C-Series-FriendlyWrt-${{ inputs.version }}${SUFFIX}.tgz"
          TAGS=$(gh release list --limit 30 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
          FOUND=""
          for TAG in $TAGS; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
              FOUND="$TAG"; break
            fi
          done
          [ -z "$FOUND" ] && { echo "Not found: $PATTERN"; exit 1; }
          mkdir -p /tmp/existing
          cd /tmp/existing
          gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
          tar xzf "$PATTERN"
          echo "release_tag=$FOUND" >> $GITHUB_OUTPUT

      - name: A1 - File inventory
        run: |
          echo "########## A1: File inventory ##########"
          SDDIR=$(dirname "$(find /tmp/existing -name parameter.txt | head -1)")
          echo "SD-fuse dir: $SDDIR"
          ls -la "$SDDIR/"
          echo ""
          for f in "$SDDIR"/*; do
            [ -f "$f" ] && printf "%-30s %10s  %s\n" "$(basename "$f")" "$(stat -c%s "$f")" "$(file -b "$f")"
          done

      - name: A2 - FriendlyWrt kernel.img header
        run: |
          set -e
          KIMG=$(find /tmp/existing -name "kernel.img" | head -1)
          echo "########## A2: FriendlyWrt kernel.img ##########"
          echo "Size: $(stat -c%s "$KIMG")"
          xxd -l 128 "$KIMG"
          echo ""
          python3 << PYEOF
          with open("$KIMG", 'rb') as f:
              data = f.read(256)
          print(f"Magic: {data[0:4]}")
          size_field_le = int.from_bytes(data[4:8], 'little')
          print(f"Size field (LE u32 @ 0x04): {size_field_le}")
          print(f"File size: $(stat -c%s "$KIMG")")
          print(f"File size - 8: $(stat -c%s "$KIMG") - 8")
          arm64_off = data.find(b'ARM\x64')
          print(f"ARM64 magic at: 0x{arm64_off:x}")
          PYEOF
          echo ""
          echo "--- 内核版本字符串（前 4MB）---"
          dd if="$KIMG" bs=1 skip=8 count=$((4*1024*1024)) 2>/dev/null | strings -n 8 | grep -iE "Linux version|flippy" | head -5

      - name: A3 - boot.img structure (sparse-aware)
        run: |
          set -e
          BIMG=$(find /tmp/existing -name "boot.img" | head -1)
          echo "########## A3: boot.img ##########"
          echo "Size: $(stat -c%s "$BIMG")"
          xxd -l 64 "$BIMG"
          echo ""
          # boot.img 头是 KRNL + size(LE) + 数据
          # 尝试多种解析
          python3 << PYEOF
          import subprocess, os
          data = open("$BIMG", 'rb').read(32)
          print(f"Magic: {data[0:4]}")
          size_le = int.from_bytes(data[4:8], 'little')
          print(f"Size field: {size_le}")
          print(f"File size: $(stat -c%s "$BIMG")")
          print(f"File size - 8: $(stat -c%s "$BIMG") - 8")
          PYEOF
          echo ""
          echo "--- 提取 payload (skip 8) ---"
          dd if="$BIMG" of=/tmp/boot_payload bs=1 skip=8 status=none
          file /tmp/boot_payload
          echo "Payload size: $(stat -c%s /tmp/boot_payload)"
          echo ""
          echo "--- payload 是否为 Android sparse ---"
          xxd -l 16 /tmp/boot_payload
          SPARSE_MAGIC=$(xxd -l 4 -p /tmp/boot_payload)
          echo "Magic: $SPARSE_MAGIC"
          if [ "$SPARSE_MAGIC" = "3aff26ed" ]; then
            echo ">>> Android sparse image"
            simg2img /tmp/boot_payload /tmp/boot_payload.raw
            echo "raw size: $(stat -c%s /tmp/boot_payload.raw)"
            file /tmp/boot_payload.raw
            xxd -l 16 /tmp/boot_payload.raw
            # 检查是不是 ext4
            EXT4_MAGIC=$(xxd -s 0x438 -l 2 -p /tmp/boot_payload.raw)
            echo "Magic @ 0x438: $EXT4_MAGIC"
            if [ "$EXT4_MAGIC" = "53ef" ]; then
              echo ">>> ext4 filesystem"
              sudo mkdir -p /tmp/boot_mnt
              sudo mount -o loop,ro /tmp/boot_payload.raw /tmp/boot_mnt
              echo "--- boot.img contents ---"
              sudo find /tmp/boot_mnt -maxdepth 2 -type f -exec ls -la {} \;
              echo ""
              echo "--- vmlinuz / uInitrd ---"
              BOOT_VMLINUZ=$(sudo find /tmp/boot_mnt -maxdepth 2 -name "vmlinuz*" | head -1)
              [ -n "$BOOT_VMLINUZ" ] && echo "found: $BOOT_VMLINUZ"
              sudo umount /tmp/boot_mnt
            fi
          elif [ "$SPARSE_MAGIC" = "1f8b0800" ]; then
            echo ">>> gzip, decompress..."
            zcat /tmp/boot_payload > /tmp/boot_payload.gz_decompressed 2>/dev/null
            file /tmp/boot_payload.gz_decompressed
          else
            echo ">>> unknown format, first 64 bytes:"
            xxd -l 64 /tmp/boot_payload
          fi

      - name: A4 - parameter.txt
        run: |
          PARAM=$(find /tmp/existing -name "parameter.txt" | head -1)
          echo "########## A4: parameter.txt ##########"
          cat "$PARAM"
          echo ""
          python3 << 'PYEOF'
          import re, glob
          params = glob.glob("/tmp/existing/*/parameter.txt") + glob.glob("/tmp/existing/*/*/parameter.txt")
          if params:
              with open(params[0]) as f:
                  content = f.read()
              m = re.search(r'CMDLINE:\s*mtdparts=([^:]+):(.+)$', content, re.M)
              if m:
                  print(f"{'Partition':<15} {'Offset':>12} {'Size':>14} {'MB':>8} {'End':>14}")
                  print("-" * 70)
                  for p in m.group(2).split(','):
                      pm = re.match(r'(-|0x[0-9a-fA-F]+)@(0x[0-9a-fA-F]+)\(([^)]+)\)', p)
                      if pm:
                          size, offset, name = pm.group(1), pm.group(2), pm.group(3)
                          off_int = int(offset, 16)
                          if size == '-':
                              print(f"{name:<15} {offset:>12} {'rest':>14} {'-':>8} {'-':>14}")
                          else:
                              size_int = int(size, 16)
                              print(f"{name:<15} {offset:>12} {size:>14} {size_int*512/1024/1024:>8.2f} 0x{off_int+size_int:08x}")
          PYEOF

      - name: A5 - FriendlyWrt rootfs.img (sparse-aware, 关键!)
        run: |
          set -e
          RIMG=$(find /tmp/existing -name "rootfs.img" | head -1)
          echo "########## A5: FriendlyWrt rootfs.img ##########"
          echo "File: $RIMG"
          echo "Size: $(stat -c%s "$RIMG")"
          echo "--- First 16 bytes ---"
          xxd -l 16 "$RIMG"
          echo ""
          echo "=== simg2img 转换 ==="
          simg2img "$RIMG" /tmp/rootfs.raw.img
          echo "raw image size: $(stat -c%s /tmp/rootfs.raw.img)"
          file /tmp/rootfs.raw.img
          echo ""
          echo "=== ext4 magic 检查 ==="
          EXT4_MAGIC=$(xxd -s 0x438 -l 2 -p /tmp/rootfs.raw.img)
          echo "Magic @ 0x438: $EXT4_MAGIC"
          echo ""
          echo "=== 挂载 rootfs.raw.img ==="
          sudo mkdir -p /tmp/rootfs_mnt
          sudo mount -o loop,ro /tmp/rootfs.raw.img /tmp/rootfs_mnt

          echo ""
          echo "=== /lib/modules/ ==="
          sudo ls -la /tmp/rootfs_mnt/lib/modules/ || echo "  (不存在)"
          for d in /tmp/rootfs_mnt/lib/modules/*/; do
            [ -d "$d" ] && echo ">>> $d 共 $(sudo find "$d" -name '*.ko*' | wc -l) 个 .ko"
          done
          echo ""
          echo "=== 关键模块（在 rootfs 里查找）==="
          for mod in ext4 overlay squashfs nls_cp437 nls_iso8859-1 usb-storage mmc_block dw_mmc_rockchip phy_rockchip_inno_usb2 rockchip_saradc; do
            R=$(sudo find /tmp/rootfs_mnt/lib/modules -name "${mod}.ko*" 2>/dev/null | head -1)
            [ -n "$R" ] && echo "  ✓ $mod: $(basename "$R")" || echo "  (built-in or absent)"
          done
          echo ""
          echo "=== /etc/openwrt_release ==="
          sudo cat /tmp/rootfs_mnt/etc/openwrt_release 2>/dev/null || true
          echo ""
          echo "=== /lib/firmware/ 抽样 ==="
          sudo ls /tmp/rootfs_mnt/lib/firmware/ 2>/dev/null | head -10
          echo ""
          echo "=== 内核版本字符串搜索 ==="
          sudo find /tmp/rootfs_mnt/lib/modules -name "modules.dep" -exec strings -n 6 {} \; 2>/dev/null | grep -oE "6\.[0-9]+\.[0-9]+[a-z0-9.+-]*" | sort -u | head
          echo ""
          echo "=== /boot 目录 ==="
          sudo ls -la /tmp/rootfs_mnt/boot/ 2>/dev/null || echo "  (无 /boot)"

          sudo umount /tmp/rootfs_mnt
          echo ""
          echo "✓ A5 done"

      - name: A6 - resource.img structure (dtb 来源!)
        run: |
          set -e
          SDDIR=$(dirname "$(find /tmp/existing -name parameter.txt | head -1)")
          RIMG="$SDDIR/resource.img"
          echo "########## A6: resource.img ##########"
          echo "Size: $(stat -c%s "$RIMG")"
          echo "--- First 64 bytes ---"
          xxd -l 64 "$RIMG"
          echo ""
          echo "=== 尝试各种解析 ==="
          python3 << PYEOF
          data = open("$RIMG", 'rb').read(64)
          # Rockchip resource.img 通常是 raw DTB 头
          # DTB magic 0xd00dfeed
          idx = data.find(b'\\xd0\\x0d\\xfe\\xed')
          if idx >= 0:
              print(f"DTB magic at 0x{idx:x}")
          else:
              print(f"DTB magic not found in first 64 bytes")
          PYEOF
          echo ""
          echo "=== fdtdump 头部 ==="
          fdtdump "$RIMG" 2>&1 | head -30 || echo "(fdtdump 失败)"
          echo ""
          echo "=== binwalk 探测 ==="
          binwalk "$RIMG" 2>/dev/null | head -30 || true
          echo ""
          echo "=== resource.img 里的 dtb 字符串 ==="
          strings -n 8 "$RIMG" | grep -iE "friendlyarm,nanopi|rk3568-nanopi|nanopi-r5|rk3568" | head -20
          echo ""
          echo "=== 是否包含 gzip 压缩的 dtb 列表 ==="
          strings -n 8 "$RIMG" | grep -iE "dtb|\.dtb" | head -20

      - name: A7 - uboot / idbloader / MiniLoader 分析
        run: |
          SDDIR=$(dirname "$(find /tmp/existing -name parameter.txt | head -1)")
          echo "########## A7: uboot / idbloader ##########"
          for f in MiniLoaderAll.bin idbloader.img uboot.img; do
            [ -f "$SDDIR/$f" ] && echo "$f: $(stat -c%s "$SDDIR/$f") bytes, $(file -b "$SDDIR/$f")"
          done
          echo ""
          echo "=== uboot.img 结构 ==="
          if [ -f "$SDDIR/uboot.img" ]; then
            echo "--- First 64 bytes ---"
            xxd -l 64 "$SDDIR/uboot.img"
            echo ""
            echo "--- uboot.img 里 kernel/boot 加载相关字符串 ---"
            strings -n 6 "$SDDIR/uboot.img" | grep -iE "bootargs|bootcmd|kernel|boot.img|resource.img|mmcblk|load.*mmc|ext4load|fatload" | head -40
          fi
          echo ""
          echo "=== idbloader.img 里相关字符串 ==="
          [ -f "$SDDIR/idbloader.img" ] && strings -n 6 "$SDDIR/idbloader.img" | grep -iE "kernel|bootargs|mmc|rk3568" | head -20

      # ============================================================
      # ==============  B: flippy 内核包完整分析  ==================
      # ============================================================

      - name: B0 - Download flippy kernel package
        id: flippy_ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/flippy_pkg
          cd /tmp/flippy_pkg
          ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
          LATEST=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//' | sort -V | tail -1)
          echo "Latest flippy version: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          wget -q "https://github.com/ophub/kernel/releases/download/kernel_flippy/${LATEST}.tar.gz" -O flippy.tar.gz
          ls -la flippy.tar.gz

      - name: B1 - flippy package structure
        run: |
          cd /tmp/flippy_pkg
          echo "########## B1: flippy tar.gz 结构 ##########"
          tar tzf flippy.tar.gz
          echo ""
          echo "=== 解压 ==="
          tar xzf flippy.tar.gz
          LATEST="${{ steps.flippy_ver.outputs.version }}"
          ls -la "/tmp/flippy_pkg/$LATEST/"
          echo ""
          echo "=== 各子包内部列表 ==="
          for f in "/tmp/flippy_pkg/$LATEST"/*.tar.gz; do
            echo "--- $(basename "$f") ---"
            tar tzf "$f" | head -10
            echo "  (共 $(tar tzf "$f" | wc -l) 个条目)"
            echo ""
          done

      - name: B2 - flippy boot
        run: |
          set -e
          LATEST="${{ steps.flippy_ver.outputs.version }}"
          mkdir -p /tmp/flippy_pkg/boot
          tar xzf "$(find /tmp/flippy_pkg/$LATEST -name 'boot-*.tar.gz' | head -1)" -C /tmp/flippy_pkg/boot
          echo "########## B2: flippy boot ##########"
          ls -la /tmp/flippy_pkg/boot/
          echo ""
          for f in /tmp/flippy_pkg/boot/*; do
            [ -f "$f" ] && printf "%-45s %10s  %s\n" "$(basename "$f")" "$(stat -c%s "$f")" "$(file -b "$f")"
          done
          echo ""
          VMLINUZ=$(find /tmp/flippy_pkg/boot -name "vmlinuz-*" | head -1)
          echo "=== vmlinuz 前 128 字节 ==="
          xxd -l 128 "$VMLINUZ"
          echo ""
          python3 << PYEOF
          with open("$VMLINUZ", 'rb') as f:
              data = f.read(512)
          arm64_off = data.find(b'ARM\x64')
          print(f"ARM64 magic at: 0x{arm64_off:x}")
          PYEOF
          echo ""
          echo "=== vmlinuz 版本字符串 ==="
          strings -n 8 "$VMLINUZ" | grep -iE "Linux version|flippy" | head -5

      - name: B3 - flippy config
        run: |
          CONFIG=$(find /tmp/flippy_pkg/boot -name "config-*" | head -1)
          echo "########## B3: flippy 内核 config ##########"
          echo "Size: $(stat -c%s "$CONFIG")"
          echo ""
          grep -E "CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO" "$CONFIG"
          echo ""
          echo "=== 关键文件系统（built-in）==="
          grep -E "CONFIG_(EXT4_FS|OVERLAY_FS|SQUASHFS|F2FS_FS|VFAT_FS|NLS_CODEPAGE_437|NLS_ISO8859_1)=" "$CONFIG"
          echo ""
          echo "=== 关键存储/USB（built-in 或模块）==="
          grep -E "CONFIG_(MMC|MMC_BLOCK|MMC_DW_ROCKCHIP|PHY_ROCKCHIP_INNO_USB2|PHY_ROCKCHIP_NANENG_COMBO_PHY|USB_STORAGE|SCSI_DISK|BLK_DEV_INITRD)=" "$CONFIG" | head -30
          echo ""
          echo "=== CONFIG_MODULE_SIG / COMPRESS ==="
          grep -E "CONFIG_MODULE_SIG|CONFIG_MODULE_COMPRESS" "$CONFIG"
          echo ""
          echo "=== 总开关数 ==="
          echo "=y: $(grep -c '=y$' "$CONFIG"), =m: $(grep -c '=m$' "$CONFIG")"

      - name: B4 - flippy modules
        run: |
          set -e
          LATEST="${{ steps.flippy_ver.outputs.version }}"
          mkdir -p /tmp/flippy_pkg/modules
          tar xzf "$(find /tmp/flippy_pkg/$LATEST -name 'modules-*.tar.gz' | head -1)" -C /tmp/flippy_pkg/modules
          echo "########## B4: flippy modules ##########"
          ls -la /tmp/flippy_pkg/modules/
          MODNAME=$(ls /tmp/flippy_pkg/modules/ | head -1)
          echo "模块目录名: $MODNAME"
          echo "目录大小: $(du -sh /tmp/flippy_pkg/modules/$MODNAME | cut -f1)"
          echo ""
          echo "=== .ko 数量 ==="
          find "/tmp/flippy_pkg/modules/$MODNAME" -name "*.ko" | wc -l
          echo ""
          echo "=== .ko.gz/.xz/.zst 数量 ==="
          find "/tmp/flippy_pkg/modules/$MODNAME" -name "*.ko.gz" | wc -l
          find "/tmp/flippy_pkg/modules/$MODNAME" -name "*.ko.xz" | wc -l
          find "/tmp/flippy_pkg/modules/$MODNAME" -name "*.ko.zst" | wc -l
          echo ""
          echo "=== modules.dep 头几行 ==="
          head -3 "/tmp/flippy_pkg/modules/$MODNAME/modules.dep"
          echo ""
          echo "=== 关键模块（flippy 里是否作为 .ko 存在，或 built-in）==="
          for mod in ext4 overlay squashfs nls_cp437 nls_iso8859_1 usb_storage mmc_block dw_mmc_rockchip phy_rockchip_inno_usb2 rockchip_saradc; do
            F=$(find "/tmp/flippy_pkg/modules/$MODNAME" -name "${mod}.ko*" 2>/dev/null | head -1)
            if [ -n "$F" ]; then
              echo "  ✓ $mod.ko: $(basename "$F")"
            else
              # 检查 built-in
              grep -q "kernel/${mod}.ko" "/tmp/flippy_pkg/modules/$MODNAME/modules.builtin" 2>/dev/null && echo "  ★ $mod: built-in" || echo "  ? $mod: not found"
            fi
          done
          echo ""
          echo "=== 模块目录层级 ==="
          find "/tmp/flippy_pkg/modules/$MODNAME" -maxdepth 2 -type d | head -30

      - name: B5 - flippy dtb (R5S/R5C)
        run: |
          set -e
          LATEST="${{ steps.flippy_ver.outputs.version }}"
          mkdir -p /tmp/flippy_pkg/dtb
          tar xzf "$(find /tmp/flippy_pkg/$LATEST -name 'dtb-rockchip-*.tar.gz' | head -1)" -C /tmp/flippy_pkg/dtb
          echo "########## B5: flippy dtb ##########"
          echo "dtb 总数: $(find /tmp/flippy_pkg/dtb -name '*.dtb' | wc -l)"
          echo ""
          echo "=== R5S/R5C 完整匹配 ==="
          find /tmp/flippy_pkg/dtb -name "*r5s*" -o -name "*r5c*" | sort
          echo ""
          echo "=== 每个 R5S/R5C dtb 的 compatible/model ==="
          for f in $(find /tmp/flippy_pkg/dtb -name "*r5s*.dtb" -o -name "*r5c*.dtb" | sort); do
            echo "--- $f ---"
            fdtdump "$f" 2>/dev/null | grep -E "^\s+(compatible|model)" | head -3
            echo ""
          done
          echo ""
          echo "=== 所有 rk3568-nanopi* ==="
          find /tmp/flippy_pkg/dtb -name "rk3568-nanopi*" | sort
          echo ""
          echo "=== overlay 目录 ==="
          ls /tmp/flippy_pkg/dtb/overlay/ 2>/dev/null | head -20

      # ============================================================
      # ==============  C: 对比和可行性分析  ======================
      # ============================================================

      - name: C1 - Kernel size vs partition capacity
        run: |
          set -e
          echo "########## C1: kernel 大小 vs 分区容量 ##########"
          KIMG=$(find /tmp/existing -name "kernel.img" | head -1)
          VMLINUZ=$(find /tmp/flippy_pkg/boot -name "vmlinuz-*" | head -1)
          PARAM=$(find /tmp/existing -name "parameter.txt" | head -1)

          echo "FriendlyWrt kernel.img: $(stat -c%s "$KIMG") bytes"
          echo "flippy vmlinuz:         $(stat -c%s "$VMLINUZ") bytes"
          echo "flippy 构造后:           $(( $(stat -c%s "$VMLINUZ") + 8 )) bytes"
          echo ""
          KERNEL_SIZE_HEX=$(grep -oE '0x[0-9a-fA-F]+@0x[0-9a-fA-F]+\(kernel\)' "$PARAM" | head -1 | cut -d@ -f1)
          KERNEL_SIZE_BYTES=$((KERNEL_SIZE_HEX * 512))
          echo "当前 kernel 分区: $KERNEL_SIZE_BYTES bytes ($((KERNEL_SIZE_BYTES / 1024 / 1024)) MiB)"
          echo ""
          if [ $(( $(stat -c%s "$VMLINUZ") + 8 )) -le $KERNEL_SIZE_BYTES ]; then
            echo ">>> ✓ flippy 装得下"
          else
            NEED=$(echo "scale=2; ($(stat -c%s "$VMLINUZ") + 8) / 1024 / 1024" | bc)
            echo ">>> ✗ flippy 太大，需要 ≥ ${NEED} MiB"
            echo "    建议 0x18000 (48 MiB)"
          fi

      - name: C2 - Preview constructed kernel.img
        run: |
          set -e
          VMLINUZ=$(find /tmp/flippy_pkg/boot -name "vmlinuz-*" | head -1)
          VMLINUZ_SIZE=$(stat -c%s "$VMLINUZ")
          echo "########## C2: 预览构造 kernel.img ##########"
          SIZE_HEX=$(printf '%08x' $VMLINUZ_SIZE)
          SIZE_LE=$(echo "$SIZE_HEX" | sed 's/\(..\)\(..\)\(..\)\(..\)/\4\3\2\1/')
          printf 'KRNL' > /tmp/preview_kernel.img
          printf "$SIZE_LE" | xxd -r -p >> /tmp/preview_kernel.img
          cat "$VMLINUZ" >> /tmp/preview_kernel.img
          echo "构造后大小: $(stat -c%s /tmp/preview_kernel.img) bytes"
          echo "前 16 字节: $(xxd -l 16 -p /tmp/preview_kernel.img)"
          echo ""
          python3 << 'PYEOF'
          data = open('/tmp/preview_kernel.img','rb').read(512)
          idx = data.find(b'ARM\x64')
          print(f"ARM64 magic at: 0x{idx:x} (期望 0x40)")
          print('✓ MATCH' if idx == 0x40 else '✗ MISMATCH')
          PYEOF
          echo ""
          echo "=== flippy 字符串确认 ==="
          strings -n 8 /tmp/preview_kernel.img | grep -iE "flippy" | head -3

      - name: C3 - mk-sd-image.sh 源码分析
        run: |
          echo "########## C3: mk-sd-image.sh 关键逻辑 ##########"
          MK=$(find /tmp/existing -name "mk-sd-image.sh" 2>/dev/null | head -1)
          if [ -z "$MK" ]; then
            # tgz 里可能没有脚本，看 repo 里有没有
            echo "(tgz 里无 mk-sd-image.sh，检查环境)"
          else
            echo "File: $MK"
            grep -nE "kernel\.img|boot\.img|rootfs\.img|resource\.img|dtb|parameter" "$MK" | head -40
          fi

      - name: C4 - Summary
        run: |
          echo ""
          echo "==================================================================="
          echo "                       DIAGNOSTIC COMPLETE"
          echo "==================================================================="
          echo ""
          echo "=== flippy 包 ==="
          echo "版本:           ${{ steps.flippy_ver.outputs.version }}"
          echo "boot:           $(du -sh /tmp/flippy_pkg/boot 2>/dev/null | cut -f1)"
          echo "modules:        $(du -sh /tmp/flippy_pkg/modules 2>/dev/null | cut -f1)"
          echo "dtb:            $(du -sh /tmp/flippy_pkg/dtb 2>/dev/null | cut -f1)"
          echo ""
          echo "=== FriendlyWrt ==="
          SDDIR=$(dirname "$(find /tmp/existing -name parameter.txt | head -1)")
          echo "kernel.img:     $(stat -c%s "$SDDIR/kernel.img" 2>/dev/null) bytes"
          echo "rootfs.img:     $(stat -c%s "$SDDIR/rootfs.img" 2>/dev/null) bytes"
          echo "boot.img:       $(stat -c%s "$SDDIR/boot.img" 2>/dev/null) bytes"
          echo "resource.img:   $(stat -c%s "$SDDIR/resource.img" 2>/dev/null) bytes"
          echo "uboot.img:      $(stat -c%s "$SDDIR/uboot.img" 2>/dev/null) bytes"
          echo ""
          echo "重点看："
          echo "  A3  boot.img 到底装了什么（ext4? sparse?）"
          echo "  A5  rootfs 里的模块版本（用 simg2img 解开后）"
          echo "  A6  resource.img 里的 dtb 结构（dtb 真正的来源）"
          echo "  A7  uboot 从哪里加载内核"
          echo "  B4  flippy 模块目录结构（哪些是 built-in，哪些是 .ko）"
          echo "  B5  flippy 里有没有 r5s/r5c dtb"
          echo "  C1  flippy 装得下吗"
          echo "  C3  mk-sd-image.sh 读哪些文件"