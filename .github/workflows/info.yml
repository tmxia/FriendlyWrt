name: Extract FriendlyWrt Info

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (留空用最新)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/fw && cd /tmp/fw
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          fi
          echo "Release: $TAG"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.img.gz" \
            --dir . 2>/dev/null || true
          if [ -z "$(ls -A *.img.gz 2>/dev/null)" ]; then
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "*.img" \
              --dir .
          fi
          ls -lh

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kpartx

      - name: Extract info from each image
        run: |
          cd /tmp/fw
          {
            echo "## 官方固件架构与版本"
            echo ""
            echo "| 镜像 | DISTRIB_ID | DISTRIB_RELEASE | DISTRIB_ARCH | DISTRIB_TARGET |"
            echo "|---|---|---|---|---|"
          } > /tmp/result.md

          for img in *.img.gz *.img; do
            [ -f "$img" ] || continue
            echo "=== $img ==="

            # Decompress if gzipped
            if [[ "$img" == *.gz ]]; then
              raw="${img%.gz}"
              gzip -dc "$img" > "$raw"
            else
              raw="$img"
            fi

            # Map partitions
            PARTS=$(sudo kpartx -av "$raw" 2>/dev/null | grep -oE 'loop[0-9]+p[0-9]+')

            ID=""; REL=""; ARCH=""; TGT=""
            for p in $PARTS; do
              MNT=$(mktemp -d)
              if sudo mount -o ro "/dev/mapper/$p" "$MNT" 2>/dev/null; then
                if [ -f "$MNT/etc/openwrt_release" ]; then
                  ID=$(grep "^DISTRIB_ID=" "$MNT/etc/openwrt_release" | cut -d"'" -f2)
                  REL=$(grep "^DISTRIB_RELEASE=" "$MNT/etc/openwrt_release" | cut -d"'" -f2)
                  ARCH=$(grep "^DISTRIB_ARCH=" "$MNT/etc/openwrt_release" | cut -d"'" -f2)
                  TGT=$(grep "^DISTRIB_TARGET=" "$MNT/etc/openwrt_release" | cut -d"'" -f2)
                  sudo umount "$MNT"
                  rmdir "$MNT"
                  break
                fi
                sudo umount "$MNT"
              fi
              rmdir "$MNT" 2>/dev/null
            done

            sudo kpartx -d "$raw" 2>/dev/null
            [ "$raw" != "$img" ] && rm -f "$raw"

            echo "  ID      = $ID"
            echo "  RELEASE = $REL"
            echo "  ARCH    = $ARCH"
            echo "  TARGET  = $TGT"

            echo "| $img | $ID | $REL | $ARCH | $TGT |" >> /tmp/result.md
          done

          echo ""
          cat /tmp/result.md
          cat /tmp/result.md >> $GITHUB_STEP_SUMMARY