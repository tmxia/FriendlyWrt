name: Probe USERDATA Source (Both Versions)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version: ['v24.10', 'v25.12']
    steps:
      - name: Clone all relevant repos (${{ matrix.version }})
        run: |
          mkdir -p probe
          cd probe
          git clone --depth=1 -b master-${{ matrix.version }} https://github.com/friendlyarm/friendlywrt_device_rk3568 device-rk3568 || echo "device-rk3568 failed"
          git clone --depth=1 -b master-${{ matrix.version }} https://github.com/friendlyarm/friendlywrt_configs configs || echo "configs failed"
          git clone --depth=1 -b master-${{ matrix.version }} https://github.com/friendlyarm/friendlywrt friendlywrt || echo "friendlywrt failed"
          git clone --depth=1 -b kernel-6.1.y https://github.com/friendlyarm/sd-fuse_rk3568 sd-fuse || echo "sd-fuse failed"
          git clone --depth=1 https://github.com/friendlyarm/friendlywrt_scripts scripts || echo "scripts failed"
          ls -la

      - name: A. Who calls build-rootfs-img (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] build-rootfs-img 调用者 ====="
          grep -rn "build-rootfs-img" . 2>/dev/null | grep -v "\.git/" | head -30

      - name: B. Search exact byte values (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] 搜 24.10 的 1073741824 (1G) ====="
          grep -rn "1073741824\|0x40000000" . 2>/dev/null | grep -v "\.git/" | head -20
          echo ""
          echo "===== [${{ matrix.version }}] 搜 25.12 的 1610612736 (1.5G) ====="
          grep -rn "1610612736\|0x60000000\|3145728\|0x300000" . 2>/dev/null | grep -v "\.git/" | head -20

      - name: C. All USERDATA-like variables (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] USERDATA/OPT/PARTITION 相关 ====="
          grep -rniE "userdata|user_data" . 2>/dev/null | grep -v "\.git/" | grep -viE "kernel|\.c:|\.h:|dt-bindings" | head -50

      - name: D. Configs rockchip files (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] configs/rockchip 下的 mk ====="
          find configs -name "*.mk" -o -name "01-*" 2>/dev/null | head -30
          echo ""
          echo "===== [${{ matrix.version }}] configs 里跟 userdata/分区相关的行 ====="
          grep -rniE "userdata|partition_size|user_data" configs 2>/dev/null | head -30

      - name: E. device/friendlyelec rk3568 files (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] device-rk3568/rk3568 目录 ====="
          find device-rk3568 -type f 2>/dev/null | head -30
          echo ""
          echo "===== [${{ matrix.version }}] 内容里跟分区/尺寸相关 ====="
          grep -rniE "userdata|partition|size" device-rk3568 2>/dev/null | grep -v "\.git/" | head -40

      - name: F. friendlywrt build scripts (${{ matrix.version }})
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] friendlywrt 里 build/partition 脚本 ====="
          find friendlywrt -maxdepth 3 -name "*.sh" 2>/dev/null | grep -iE "build|partition|image|rootfs" | head -30
          echo ""
          echo "===== [${{ matrix.version }}] friendlywrt 里 userdata 相关 ====="
          grep -rniE "userdata|USERDATA_SIZE" friendlywrt 2>/dev/null | grep -v "\.git/" | head -30

      - name: G. Diff sd-fuse between versions
        run: |
          cd probe
          echo "===== [${{ matrix.version }}] sd-fuse generate-partmap 关键行 ====="
          grep -n "USERDATA_SIZE\|IMAGE_SIZE\|ROOTFS" sd-fuse/tools/generate-partmap-txt.sh 2>/dev/null
          echo ""
          echo "===== [${{ matrix.version }}] sd-fuse build-rootfs-img 关键行 ====="
          grep -n "USERDATA_SIZE\|build-rootfs-img\|generate-partmap" sd-fuse/build-rootfs-img.sh 2>/dev/null

      - name: H. Final summary (${{ matrix.version }})
        run: |
          cd probe
          echo "==================== [${{ matrix.version }}] 汇总 ===================="
          echo "-- build-rootfs-img 调用点数量 --"
          grep -rln "build-rootfs-img" . 2>/dev/null | grep -v "\.git/" | wc -l
          echo "-- 含 1073741824 的文件数 --"
          grep -rln "1073741824" . 2>/dev/null | grep -v "\.git/" | wc -l
          echo "-- 含 1610612736 的文件数 --"
          grep -rln "1610612736" . 2>/dev/null | grep -v "\.git/" | wc -l
          echo "-- 含 USERDATA_SIZE 的文件 --"
          grep -rln "USERDATA_SIZE" . 2>/dev/null | grep -v "\.git/"
          echo "============================================================"