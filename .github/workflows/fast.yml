name: Build R5S Flippy Image (official toolchain)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (建议 6.1.y 最稳)'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - '6.1.y'
          - '6.6.y'
          - '6.12.y'
          - '6.18.y'
      rootfs_release_tag:
        description: 'Rootfs 所在的 Release tag'
        required: true
        default: 'FriendlyWrt-2026-09-04'
        type: string
      rootfs_asset:
        description: 'Rootfs 资产名 (tgz/tar.gz)'
        required: true
        default: 'images-R5S-R5C-Series-FriendlyWrt-24.10-docker.tgz'
        type: string
      flippy_kernel_repo:
        description: '内核来源仓库 (owner/repo)'
        required: true
        default: 'ophub/kernel'
        type: string
      flippy_kernel_release:
        description: '内核 Release tag'
        required: true
        default: 'kernel_flippy'
        type: string
      package_soc:
        description: '打包目标 SoC'
        required: true
        default: 'rk35xx'
        type: choice
        options:
          - 'rk35xx'
          - 'all'

env:
  WORKSPACE: /home/runner/work/_temp/flippy-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare workspace
      run: |
        sudo mkdir -p $WORKSPACE
        sudo chown -R runner:runner $WORKSPACE
        mkdir -p $WORKSPACE/input
        mkdir -p $WORKSPACE/output
        echo "WORKSPACE: $WORKSPACE"
        ls -la $WORKSPACE

    # ============================================================
    # 1. 下载 rootfs tgz
    # ============================================================
    - name: Download rootfs tgz from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd $WORKSPACE/input
        echo "下载 ${{ inputs.rootfs_asset }} from ${{ inputs.rootfs_release_tag }}"
        gh release download "${{ inputs.rootfs_release_tag }}" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "${{ inputs.rootfs_asset }}" \
          --dir .
        ls -la
        echo "下载完成"

    # ============================================================
    # 2. 解压 tgz，重新打包为 flippy 期望的 rootfs.tar.gz
    # ============================================================
    - name: Repack rootfs as tar.gz
      run: |
        cd $WORKSPACE/input
        TGZ=$(find . -maxdepth 1 -name "*.tgz" -o -name "*.tar.gz" | head -1)
        echo "输入: $TGZ"
        mkdir -p extracted
        tar xzf "$TGZ" -C extracted

        echo "=== 解压后结构 ==="
        ls -la extracted/

        # 找到根目录顶层
        TOP=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -1)
        if [ -z "$TOP" ]; then
          echo "找不到顶层目录，假设 extracted 本身就是 rootfs"
          TOP=extracted
        fi
        echo "顶层: $TOP"
        ls -la "$TOP/" | head -30

        # 检查是否真的是 rootfs（有 bin/ etc/ lib/ 等目录）
        if [ ! -d "$TOP/bin" ] && [ ! -d "$TOP/etc" ]; then
          echo "⚠ 顶层没有 bin/etc，可能在更深一层"
          # 尝试更深一层
          DEEP=$(find extracted -maxdepth 3 -type d -name "etc" | head -1)
          if [ -n "$DEEP" ]; then
            TOP=$(dirname "$DEEP")
            echo "修正顶层: $TOP"
          fi
        fi

        ls -la "$TOP/" | head -20

        # 打包为 flippy 期望的 rootfs.tar.gz
        # flippy 工具期望：tarball 内容是 rootfs 内容本身（bin/ etc/ 位于顶层）
        cd "$TOP"
        sudo tar czf $WORKSPACE/input/rootfs.tar.gz --numeric-owner --owner=0 --group=0 .
        cd $WORKSPACE/input

        echo ""
        echo "=== rootfs.tar.gz 信息 ==="
        ls -la $WORKSPACE/input/rootfs.tar.gz
        SIZE=$(stat -c%s $WORKSPACE/input/rootfs.tar.gz)
        echo "大小: $SIZE bytes ($((SIZE/1024/1024)) MiB)"

        # 快速验证 tarball 内容
        echo ""
        echo "=== tarball 前 20 项 ==="
        tar tzf $WORKSPACE/input/rootfs.tar.gz | head -20

    # ============================================================
    # 3. 使用 flippy 官方 action 打包
    # ============================================================
    - name: Build Flippy image (official action)
      id: pack
      uses: ophub/flippy-openwrt-actions@main
      env:
        # 必填：rootfs tar.gz 路径
        OPENWRT_ARMSR: ${{ env.WORKSPACE }}/input/rootfs.tar.gz
        # 打包目标 SoC
        PACKAGE_SOC: ${{ inputs.package_soc }}
        # 内核版本
        KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
        KERNEL_AUTO_LATEST: 'true'
        # 内核来源
        KERNEL_REPO_URL: ${{ inputs.flippy_kernel_repo }}
        # 打包脚本来源（unifreq/openwrt_packit）
        SCRIPT_REPO_URL: unifreq/openwrt_packit
        SCRIPT_REPO_BRANCH: main
        # 输出到 workspace 便于上传
        OUTPUT_DIR: ${{ env.WORKSPACE }}/output

    # ============================================================
    # 4. 查找并复制输出到 workspace
    # ============================================================
    - name: Locate output images
      if: always()
      run: |
        echo "=== 工作区输出 ==="
        ls -la $WORKSPACE/output/ 2>/dev/null || true

        echo ""
        echo "=== 搜索所有 .img / .img.gz ==="
        find $WORKSPACE -type f \( -name "*.img" -o -name "*.img.gz" \) 2>/dev/null

        echo ""
        echo "=== 搜索 action 可能的输出位置 ==="
        for d in \
          openwrt_packit/tmp \
          openwrt_packit/out \
          /tmp/openwrt_packit/tmp \
          $GITHUB_WORKSPACE/openwrt_packit/tmp \
          $WORKSPACE/input/openwrt_packit/tmp \
          ; do
          if [ -d "$d" ]; then
            echo "找到: $d"
            ls -la "$d"
          fi
        done

        # 把找到的输出都拷到 output 目录
        FOUND=$(find / -maxdepth 7 -type f -name "*.img.gz" -newer $WORKSPACE/input/rootfs.tar.gz 2>/dev/null | head -20)
        echo ""
        echo "=== 全局搜索 .img.gz ==="
        echo "$FOUND"
        for f in $FOUND; do
          cp "$f" $WORKSPACE/output/ 2>/dev/null || true
        done

        echo ""
        echo "=== 最终 output 目录 ==="
        ls -la $WORKSPACE/output/

    - name: Verify output
      if: always()
      run: |
        COUNT=$(find $WORKSPACE/output -type f -name "*.img.gz" | wc -l)
        echo "找到 $COUNT 个 .img.gz"
        if [ "$COUNT" -eq 0 ]; then
          echo "⚠ 未找到 .img.gz 输出，将只上传日志"
        fi

    # ============================================================
    # 5. 上传 artifact
    # ============================================================
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flippy-r5s-${{ inputs.kernel_version }}
        path: |
          ${{ env.WORKSPACE }}/output/*.img.gz
          ${{ env.WORKSPACE }}/output/*.img
        retention-days: 7
        if-no-files-found: warn

    # ============================================================
    # 6. 附带日志收集（用于诊断）
    # ============================================================
    - name: Collect logs
      if: always()
      run: |
        mkdir -p $WORKSPACE/logs
        # 收集可能的构建日志
        for f in \
          openwrt_packit/make.log \
          /tmp/openwrt_packit.log \
          $WORKSPACE/input/openwrt_packit.log \
          ; do
          [ -f "$f" ] && cp "$f" $WORKSPACE/logs/ 2>/dev/null || true
        done
        # 汇总环境信息
        {
          echo "=== 构建信息 ==="
          echo "内核版本: ${{ inputs.kernel_version }}"
          echo "内核来源: ${{ inputs.flippy_kernel_repo }}:${{ inputs.flippy_kernel_release }}"
          echo "SoC: ${{ inputs.package_soc }}"
          echo ""
          echo "=== output 目录 ==="
          ls -la $WORKSPACE/output/ 2>/dev/null || echo "(空)"
        } > $WORKSPACE/logs/BUILD_INFO.txt
        cat $WORKSPACE/logs/BUILD_INFO.txt

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: ${{ env.WORKSPACE }}/logs/
        retention-days: 7
        if-no-files-found: ignore