name: PE Kernel Convert (zboot)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.49'
      source_repo:
        description: 'Source repo'
        required: true
        default: 'ophub/kernel'
        type: choice
        options:
          - ophub/kernel
          - breakingbadboy/OpenWrt
      source_release:
        description: 'Release'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_rk35xx
          - kernel_stable

jobs:
  convert:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl python3 xxd file gzip xz-utils zstd lz4

    - name: Download kernel
      run: |
        cd /tmp
        URL="https://github.com/${{ inputs.source_repo }}/releases/download/${{ inputs.source_release }}/${{ inputs.kernel_version }}.tar.gz"
        echo "Downloading: $URL"
        wget -q "$URL" -O kernel.tar.gz || { echo "FAILED"; exit 1; }
        tar xzf kernel.tar.gz

    - name: Extract boot
      run: |
        cd /tmp
        KERNEL_VER="${{ inputs.kernel_version }}"
        LOCAL_DIR="$KERNEL_VER"
        if [ ! -d "$LOCAL_DIR" ]; then
          LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        fi
        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        mkdir -p boot_extract
        tar xzf "$BOOT_TAR" -C boot_extract
        ls -la boot_extract/

    - name: Analyze vmlinuz (zboot structure)
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        [ -z "$VMLINUZ" ] && { echo "vmlinuz not found"; exit 1; }
        echo "File: $VMLINUZ"
        echo "Size: $(stat -c%s "$VMLINUZ") bytes"

        python3 - "$VMLINUZ" <<'PYEOF'
        import sys, struct

        data = open(sys.argv[1], 'rb').read()
        ARM64_MAGIC = bytes([0x41, 0x52, 0x4d, 0x64])  # "ARMd"

        print("File size: %d bytes" % len(data))

        if data[0:2] != b'MZ':
            idx = data.find(ARM64_MAGIC)
            print("Not PE (no MZ). ARM64 magic offset: 0x%x" % idx)
            sys.exit(0)

        # 读取 PE 头偏移 (0x3C)
        pe_off = struct.unpack_from('<I', data, 0x3C)[0]
        print("PE header offset (0x3C): 0x%x" % pe_off)

        if pe_off + 4 > len(data) or data[pe_off:pe_off+4] != b'PE\x00\x00':
            print("Bad PE signature at 0x%x: %s" % (pe_off, data[pe_off:pe_off+4].hex()))
            sys.exit(1)
        print("PE signature: OK")

        # COFF 头
        coff = pe_off + 4
        machine = struct.unpack_from('<H', data, coff)[0]
        num_sections = struct.unpack_from('<H', data, coff + 2)[0]
        opt_hdr_size = struct.unpack_from('<H', data, coff + 16)[0]

        print("Machine: 0x%04x (0xaa64 = ARM64)" % machine)
        print("Number of sections: %d" % num_sections)
        print("Optional header size: %d" % opt_hdr_size)

        # Section 表
        sec_start = coff + 20 + opt_hdr_size
        print("")
        print("Section table (at 0x%x):" % sec_start)
        print("%-3s %-12s %10s %10s" % ("#", "Name", "RawOff", "RawSize"))
        print("-" * 45)

        sections = []
        for i in range(num_sections):
            off = sec_start + i * 40
            name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
            vsize = struct.unpack_from('<I', data, off + 8)[0]
            vaddr = struct.unpack_from('<I', data, off + 12)[0]
            raw_size = struct.unpack_from('<I', data, off + 16)[0]
            raw_off = struct.unpack_from('<I', data, off + 20)[0]
            sections.append({'name': name, 'off': raw_off, 'size': raw_size})
            print("%-3d %-12s 0x%08x 0x%08x" % (i, name, raw_off, raw_size))

        # 检查每个 section 的格式
        print("")
        print("Section formats:")
        for i, s in enumerate(sections):
            off = s['off']
            size = s['size']
            if size == 0 or off + 32 > len(data):
                continue
            chunk = data[off:off+32]
            fmt = "unknown"
            if chunk[:2] == b'\x1f\x8b':
                fmt = "gzip"
            elif chunk[:6] == b'\xfd7zXZ\x00':
                fmt = "xz"
            elif chunk[:4] == b'\x28\xb5\x2f\xfd':
                fmt = "zstd"
            elif chunk[:4] == b'\x04\x22\x4d\x18':
                fmt = "lz4"
            elif chunk[:2] == b'BZ':
                fmt = "bzip2"
            elif chunk[:4] == b'\x7fELF':
                fmt = "ELF"
            elif chunk.find(ARM64_MAGIC) >= 0:
                fmt = "ARM64-Image"

            print("[%d] %s: %s (first 16 bytes: %s)" % (i, s['name'], fmt, chunk[:16].hex()))

            # 查找 ARM64 magic
            sub = data[off:off+min(size, 1<<20)]
            idx = sub.find(ARM64_MAGIC)
            if idx >= 0:
                print("    ARM64 magic at section+0x%x" % idx)

        PYEOF

    - name: Convert zboot to raw kernel
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)

        python3 - "$VMLINUZ" /tmp/kernel_arm64.img <<'PYEOF'
        import sys, struct, gzip, lzma, subprocess, os

        src, dst = sys.argv[1], sys.argv[2]
        data = open(src, 'rb').read()
        ARM64_MAGIC = bytes([0x41, 0x52, 0x4d, 0x64])

        # 1. 定位 PE 头
        pe_off = struct.unpack_from('<I', data, 0x3C)[0]
        assert data[pe_off:pe_off+4] == b'PE\x00\x00', "Not PE"

        coff = pe_off + 4
        num_sections = struct.unpack_from('<H', data, coff + 2)[0]
        opt_hdr_size = struct.unpack_from('<H', data, coff + 16)[0]
        sec_start = coff + 20 + opt_hdr_size

        # 2. 收集 sections
        sections = []
        for i in range(num_sections):
            off = sec_start + i * 40
            name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
            raw_size = struct.unpack_from('<I', data, off + 16)[0]
            raw_off = struct.unpack_from('<I', data, off + 20)[0]
            sections.append({'name': name, 'off': raw_off, 'size': raw_size})

        # 3. 优先找 .linux section
        target = None
        for s in sections:
            if s['name'] == '.linux':
                target = s
                break
        if not target:
            for s in sections:
                if s['name'] == '.text':
                    target = s
                    break

        if not target:
            print("ERROR: no .linux or .text section found")
            sys.exit(1)

        print("Using section: %s (offset=0x%x, size=0x%x)" % (
            target['name'], target['off'], target['size']))

        payload = data[target['off']:target['off']+target['size']]
        print("Payload size: %d bytes" % len(payload))

        # 4. 解压
        result = None
        if payload[:2] == b'\x1f\x8b':
            print("Decompressing gzip...")
            result = gzip.decompress(payload)
        elif payload[:6] == b'\xfd7zXZ\x00':
            print("Decompressing xz...")
            result = lzma.decompress(payload)
        elif payload[:4] == b'\x28\xb5\x2f\xfd':
            print("Decompressing zstd...")
            r = subprocess.run(['zstd', '-d', '-c'], input=payload, capture_output=True)
            if r.returncode != 0:
                print("zstd failed: %s" % r.stderr.decode())
                sys.exit(1)
            result = r.stdout
        elif payload[:4] == b'\x04\x22\x4d\x18':
            print("Decompressing lz4...")
            r = subprocess.run(['lz4', '-d', '-c'], input=payload, capture_output=True)
            if r.returncode != 0:
                print("lz4 failed: %s" % r.stderr.decode())
                sys.exit(1)
            result = r.stdout
        else:
            print("Unknown compression, using raw payload")
            result = payload

        print("Decompressed size: %d bytes" % len(result))

        # 5. 验证是 ARM64 Image
        magic_idx = result.find(ARM64_MAGIC)
        print("ARM64 magic offset: 0x%x" % magic_idx)

        # 6. 写入结果
        open(dst, 'wb').write(result)
        print("Written: %s" % dst)

        # 7. 显示前 64 字节
        print("First 64 bytes of decompressed:")
        for i in range(0, min(64, len(result)), 16):
            hex_part = ' '.join('%02x' % b for b in result[i:i+16])
            print("  %04x: %s" % (i, hex_part))
        PYEOF

    - name: Inspect decompressed kernel
      run: |
        echo "===== 解压后内核检查 ====="
        ls -la /tmp/kernel_arm64.img
        file /tmp/kernel_arm64.img
        echo ""
        echo "前 128 字节:"
        xxd -l 128 /tmp/kernel_arm64.img

    - name: Build KRNL kernel.img
      run: |
        python3 - /tmp/kernel_arm64.img /tmp/kernel.img <<'PYEOF'
        import sys, struct

        src, dst = sys.argv[1], sys.argv[2]
        data = bytearray(open(src, 'rb').read())
        ARM64_MAGIC = bytes([0x41, 0x52, 0x4d, 0x64])

        magic_idx = data.find(ARM64_MAGIC)
        print("Input ARM64 magic at 0x%x" % magic_idx)

        # 情况 A: 已经是干净 ARM64 Image (magic 在 0x38)
        if magic_idx == 0x38:
            print("Clean ARM64 Image already")
            # 检查 code0
            code0 = struct.unpack_from('<I', data, 0)[0]
            print("code0 = 0x%08x" % code0)
            if code0 != 0xd503201f:
                print("Replacing code0 with NOP")
                data[0:4] = b'\x1f\x20\x03\xd5'
            # 修正 image_size
            img_size = len(data)
            struct.pack_into('<Q', data, 0x10, img_size)
            print("image_size set to %d" % img_size)

        # 情况 B: magic 在 0x0（说明是裸机数据）
        elif magic_idx == 0x0:
            print("Not standard image, skipping")
        else:
            print("Magic at 0x%x, treat as-is" % magic_idx)

        # 构造 KRNL
        knl_size = len(data)
        out = b'KRNL' + struct.pack('<I', knl_size) + bytes(data)
        open(dst, 'wb').write(out)
        print("KRNL built: %d bytes (payload %d)" % (len(out), knl_size))

        # 验证
        check = open(dst, 'rb').read(128)
        assert check[0:4] == b'KRNL'
        idx2 = check.find(ARM64_MAGIC)
        print("KRNL ARM64 magic at 0x%x" % idx2)
        if idx2 == 0x40:
            print("SUCCESS: ARM64 magic correctly at 0x40")
        else:
            print("WARN: ARM64 magic at 0x%x (expected 0x40)" % idx2)
        PYEOF

    - name: Upload kernel.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-img-${{ inputs.kernel_version }}
        path: /tmp/kernel.img
        retention-days: 7

    - name: Summary
      run: |
        echo "=========================================="
        echo "转换完成"
        echo "=========================================="
        echo "输入: ${{ inputs.kernel_version }}"
        echo "来源: ${{ inputs.source_repo }} / ${{ inputs.source_release }}"
        echo "输出: /tmp/kernel.img"
        echo "已上传为 artifact: kernel-img-${{ inputs.kernel_version }}"