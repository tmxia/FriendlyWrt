name: Diagnose sd-fuse

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Init env
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl git file xxd binutils python3 \
          device-tree-compiler android-sdk-libsparse-utils u-boot-tools
        git clone https://github.com/friendlyarm/repo /tmp/repo
        sudo -E cp /tmp/repo/repo /usr/bin/

    - name: Fetch sd-fuse
      run: |
        cd /tmp
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests \
          -b master-v24.10 -m rk3568.xml \
          --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle

    - name: Download images.tgz
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PATTERN="images-R5S-R5C-Series-FriendlyWrt-24.10-docker.tgz"
        TAGS=$(gh release list --limit 50 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
        FOUND=""
        for TAG in $TAGS; do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
            FOUND="$TAG"; break
          fi
        done
        [ -z "$FOUND" ] && { echo "ERROR: not found"; exit 1; }
        mkdir -p /tmp/inputs && cd /tmp/inputs
        gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
        mkdir -p /tmp/work
        tar xzf /tmp/inputs/$PATTERN -C /tmp/work
        echo "BASE=$(find /tmp/work -maxdepth 1 -type d -name 'friendlywrt*' | head -1)"

    - name: Section 1 - sd-fuse directory structure
      run: |
        SDFUSE="/tmp/scripts/sd-fuse"
        echo "===== 1.1 sd-fuse top ====="
        ls -la "$SDFUSE"
        echo ""
        echo "===== 1.2 tools/ ====="
        ls -laR "$SDFUSE/tools/" 2>&1 | head -100
        echo ""
        echo "===== 1.3 files/ ====="
        ls -laR "$SDFUSE/files/" 2>&1 | head -80
        echo ""
        echo "===== 1.4 prebuilt/ ====="
        ls -laR "$SDFUSE/prebuilt/" 2>&1 | head -80

    - name: Section 2 - build-kernel.sh
      run: |
        echo "===== 2. build-kernel.sh ====="
        cat /tmp/scripts/sd-fuse/build-kernel.sh 2>/dev/null || echo "NOT FOUND"

    - name: Section 3 - build-boot-img.sh
      run: |
        echo "===== 3. build-boot-img.sh ====="
        cat /tmp/scripts/sd-fuse/build-boot-img.sh 2>/dev/null || echo "NOT FOUND"

    - name: Section 4 - mk-sd-image.sh
      run: |
        echo "===== 4. mk-sd-image.sh ====="
        cat /tmp/scripts/sd-fuse/mk-sd-image.sh 2>/dev/null || echo "NOT FOUND"

    - name: Section 5 - build-rootfs-img.sh
      run: |
        echo "===== 5. build-rootfs-img.sh ====="
        cat /tmp/scripts/sd-fuse/build-rootfs-img.sh 2>/dev/null || echo "NOT FOUND"

    - name: Section 6 - images.tgz top-level
      run: |
        BASE=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        echo "===== 6. images.tgz 顶层 ====="
        ls -la "$BASE"

    - name: Section 7 - resource.img structure
      run: |
        BASE=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        echo "===== 7. resource.img ====="
        if [ -f "$BASE/resource.img" ]; then
          stat -c "%n: %s bytes" "$BASE/resource.img"
          file -b "$BASE/resource.img"
          echo "--- 前 256 字节 ---"
          xxd -l 256 "$BASE/resource.img"
          echo "--- FDT magic (d00dfeed) 位置 ---"
          python3 -c "import sys; raw=open(sys.argv[1],'rb').read(); magic=b'\xd0\x0d\xfe\xed'; idxs=[]; i=0
while True:
    j=raw.find(magic,i)
    if j<0: break
    idxs.append(j); i=j+1
    if len(idxs)>30: break
print(f'  找到 {len(idxs)} 个 FDT magic:')
for off in idxs: print(f'    @ 0x{off:x}')" "$BASE/resource.img"
        else
          echo "resource.img 不存在"
        fi

    - name: Section 8 - boot.img structure
      run: |
        BASE=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        echo "===== 8. boot.img ====="
        if [ -f "$BASE/boot.img" ]; then
          stat -c "%n: %s bytes" "$BASE/boot.img"
          file -b "$BASE/boot.img"
          echo "--- 前 64 字节 ---"
          xxd -l 64 "$BASE/boot.img"
        else
          echo "boot.img 不存在"
        fi

    - name: Section 9 - kernel dtbo uboot idbloader
      run: |
        BASE=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        echo "===== 9. 关键 img 文件 ====="
        for f in kernel.img dtbo.img uboot.img idbloader.img misc.img; do
          if [ -f "$BASE/$f" ]; then
            echo "--- $f ---"
            stat -c "  size: %s bytes" "$BASE/$f"
            file -b "$BASE/$f"
            xxd -l 32 "$BASE/$f" | head -2
            echo ""
          fi
        done

    - name: Section 10 - dtb directory
      run: |
        BASE=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        echo "===== 10. dtb 目录 ====="
        ls -la "$BASE/dtb/" 2>/dev/null
        echo ""
        ls -la "$BASE/dtb/rockchip/" 2>/dev/null | head -30

    - name: Section 11 - parameter.txt
      run: |
        BASE=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        echo "===== 11. parameter.txt ====="
        cat "$BASE/parameter.txt" 2>/dev/null

    - name: Section 12 - available tools
      run: |
        SDFUSE="/tmp/scripts/sd-fuse"
        echo "===== 12.1 相关工具文件 ====="
        find "$SDFUSE" -maxdepth 4 -type f \( -name "*resource*" -o -name "*dtb*" -o -name "*img*tool*" -o -name "mkimage" -o -name "dtc" \) 2>/dev/null
        echo ""
        echo "===== 12.2 所有可执行文件 ====="
        find "$SDFUSE" -maxdepth 4 -type f -executable 2>/dev/null | head -50
        echo ""
        echo "===== 12.3 系统工具 ====="
        for t in mkimage dtc simg2img img2simg lz4; do
          if command -v $t >/dev/null 2>&1; then
            echo "$t: $(command -v $t)"
          else
            echo "$t: NOT FOUND"
          fi
        done

    - name: Summary
      run: |
        echo "=============================================="
        echo "   诊断完成"
        echo "=============================================="
        echo "请把上述全部输出贴给我"