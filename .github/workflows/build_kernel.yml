name: Build OpenWrt Mainline (Kernel 6.18)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version (label)'
        required: true
        default: 'both'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Get release tag
      id: release_tag
      run: |
        release_tag="OpenWrt-$(date +%Y-%m-%d)"
        echo "release_tag=$release_tag" >> $GITHUB_OUTPUT

    - name: Create empty release
      id: release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_tag.outputs.release_tag }}
        draft: false
        prerelease: false
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    - name: Filter combinations
      if: github.event_name == 'workflow_dispatch'
      run: |
        VERSION_INPUT="${{ github.event.inputs.version }}"
        SET_INPUT="${{ github.event.inputs.set }}"
        if [ "$VERSION_INPUT" != "both" ] && [ "${{ matrix.VERSION }}" != "$VERSION_INPUT" ]; then
          echo "Skipping version ${{ matrix.VERSION }}"
          exit 1
        fi
        if [ "$SET_INPUT" != "both" ] && [ "${{ matrix.SET }}" != "$SET_INPUT" ]; then
          echo "Skipping set ${{ matrix.SET }}"
          exit 1
        fi
        echo "Proceeding with ${{ matrix.VERSION }} - ${{ matrix.SET }}"
      continue-on-error: true

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison libncurses-dev libssl-dev \
          zlib1g-dev gawk git ccache gettext libelf-dev xsltproc rsync wget \
          unzip python3 python3-distutils python3-setuptools python3-dev \
          file libxml2-dev libxslt1-dev
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'

    - name: Clone OpenWrt mainline
      run: |
        git clone --depth=1 -b main https://github.com/openwrt/openwrt.git project
        cd project
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure target
      run: |
        cd project
        echo "CONFIG_TARGET_rockchip=y" >> .config
        echo "CONFIG_TARGET_rockchip_rk3568=y" >> .config
        echo "CONFIG_TARGET_rockchip_rk3568_DEVICE_friendlyarm_nanopi-r5s=y" >> .config
        echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        make defconfig

    - name: Add custom packages
      run: |
        cd project
        bash ../scripts/add_packages.sh ${{ matrix.SET }}

    - name: Finalize config
      run: |
        cd project
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Download sources
      run: |
        cd project
        make download -j8

    - name: Compile
      id: compile
      continue-on-error: true
      run: |
        cd project
        if ! make -j$(nproc); then
          make -j1 V=s
        fi

    - name: Retry if failed
      if: steps.compile.outcome == 'failure'
      run: |
        cd project
        make -j1 V=s

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.VERSION }}-${{ matrix.SET }}
        path: project/logs/
        retention-days: 7

    - name: Locate image
      id: locate
      run: |
        cd project
        IMG_DIR="bin/targets/rockchip/rk3568"
        IMG_FILE=$(ls $IMG_DIR/*-nanopi-r5s-*.img.gz 2>/dev/null | head -n1)
        if [ -z "$IMG_FILE" ]; then
          IMG_FILE=$(ls $IMG_DIR/*-friendlyarm_nanopi-r5s-*.img.gz 2>/dev/null | head -n1)
        fi
        if [ -z "$IMG_FILE" ]; then
          echo "ERROR: No image found!"
          exit 1
        fi
        echo "img_file=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "img_filename=$(basename $IMG_FILE)" >> $GITHUB_OUTPUT

    - name: Upload image
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: project/${{ steps.locate.outputs.img_file }}
        asset_name: ${{ steps.locate.outputs.img_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate:
    needs: [prepare_release, build]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | startswith("rootfs-") or startswith("host-pm-")) | .name' | while read asset; do
          [ -z "$asset" ] && continue
          echo "Deleting $asset"
          gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
        done

  cleanup_self:
    runs-on: ubuntu-latest
    needs: [prepare_release, build, cleanup_intermediate]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        keep_minimum_runs: 0
        retain_days: 0
        delete_workflow_pattern: "Build OpenWrt Mainline"
        repository: ${{ github.repository }}