name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  actions: write
  packages: write

concurrency:
  group: build-r5s
  cancel-in-progress: false

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_VER: '25.12'
  MODEL_NAME: 'R5S'
  OPENWRT_BRANCH: 'openwrt-25.12'
  OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
  CONFIG_FILE: 'scripts/r5s.config'
  DIY_SH: 'scripts/r5s_customize.sh'
  CACHE_KEEP_VERSIONS: '3'

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    concurrency:
      group: r5s-prepare-release
      cancel-in-progress: false
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="${MODEL_NAME}-OpenWrt-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)

          if [ "$FORCE_BASE" = "true" ]; then
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: true

  build:
    name: Build r5s
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup, clone and detect kernel
        id: setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/az \
                      /usr/local/share/powershell /opt/microsoft /opt/google \
                      /opt/pipx /usr/lib/jvm /usr/local/sdkman /usr/local/go \
                      /usr/local/share/chromium /opt/conda || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile

          sudo systemctl stop docker || true
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker || sudo service docker start
          sleep 3
          docker info | grep "Docker Root Dir" || true

          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig zstd \
            device-tree-compiler u-boot-tools e2fsprogs parted dosfstools mtools \
            android-sdk-libsparse-utils btrfs-progs

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          free -h
          df -hT

          echo ""
          echo "===== clone OpenWrt ====="
          cd /workdir
          git clone -b ${{ env.OPENWRT_BRANCH }} --single-branch \
            ${{ env.OPENWRT_REPO }} openwrt 2>&1 | tail -3
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

          echo ""
          echo "===== detect kernel version ====="
          cd /workdir/openwrt
          KV=$(grep -h '^LINUX_VERSION-6\.12 = ' include/kernel-version.mk \
               | head -1 | awk -F'= ' '{print $2}' | tr -d '.')
          if [ -z "$KV" ]; then
            SHORT=$(git rev-parse --short HEAD)
            KV="commit-${SHORT}"
          fi
          OW_HASH=$(git rev-parse --short=8 HEAD)
          echo "kernel=$KV" >> "$GITHUB_OUTPUT"
          echo "ow_hash=$OW_HASH" >> "$GITHUB_OUTPUT"
          echo "detected: kernel=6.12.$KV openwrt=$OW_HASH"

          sudo mkdir -p /workdir/ccache
          sudo chown -R $USER:$GROUPS /workdir/ccache

      - name: Restore build cache
        id: restore_build
        run: |
          set -e
          cd /workdir/openwrt

          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${REPO_LOWER}/r5s-buildcache"
          KV="${{ steps.setup.outputs.kernel }}"
          TAG="${BASE}:openwrt-25.12-linux-6.12.${KV}"

          echo "=== build cache: $TAG ==="
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "complete=false" >> "$GITHUB_OUTPUT"

          docker rmi "$TAG" 2>/dev/null || true

          if ! docker pull "$TAG" 2>/dev/null; then
            echo "CACHE MISS"
            exit 0
          fi

          echo "CACHE HIT, extracting..."
          docker create --name r5s_build_tmp "$TAG" >/dev/null
          docker export r5s_build_tmp | tar -xf - -C /workdir/openwrt
          docker rm r5s_build_tmp >/dev/null

          echo ""
          echo "=== restored directory sizes ==="
          for d in staging_dir/host staging_dir/toolchain-* staging_dir/target-* \
                   build_dir/host build_dir/toolchain-*; do
            [ -e "$d" ] || continue
            echo "  $(du -sh "$d" 2>/dev/null | awk '{print $1}')  $d"
          done

          echo ""
          echo "=== key stamps ==="
          COMPLETE=true

          HOST_STAMPS=$(ls staging_dir/host/stamp/.tools_compile_* 2>/dev/null || true)
          if [ -z "$HOST_STAMPS" ]; then
            echo "  [MISS] staging_dir/host/stamp/.tools_compile_*"
            COMPLETE=false
          else
            echo "$HOST_STAMPS" | while read -r s; do
              echo "  [OK]   $s ($(stat -c '%y' "$s" | cut -d. -f1))"
            done
          fi

          TC_STAMPS=$(ls staging_dir/toolchain-*/stamp/.toolchain_compile_* 2>/dev/null || true)
          if [ -z "$TC_STAMPS" ]; then
            echo "  [MISS] staging_dir/toolchain-*/stamp/.toolchain_compile_*"
            COMPLETE=false
          else
            echo "$TC_STAMPS" | while read -r s; do
              echo "  [OK]   $s ($(stat -c '%y' "$s" | cut -d. -f1))"
            done
          fi

          echo ""
          echo "complete=$COMPLETE"
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: restore_ccache
        run: |
          set -e
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${REPO_LOWER}/r5s-ccache"
          KV="${{ steps.setup.outputs.kernel }}"
          TAG="${BASE}:openwrt-25.12-linux-6.12.${KV}"

          echo "=== ccache: $TAG ==="
          echo "hit=false" >> "$GITHUB_OUTPUT"

          mkdir -p /workdir/ccache
          docker rmi "$TAG" 2>/dev/null || true

          if ! docker pull "$TAG" 2>/dev/null; then
            echo "CCACHE MISS"
            exit 0
          fi

          echo "CCACHE HIT, extracting..."
          docker create --name r5s_ccache_tmp "$TAG" >/dev/null
          docker export r5s_ccache_tmp | tar -xf - -C /workdir
          docker rm r5s_ccache_tmp >/dev/null

          CCACHE_STATS=$(du -sh /workdir/ccache 2>/dev/null | awk '{print $1}')
          CCACHE_FILES=$(find /workdir/ccache -type f 2>/dev/null | wc -l)
          echo "  size: $CCACHE_STATS, files: $CCACHE_FILES"

          echo "hit=true" >> "$GITHUB_OUTPUT"

      - name: Prepare build configuration
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre
          ./scripts/feeds update -a 2>&1 | tail -30

          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} post
          ./scripts/feeds install -a 2>&1 | tail -40

          cp $GITHUB_WORKSPACE/${{ env.CONFIG_FILE }} .config
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} config

          for pkg in iptables-zz-legacy ip6tables-zz-legacy iptables-legacy; do
            sed -i "s/^CONFIG_PACKAGE_${pkg}=[ym]/# CONFIG_PACKAGE_${pkg} is not set/" .config
            grep -q "^# CONFIG_PACKAGE_${pkg} is not set" .config || \
              echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done

          if ! grep -q '^CONFIG_CCACHE=y' .config; then
            echo "CONFIG_CCACHE=y" >> .config
          fi
          sed -i 's|^CONFIG_CCACHE_DIR=.*|CONFIG_CCACHE_DIR="/workdir/ccache"|' .config
          grep -q '^CONFIG_CCACHE_DIR=' .config || \
            echo 'CONFIG_CCACHE_DIR="/workdir/ccache"' >> .config

          make defconfig

          echo ""
          echo "=== ccache config ==="
          grep -E '^CONFIG_CCACHE' .config || true

      - name: Compile base
        id: compile_base
        run: |
          cd /workdir/openwrt
          touch /workdir/base_compilation_marker

          echo "===== tools/download ====="
          T0=$(date +%s)
          if ! make tools/download -j1 > /tmp/tools_dl.log 2>&1; then
            echo "tools/download failed, showing verbose output"
            make tools/download -j1 V=s 2>&1 | tail -100
            exit 1
          fi
          echo "  took $(( $(date +%s) - T0 ))s"

          echo "===== tools/compile ====="
          T0=$(date +%s)
          if ! make tools/compile -j$(nproc) > /tmp/tools_c.log 2>&1; then
            echo "tools/compile failed, showing verbose output"
            make tools/compile -j1 V=s 2>&1 | tail -200
            exit 1
          fi
          echo "  took $(( $(date +%s) - T0 ))s"

          echo "===== toolchain/download ====="
          T0=$(date +%s)
          if ! make toolchain/download -j1 > /tmp/tc_dl.log 2>&1; then
            echo "toolchain/download failed, showing verbose output"
            make toolchain/download -j1 V=s 2>&1 | tail -100
            exit 1
          fi
          echo "  took $(( $(date +%s) - T0 ))s"

          echo "===== toolchain/compile ====="
          T0=$(date +%s)
          if ! make toolchain/compile -j$(nproc) > /tmp/tc_c.log 2>&1; then
            echo "toolchain/compile failed, showing verbose output"
            make toolchain/compile -j1 V=s 2>&1 | tail -250
            exit 1
          fi
          echo "  took $(( $(date +%s) - T0 ))s"

          echo ""
          echo "===== compile base OK ====="
          echo ""
          echo "=== post-compile stamps ==="
          ls -la staging_dir/host/stamp/ 2>/dev/null | tail -20 || true
          ls -la staging_dir/toolchain-*/stamp/ 2>/dev/null | tail -20 || true

      - name: Save and publish cache
        if: success() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.CACHE_KEEP_VERSIONS }}
          KV: ${{ steps.setup.outputs.kernel }}
          CACHE_HIT: ${{ steps.restore_build.outputs.hit }}
          CACHE_COMPLETE: ${{ steps.restore_build.outputs.complete }}
        run: |
          set -e
          cd /workdir/openwrt

          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          BUILD_BASE="ghcr.io/${REPO_LOWER}/r5s-buildcache"
          CCACHE_BASE="ghcr.io/${REPO_LOWER}/r5s-ccache"
          BUILD_TAG="${BUILD_BASE}:openwrt-25.12-linux-6.12.${KV}"
          CCACHE_TAG="${CCACHE_BASE}:openwrt-25.12-linux-6.12.${KV}"

          IGNORE_PATTERN="staging_dir/host/stamp/\.tools_compile_|staging_dir/target-[^/]+/stamp/\.target_prereq$"

          CHANGED=$(find build_dir staging_dir -type f -newer /workdir/base_compilation_marker -path "*/stamp/*" 2>/dev/null | \
                    grep -E -v "$IGNORE_PATTERN" | wc -l)

          echo "changed stamp files: $CHANGED"
          echo "cache hit: $CACHE_HIT, complete: $CACHE_COMPLETE"

          if [ "$CACHE_HIT" = "true" ] && [ "$CACHE_COMPLETE" = "true" ] && [ "$CHANGED" -eq 0 ]; then
            echo "cache is complete and up-to-date, skip save"
            exit 0
          fi

          echo ""
          echo "===== build cache: packing ====="
          T0=$(date +%s)
          docker rmi "$BUILD_TAG" 2>/dev/null || true

          tar -cf - \
            --exclude='build_dir/target-*/linux-*' \
            --exclude='build_dir/toolchain-*/linux-*' \
            -C /workdir/openwrt \
            staging_dir build_dir | docker import - "$BUILD_TAG"

          TAR_SIZE=$(docker image inspect "$BUILD_TAG" --format='{{.Size}}' 2>/dev/null || echo 0)
          echo "  packed in $(( $(date +%s) - T0 ))s, size: $((TAR_SIZE / 1024 / 1024 ))MB"

          echo "===== build cache: pushing ====="
          T0=$(date +%s)
          for attempt in 1 2 3; do
            if docker push "$BUILD_TAG" >/dev/null 2>&1; then
              echo "  pushed in $(( $(date +%s) - T0 ))s"
              break
            fi
            echo "  attempt $attempt failed, retrying..."
            sleep 5
          done

          docker rmi "$BUILD_TAG" 2>/dev/null || true

          echo ""
          echo "===== ccache: packing ====="
          if [ -d /workdir/ccache ] && [ "$(ls -A /workdir/ccache 2>/dev/null)" ]; then
            T0=$(date +%s)
            docker rmi "$CCACHE_TAG" 2>/dev/null || true

            tar -cf - -C /workdir ccache | docker import - "$CCACHE_TAG"

            CC_SIZE=$(docker image inspect "$CCACHE_TAG" --format='{{.Size}}' 2>/dev/null || echo 0)
            echo "  packed in $(( $(date +%s) - T0 ))s, size: $((CC_SIZE / 1024 / 1024 ))MB"

            echo "===== ccache: pushing ====="
            T0=$(date +%s)
            for attempt in 1 2 3; do
              if docker push "$CCACHE_TAG" >/dev/null 2>&1; then
                echo "  pushed in $(( $(date +%s) - T0 ))s"
                break
              fi
              echo "  attempt $attempt failed, retrying..."
              sleep 5
            done

            docker rmi "$CCACHE_TAG" 2>/dev/null || true
          else
            echo "  ccache empty, skip"
          fi

          echo ""
          echo "===== prune old cache versions ====="
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)

          OWNER_TYPE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                       "https://api.github.com/users/$OWNER" | jq -r .type 2>/dev/null || echo "User")
          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_PREFIX="/orgs/$OWNER/packages/container"
          else
            API_PREFIX="/users/$OWNER/packages/container"
          fi
          echo "owner type: $OWNER_TYPE"

          prune_prefix() {
            local PKG="$1"
            local PREFIX="$2"

            echo ""
            echo "--- prune ${PKG}:* prefix=${PREFIX} keep=${KEEP} ---"

            local ALL=$(mktemp)
            local PAGE=1
            while :; do
              local RESP=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                     "https://api.github.com${API_PREFIX}/${PKG}/versions?per_page=100&page=$PAGE")
              local COUNT=$(echo "$RESP" | jq 'if type=="array" then length else 0 end')
              [ "$COUNT" = "0" ] && break
              echo "$RESP" | jq -c '.[]' >> "$ALL"
              [ "$COUNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done

            local TOTAL=$(wc -l < "$ALL" | tr -d ' ')
            echo "  total versions: $TOTAL"

            if [ "$TOTAL" != "0" ]; then
              local PLAN=$(jq -r --arg p "$PREFIX" '
                select((.metadata.container.tags // []) | any(startswith($p)))
                | [.id, .created_at] | @tsv
              ' "$ALL" | sort -k2 -r | awk -v keep="$KEEP" 'NR>keep {print $1}')

              if [ -z "$PLAN" ]; then
                echo "  (nothing to prune)"
              else
                local N=$(echo "$PLAN" | wc -l | tr -d ' ')
                echo "  pruning $N versions..."
                echo "$PLAN" | while read -r VID; do
                  [ -z "$VID" ] && continue
                  if curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                     "https://api.github.com${API_PREFIX}/${PKG}/versions/$VID" >/dev/null 2>&1; then
                    echo "    deleted $VID"
                  else
                    echo "    failed  $VID"
                  fi
                done
              fi
            fi

            rm -f "$ALL"
          }

          prune_prefix "r5s-buildcache" "openwrt-25.12-linux-6.12."
          prune_prefix "r5s-ccache"     "openwrt-25.12-linux-6.12."

          echo ""
          echo "=== prune done ==="

      - name: Compile firmware
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre_build
          rm -rf bin/targets/rockchip/armv8

          set +e
          make download -j8 > /tmp/download.log 2>&1 || true
          make -j$(nproc) V=s > /tmp/build.log 2>&1
          BUILD_RESULT=$?
          set -e

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "Build failed (exit: $BUILD_RESULT)"
            if [ "$BUILD_RESULT" -gt 128 ]; then
              SIG=$((BUILD_RESULT - 128))
              [ "$SIG" = "9" ] && echo "SIGKILL (likely OOM)"
              free -h
              sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill" | tail -20 || true
            fi

            FIRST_ERR=$(grep -n -m 1 -E "^make(\[[0-9]+\])?: \*\*\* .* Error [0-9]" /tmp/build.log | cut -d: -f1)
            if [ -n "$FIRST_ERR" ]; then
              START=$((FIRST_ERR > 150 ? FIRST_ERR - 150 : 1))
              END=$((FIRST_ERR + 30))
              sed -n "${START},${END}p" /tmp/build.log
            else
              tail -300 /tmp/build.log
            fi
            exit 1
          fi

          echo ""
          echo "=== ccache stats ==="
          ccache -s -d /workdir/ccache 2>/dev/null || ccache -s 2>/dev/null || true

      - name: Collect and upload artifacts
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /workdir/openwrt
          OUT="bin/targets/rockchip/armv8"
          TAG="${{ needs.prepare_release.outputs.release_tag }}"
          ARTIFACT_PREFIX=$(echo "$TAG" | sed "s/^${MODEL_NAME}-OpenWrt-/${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-/")
          KV=$(grep -h '^LINUX_VERSION-6\.12 = ' include/kernel-version.mk | head -1 | awk -F'= ' '{print $2}')
          echo "release tag:     $TAG"
          echo "artifact prefix: $ARTIFACT_PREFIX"
          echo "kernel version:  6.12.${KV}"

          IMG_EXT4_GZ=$(find "$OUT" -maxdepth 1 -type f -name "*nanopi-r5s-ext4-sysupgrade.img.gz" | head -1)
          [ -n "$IMG_EXT4_GZ" ] || { echo "ext4 img missing"; exit 1; }
          file "$IMG_EXT4_GZ" | grep -q "gzip compressed data" || exit 1
          python3 -c "import zlib;d=zlib.decompressobj(wbits=31);d.decompress(open('$IMG_EXT4_GZ','rb').read());exit(0 if d.eof else 1)" || exit 1

          IMG_SQ_GZ=$(find "$OUT" -maxdepth 1 -type f -name "*nanopi-r5s-squashfs-sysupgrade.img.gz" | head -1)
          [ -n "$IMG_SQ_GZ" ] || { echo "squashfs img missing"; exit 1; }
          file "$IMG_SQ_GZ" | grep -q "gzip compressed data" || exit 1
          python3 -c "import zlib;d=zlib.decompressobj(wbits=31);d.decompress(open('$IMG_SQ_GZ','rb').read());exit(0 if d.eof else 1)" || exit 1

          python3 -c "import gzip,sys;f=gzip.open(sys.argv[1],'rb');f.seek(446);e=f.read(64);t=e[32+4];assert t!=0,'p3 missing';print(f'p3 present MBR type=0x{t:02x}')" "$IMG_EXT4_GZ"

          MANIFEST=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s.manifest" -type f | head -1)
          [ -n "$MANIFEST" ] || { echo "manifest missing"; exit 1; }
          grep -E "^(kmod-r8169|clashoo|luci-app-clashoo|luci-app-amlogic|docker|dockerd|containerd|runc|luci-app-dockerman|ttyd|openssh-sftp-server|parted) " "$MANIFEST" || true

          mkdir -p $GITHUB_WORKSPACE/artifact

          cp "$IMG_EXT4_GZ" "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-sdcard.img.gz"
          cp "$IMG_SQ_GZ" "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-squashfs-sysupgrade.img.gz"
          cp "$MANIFEST" "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-manifest.txt"

          SUMFILE=$(find "$OUT" -maxdepth 1 -name "sha256sums" -type f | head -1)
          [ -n "$SUMFILE" ] && cp "$SUMFILE" "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-sha256sums.txt"

          echo "kernel version:" >> "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-build-info.txt"
          grep -rn '^LINUX_VERSION-6\.12' include/ target/linux/generic/kernel-6.12 2>/dev/null >> "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-build-info.txt" || true
          echo "openwrt commit: $(git rev-parse HEAD)" >> "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-build-info.txt"
          echo "build time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_WORKSPACE/artifact/${ARTIFACT_PREFIX}-build-info.txt"

          cd $GITHUB_WORKSPACE/artifact
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] && [ "$f" != "SHA256SUMS" ] && sha256sum "$f" >> SHA256SUMS
          done

          echo ""
          echo "===== upload to release ====="
          shopt -s nullglob
          RELEASE_FILES=(*.gz)
          shopt -u nullglob
          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "no firmware files"; exit 1
          fi
          echo "uploading ${#RELEASE_FILES[@]} firmware files to release"
          printf '  %s\n' "${RELEASE_FILES[@]}"
          gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber

          echo ""
          echo "===== update release notes ====="
          gh release edit "$TAG" --notes "Kernel: 6.12.${KV}" || echo "::warning::failed to update release notes"

          echo ""
          echo "===== all artifacts ====="
          ls -lh

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware-${{ needs.prepare_release.outputs.release_tag }}
          path: artifact/
          retention-days: 30

  cleanup_self:
    name: Cleanup workflow history
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 1
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}