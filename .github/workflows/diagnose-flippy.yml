name: Diagnose - Direct Offset Read

on:
  workflow_dispatch:
    inputs:
      official_release_tag:
        description: '官方固件 Release tag'
        required: true
        default: 'FriendlyWrt-2026-09-04'
        type: string
      official_asset:
        description: '官方固件 asset 名 (.img.gz)'
        required: true
        default: 'R5S-R5C-Series-FriendlyWrt-24.10-docker.img.gz'
        type: string
      flippy_version:
        description: 'Flippy 内核确切版本号'
        required: true
        default: '6.18.49'
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            wget curl git file xxd bc python3 gzip

      # ============================================================
      # 1. 下载官方 .img.gz 并解压
      # ============================================================
      - name: Download official img.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.official_release_tag }}
          ASSET: ${{ inputs.official_asset }}
        run: |
          mkdir -p /tmp/official
          cd /tmp/official
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir .
          ls -la
          gunzip -k *.img.gz
          IMG=$(find . -maxdepth 1 -name "*.img" | head -1)
          echo "IMG=$IMG ($(stat -c%s "$IMG") bytes)" | tee /tmp/official/info.txt

      # ============================================================
      # 2. 直接读固定偏移的关键组件
      # ============================================================
      - name: Read fixed-offset components from official img
        run: |
          cd /tmp/official
          IMG=$(find . -maxdepth 1 -name "*.img" | head -1)

          # 从 parameter.txt 已知偏移（单位：字节）
          # kernel:   LBA 0x12000 × 512 = 0x2400000
          # boot:     LBA 0x26000 × 512 = 0x4c00000
          # resource: LBA 0xa000  × 512 = 0x1400000
          # dtbo:     LBA 0x8000  × 512 = 0x1000000
          # misc:     LBA 0x6000  × 512 = 0xc00000

          echo "════════════════════════════════════════"
          echo "  LBA 1 处 (偏移 512) 的内容 —— 检查 GPT"
          echo "════════════════════════════════════════"
          xxd -s 512 -l 256 "$IMG"

          echo ""
          echo "════════════════════════════════════════"
          echo "  镜像最开头 512 字节 (LBA 0, MBR/保护引导)"
          echo "════════════════════════════════════════"
          xxd -l 512 "$IMG"

          echo ""
          echo "════════════════════════════════════════"
          echo "  镜像偏移 0x4000 处 (LBA 8, Rockchip parameter.txt 常见位置)"
          echo "════════════════════════════════════════"
          dd if="$IMG" bs=1 skip=$((0x4000)) count=2048 2>/dev/null \
            | strings | head -30

          mkdir -p /tmp/official/parts

          echo ""
          echo "════════════════════════════════════════"
          echo "  官方 kernel 头 (偏移 0x2400000)"
          echo "════════════════════════════════════════"
          dd if="$IMG" of=/tmp/official/parts/kernel_head.bin \
            bs=1 skip=$((0x2400000)) count=$((2*1024*1024)) 2>/dev/null
          echo "提取大小: $(stat -c%s /tmp/official/parts/kernel_head.bin) bytes"
          xxd -l 256 /tmp/official/parts/kernel_head.bin

          echo ""
          echo "════════════════════════════════════════"
          echo "  官方 boot 头 (偏移 0x4c00000)"
          echo "════════════════════════════════════════"
          dd if="$IMG" of=/tmp/official/parts/boot_head.bin \
            bs=1 skip=$((0x4c00000)) count=$((1024*1024)) 2>/dev/null
          echo "提取大小: $(stat -c%s /tmp/official/parts/boot_head.bin) bytes"
          xxd -l 128 /tmp/official/parts/boot_head.bin

          echo ""
          echo "════════════════════════════════════════"
          echo "  官方 resource 头 (偏移 0x1400000)"
          echo "════════════════════════════════════════"
          dd if="$IMG" of=/tmp/official/parts/resource_head.bin \
            bs=1 skip=$((0x1400000)) count=$((512*1024)) 2>/dev/null
          echo "提取大小: $(stat -c%s /tmp/official/parts/resource_head.bin) bytes"
          xxd -l 128 /tmp/official/parts/resource_head.bin

      # ============================================================
      # 3. 下载 Flippy 内核
      # ============================================================
      - name: Download Flippy kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ inputs.flippy_version }}
        run: |
          mkdir -p /tmp/flippy
          cd /tmp/flippy
          URL="https://github.com/ophub/kernel/releases/download/kernel_flippy/${VER}.tar.gz"
          echo "URL: $URL"
          wget -q "$URL" -O kernel.tar.gz
          tar xzf kernel.tar.gz

          LDIR=$(find . -maxdepth 1 -type d -name "*${VER}*" | head -1)
          [ -z "$LDIR" ] && LDIR="$VER"
          BOOT_TAR=$(find "$LDIR" -name "boot-*.tar.gz" | head -1)
          DTB_TAR=$(find "$LDIR" -name "dtb-rockchip-*.tar.gz" | head -1)
          mkdir -p boot dtb
          tar xzf "$BOOT_TAR" -C boot
          [ -n "$DTB_TAR" ] && tar xzf "$DTB_TAR" -C dtb

          echo "=== Flippy boot/ ==="
          ls -la boot/

      # ============================================================
      # 4. 三方对比：官方 vs Flippy
      # ============================================================
      - name: Deep comparison
        run: |
          echo "════════════════════════════════════════"
          echo "  深度对比：官方 kernel 头 vs Flippy vmlinuz"
          echo "════════════════════════════════════════"
          FLP_VMLINUZ=$(find /tmp/flippy/boot -name "vmlinuz-*" | head -1)

          echo ""
          echo "=== 官方 kernel 头 (前 96 字节) ==="
          xxd -l 96 /tmp/official/parts/kernel_head.bin

          echo ""
          echo "=== Flippy vmlinuz 头 (前 96 字节) ==="
          echo "大小: $(stat -c%s "$FLP_VMLINUZ") bytes"
          xxd -l 96 "$FLP_VMLINUZ"

          echo ""
          echo "=== 字段解析 ==="
          OFF_HEAD=/tmp/official/parts/kernel_head.bin \
          FLP_VMLINUZ="$FLP_VMLINUZ" \
          python3 - <<'PYEOF'
          import os
          def inspect(path, label):
              print(f"\n[{label}]")
              print(f"  路径: {path}")
              try:
                  with open(path, 'rb') as f:
                      d = f.read(0x200)
              except Exception as e:
                  print(f"  读取失败: {e}")
                  return
              print(f"  [0x00:0x04] = {d[0:4]}  (hex: {d[0:4].hex()})")
              print(f"  [0x04:0x08] = {d[4:8].hex()}")
              print(f"  [0x08:0x0c] = {d[8:12].hex()}")
              print(f"  [0x0c:0x10] = {d[12:16].hex()}")
              print(f"  [0x10:0x14] = {d[16:20].hex()}")
              print(f"  [0x14:0x18] = {d[20:24].hex()}")
              print(f"  [0x18:0x1c] = {d[24:28].hex()}")
              print(f"  [0x20:0x24] = {d[32:36].hex()}")
              print(f"  [0x38:0x3c] = {d[56:60].hex()}")

              if d[0:4] == b'KRNL':
                  print(f"  >>> 格式: KRNL")
                  print(f"      size[4:8]       = {int.from_bytes(d[4:8],'little')}")
                  print(f"      code0[8:12]     = 0x{int.from_bytes(d[8:12],'little'):08x}")
                  print(f"      code1[12:16]    = 0x{int.from_bytes(d[12:16],'little'):08x}")
                  print(f"      image_size[16:24]= 0x{int.from_bytes(d[16:24],'little'):x}")
              elif d[0:2] == b'MZ':
                  pe_off = int.from_bytes(d[0x3C:0x40], 'little')
                  print(f"  >>> 格式: PE/EFI (MZ)")
                  print(f"      PE header @ 0x{pe_off:x}")
                  print(f"      Machine[PE+4:PE+6] = 0x{int.from_bytes(d[pe_off+4:pe_off+6],'little'):04x}")
                  print(f"      (0xaa64 = ARM64)")
              elif d[0:4] == b'\xd0\x0d\xfe\xed':
                  print(f"  >>> 格式: FIT/DTB")
              elif d[0:8] == b'ANDROID!':
                  print(f"  >>> 格式: Android boot.img")
              else:
                  print(f"  >>> 格式: 未知")
              # 找 ARM64 magic
              idx = d.find(b'ARM\x64')
              if idx >= 0:
                  print(f"  ARM\\x64 @ 0x{idx:x}")
          inspect(os.environ.get("OFF_HEAD", ""), "OFFICIAL kernel.img")
          inspect(os.environ.get("FLP_VMLINUZ", ""), "FLIPPY vmlinuz")
          PYEOF

      # ============================================================
      # 5. 上传结果
      # ============================================================
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-direct-${{ inputs.flippy_version }}
          path: /tmp/official/parts/
          retention-days: 14