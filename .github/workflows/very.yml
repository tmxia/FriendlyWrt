name: Quick verify kernel config

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Config file to verify'
        required: false
        default: 'scripts/r5s.config'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENWRT_BRANCH: 'openwrt-25.12'
      OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
      CONFIG_FILE: ${{ github.event.inputs.config_file || 'scripts/r5s.config' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-pip python3-setuptools python3-pyelftools unzip wget \
            zip zlib1g-dev libelf-dev subversion flex bison libtool \
            autoconf automake cmake rsync quilt time jq swig zstd

      - name: Prepare workdir
        run: |
          sudo mkdir -p /workdir
          sudo chown -R "$USER:$GROUPS" /workdir

      - name: Clone OpenWrt
        run: |
          git clone -b "$OPENWRT_BRANCH" --single-branch --depth=1 \
            "$OPENWRT_REPO" /workdir/openwrt
          ln -sf /workdir/openwrt openwrt

      - name: Prepare .config
        run: |
          cd /workdir/openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          echo "input lines: $(wc -l < .config)"

      - name: Run defconfig
        run: |
          cd /workdir/openwrt
          make defconfig > /tmp/defconfig.log 2>&1 || true
          tail -3 /tmp/defconfig.log

      # 关键：只生成内核 .config，不编译
      - name: Prepare target (generate kernel .config only)
        run: |
          cd /workdir/openwrt
          echo "=== make target/linux/prepare ==="
          set +e
          make target/linux/prepare -j$(nproc) > /tmp/target_prepare.log 2>&1
          RC=$?
          set -e
          echo "rc=$RC"
          tail -20 /tmp/target_prepare.log

      - name: Inspect kernel .config
        run: |
          cd /workdir/openwrt
          REPORT=/workdir/kernel-verify.txt
          : > "$REPORT"

          echo "########## 1) OpenWrt target configs ##########" >> "$REPORT"
          find target/linux -name 'config-6.12' | sort | while read f; do
            echo "--- $f ---" >> "$REPORT"
            grep -n "PROC_PAGE_MONITOR\|^CONFIG_PROC_FS\|^# CONFIG_PROC_FS" "$f" >> "$REPORT" 2>/dev/null || echo "  (no match)" >> "$REPORT"
          done

          echo "" >> "$REPORT"
          echo "########## 2) Final kernel .config ##########" >> "$REPORT"
          KCFG=$(find build_dir -path '*/linux-rockchip_armv8/linux-6.12.*/.config' 2>/dev/null | head -1)
          if [ -z "$KCFG" ]; then
            KCFG=$(find build_dir -path '*/linux-6.12.*/.config' 2>/dev/null | head -1)
          fi
          if [ -n "$KCFG" ]; then
            echo "file: $KCFG" >> "$REPORT"
            grep -n "CONFIG_PROC_PAGE_MONITOR\|CONFIG_PROC_FS\b" "$KCFG" >> "$REPORT" || echo "  (no match)" >> "$REPORT"
          else
            echo "  !! kernel .config not found" >> "$REPORT"
            find build_dir -maxdepth 4 -name '.config' -path '*linux*' 2>/dev/null >> "$REPORT"
          fi

          echo "" >> "$REPORT"
          echo "########## 3) ARM64 COW patch presence (ff1712f953e2) ##########" >> "$REPORT"
          KSRC=$(find build_dir -maxdepth 4 -type d -name 'linux-6.12.*' 2>/dev/null | head -1)
          if [ -n "$KSRC" ]; then
            echo "kernel src: $KSRC" >> "$REPORT"
            PGT="$KSRC/arch/arm64/include/asm/pgtable.h"
            if [ -f "$PGT" ]; then
              echo "--- grep pte_wrprotect in $PGT ---" >> "$REPORT"
              grep -n -A5 "pte_wrprotect" "$PGT" | head -40 >> "$REPORT" || true
              if grep -q "dirty bit is preserved\|preserve.*dirty\|pte_mkclean" "$PGT"; then
                echo "[PATCH PRESENT] dirty-bit preservation code found" >> "$REPORT"
              else
                echo "[PATCH MISSING?] cannot find dirty-bit preservation marker" >> "$REPORT"
              fi
            else
              echo "  !! pgtable.h not found at $PGT" >> "$REPORT"
            fi
          else
            echo "  !! kernel source dir not found" >> "$REPORT"
          fi

          echo "" >> "$REPORT"
          echo "########## 4) OpenWrt kernel-version.mk ##########" >> "$REPORT"
          grep -n '^LINUX_VERSION-6.12\|^LINUX_KERNEL_HASH-6.12' include/kernel-version.mk >> "$REPORT" 2>/dev/null || true

      - name: Print report
        run: |
          echo "================= KERNEL VERIFY ================="
          cat /workdir/kernel-verify.txt
          echo "================================================="
          {
            echo "### Kernel quick verify"
            echo ""
            echo '```'
            cat /workdir/kernel-verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-verify-report
          path: |
            /workdir/kernel-verify.txt
            /workdir/openwrt/.config
            /tmp/defconfig.log
            /tmp/target_prepare.log
          retention-days: 14
          if-no-files-found: warn