name: Build FriendlyWrt With Custom Kernel

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '24.10'
        type: choice
        options: ['24.10', '25.12']
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options: ['docker', 'non-docker']
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.y'
        type: choice
        options: ['6.18.y', '6.12.y', '6.6.y', '6.1.y']
      official_release_tag:
        description: '官方固件 Release tag'
        required: true
        default: 'FriendlyWrt-2026-09-04'
        type: string
      official_asset:
        description: '官方固件 asset 名'
        required: true
        default: 'R5S-R5C-Series-FriendlyWrt-24.10-docker.img.gz'
        type: string
      replace_existing:
        description: 'Replace existing release tag'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      verified: ${{ steps.verify.outputs.passed }}
      img_name: ${{ env.img_name }}
    steps:
    - uses: actions/checkout@v4

    - name: Init env
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl git rsync time file unzip bc bzip2 xxd \
          python3 python3-pip dosfstools e2fsprogs parted \
          android-sdk-libsparse-utils u-boot-tools \
          gzip xz-utils zstd lz4 binutils-aarch64-linux-gnu
        pip3 install --quiet zstandard lz4
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git clone https://github.com/friendlyarm/repo /tmp/repo
        sudo -E cp /tmp/repo/repo /usr/bin/
        mkdir -p $GITHUB_WORKSPACE/artifact
        chmod +x $GITHUB_WORKSPACE/scripts/verify-against-official.sh || true
        echo "cores: $(nproc)"

    - name: Fetch sd-fuse
      run: |
        cd /tmp
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests \
          -b master-v${{ inputs.version }} -m rk3568.xml \
          --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        ls -la /tmp/scripts/sd-fuse/

    - name: Download tgz
      id: images
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SUFFIX=""
        [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
        PATTERN="images-R5S-R5C-Series-FriendlyWrt-${{ inputs.version }}${SUFFIX}.tgz"
        TAGS=$(gh release list --limit 50 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
        FOUND=""
        for TAG in $TAGS; do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
            FOUND="$TAG"; break
          fi
        done
        [ -z "$FOUND" ] && { echo "ERROR: not found"; exit 1; }
        mkdir -p /tmp/inputs && cd /tmp/inputs
        gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
        echo "images_tgz=/tmp/inputs/$PATTERN" >> $GITHUB_OUTPUT

    - name: Download official
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REF_TAG: ${{ inputs.official_release_tag }}
        REF_ASSET: ${{ inputs.official_asset }}
      run: |
        mkdir -p /tmp/official && cd /tmp/official
        if gh release download "$REF_TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern "$REF_ASSET" --dir .; then
          ls -la
          gunzip -k *.img.gz 2>/dev/null || true
          IMG=$(find . -maxdepth 1 -name "*.img" | head -1)
          [ -n "$IMG" ] && echo "官方参考: $IMG"
        else
          touch /tmp/official/.no_reference
        fi

    - name: Scan kernel
      id: kernel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        case "$KERNEL_VERSION" in
          6.18*|6.18.y) PREFIX="6.18" ;;
          6.12*|6.12.y) PREFIX="6.12" ;;
          6.6*|6.6.y)   PREFIX="6.6" ;;
          6.1*|6.1.y)   PREFIX="6.1" ;;
          *)            PREFIX="$KERNEL_VERSION" ;;
        esac
        declare -A VER_TO_SOURCE
        for target in \
          "ophub/kernel:kernel_flippy" \
          "ophub/kernel:kernel_rk35xx" \
          "breakingbadboy/OpenWrt:kernel_rk35xx"; do
          REPO="${target%%:*}"; RELEASE="${target##*:}"
          ASSETS=$(gh release view "$RELEASE" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          [ -z "$ASSETS" ] && continue
          VERS=$(echo "$ASSETS" | grep -E "^${PREFIX}\.[0-9]+\.tar\.gz$" | sed 's/\.tar\.gz//' | sort -V || echo "")
          [ -z "$VERS" ] && continue
          for v in $VERS; do
            [ -z "${VER_TO_SOURCE[$v]:-}" ] && VER_TO_SOURCE["$v"]="$REPO:$RELEASE"
          done
        done
        [ ${#VER_TO_SOURCE[@]} -eq 0 ] && { echo "ERROR: no kernel"; exit 1; }
        SELECTED_VER=$(printf '%s\n' "${!VER_TO_SOURCE[@]}" | sort -V | tail -1)
        SELECTED_SOURCE="${VER_TO_SOURCE[$SELECTED_VER]}"
        SELECTED_REPO="${SELECTED_SOURCE%%:*}"
        SELECTED_RELEASE="${SELECTED_SOURCE##*:}"
        echo "Selected: $SELECTED_VER from $SELECTED_REPO/$SELECTED_RELEASE"
        echo "version=$SELECTED_VER" >> $GITHUB_OUTPUT
        echo "repo=$SELECTED_REPO" >> $GITHUB_OUTPUT
        echo "release=$SELECTED_RELEASE" >> $GITHUB_OUTPUT

    - name: Download kernel
      run: |
        cd /tmp
        URL="https://github.com/${{ steps.kernel.outputs.repo }}/releases/download/${{ steps.kernel.outputs.release }}/${{ steps.kernel.outputs.version }}.tar.gz"
        wget -q --timeout=120 "$URL" -O kernel.tar.gz || curl -L -f --max-time 300 "$URL" -o kernel.tar.gz
        tar xzf kernel.tar.gz
        KERNEL_VER="${{ steps.kernel.outputs.version }}"
        LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        [ -z "$LOCAL_DIR" ] && LOCAL_DIR="$KERNEL_VER"
        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)
        mkdir -p boot_extract dtb_extract
        tar xzf "$BOOT_TAR" -C boot_extract
        tar xzf "$DTB_TAR" -C dtb_extract
        ls -la boot_extract/

    - name: 'Extract real kernel from EFI zboot'
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        [ -z "$VMLINUZ" ] && { echo "vmlinuz not found"; exit 1; }
        echo "输入: $VMLINUZ ($(stat -c%s "$VMLINUZ") bytes)"

        python3 - "$VMLINUZ" /tmp/kernel.img <<'PYEOF'
        import sys, struct, gzip, bz2, lzma

        src, dst = sys.argv[1], sys.argv[2]
        raw = open(src, 'rb').read()
        ARM64_MAGIC = b'ARM\x64'

        # PE parse
        pe_off = struct.unpack_from('<I', raw, 0x3C)[0]
        coff = pe_off + 4
        nsec = struct.unpack_from('<H', raw, coff + 2)[0]
        opt_size = struct.unpack_from('<H', raw, coff + 16)[0]
        sec_base = coff + 20 + opt_size

        sections = {}
        for i in range(nsec):
            o = sec_base + i * 40
            name = raw[o:o+8].rstrip(b'\x00').decode('ascii', 'ignore')
            rsize = struct.unpack_from('<I', raw, o + 16)[0]
            roff  = struct.unpack_from('<I', raw, o + 20)[0]
            sections[name] = (roff, rsize)
            print("  section %s: off=0x%x size=%d" % (name, roff, rsize))

        text_off, text_size = sections.get('.text', (0, 0))
        data_off, data_size = sections.get('.data', (0, 0))
        payload = raw[text_off:text_off + text_size] + raw[data_off:data_off + data_size]
        print("payload total: %d bytes" % len(payload))

        # 搜 zboot magic
        print("")
        print("=" * 60)
        print("搜 zboot magic (0x7a6f6f62 各种字节序)")
        print("=" * 60)
        ZB_VARIANTS = [
            ("LE('booz')", b'\x62\x6f\x6f\x7a'),
            ("BE('zoob')", b'\x7a\x6f\x6f\x62'),
            ("str'zboot'", b'zboot'),
        ]

        zboot_hits = []
        for label, magic in ZB_VARIANTS:
            p = 0
            count = 0
            while count < 10:
                p = payload.find(magic, p)
                if p < 0: break
                # 验证 header 合理性
                ok = False
                if p + 0x60 <= len(payload):
                    hv = struct.unpack_from('<I', payload, p + 4)[0]
                    poff = struct.unpack_from('<I', payload, p + 12)[0]
                    psz = struct.unpack_from('<I', payload, p + 16)[0]
                    if 0 < hv < 16 and 0 < poff < 0x100000 and 0x10000 < psz < 0x10000000:
                        ok = True
                        print("  ★ %s @ 0x%x: hv=%d poff=0x%x psz=%d" % (label, p, hv, poff, psz))
                        zboot_hits.append(p)
                if not ok:
                    print("    %s @ 0x%x (验证失败)" % (label, p))
                p += 1
                count += 1

        # 逐个尝试 zboot 解压
        best_img = None
        for p in zboot_hits:
            hv = struct.unpack_from('<I', payload, p + 4)[0]
            kv = struct.unpack_from('<I', payload, p + 8)[0]
            poff = struct.unpack_from('<I', payload, p + 12)[0]
            psz = struct.unpack_from('<I', payload, p + 16)[0]
            isz = struct.unpack_from('<I', payload, p + 20)[0]
            ct_bytes = payload[p + 44:p + 76]
            ct = ct_bytes.split(b'\x00')[0].decode('ascii', 'ignore')
            kn_bytes = payload[p + 76:p + 92]
            kn = kn_bytes.split(b'\x00')[0].decode('ascii', 'ignore')

            print("")
            print("=" * 60)
            print("zboot @ payload[0x%x]" % p)
            print("  hdr_ver=%d kernel_ver=0x%08x" % (hv, kv))
            print("  payload_offset=0x%x payload_size=%d image_size=%d" % (poff, psz, isz))
            print("  compression='%s'" % ct)
            print("  kernel_file_name='%s'" % kn)

            comp_off = p + poff
            if comp_off + psz > len(payload):
                print("  压缩数据越界")
                continue
            comp_data = payload[comp_off:comp_off + psz]
            print("  压缩数据 @ payload[0x%x], %d bytes" % (comp_off, len(comp_data)))
            print("  前 16 字节: %s" % comp_data[:16].hex())

            img = None
            for c in [ct, 'gzip', 'zstd', 'lz4', 'lzma', 'xz', 'bzip2']:
                if not c or img is not None: continue
                try:
                    if c in ('gzip', 'gz'):
                        img = gzip.decompress(comp_data)
                    elif c == 'zstd':
                        import zstandard
                        img = zstandard.ZstdDecompressor().decompress(
                            comp_data, max_output_size=200*1024*1024)
                    elif c in ('lz4', 'lz4legacy'):
                        import lz4.frame
                        img = lz4.frame.decompress(comp_data)
                    elif c in ('lzma', 'xz'):
                        img = lzma.decompress(comp_data)
                    elif c == 'bzip2':
                        img = bz2.decompress(comp_data)
                    if img:
                        print("  ✓ 解压(%s): %d bytes" % (c, len(img)))
                except Exception as e:
                    print("  %s: %s" % (c, str(e)[:50]))

            if img is None:
                continue

            # 检查结果
            if img[0x38:0x3c] != ARM64_MAGIC:
                idx = img.find(ARM64_MAGIC, 0, 0x2000)
                if idx >= 0x38:
                    print("  对齐 magic @ 0x%x" % idx)
                    img = img[idx-0x38:]

            if img[0x38:0x3c] == ARM64_MAGIC:
                if best_img is None or len(img) > len(best_img):
                    best_img = img
                    print("  ★ 有效 ARM64 Image, 长度 %d" % len(img))

        # Fallback: 直接尝试 gzip magic 位置
        if best_img is None:
            print("")
            print("=" * 60)
            print("Fallback: 直接尝试 gzip magic 位置")
            print("=" * 60)
            i = 0
            while True:
                p = payload.find(b'\x1f\x8b\x08', i)
                if p < 0: break
                print("  gzip @ 0x%x" % p)
                try:
                    img = gzip.decompress(payload[p:])
                    print("    解压: %d bytes" % len(img))
                    idx = img.find(ARM64_MAGIC, 0, 0x2000)
                    if idx >= 0x38:
                        img2 = img[idx-0x38:]
                        if best_img is None or len(img2) > len(best_img):
                            best_img = img2
                            print("    ★ 有效 ARM64 Image @ 对齐 0x%x" % idx)
                except Exception as e:
                    print("    失败: %s" % str(e)[:50])
                i = p + 1
                if i >= len(payload): break

        if best_img is None:
            print("")
            print("!!! 无法提取内核 !!!")
            sys.exit(1)

        # 构造 KRNL
        print("")
        print("=" * 60)
        print("构造 KRNL")
        print("=" * 60)
        print("  内核大小: %d bytes" % len(best_img))
        print("  code0 @ 0x00: %s" % best_img[0:4].hex())
        print("  code1 @ 0x04: %s" % best_img[4:8].hex())
        print("  magic @ 0x38: %s" % best_img[0x38:0x3c])

        knl = b'KRNL' + struct.pack('<I', len(best_img)) + best_img
        open(dst, 'wb').write(knl)

        out = open(dst, 'rb').read(0x80)
        assert out[0:4] == b'KRNL'
        assert out[0x40:0x44] == ARM64_MAGIC

        print("")
        print("KRNL 结构验证")
        print("  size    = %d" % struct.unpack_from('<I', out, 4)[0])
        print("  code0   = %s" % out[0x08:0x0c].hex())
        print("  code1   = %s" % out[0x0c:0x10].hex())
        print("  magic   @ 0x40 = %s" % out[0x40:0x44])
        print("SUCCESS")
        PYEOF
        echo ""
        echo "kernel.img: $(stat -c%s /tmp/kernel.img) bytes"
        xxd -l 96 /tmp/kernel.img

    - name: Prepare sd-fuse
      run: |
        cd /tmp
        mkdir -p /tmp/work
        tar xzf "${{ steps.images.outputs.images_tgz }}" -C /tmp/work
        BASE_DIR=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        DIST_NAME="friendlywrt$(echo ${{ inputs.version }} | awk -F . '{print $1}')$([ "${{ inputs.set }}" = "docker" ] && echo "-docker")"
        TARGET="/tmp/scripts/sd-fuse/$DIST_NAME"
        rm -rf "$TARGET"
        cp -a "$BASE_DIR" "$TARGET"

        cp /tmp/kernel.img "$TARGET/kernel.img"
        NEW_KERNEL_SIZE=$(stat -c%s "$TARGET/kernel.img")

        PARAM_FILE="$TARGET/parameter.txt"
        python3 - "$PARAM_FILE" "$NEW_KERNEL_SIZE" <<'PYEOF'
        import re, sys
        param_file, kernel_size = sys.argv[1], int(sys.argv[2])
        content = open(param_file).read()
        m = re.search(r'0x([0-9a-fA-F]+)@(0x[0-9a-fA-F]+)\(kernel\)', content, re.IGNORECASE)
        if not m: sys.exit(0)
        old_size = int(m.group(1), 16)
        kernel_off = int(m.group(2), 16)
        kernel_end = kernel_off + old_size
        need = (kernel_size + 511) // 512
        rounded = ((need + 0x3FFF) // 0x4000) * 0x4000
        new_size = max(rounded, old_size)
        print("[param] old=%.1f MiB need=%.1f MiB new=%.1f MiB" % (old_size*512/1024/1024, need*512/1024/1024, new_size*512/1024/1024))
        if new_size == old_size: sys.exit(0)
        delta = new_size - old_size
        content = content[:m.start()] + f'0x{new_size:08x}@{m.group(2)}(kernel)' + content[m.end():]
        def shift(mt):
            off = int(mt.group(1), 16)
            return f'@0x{off + delta:08x}' if off >= kernel_end else mt.group(0)
        content = re.sub(r'@0x([0-9a-fA-F]+)', shift, content)
        open(param_file, 'w').write(content)
        print(f"[param] 扩容 delta={delta}")
        PYEOF

        mkdir -p "$TARGET/dtb/rockchip"
        DTB_R5S=$(find /tmp/dtb_extract -name "rk3568-nanopi-r5s.dtb" | head -1)
        DTB_R5C=$(find /tmp/dtb_extract -name "rk3568-nanopi-r5c.dtb" | head -1)
        [ -n "$DTB_R5S" ] && cp "$DTB_R5S" "$TARGET/dtb/rockchip/rk3568-nanopi-r5s.dtb"
        [ -n "$DTB_R5C" ] && cp "$DTB_R5C" "$TARGET/dtb/rockchip/rk3568-nanopi-r5c.dtb"
        UINITRD=$(find /tmp/boot_extract -name "uInitrd-*" | head -1)
        [ -n "$UINITRD" ] && cp "$UINITRD" "$TARGET/uInitrd"

    - name: Build image
      run: |
        cd /tmp/scripts/sd-fuse
        DIST_NAME="friendlywrt$(echo ${{ inputs.version }} | awk -F . '{print $1}')$([ "${{ inputs.set }}" = "docker" ] && echo "-docker")"
        chmod +x mk-sd-image.sh
        rm -f out/*.img
        set +e
        yes | ./mk-sd-image.sh "$DIST_NAME" > /tmp/mk-sd.log 2>&1
        MK_EXIT=$?
        set -e
        tail -20 /tmp/mk-sd.log
        FOUND_IMG=$(find out -maxdepth 1 -name "*.img" -print -quit)
        [ -z "$FOUND_IMG" ] && { echo "No image"; exit 1; }
        KV_SHORT="${{ inputs.kernel_version }}"
        [ "$KV_SHORT" = "auto" ] || KV_SHORT="${KV_SHORT%.y}"
        IMG_FILE="R5S-R5C-Series-FriendlyWrt-kv${KV_SHORT}-${{ inputs.version }}$([ "${{ inputs.set }}" = "docker" ] && echo "-docker").img"
        mv "$FOUND_IMG" "$GITHUB_WORKSPACE/artifact/$IMG_FILE"
        echo "img_name=$IMG_FILE" >> $GITHUB_ENV

    - name: Verify
      id: verify
      run: |
        set +e
        bash $GITHUB_WORKSPACE/scripts/verify-against-official.sh \
          "$GITHUB_WORKSPACE/artifact/${{ env.img_name }}" \
          "/tmp/official" "${{ steps.kernel.outputs.version }}"
        RC=$?
        set -e
        if [ $RC -eq 0 ]; then
          echo "passed=true" >> $GITHUB_OUTPUT
        else
          echo "passed=false" >> $GITHUB_OUTPUT
          exit $RC
        fi

    - name: Compress
      run: |
        cd $GITHUB_WORKSPACE/artifact
        gzip -f *.img
        ls -la
        for f in *.img.gz; do
          SIZE=$(stat -c%s "$f")
          echo "$f -> $SIZE bytes"
          [ "$SIZE" -ge 2147483648 ] && { echo "ERROR: >2GiB"; exit 1; }
        done

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.img_name }}
        path: ./artifact/${{ env.img_name }}.gz
        retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      needs.build.outputs.verified == 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: firmware-${{ needs.build.outputs.img_name }}
        path: ./artifact
    - name: Tag
      id: tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        KV="${{ github.event.inputs.kernel_version }}"
        KV_SHORT="${KV%.y}"
        [ "$KV" = "auto" ] && KV_SHORT="auto"
        BASE_TAG="FriendlyWrt-kv${KV_SHORT}-$(date +%Y-%m-%d)"
        if [ "${{ github.event.inputs.replace_existing }}" = "true" ]; then
          EXISTING=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' \
            | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
          for tag in $EXISTING; do
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
            git push origin --delete "refs/tags/$tag" || true
          done
        fi
        echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
    - name: Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "R5S/R5C FriendlyWrt ${{ inputs.version }} + Flippy KV ${{ inputs.kernel_version }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: ./artifact/*.img.gz