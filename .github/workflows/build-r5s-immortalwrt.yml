name: Build ImmortalWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  IMMORTALWRT_BRANCH: 'openwrt-25.12'
  IMMORTALWRT_REPO: 'https://github.com/immortalwrt/immortalwrt.git'
  FLAVOR: 'r5s'
  TARGET_OS: 'friendlywrt25'
  MODEL_NAME: 'R5S-R5C-Series'
  FRIENDLY_VER: '25.12'
  GOPROXY: 'https://goproxy.cn,direct'
  GOFLAGS: '-mod=mod'
  GOMODCACHE: '/tmp/go-mod-cache'
  CCACHE_DIR: '/home/runner/.ccache'
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: '3G'
  ROOTFS_PARTSIZE: '2048'
  ENABLE_DOCKER: 'true'
  DOCKER_BOOTARGS: 'cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="ImmortalWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Reclaim disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    /usr/share/swift /usr/local/.ghcup /opt/az || true
        sudo apt-get clean
        df -h /

    - name: Add swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile > /dev/null
        sudo swapon /swapfile
        free -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-dev python3-distutils python3-setuptools \
          python3-pip python3-venv python3-pyelftools rsync subversion swig time \
          xsltproc zlib1g-dev \
          bison flex libtool libtool-bin pkg-config \
          libgmp-dev libmpc-dev libmpfr-dev \
          gperf patch quilt cpio \
          liblzma-dev libbz2-dev \
          device-tree-compiler u-boot-tools \
          bzip2 xz-utils zip unzip wget curl \
          autoconf automake autopoint texinfo help2man \
          aria2 bc whiptail mercurial lib32stdc++6 \
          android-sdk-libsparse-utils e2fsprogs parted dosfstools mtools lz4
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
        python3 -c "import elftools" 2>/dev/null || pip3 install --quiet pyelftools
        mkdir -p ./artifact
        echo "CPU cores: $(nproc)"
        echo "ccache version: $(ccache --version | head -1)"

    - name: Prepare ImmortalWrt workspace
      run: |
        mkdir -p project
        cd project
        git clone --depth 1 -b ${{ env.IMMORTALWRT_BRANCH }} \
          ${{ env.IMMORTALWRT_REPO }} friendlywrt > /dev/null 2>&1
        cd friendlywrt
        git log -1 --oneline
        echo "=== KERNEL_PATCHVER ==="
        grep -E "KERNEL_(PATCHVER|TESTING_PATCHVER)" target/linux/rockchip/Makefile 2>/dev/null || true
        ./scripts/feeds update -a > /dev/null 2>&1 || ./scripts/feeds update -a
        ./scripts/feeds install -a > /dev/null 2>&1
        cd ..
        mkdir -p configs/rockchip
        touch configs/rockchip/01-nanopi
        echo "[OK] ImmortalWrt workspace prepared"

    - name: Restore staging_dir (toolchain + host)
      uses: actions/cache@v4
      with:
        path: project/friendlywrt/staging_dir
        key: staging-${{ env.IMMORTALWRT_BRANCH }}-${{ env.FLAVOR }}-${{ github.run_id }}
        restore-keys: |
          staging-${{ env.IMMORTALWRT_BRANCH }}-${{ env.FLAVOR }}-
          staging-${{ env.IMMORTALWRT_BRANCH }}-

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ env.IMMORTALWRT_BRANCH }}-${{ env.FLAVOR }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ env.IMMORTALWRT_BRANCH }}-${{ env.FLAVOR }}-
          ccache-${{ env.IMMORTALWRT_BRANCH }}-

    - name: Restore downloads (dl)
      uses: actions/cache@v4
      with:
        path: project/friendlywrt/dl
        key: dl-${{ env.IMMORTALWRT_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          dl-${{ env.IMMORTALWRT_BRANCH }}-

    - name: Restore Go module cache
      uses: actions/cache@v4
      with:
        path: /tmp/go-mod-cache
        key: gomod-${{ env.IMMORTALWRT_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          gomod-${{ env.IMMORTALWRT_BRANCH }}-

    - name: Run custom kernel config & build
      env:
        ROOTFS_PARTSIZE: ${{ env.ROOTFS_PARTSIZE }}
        CCACHE_DIR: ${{ env.CCACHE_DIR }}
        IMMORTALWRT: '1'
      run: bash scripts/custome_kernel_config_new.sh

    - name: Clean go-mod-cache before saving
      if: always()
      run: |
        rm -rf project/friendlywrt/dl/go-mod-cache
        du -sh project/friendlywrt/dl 2>/dev/null || true

    - name: Show cache stats
      if: always()
      run: |
        ccache -s || true
        du -sh "$CCACHE_DIR" 2>/dev/null || true
        du -sh project/friendlywrt/staging_dir 2>/dev/null || true
        du -sh project/friendlywrt/dl 2>/dev/null || true

    - name: Locate kernel artifacts
      run: |
        cd project/friendlywrt

        TRIPLE_DIR=$(find build_dir -maxdepth 1 -type d -name "target-*_musl" | head -1)
        [ -z "$TRIPLE_DIR" ] && { echo "::error::target triple not found"; ls -la build_dir/ | head -20; exit 1; }
        TRIPLE_DIR=$(realpath "$TRIPLE_DIR")
        echo "TRIPLE_DIR=$TRIPLE_DIR" >> $GITHUB_ENV
        echo "[OK] TRIPLE_DIR: $TRIPLE_DIR"

        KDIR=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "linux-rockchip*" | head -1)
        [ -z "$KDIR" ] && { echo "::error::linux-rockchip dir not found"; ls -la "$TRIPLE_DIR/"; exit 1; }
        KDIR=$(realpath "$KDIR")
        echo "KDIR=$KDIR" >> $GITHUB_ENV
        echo "[OK] KDIR: $KDIR"

        IMG=$(find "$KDIR" -path "*/arch/arm64/boot/Image" -type f 2>/dev/null | head -1)
        [ -z "$IMG" ] && IMG=$(find "$KDIR" -maxdepth 4 -name "Image" -type f 2>/dev/null | head -1)
        [ -z "$IMG" ] && { echo "::error::Kernel Image not found"; find "$KDIR" -name Image -type f | head; exit 1; }
        IMG=$(realpath "$IMG")
        echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV
        echo "[OK] Image: $IMG ($(du -h $IMG | awk '{print $1}'))"

        DTB_DIR=$(find "$KDIR" -path "*/arch/arm64/boot/dts/rockchip" -type d 2>/dev/null | head -1)
        [ -z "$DTB_DIR" ] && DTB_DIR=$(find "$KDIR" -maxdepth 5 -type d -name "rockchip" -path "*dts*" | head -1)
        [ -z "$DTB_DIR" ] && { echo "::error::DTB dir not found"; exit 1; }
        DTB_DIR=$(realpath "$DTB_DIR")
        echo "DTB_DIR=$DTB_DIR" >> $GITHUB_ENV
        echo "[OK] DTB dir: $DTB_DIR"

        ROOTFS_SRC=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "root-*" | head -1)
        [ -z "$ROOTFS_SRC" ] && { echo "::error::Rootfs dir not found"; ls "$TRIPLE_DIR/" | head; exit 1; }
        ROOTFS_SRC=$(realpath "$ROOTFS_SRC")
        echo "ROOTFS_SRC=$ROOTFS_SRC" >> $GITHUB_ENV
        echo "[OK] Rootfs: $ROOTFS_SRC ($(du -sh $ROOTFS_SRC | awk '{print $1}'))"

        KV=$(ls "$ROOTFS_SRC/lib/modules/" 2>/dev/null | head -1)
        echo "KV=$KV" >> $GITHUB_ENV
        echo "[OK] Kernel modules version: $KV"
        case "$KV" in
          6.12*)  echo "[OK] 内核版本 6.12 符合预期" ;;
          6.1*)   echo "::warning::内核版本为 $KV，仍为 6.1" ;;
          *)      echo "::warning::内核版本 $KV（非 6.12），继续但请复核" ;;
        esac

    - name: Clone sd-fuse_rk3568
      run: |
        cd project
        rm -rf sd-fuse
        git clone --depth 1 https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse
        cd sd-fuse
        [ -f mk-emmc-image.sh ] || { echo "::error::mk-emmc-image.sh missing"; exit 1; }
        echo "[OK] sd-fuse ready"

    - name: Package kernel
      run: |
        cd project
        SF="sd-fuse"
        TGT="$SF/$TARGET_OS"
        mkdir -p "$TGT"
        [ -f "$IMAGE_PATH" ] || { echo "::error::Image not found: $IMAGE_PATH"; exit 1; }
        "$SF/tools/mkkrnlimg" "$IMAGE_PATH" "$TGT/kernel.img"
        [ -f "$TGT/kernel.img" ] || { echo "::error::kernel.img 未生成"; exit 1; }
        ls -lh "$TGT/kernel.img"
        cp "$TGT/kernel.img" "$TGT/boot.img"

    - name: Package resource.img
      run: |
        cd project
        SF="$PWD/sd-fuse"
        TGT="$SF/$TARGET_OS"
        IMGFILE="$TGT/resource.img"
        mkdir -p "$TGT"
        [ -d "$DTB_DIR" ] || { echo "::error::DTB dir not found: $DTB_DIR"; exit 1; }

        rm -rf /tmp/dtb-pack
        mkdir -p /tmp/dtb-pack

        R5S_DTB=""
        for cand in rk3568-nanopi-r5s.dtb rk3568-nanopi-r5s-lts.dtb rk3568-nanopi-r5c.dtb; do
          if [ -f "$DTB_DIR/$cand" ]; then
            R5S_DTB="$cand"
            break
          fi
        done
        [ -z "$R5S_DTB" ] && { echo "::error::找不到 rk3568-nanopi-r5s*.dtb"; ls "$DTB_DIR"/*.dtb 2>/dev/null | head -20; exit 1; }

        echo "[OK] 主 dtb: $R5S_DTB"
        cp "$DTB_DIR/$R5S_DTB" /tmp/dtb-pack/rk-kernel.dtb
        for cand in rk3568-nanopi-r5s.dtb rk3568-nanopi-r5s-lts.dtb rk3568-nanopi-r5c.dtb; do
          [ -f "$DTB_DIR/$cand" ] && cp "$DTB_DIR/$cand" /tmp/dtb-pack/
        done

        cd /tmp/dtb-pack
        DTB_LIST=$(find . -maxdepth 1 -type f -name "*.dtb" -printf "%f\n" | sort)
        [ -z "$DTB_LIST" ] && { echo "::error::no dtb files"; exit 1; }
        echo "$DTB_LIST"

        "$SF/tools/resource_tool" --pack --root=. --image="$IMGFILE" $DTB_LIST
        cd - > /dev/null
        [ -f "$IMGFILE" ] || { echo "::error::resource.img 未生成"; exit 1; }
        ls -lh "$IMGFILE"

    - name: Stage U-Boot binaries
      run: |
        cd project/sd-fuse
        TGT="$TARGET_OS"
        for f in uboot.img idbloader.img MiniLoaderAll.bin misc.img dtbo.img; do
          [ -f "prebuilt/$f" ] && cp -v "prebuilt/$f" "$TGT/$f"
        done

    - name: Build rootfs.img
      run: |
        cd project/sd-fuse
        TGT="$TARGET_OS"
        [ -d "$ROOTFS_SRC" ] || { echo "::error::Rootfs src not found: $ROOTFS_SRC"; exit 1; }

        rm -rf /tmp/rootfs-pack
        cp -a "$ROOTFS_SRC" /tmp/rootfs-pack
        (cd /tmp/rootfs-pack/dev && find . ! -type d -exec rm -f {} \; ) 2>/dev/null || true

        echo "=== rootfs 内核模块 ==="
        ls /tmp/rootfs-pack/lib/modules/
        find /tmp/rootfs-pack/lib/modules -name "*.ko" | wc -l

        MKFS="$PWD/tools/mke2fs"
        MKFS_CONF="$PWD/tools/mke2fs.conf"
        ROOTFS_DIR=/tmp/rootfs-pack

        ACTUAL_MB=$(du -sm "$ROOTFS_DIR" | awk '{print $1}')
        echo "rootfs 内容: ${ACTUAL_MB} MB / 目标分区: ${ROOTFS_PARTSIZE} MB"
        if [ "$ACTUAL_MB" -gt "$ROOTFS_PARTSIZE" ]; then
          echo "::error::rootfs (${ACTUAL_MB}MB) 超过 ROOTFS_PARTSIZE (${ROOTFS_PARTSIZE}MB)"
          exit 1
        fi

        LOGICAL_SIZE=$(( ROOTFS_PARTSIZE * 1024 * 1024 ))
        IMG_BLK=$(( LOGICAL_SIZE / 4096 ))
        INODE_SIZE=$(( $(find "$ROOTFS_DIR" | wc -l) + 128 ))

        rm -f "$TGT/rootfs.img"
        MKE2FS_CONFIG="$MKFS_CONF" \
          "$MKFS" -N "$INODE_SIZE" \
            -E android_sparse -t ext4 -L rootfs -M /root -b 4096 -0 \
            -d "$ROOTFS_DIR" "$TGT/rootfs.img" "$IMG_BLK"

        [ -f "$TGT/rootfs.img" ] || { echo "::error::rootfs.img 生成失败"; exit 1; }
        ls -lh "$TGT/rootfs.img"
        echo "ROOTFS_SIZE_BYTES=$LOGICAL_SIZE" >> $GITHUB_ENV

    - name: Generate parameter.txt
      run: |
        cd project/sd-fuse
        [ -z "$ROOTFS_SIZE_BYTES" ] && { echo "::error::ROOTFS_SIZE_BYTES 未设置"; exit 1; }
        PARAMETER_TPL="$PWD/prebuilt/parameter.template" \
          ./tools/generate-partmap-txt.sh "$ROOTFS_SIZE_BYTES" "$TARGET_OS"
        cat "$TARGET_OS/parameter.txt"

    - name: Patch parameter.txt CMDLINE
      run: |
        cd project/sd-fuse
        PARAM="$TARGET_OS/parameter.txt"
        [ -f "$PARAM" ] || { echo "::error::$PARAM not found"; exit 1; }

        REQUIRED_KW="cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1"
        ADD=""
        for kw in $REQUIRED_KW; do
          grep -q -- "$kw" "$PARAM" || { ADD="$ADD $kw"; echo "[MISS] $kw"; }
        done
        ADD=$(echo "$ADD" | sed 's/^ *//;s/ *$//')

        if [ -n "$ADD" ]; then
          echo "[PATCH] 追加: $ADD"
          if grep -qE "^CMDLINE[:=]" "$PARAM"; then
            sed -i "/^CMDLINE[:=]/ s|$| $ADD|" "$PARAM"
          elif grep -qE "^bootargs[:=]" "$PARAM"; then
            sed -i "/^bootargs[:=]/ s|$| $ADD|" "$PARAM"
          else
            echo "::error::parameter.txt 中找不到 CMDLINE/bootargs 行"; cat "$PARAM"; exit 1
          fi
        fi
        cat "$PARAM"
        for kw in $REQUIRED_KW; do
          grep -q -- "$kw" "$PARAM" || { echo "::error::参数 $kw 未成功写入"; exit 1; }
        done
        echo "[OK] CMDLINE cgroup/swap 参数已就绪"

    - name: Build SD card image
      run: |
        cd project/sd-fuse
        export SDFUSE_NONINTERACTIVE=y
        sudo -E ./mk-sd-image.sh "$TARGET_OS" 2>&1 | tee /tmp/sd-image.log | tail -60 || {
          echo "::warning::mk-sd-image.sh 非零退出"
          tail -120 /tmp/sd-image.log
        }
        ls -lh out/ 2>/dev/null || echo "(无 out/)"
        if grep -q "more than capacity" /tmp/sd-image.log; then
          echo "::error::mk-sd-image.sh 跳过了 rootfs 写入"
          grep "more than capacity" /tmp/sd-image.log; exit 1
        fi

    - name: Build eMMC flasher image
      run: |
        cd project/sd-fuse
        export SDFUSE_NONINTERACTIVE=y
        sudo -E ./mk-emmc-image.sh "$TARGET_OS" autostart=yes \
          > /tmp/emmc-image.log 2>&1 || true

        grep -v "Error: out/rk3568-eflasher-" /tmp/emmc-image.log | tail -20

        if [ -f "out/emmc-flasher-images.tgz" ]; then
          ls -lh out/emmc-flasher-images.tgz
          echo "[OK] eMMC 刷机包已生成"
        else
          echo "::error::emmc-flasher-images.tgz 未生成"
          ls -la out/
          exit 1
        fi

    - name: Fix file ownership from sudo operations
      run: |
        cd project/sd-fuse
        [ -d "out" ] && sudo chown -R "$(id -u):$(id -g)" out/ 2>/dev/null || true
        [ -d "$TARGET_OS" ] && sudo chown -R "$(id -u):$(id -g)" "$TARGET_OS" 2>/dev/null || true

    - name: Rename artifacts
      run: |
        cd project/sd-fuse

        SRC_IMG=$(find out -maxdepth 1 -name "*.img" -type f 2>/dev/null | head -1)
        if [ -n "$SRC_IMG" ] && [ -s "$SRC_IMG" ]; then
          SRC_SIZE_MB=$(( $(stat -c%s "$SRC_IMG") / 1024 / 1024 ))
          echo "SD 镜像原始大小: ${SRC_SIZE_MB} MB"
          if [ "$SRC_SIZE_MB" -lt 400 ]; then
            echo "::error::SD 镜像只有 ${SRC_SIZE_MB} MB，可能 rootfs 未写入"; exit 1
          fi
          DST_NAME="${MODEL_NAME}-ImmortalWrt-${FRIENDLY_VER}.img"
          cp "$SRC_IMG" "/tmp/${DST_NAME}"
          gzip -f "/tmp/${DST_NAME}"
          cp "/tmp/${DST_NAME}.gz" ../../artifact/
          echo "[OK] SD image: ${DST_NAME}.gz"
        else
          echo "::error::未找到 sd-fuse 生成的 .img"; exit 1
        fi

        SRC_TGZ=$(find out -maxdepth 3 -name "*-images.tgz" -type f 2>/dev/null | head -1)
        if [ -n "$SRC_TGZ" ] && [ -s "$SRC_TGZ" ]; then
          DST_NAME="images-${MODEL_NAME}-ImmortalWrt-${FRIENDLY_VER}.tgz"
          cp "$SRC_TGZ" "../../artifact/${DST_NAME}"
          echo "[OK] eMMC pack: ${DST_NAME}"
        else
          echo "::warning::未找到 eMMC 刷机包"
        fi

        IMM_SYSUP=$(find ../friendlywrt/bin/targets/rockchip/armv8 -maxdepth 1 \
          -name "*nanopi-r5s*sysupgrade.img.gz" -type f 2>/dev/null | head -1)
        if [ -n "$IMM_SYSUP" ]; then
          DST_NAME="${MODEL_NAME}-ImmortalWrt-${FRIENDLY_VER}-sysupgrade.img.gz"
          cp "$IMM_SYSUP" "../../artifact/${DST_NAME}"
          echo "[OK] ImmortalWrt native: ${DST_NAME}"
        fi

        IMM_MANIFEST=$(find ../friendlywrt/bin/targets/rockchip/armv8 -maxdepth 1 \
          -name "*nanopi-r5s*.manifest" -type f 2>/dev/null | head -1)
        [ -n "$IMM_MANIFEST" ] && cp "$IMM_MANIFEST" "../../artifact/"

    - name: Generate SHA256 and README
      run: |
        cd artifact
        rm -f SHA256SUMS
        for f in *; do
          [ -f "$f" ] && [ "$f" != "SHA256SUMS" ] && sha256sum "$f" >> SHA256SUMS
        done

        cat > README.txt <<EOF
        ImmortalWrt for NanoPi R5S — $(date +%Y-%m-%d)
        ============================================================
        发行标签: ${{ needs.prepare_release.outputs.release_tag }}
        上游源码: immortalwrt/immortalwrt @ ${{ env.IMMORTALWRT_BRANCH }}
        内核版本: 6.12.x
        rootfs 分区: ${ROOTFS_PARTSIZE} MB
        Docker: 已集成
        晶晨宝盒: 已集成 (luci-app-amlogic)
        CMDLINE 追加: ${DOCKER_BOOTARGS}

        产物:
        1. ${MODEL_NAME}-ImmortalWrt-${FRIENDLY_VER}.img.gz  → SD 卡镜像
        2. images-${MODEL_NAME}-ImmortalWrt-${FRIENDLY_VER}.tgz → eMMC 刷机包
        3. ${MODEL_NAME}-ImmortalWrt-${FRIENDLY_VER}-sysupgrade.img.gz → 原生镜像
        4. SHA256SUMS
        5. diagnostics.tgz → 编译期诊断信息（含 System.map、内核 .config）

        刷机后验证:
        - uname -r → 6.12.x
        - /proc/cmdline 含 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory
        - docker info 正常
        - LuCI 有「系统 → 晶晨宝盒」
        - 默认密码: tony
        EOF
        ls -lh

    - name: Collect diagnostics
      if: always()
      run: |
        mkdir -p artifact/diagnostics
        DIAG=artifact/diagnostics

        # =========================================================
        # 优先：从 custome_kernel_config_new.sh 导出的调试产物
        # 这是决定性证据（System.map / vmlinux / kernel.config.full）
        # =========================================================
        if [ -d "project/friendlywrt/.debug-artifacts" ]; then
          echo "[OK] 拷贝 .debug-artifacts 里的所有文件"
          cp -r project/friendlywrt/.debug-artifacts/* "$DIAG/" 2>/dev/null || true
          ls -lh "$DIAG/"
        else
          echo "::warning::.debug-artifacts 不存在，用兜底逻辑"
        fi

        # =========================================================
        # 兜底：直接从内核源码目录采集（修正路径）
        # =========================================================
        if [ -n "$KDIR" ] && [ -d "$KDIR" ]; then
          KSRC_REAL=$(find "$KDIR" -maxdepth 1 -type d -name "linux-6.12*" | head -1)

          if [ -n "$KSRC_REAL" ] && [ -d "$KSRC_REAL" ]; then
            echo "[OK] 找到内核源码目录: $KSRC_REAL"

            # DTS 源文件
            find "$KSRC_REAL" -name "rk3568-nanopi-r5s*.dts*" -type f \
              -exec cp {} "$DIAG/" \; 2>/dev/null || true

            # 最终内核 .config
            if [ -f "$KSRC_REAL/.config" ]; then
              cp "$KSRC_REAL/.config" "$DIAG/kernel.config.full" 2>/dev/null || true
              grep -E "^CONFIG_(LEDS|GPIO_ROCKCHIP|PINCTRL_ROCKCHIP|R8169|RTL8|STMMAC|NET_DSA|NET_VENDOR|PCI|PHY_|NEW_LEDS|LEDS_TRIGGER|LEDS_CLASS|LEDS_GPIO|GPIOLIB|OF_GPIO|GPIOD|INET_DIAG)" \
                "$KSRC_REAL/.config" > "$DIAG/kernel-config-led-net.txt" 2>/dev/null || true
            fi

            # System.map（决定性证据）
            if [ -f "$KSRC_REAL/System.map" ]; then
              cp "$KSRC_REAL/System.map" "$DIAG/System.map" 2>/dev/null || true
              grep -E " (T|t) _?(leds_gpio_probe|led_gpio_set|led_classdev_register|ledtrig_netdev_activate|ledtrig_heartbeat_activate|rockchip_gpio_probe|r8169_probe|stmmac_dvr_probe|dwmac_rk_probe)$" \
                "$KSRC_REAL/System.map" > "$DIAG/System.map.leds-net" 2>/dev/null || true
            fi

            # vmlinux（完整符号表，可能几十 MB）
            if [ -f "$KSRC_REAL/vmlinux" ]; then
              cp "$KSRC_REAL/vmlinux" "$DIAG/vmlinux" 2>/dev/null || true
            fi
          fi
        fi

        # =========================================================
        # 用户空间诊断
        # =========================================================
        if [ -n "$ROOTFS_SRC" ] && [ -d "$ROOTFS_SRC" ]; then
          [ -f "$ROOTFS_SRC/etc/config/network" ] && cp "$ROOTFS_SRC/etc/config/network" "$DIAG/network-config.txt" || true
          [ -f "$ROOTFS_SRC/etc/config/system" ] && cp "$ROOTFS_SRC/etc/config/system" "$DIAG/system-config.txt" || true

          if [ -d "$ROOTFS_SRC/etc/board.d" ]; then
            find "$ROOTFS_SRC/etc/board.d" -maxdepth 1 -type f | while read -r f; do
              b=$(basename "$f")
              cp "$f" "$DIAG/board.d-$b.txt" 2>/dev/null || true
            done
          fi

          for f in \
            "$ROOTFS_SRC/etc/init.d/led" \
            "$ROOTFS_SRC/etc/init.d/led-force" \
            "$ROOTFS_SRC/etc/uci-defaults/50-fix-network" \
            "$ROOTFS_SRC/etc/uci-defaults/99-custom"; do
            [ -f "$f" ] && cp "$f" "$DIAG/$(basename "$f").txt" || true
          done

          if [ -n "$KV" ] && [ -d "$ROOTFS_SRC/lib/modules/$KV" ]; then
            ls -1 "$ROOTFS_SRC/lib/modules/$KV/" > "$DIAG/modules-top.txt" 2>/dev/null || true
          fi
        fi

        # 环境变量记录
        {
          echo "IMMORTALWRT_BRANCH=$IMMORTALWRT_BRANCH"
          echo "FRIENDLY_VER=$FRIENDLY_VER"
          echo "ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE"
          echo "DOCKER_BOOTARGS=$DOCKER_BOOTARGS"
          echo "KDIR=$KDIR"
          echo "DTB_DIR=$DTB_DIR"
          echo "ROOTFS_SRC=$ROOTFS_SRC"
          echo "KV=$KV"
        } > "$DIAG/env.txt"

        cd artifact
        tar czf diagnostics.tgz diagnostics/
        rm -rf diagnostics/
        ls -lh diagnostics.tgz

    - name: Upload all artifacts to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/*
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
        file_glob: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build ImmortalWrt for NanoPi R5S"
          repository: ${{ github.repository }}