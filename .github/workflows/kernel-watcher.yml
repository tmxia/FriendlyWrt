name: Kernel Watcher

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit SHA for nanopi6-v6.1.y
        id: sha
        run: |
          SHA=$(curl -s https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/nanopi6-v6.1.y | jq -r .sha)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current SHA: $SHA"

      - name: Read recorded SHA
        id: recorded
        run: |
          if [ -f .kernel-version ]; then
            RECORDED=$(cat .kernel-version)
          else
            RECORDED="none"
          fi
          echo "recorded=$RECORDED" >> $GITHUB_OUTPUT

      - name: Compare and trigger build if changed
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kernel updated, triggering build..."
          gh workflow run build_r5s.yml -f version=both -f set=both --repo ${{ github.repository }}

      - name: Update recorded SHA
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        run: |
          echo "${{ steps.sha.outputs.sha }}" > .kernel-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kernel-version
          git commit -m "Update kernel SHA"
          git push

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [check_kernel]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Kernel Watcher"
          repository: ${{ github.repository }}