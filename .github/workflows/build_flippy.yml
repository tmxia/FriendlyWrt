name: Build FriendlyWrt With Flippy Kernel (Full)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-flippy-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi
          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          dosfstools e2fsprogs parted xxd
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        repo sync -c toolchain --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || true

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        make -j$(nproc)

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        MODEL=R5S-R5C-Series
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL
        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Compile uboot, kernel, and generate sd-fuse dir
      run: |
        cd $GITHUB_WORKSPACE/project
        ./build.sh uboot
        cd $GITHUB_WORKSPACE/project
        repo sync -c device/friendlyelec --no-clone-bundle
        if [ ! -f .current_config.mk ]; then
          CPU=rk3568
          [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
          DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
          CONFIG=rockchip${SUFFIX}
          cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        fi
        ./build.sh kernel
        ./build.sh sd-img

    - name: Get latest flippy kernel version
      id: flippy_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
        LATEST=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//' | sort -V | tail -1)
        echo "version=$LATEST" >> $GITHUB_OUTPUT

    - name: Download flippy kernel
      run: |
        cd $GITHUB_WORKSPACE/project
        KERNEL_VER="${{ steps.flippy_version.outputs.version }}"
        wget -q "https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VER}.tar.gz" -O /tmp/flippy.tar.gz
        mkdir -p /tmp/flippy && tar xzf /tmp/flippy.tar.gz -C /tmp/flippy
        KDIR="/tmp/flippy/$KERNEL_VER"
        mkdir -p /tmp/flippy_boot /tmp/flippy_dtb /tmp/flippy_modules
        tar xzf "$(find $KDIR -name 'boot-*.tar.gz' | head -1)" -C /tmp/flippy_boot
        tar xzf "$(find $KDIR -name 'dtb-rockchip-*.tar.gz' | head -1)" -C /tmp/flippy_dtb
        tar xzf "$(find $KDIR -name 'modules-*.tar.gz' | head -1)" -C /tmp/flippy_modules
        echo "flippy boot:"; ls -la /tmp/flippy_boot/

    - name: Extend kernel partition in parameter.txt
      run: |
        cd $GITHUB_WORKSPACE/project
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        PARAM="scripts/sd-fuse/${DIST_DIR}/parameter.txt"
        echo "=== Original parameter.txt ==="
        cat "$PARAM"
        # 原 kernel 分区大小 0x14000 (40 MiB)，扩大到 0x18000 (48 MiB)，偏移 +0x4000
        # 原: 0x00014000@0x00012000(kernel),0x00010000@0x00026000(boot),0x00010000@0x00036000(recovery),0x00200000@0x00046000(rootfs),0x00200000@0x00246000(userdata:grow),-@0x00446000(opt:grow)
        # 新: 0x00018000@0x00012000(kernel),0x00010000@0x0002a000(boot),0x00010000@0x0003a000(recovery),0x00200000@0x0004a000(rootfs),0x00200000@0x0024a000(userdata:grow),-@0x0044a000(opt:grow)
        sed -i 's|0x00014000@0x00012000(kernel),0x00010000@0x00026000(boot),0x00010000@0x00036000(recovery),0x00200000@0x00046000(rootfs),0x00200000@0x00246000(userdata:grow),-@0x00446000(opt:grow)|0x00018000@0x00012000(kernel),0x00010000@0x0002a000(boot),0x00010000@0x0003a000(recovery),0x00200000@0x0004a000(rootfs),0x00200000@0x0024a000(userdata:grow),-@0x0044a000(opt:grow)|' "$PARAM"
        echo "=== Modified parameter.txt ==="
        cat "$PARAM"
        # 验证
        if ! grep -q "0x00018000@0x00012000(kernel)" "$PARAM"; then
          echo "ERROR: parameter.txt modification failed"
          exit 1
        fi
        echo "✓ kernel partition extended to 48 MiB"

    - name: Replace kernel.img with flippy kernel
      run: |
        cd $GITHUB_WORKSPACE/project
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        KERNEL_IMG="scripts/sd-fuse/${DIST_DIR}/kernel.img"
        VMLINUZ=$(find /tmp/flippy_boot -name "vmlinuz-*" | head -1)
        VMLINUZ_SIZE=$(stat -c%s "$VMLINUZ")
        echo "flippy vmlinuz: $VMLINUZ ($VMLINUZ_SIZE bytes)"
        # 构造 KRNL + size(LE 4) + vmlinuz
        SIZE_HEX=$(printf '%08x' $VMLINUZ_SIZE)
        SIZE_LE=$(echo "$SIZE_HEX" | sed 's/\(..\)\(..\)\(..\)\(..\)/\4\3\2\1/')
        printf 'KRNL' > /tmp/new_kernel.img
        printf "$SIZE_LE" | xxd -r -p >> /tmp/new_kernel.img
        cat "$VMLINUZ" >> /tmp/new_kernel.img
        # 验证 ARM64 magic 位置
        python3 -c "
        data = open('/tmp/new_kernel.img','rb').read(256)
        idx = data.find(b'ARM\x64')
        assert idx == 0x40, f'Magic at 0x{idx:x}, expected 0x40'
        print('✓ ARM64 magic at 0x40')
        "
        cp /tmp/new_kernel.img "$KERNEL_IMG"
        echo "New kernel.img size: $(stat -c%s "$KERNEL_IMG")"
        # 替换 dtb
        rm -rf "scripts/sd-fuse/${DIST_DIR}/dtb"
        mkdir -p "scripts/sd-fuse/${DIST_DIR}/dtb/rockchip"
        cp /tmp/flippy_dtb/*.dtb "scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/" 2>/dev/null || true
        echo "dtb files: $(ls scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ | wc -l)"
        # 替换 uInitrd（如存在）
        UINITRD=$(find /tmp/flippy_boot -name "uInitrd-*" | head -1)
        [ -n "$UINITRD" ] && cp "$UINITRD" "scripts/sd-fuse/${DIST_DIR}/uInitrd" && echo "uInitrd replaced"

    - name: Replace modules in rootfs with flippy modules
      run: |
        cd $GITHUB_WORKSPACE/project
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        # flippy modules 目录名（如 6.18.49-flippy-95+）
        MODULES_NAME=$(ls /tmp/flippy_modules | head -1)
        echo "Flippy modules dir: $MODULES_NAME"
        if [ -z "$MODULES_NAME" ]; then
          echo "WARNING: flippy modules not found, skipping"
          exit 0
        fi
        # 找到 rootfs 里的 lib/modules
        ROOTFS_SRC="friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip"
        if [ -d "$ROOTFS_SRC/lib/modules" ]; then
          echo "Old modules:"
          ls "$ROOTFS_SRC/lib/modules/"
          sudo rm -rf "$ROOTFS_SRC/lib/modules"
        fi
        mkdir -p "$ROOTFS_SRC/lib/modules/$MODULES_NAME"
        cp -a "/tmp/flippy_modules/$MODULES_NAME"/. "$ROOTFS_SRC/lib/modules/$MODULES_NAME/"
        echo "Modules replaced."

    - name: Build final image and upload
      id: build_sd_image
      run: |
        cd $GITHUB_WORKSPACE/project/scripts/sd-fuse
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        IMG_FILE="${{ steps.config.outputs.img_filename }}"
        ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"
        # 打包 tgz
        tar czf "$ARTIFACT_DIR/${{ steps.config.outputs.archive_filename }}" -C . "$DIST_DIR"
        echo "tgz created"
        # 重新生成镜像
        set +e
        yes | ./mk-sd-image.sh "$DIST_DIR" > /tmp/mk-sd.log 2>&1
        MK_EXIT=$?
        set -e
        echo "mk-sd-image.sh exit code: $MK_EXIT"
        cat /tmp/mk-sd.log
        [ $MK_EXIT -eq 0 ] || { echo "FAILED"; exit 1; }
        # 重命名
        if [ ! -f "out/${IMG_FILE}" ]; then
          ORIG=$(find out -maxdepth 1 -name "*.img" -print -quit)
          [ -n "$ORIG" ] && mv "$ORIG" "out/$IMG_FILE"
        fi
        [ -f "out/$IMG_FILE" ] || { echo "No .img"; ls -la out; exit 1; }
        mv "out/$IMG_FILE" "$ARTIFACT_DIR/"
        # 验证最终 raw 镜像的 kernel 分区
        RAW="$ARTIFACT_DIR/$IMG_FILE"
        KERNEL_OFFSET=$((0x12000 * 512))
        echo "=== Verify kernel in raw image at offset $KERNEL_OFFSET ==="
        python3 -c "
        with open('$RAW','rb') as f:
          f.seek($KERNEL_OFFSET)
          data = f.read(256)
        idx = data.find(b'ARM\x64')
        print(f'ARM64 magic at partition offset: 0x{idx:x}')
        assert idx == 0x40, f'FAIL: magic at 0x{idx:x}, expected 0x40'
        print('✓ Raw image contains flippy kernel')
        "
        # 压缩
        cd "$ARTIFACT_DIR"
        gzip -f "$IMG_FILE"
        echo "Compressed: $IMG_FILE.gz"

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    - uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          dosfstools e2fsprogs parted xxd
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true

    - name: Download source
      run: |
        mkdir project && cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        repo sync -c toolchain --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project && source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project && bash ../scripts/add_packages.sh

    - name: Update config
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Download and compile
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
        make -j$(nproc)

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        MODEL=R5S-R5C-Series
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL
        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Compile uboot, kernel, sd-img
      run: |
        cd $GITHUB_WORKSPACE/project
        ./build.sh uboot
        cd $GITHUB_WORKSPACE/project
        repo sync -c device/friendlyelec --no-clone-bundle
        [ ! -f .current_config.mk ] && {
          CPU=rk3568
          [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
          DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
          CONFIG=rockchip${SUFFIX}
          cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        }
        ./build.sh kernel
        ./build.sh sd-img

    - name: Get flippy kernel
      id: flippy_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
        LATEST=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//' | sort -V | tail -1)
        echo "version=$LATEST" >> $GITHUB_OUTPUT

    - name: Download flippy kernel
      run: |
        cd $GITHUB_WORKSPACE/project
        KERNEL_VER="${{ steps.flippy_version.outputs.version }}"
        wget -q "https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VER}.tar.gz" -O /tmp/flippy.tar.gz
        mkdir -p /tmp/flippy && tar xzf /tmp/flippy.tar.gz -C /tmp/flippy
        KDIR="/tmp/flippy/$KERNEL_VER"
        mkdir -p /tmp/flippy_boot /tmp/flippy_dtb /tmp/flippy_modules
        tar xzf "$(find $KDIR -name 'boot-*.tar.gz' | head -1)" -C /tmp/flippy_boot
        tar xzf "$(find $KDIR -name 'dtb-rockchip-*.tar.gz' | head -1)" -C /tmp/flippy_dtb
        tar xzf "$(find $KDIR -name 'modules-*.tar.gz' | head -1)" -C /tmp/flippy_modules

    - name: Extend kernel partition
      run: |
        cd $GITHUB_WORKSPACE/project
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        PARAM="scripts/sd-fuse/${DIST_DIR}/parameter.txt"
        sed -i 's|0x00014000@0x00012000(kernel),0x00010000@0x00026000(boot),0x00010000@0x00036000(recovery),0x00200000@0x00046000(rootfs),0x00200000@0x00246000(userdata:grow),-@0x00446000(opt:grow)|0x00018000@0x00012000(kernel),0x00010000@0x0002a000(boot),0x00010000@0x0003a000(recovery),0x00200000@0x0004a000(rootfs),0x00200000@0x0024a000(userdata:grow),-@0x0044a000(opt:grow)|' "$PARAM"
        grep -q "0x00018000@0x00012000(kernel)" "$PARAM" || { echo "ERROR: parameter.txt modification failed"; exit 1; }
        echo "✓ kernel partition extended"

    - name: Replace kernel and modules
      run: |
        cd $GITHUB_WORKSPACE/project
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        KERNEL_IMG="scripts/sd-fuse/${DIST_DIR}/kernel.img"
        VMLINUZ=$(find /tmp/flippy_boot -name "vmlinuz-*" | head -1)
        VMLINUZ_SIZE=$(stat -c%s "$VMLINUZ")
        SIZE_HEX=$(printf '%08x' $VMLINUZ_SIZE)
        SIZE_LE=$(echo "$SIZE_HEX" | sed 's/\(..\)\(..\)\(..\)\(..\)/\4\3\2\1/')
        printf 'KRNL' > /tmp/new_kernel.img
        printf "$SIZE_LE" | xxd -r -p >> /tmp/new_kernel.img
        cat "$VMLINUZ" >> /tmp/new_kernel.img
        python3 -c "
        data = open('/tmp/new_kernel.img','rb').read(256)
        idx = data.find(b'ARM\x64')
        assert idx == 0x40, f'Magic at 0x{idx:x}'
        print('✓ magic at 0x40')
        "
        cp /tmp/new_kernel.img "$KERNEL_IMG"
        rm -rf "scripts/sd-fuse/${DIST_DIR}/dtb"
        mkdir -p "scripts/sd-fuse/${DIST_DIR}/dtb/rockchip"
        cp /tmp/flippy_dtb/*.dtb "scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/" 2>/dev/null || true
        UINITRD=$(find /tmp/flippy_boot -name "uInitrd-*" | head -1)
        [ -n "$UINITRD" ] && cp "$UINITRD" "scripts/sd-fuse/${DIST_DIR}/uInitrd"
        # modules
        MODULES_NAME=$(ls /tmp/flippy_modules | head -1)
        if [ -n "$MODULES_NAME" ]; then
          ROOTFS_SRC="friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip"
          [ -d "$ROOTFS_SRC/lib/modules" ] && sudo rm -rf "$ROOTFS_SRC/lib/modules"
          mkdir -p "$ROOTFS_SRC/lib/modules/$MODULES_NAME"
          cp -a "/tmp/flippy_modules/$MODULES_NAME"/. "$ROOTFS_SRC/lib/modules/$MODULES_NAME/"
        fi

    - name: Build final image
      id: build_sd_image
      run: |
        cd $GITHUB_WORKSPACE/project/scripts/sd-fuse
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        IMG_FILE="${{ steps.config.outputs.img_filename }}"
        ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"
        tar czf "$ARTIFACT_DIR/${{ steps.config.outputs.archive_filename }}" -C . "$DIST_DIR"
        set +e
        yes | ./mk-sd-image.sh "$DIST_DIR" > /tmp/mk-sd.log 2>&1
        MK_EXIT=$?
        set -e
        cat /tmp/mk-sd.log
        [ $MK_EXIT -eq 0 ] || exit 1
        if [ ! -f "out/${IMG_FILE}" ]; then
          ORIG=$(find out -maxdepth 1 -name "*.img" -print -quit)
          [ -n "$ORIG" ] && mv "$ORIG" "out/$IMG_FILE"
        fi
        mv "out/$IMG_FILE" "$ARTIFACT_DIR/"
        RAW="$ARTIFACT_DIR/$IMG_FILE"
        KERNEL_OFFSET=$((0x12000 * 512))
        python3 -c "
        with open('$RAW','rb') as f:
          f.seek($KERNEL_OFFSET)
          data = f.read(256)
        idx = data.find(b'ARM\x64')
        assert idx == 0x40, f'FAIL: magic at 0x{idx:x}'
        print('✓ Raw image contains flippy kernel')
        "
        cd "$ARTIFACT_DIR"
        gzip -f "$IMG_FILE"

    - name: Upload images-XYZ.tgz
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate_assets:
    needs: [prepare_release, build_manual, build_auto]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-friendlywrt-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build_manual, build_auto, cleanup_intermediate_assets]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build FriendlyWrt With Flippy Kernel (Full)"
          repository: ${{ github.repository }}