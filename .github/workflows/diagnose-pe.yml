name: Diagnose PE Kernel Structure

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to diagnose'
        required: true
        default: '6.18.49'
      source_repo:
        description: 'Source repo'
        required: true
        default: 'ophub/kernel'
        type: choice
        options:
          - ophub/kernel
          - breakingbadboy/OpenWrt
      source_release:
        description: 'Release'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_rk35xx
          - kernel_stable

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl python3 xxd file cpio gzip xz-utils \
          zstd lz4 binutils-aarch64-linux-gnu

    - name: Download kernel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd /tmp
        KERNEL_VER="${{ inputs.kernel_version }}"
        REPO="${{ inputs.source_repo }}"
        RELEASE="${{ inputs.source_release }}"
        URL="https://github.com/${REPO}/releases/download/${RELEASE}/${KERNEL_VER}.tar.gz"
        echo "Downloading: $URL"
        wget -q "$URL" -O kernel.tar.gz || { echo "FAILED"; exit 1; }
        tar xzf kernel.tar.gz
        ls -la

    - name: Extract boot package
      run: |
        cd /tmp
        KERNEL_VER="${{ inputs.kernel_version }}"
        LOCAL_DIR="$KERNEL_VER"
        [ ! -d "$LOCAL_DIR" ] && LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        echo "LOCAL_DIR=$LOCAL_DIR"
        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        echo "BOOT_TAR=$BOOT_TAR"
        mkdir -p boot_extract
        tar xzf "$BOOT_TAR" -C boot_extract
        ls -la boot_extract/

    - name: Analyze vmlinuz PE structure
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        [ -z "$VMLINUZ" ] && { echo "vmlinuz not found"; exit 1; }
        echo "=========================================="
        echo "VMLINUZ: $VMLINUZ"
        echo "Size: $(stat -c%s "$VMLINUZ") bytes"
        echo "=========================================="

        echo ""
        echo "########## file 识别 ##########"
        file "$VMLINUZ"

        echo ""
        echo "########## 前 128 字节 ##########"
        xxd -l 128 "$VMLINUZ"

        echo ""
        echo "########## PE 头解析（Python）##########"
        python3 - "$VMLINUZ" <<'PYEOF'
import sys, struct
data = open(sys.argv[1], 'rb').read()
print(f"File size: {len(data)} bytes")

# DOS 头
if data[0:2] != b'MZ':
    print("Not PE format (no MZ)")
    sys.exit(0)

pe_off = struct.unpack_from('<I', data, 0x3C)[0]
print(f"DOS header: MZ")
print(f"PE header offset: 0x{pe_off:x}")

if data[pe_off:pe_off+4] != b'PE\x00\x00':
    print(f"✗ PE signature invalid at 0x{pe_off:x}: {data[pe_off:pe_off+4].hex()}")
    sys.exit(1)
print(f"PE signature: OK")

# COFF header
coff = pe_off + 4
machine = struct.unpack_from('<H', data, coff)[0]
num_sections = struct.unpack_from('<H', data, coff + 2)[0]
timestamp = struct.unpack_from('<I', data, coff + 4)[0]
sym_table = struct.unpack_from('<I', data, coff + 8)[0]
num_symbols = struct.unpack_from('<I', data, coff + 12)[0]
opt_hdr_size = struct.unpack_from('<H', data, coff + 16)[0]
characteristics = struct.unpack_from('<H', data, coff + 18)[0]

print(f"")
print(f"COFF header:")
print(f"  Machine:         0x{machine:04x} (0xaa64=ARM64)")
print(f"  Number sections: {num_sections}")
print(f"  Timestamp:       0x{timestamp:x}")
print(f"  Symbol table:    0x{sym_table:x}")
print(f"  Num symbols:     {num_symbols}")
print(f"  Opt header size: {opt_hdr_size}")
print(f"  Characteristics: 0x{characteristics:04x}")

# Section table
sec_start = coff + 20 + opt_hdr_size
print(f"")
print(f"Section table (starts at 0x{sec_start:x}):")
print(f"{'#':<3} {'Name':<12} {'VAddr':>12} {'VSize':>12} {'RawOff':>12} {'RawSize':>12} {'Chars':>10}")
print("-" * 80)

sections = []
for i in range(num_sections):
    off = sec_start + i * 40
    name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
    vsize = struct.unpack_from('<I', data, off + 8)[0]
    vaddr = struct.unpack_from('<I', data, off + 12)[0]
    raw_size = struct.unpack_from('<I', data, off + 16)[0]
    raw_off = struct.unpack_from('<I', data, off + 20)[0]
    chars = struct.unpack_from('<I', data, off + 36)[0]
    sections.append({'name': name, 'raw_off': raw_off, 'raw_size': raw_size})
    print(f"{i:<3} {name:<12} 0x{vaddr:08x} 0x{vsize:08x} 0x{raw_off:08x} 0x{raw_size:08x} 0x{chars:08x}")

print("")
print("########## 每个 section 前 32 字节 ##########")
for i, s in enumerate(sections):
    off = s['raw_off']
    size = s['raw_size']
    if off + 32 > len(data) or size == 0:
        print(f"[{i}] {s['name']}: 越界或空")
        continue
    chunk = data[off:off+32]
    print(f"[{i}] {s['name']:<12} ({size} bytes) @0x{off:x}")
    print(f"      Hex: {chunk.hex()}")
    # 检测压缩格式
    sig = chunk[:4]
    comp = ""
    if sig[:2] == b'\x1f\x8b': comp = "gzip"
    elif sig[:6] == b'\xfd7zXZ\x00': comp = "xz"
    elif sig[:4] == b'\x28\xb5\x2f\xfd': comp = "zstd"
    elif sig[:4] == b'\x04\x22\x4d\x18': comp = "lz4"
    elif sig[:2] == b'BZ': comp = "bzip2"
    elif sig[:2] == b'\x5d\x00': comp = "lzma"
    elif chunk.find(b'ARM\x64') >= 0: comp = "★ ARM64 Image ★"
    elif sig[:4] == b'\x7fELF': comp = "★ ELF ★"
    if comp:
        print(f"      格式: {comp}")
    # 检查 ARM64 magic 在整个 section 中的位置
    section_data = data[off:off+min(size, len(data)-off)]
    for m in range(len(section_data)-4):
        if section_data[m:m+4] == b'ARM\x64':
            print(f"      ARM64 magic 位置: section + 0x{m:x}")
            break

PYEOF

    - name: Try decompress each section
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        mkdir -p /tmp/sections
        python3 - "$VMLINUZ" <<'PYEOF'
import sys, struct, os, gzip, lzma, subprocess

data = open(sys.argv[1], 'rb').read()
pe_off = struct.unpack_from('<I', data, 0x3C)[0]
coff = pe_off + 4
num_sections = struct.unpack_from('<H', data, coff + 2)[0]
opt_hdr_size = struct.unpack_from('<H', data, coff + 16)[0]
sec_start = coff + 20 + opt_hdr_size

for i in range(num_sections):
    off = sec_start + i * 40
    name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
    raw_size = struct.unpack_from('<I', data, off + 16)[0]
    raw_off = struct.unpack_from('<I', data, off + 20)[0]
    if raw_size == 0 or raw_size > 100 * 1024 * 1024:
        continue
    section_data = data[raw_off:raw_off + raw_size]
    if len(section_data) < 4:
        continue
    
    outdir = "/tmp/sections"
    safe_name = name.replace('.', '_').lstrip('_')
    base = f"{outdir}/{safe_name}"
    open(base + ".raw", 'wb').write(section_data)
    
    sig = section_data[:6]
    decompressed = None
    decomp_name = None
    try:
        if sig[:2] == b'\x1f\x8b':
            decompressed = gzip.decompress(section_data)
            decomp_name = "gzip"
        elif sig[:6] == b'\xfd7zXZ\x00':
            decompressed = lzma.decompress(section_data)
            decomp_name = "xz"
        elif sig[:4] == b'\x28\xb5\x2f\xfd':
            # zstd
            try:
                import zstandard as zstd
                dctx = zstd.ZstdDecompressor()
                decompressed = dctx.decompress(section_data, max_output_size=100*1024*1024)
                decomp_name = "zstd"
            except:
                # 用命令行
                subprocess.run(['zstd', '-d', '-f', '-o', base + '.zstd_out', base + '.raw'], 
                             capture_output=True)
                if os.path.exists(base + '.zstd_out'):
                    decompressed = open(base + '.zstd_out', 'rb').read()
                    decomp_name = "zstd-cli"
        elif sig[:4] == b'\x04\x22\x4d\x18':
            subprocess.run(['lz4', '-d', '-f', base + '.raw', base + '.lz4_out'], 
                         capture_output=True)
            if os.path.exists(base + '.lz4_out'):
                decompressed = open(base + '.lz4_out', 'rb').read()
                decomp_name = "lz4"
        elif sig[:2] == b'\x5d\x00':
            decompressed = lzma.decompress(section_data)
            decomp_name = "lzma"
    except Exception as e:
        print(f"[{i}] {name}: 解压失败: {e}")
    
    if decompressed:
        open(base + ".decompressed", 'wb').write(decompressed)
        magic = decompressed.find(b'ARM\x64')
        print(f"[{i}] {name}: {decomp_name} 解压成功 -> {len(decompressed)} bytes")
        print(f"      ARM64 magic@{magic:x}")
        print(f"      前 32 字节: {decompressed[:32].hex()}")
        print(f"      ★★ 保存到 {base}.decompressed")
    else:
        # 检查 raw 里是否有 ARM64
        magic = section_data.find(b'ARM\x64')
        if magic >= 0:
            print(f"[{i}] {name}: raw 中含 ARM64 magic@0x{magic:x}")

PYEOF
        echo ""
        echo "=== /tmp/sections 内容 ==="
        ls -la /tmp/sections/

    - name: Summary
      run: |
        echo "=========================================="
        echo "诊断完成！"
        echo "=========================================="
        echo ""
        echo "请把以下内容贴回："
        echo "1. vmlinuz 前 128 字节"
        echo "2. PE header 解析结果（sections 表）"
        echo "3. 每个 section 的前 32 字节"
        echo "4. 解压结果（哪些 section 可解压、解压后 ARM64 magic 位置）"
        echo ""
        echo "重点看："
        echo "- .linux section 是否可解压"
        echo "- 解压后是否含 ARM64 magic"
        echo "- 解压后前 32 字节是否为有效 ARM64 指令"