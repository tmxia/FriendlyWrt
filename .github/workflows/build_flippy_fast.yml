name: Build FriendlyWrt With Flippy Kernel (Fast)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  prepare_release:
    # ...（与之前完全相同，略）...
    # 请保留 prepare_release 的完整内容（此处省略，实际文件需包含）

  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    # ... 前面所有步骤保持不变（Checkout, 初始化, 下载源码, 定制, 配置, 下载rootfs, 准备rootfs, 编译uboot, flippy内核替换, Prepare sd-img environment）...
    # 这里只给出最后两个步骤的修改，其余省略，实际文件请保留原样

    - name: Build sd image with flippy kernel (direct)
      id: build_sd_image
      run: |
        cd project
        export TOPDIR=$(pwd)
        export FRIENDLYWRT_SRC=$TOPDIR
        echo "Current directory: $(pwd)"
        mkdir -p out
        pushd scripts/sd-fuse > /dev/null
        echo "Running mk-sd-image.sh from sd-fuse directory..."
        ./mk-sd-image.sh ${{ steps.config.outputs.dist_dir }} ../../out/${{ steps.config.outputs.img_filename }}
        popd > /dev/null
        if [ -f "out/${{ steps.config.outputs.img_filename }}" ]; then
          echo "Image generated successfully: out/${{ steps.config.outputs.img_filename }}"
          mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        else
          echo "ERROR: Image file not found: out/${{ steps.config.outputs.img_filename }}"
          exit 1
        fi
        pushd scripts/sd-fuse/ > /dev/null
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
          echo "ERROR: image directory ${{ steps.config.outputs.dist_dir }} not found"
          ls -la
          exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null
        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    # ... 同样，前面步骤保持不变 ...
    - name: Build sd image with flippy kernel (direct)
      id: build_sd_image
      run: |
        cd project
        export TOPDIR=$(pwd)
        export FRIENDLYWRT_SRC=$TOPDIR
        echo "Current directory: $(pwd)"
        mkdir -p out
        pushd scripts/sd-fuse > /dev/null
        echo "Running mk-sd-image.sh from sd-fuse directory..."
        ./mk-sd-image.sh ${{ steps.config.outputs.dist_dir }} ../../out/${{ steps.config.outputs.img_filename }}
        popd > /dev/null
        if [ -f "out/${{ steps.config.outputs.img_filename }}" ]; then
          echo "Image generated successfully: out/${{ steps.config.outputs.img_filename }}"
          mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        else
          echo "ERROR: Image file not found: out/${{ steps.config.outputs.img_filename }}"
          exit 1
        fi
        pushd scripts/sd-fuse/ > /dev/null
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
          echo "ERROR: image directory ${{ steps.config.outputs.dist_dir }} not found"
          ls -la
          exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null
        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate_assets:
    # ... 保持不变 ...
  cleanup_self:
    # ... 保持不变 ...