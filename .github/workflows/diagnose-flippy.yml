name: Diagnose Flippy vs Official Kernel

on:
  workflow_dispatch:
    inputs:
      official_release_tag:
        description: '官方固件 Release tag'
        required: true
        default: 'FriendlyWrt-2026-09-04'
        type: string
      official_asset:
        description: '官方固件 asset 名 (.img.gz)'
        required: true
        default: 'R5S-R5C-Series-FriendlyWrt-24.10-docker.img.gz'
        type: string
      flippy_kernel_version:
        description: 'Flippy 内核版本'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - '6.1.y'
          - '6.6.y'
          - '6.18.y'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            wget curl git file xxd bc python3 \
            device-tree-compiler cpio gzip xz-utils lz4 zstd

      - name: Download official firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.official_release_tag }}
          ASSET: ${{ inputs.official_asset }}
        run: |
          mkdir -p /tmp/official
          cd /tmp/official
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir .
          ls -la

      - name: Decompress and extract partitions
        run: |
          cd /tmp/official
          IMG_GZ=$(find . -name "*.img.gz" | head -1)
          if [ -z "$IMG_GZ" ]; then
            echo "ERROR: 未找到 .img.gz"
            ls -la
            exit 1
          fi
          echo "解压: $IMG_GZ"
          gunzip -k "$IMG_GZ"
          IMG=$(find . -name "*.img" | head -1)
          if [ -z "$IMG" ]; then
            echo "ERROR: 未找到 .img"
            exit 1
          fi
          echo "IMG: $IMG ($(stat -c%s "$IMG") bytes)"

          python3 - "$IMG" <<'PYEOF'
          import struct, sys, os
          img = sys.argv[1]
          with open(img, 'rb') as f:
              f.seek(512)
              hdr = f.read(92)
              assert hdr[0:8] == b'EFI PART', '镜像不是 GPT 格式'
              entries_lba = struct.unpack_from('<Q', hdr, 72)[0]
              num_entries = struct.unpack_from('<I', hdr, 80)[0]
              entry_size  = struct.unpack_from('<I', hdr, 84)[0]
              f.seek(entries_lba * 512)
              entries = f.read(entry_size * num_entries)

          print("=== 官方镜像 GPT 分区表 ===")
          parts = []
          for i in range(num_entries):
              off = i * entry_size
              nb = entries[off+56:off+56+72]
              name = nb.split(b'\x00')[0].decode('utf-16-le', errors='ignore').strip()
              if not name:
                  continue
              first_lba = struct.unpack_from('<Q', entries, off+32)[0]
              last_lba  = struct.unpack_from('<Q', entries, off+40)[0]
              size_mb = (last_lba - first_lba + 1) * 512 / 1024 / 1024
              print(f"  {name:12} LBA 0x{first_lba:x}-0x{last_lba:x}  {size_mb:.1f} MiB")
              parts.append((name, first_lba, last_lba))

          os.makedirs('/tmp/official/parts', exist_ok=True)
          with open(img, 'rb') as f:
              for name, first, last in parts:
                  offset = first * 512
                  size = (last - first + 1) * 512
                  if name == 'kernel':
                      f.seek(offset)
                      data = f.read(min(size, 1024 * 1024))
                      with open('/tmp/official/parts/kernel_head.bin', 'wb') as w:
                          w.write(data)
                      print(f"  提取 kernel 头部 {len(data)} 字节")
                  elif name == 'resource':
                      f.seek(offset)
                      data = f.read(size)
                      with open('/tmp/official/parts/resource.img', 'wb') as w:
                          w.write(data)
                      print(f"  提取 resource.img ({size} bytes)")
                  elif name == 'boot':
                      f.seek(offset)
                      data = f.read(min(size, 1024 * 1024))
                      with open('/tmp/official/parts/boot_head.bin', 'wb') as w:
                          w.write(data)
                      print(f"  提取 boot 头部 {len(data)} 字节")
          PYEOF

          echo ""
          echo "=== parts 目录 ==="
          ls -la /tmp/official/parts/

      - name: Parse resource.img and extract dtb
        run: |
          cd /tmp/official/parts
          if [ ! -f resource.img ]; then
            echo "无 resource.img，跳过"
            exit 0
          fi

          python3 - <<'PYEOF'
          import struct, os
          path = 'resource.img'
          with open(path, 'rb') as f:
              data = f.read()

          print(f"resource.img 大小: {len(data)}")
          print(f"magic: {data[:8].hex()}")

          magic = data[:4]
          if magic == b'RKRS' or magic == b'RSCE':
              ver = struct.unpack_from('<H', data, 4)[0]
              hdr_size = struct.unpack_from('<H', data, 6)[0]
              idx_off = struct.unpack_from('<I', data, 8)[0]
              dat_off = struct.unpack_from('<I', data, 12)[0]
              dat_sz = struct.unpack_from('<I', data, 16)[0]
              part_num = struct.unpack_from('<I', data, 20)[0]
              print(f"ver={ver} hdr_size={hdr_size}")
              print(f"idx_off=0x{idx_off:x} data_off=0x{dat_off:x}")
              print(f"data_size={dat_sz} part_num={part_num}")

              os.makedirs('/tmp/official/parts/dtb', exist_ok=True)
              for i in range(part_num):
                  eo = idx_off + i * 24
                  if eo + 24 > len(data):
                      break
                  name = data[eo:eo+16].split(b'\x00')[0].decode('ascii', 'ignore')
                  eoff = struct.unpack_from('<I', data, eo+16)[0]
                  esz = struct.unpack_from('<I', data, eo+20)[0]
                  print(f"  entry[{i}]: '{name}' off=0x{eoff:x} size={esz}")

                  if eoff + esz <= len(data) and esz > 0:
                      blob = data[eoff:eoff+esz]
                      if blob[:4] == b'\xd0\x0d\xfe\xed':
                          out = f'/tmp/official/parts/dtb/{name}.dtb'
                          with open(out, 'wb') as w:
                              w.write(blob)
                          print(f"    -> 提取 DTB ({esz} bytes)")
          else:
              print("未知 resource 格式，尝试扫描 dtb magic")
              os.makedirs('/tmp/official/parts/dtb', exist_ok=True)
              pos = 0
              cnt = 0
              while pos < len(data) - 4:
                  if data[pos:pos+4] == b'\xd0\x0d\xfe\xed':
                      end = pos + 4 * 1024 * 1024
                      if end > len(data):
                          end = len(data)
                      blob = data[pos:end]
                      out = f'/tmp/official/parts/dtb/scan_{cnt}.dtb'
                      with open(out, 'wb') as w:
                          w.write(blob)
                      print(f"  扫描到 dtb @ 0x{pos:x}")
                      cnt += 1
                      pos += 4
                      if cnt >= 5:
                          break
                  else:
                      pos += 1
          PYEOF

          echo ""
          echo "=== 提取的 DTB ==="
          ls -la /tmp/official/parts/dtb/ 2>/dev/null || echo "无"

      - name: Download and unpack Flippy kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KV: ${{ inputs.flippy_kernel_version }}
        run: |
          mkdir -p /tmp/flippy
          cd /tmp/flippy

          ASSETS=$(gh release view kernel_rk35xx --repo breakingbadboy/OpenWrt \
                   --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          if [ -z "$ASSETS" ]; then
            echo "ERROR: 无法获取 kernel_rk35xx 资产列表"
            exit 1
          fi

          PATTERN="^${KV}\\.[0-9]+\\.tar\\.gz\$"
          VERS=$(echo "$ASSETS" | grep -E "$PATTERN" | sed 's/\.tar\.gz//' | sort -V || true)
          if [ -z "$VERS" ]; then
            echo "ERROR: 无匹配 $KV"
            echo "$ASSETS" | head -20
            exit 1
          fi

          SEL=$(echo "$VERS" | tail -1)
          echo "选中: $SEL"
          echo "FLIPPY_VER=$SEL" >> $GITHUB_ENV

          URL="https://github.com/breakingbadboy/OpenWrt/releases/download/kernel_rk35xx/${SEL}.tar.gz"
          wget -q "$URL" -O kernel.tar.gz
          tar xzf kernel.tar.gz

          LDIR=$(find . -maxdepth 1 -type d -name "*${SEL}*" | head -1)
          if [ -z "$LDIR" ]; then
            LDIR="$SEL"
          fi
          echo "内核目录: $LDIR"
          ls -la "$LDIR"

          BOOT_TAR=$(find "$LDIR" -name "boot-*.tar.gz" | head -1)
          DTB_TAR=$(find "$LDIR" -name "dtb-rockchip-*.tar.gz" | head -1)
          mkdir -p boot dtb
          tar xzf "$BOOT_TAR" -C boot
          tar xzf "$DTB_TAR" -C dtb

          echo ""
          echo "=== Flippy boot/ ==="
          ls -la boot/
          echo ""
          echo "=== Flippy dtb 中 R5S/R5C ==="
          find dtb -name "*r5s*" -o -name "*r5c*" 2>/dev/null | head

      - name: Compare kernel heads
        run: |
          echo "==========================================="
          echo "  对比 #1: kernel 头部 (最关键)"
          echo "==========================================="
          echo ""
          echo "--- 官方 kernel 头 (来自镜像 LBA 0x12000) ---"
          xxd -l 256 /tmp/official/parts/kernel_head.bin

          echo ""
          echo "--- Flippy 原始 vmlinuz 头 ---"
          FLP_VMLINUZ=$(find /tmp/flippy/boot -name "vmlinuz-*" | head -1)
          echo "文件: $FLP_VMLINUZ ($(stat -c%s "$FLP_VMLINUZ") bytes)"
          xxd -l 256 "$FLP_VMLINUZ"

          echo ""
          echo "--- 关键字段解析 ---"
          OFF_HEAD=/tmp/official/parts/kernel_head.bin \
          FLP_VMLINUZ="$FLP_VMLINUZ" \
          python3 - <<'PYEOF'
          import os
          def inspect(path, label):
              print(f"\n[{label}] {path}")
              try:
                  with open(path, 'rb') as f:
                      d = f.read(0x100)
              except Exception as e:
                  print(f"  读取失败: {e}")
                  return
              print(f"  bytes[0:4]      = {d[0:4]}")
              print(f"  bytes[0:4].hex  = {d[0:4].hex()}")
              if d[0:4] == b'KRNL':
                  print(f"  >> 是 KRNL 格式")
                  print(f"  size[4:8]       = {int.from_bytes(d[4:8],'little')}")
                  print(f"  code0[8:12]     = 0x{int.from_bytes(d[8:12],'little'):08x}")
                  print(f"  image_size[16:24]= 0x{int.from_bytes(d[16:24],'little'):x}")
                  idx = d.find(b'ARM\x64')
                  print(f"  ARM\\x64 @       = 0x{idx:x}")
              elif d[0:2] == b'MZ':
                  print(f"  >> 是 PE/EFI 格式")
                  pe_off = int.from_bytes(d[0x3C:0x40], 'little')
                  print(f"  PE header offset = 0x{pe_off:x}")
              elif d[0:4] == b'\xd0\x0d\xfe\xed':
                  print(f"  >> 是 FIT/DTB 格式")
              elif d[0:8] == b'ANDROID!':
                  print(f"  >> 是 Android boot.img")
              else:
                  print(f"  >> 未知格式")

          inspect(os.environ.get("OFF_HEAD", ""), "OFFICIAL")
          inspect(os.environ.get("FLP_VMLINUZ", ""), "FLIPPY")
          PYEOF

      - name: Compare DTB
        run: |
          echo "==========================================="
          echo "  对比 #2: DTB"
          echo "==========================================="

          OFF_DTB=$(find /tmp/official/parts/dtb -name "*r5s*" 2>/dev/null | head -1)
          if [ -z "$OFF_DTB" ]; then
            OFF_DTB=$(find /tmp/official/parts/dtb -name "*.dtb" 2>/dev/null | head -1)
          fi

          FLP_DTB=$(find /tmp/flippy/dtb -name "*r5s*" 2>/dev/null | head -1)
          if [ -z "$FLP_DTB" ]; then
            FLP_DTB=$(find /tmp/flippy/dtb -name "*.dtb" 2>/dev/null | head -1)
          fi

          echo "官方 DTB: $OFF_DTB"
          echo "Flippy DTB: $FLP_DTB"

          if [ -z "$OFF_DTB" ] || [ -z "$FLP_DTB" ]; then
            echo "缺 DTB，跳过对比"
            exit 0
          fi

          stat -c "  官方大小: %s bytes" "$OFF_DTB"
          stat -c "  Flippy大小: %s bytes" "$FLP_DTB"

          mkdir -p /tmp/dtbcmp
          dtc -I dtb -O dts -o /tmp/dtbcmp/official.dts "$OFF_DTB" 2>/dev/null || true
          dtc -I dtb -O dts -o /tmp/dtbcmp/flippy.dts "$FLP_DTB" 2>/dev/null || true

          echo ""
          echo "--- 官方 chosen 节点 ---"
          grep -A3 -B1 'chosen' /tmp/dtbcmp/official.dts 2>/dev/null | head -20 || echo "无"

          echo ""
          echo "--- Flippy chosen 节点 ---"
          grep -A3 -B1 'chosen' /tmp/dtbcmp/flippy.dts 2>/dev/null | head -20 || echo "无"

          echo ""
          echo "--- 差异前 60 行 ---"
          diff /tmp/dtbcmp/official.dts /tmp/dtbcmp/flippy.dts | head -60 || true

          DIFF_LINES=$(diff /tmp/dtbcmp/official.dts /tmp/dtbcmp/flippy.dts | grep -c '^[<>]' || true)
          echo ""
          echo "差异总行数: $DIFF_LINES"

      - name: Collect results
        if: always()
        run: |
          mkdir -p /tmp/results
          cp -f /tmp/official/parts/kernel_head.bin /tmp/results/ 2>/dev/null || true
          cp -f /tmp/official/parts/resource.img /tmp/results/ 2>/dev/null || true
          cp -f /tmp/official/parts/boot_head.bin /tmp/results/ 2>/dev/null || true
          cp -rf /tmp/official/parts/dtb /tmp/results/official-dtb 2>/dev/null || true

          FLP_VMLINUZ=$(find /tmp/flippy/boot -name "vmlinuz-*" 2>/dev/null | head -1)
          if [ -n "$FLP_VMLINUZ" ]; then
            cp -f "$FLP_VMLINUZ" /tmp/results/flippy-vmlinuz 2>/dev/null || true
          fi

          FLP_DTB=$(find /tmp/flippy/dtb -name "*r5s*" 2>/dev/null | head -1)
          if [ -n "$FLP_DTB" ]; then
            cp -f "$FLP_DTB" /tmp/results/flippy-r5s.dtb 2>/dev/null || true
          fi

          cp -f /tmp/dtbcmp/official.dts /tmp/results/ 2>/dev/null || true
          cp -f /tmp/dtbcmp/flippy.dts /tmp/results/ 2>/dev/null || true

          {
            echo "Flippy 内核版本: ${FLIPPY_VER:-unknown}"
            echo ""
            echo "官方 kernel 头部 (前 96 字节):"
            xxd -l 96 /tmp/official/parts/kernel_head.bin 2>/dev/null || echo "N/A"
            echo ""
            echo "Flippy vmlinuz 头部 (前 96 字节):"
            xxd -l 96 /tmp/results/flippy-vmlinuz 2>/dev/null || echo "N/A"
          } > /tmp/results/REPORT.txt

          ls -la /tmp/results/

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ inputs.flippy_kernel_version }}
          path: /tmp/results/
          retention-days: 14