name: Cleanup GHCR All Cache

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要删除的包名（逗号分隔）'
        required: true
        default: 'r5s-base-cache,r5s-cache'
      confirm:
        description: '输入 DELETE 确认删除'
        required: true
        default: ''
        type: string

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirm
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::未确认，输入 DELETE 才能执行"
            exit 1
          fi

      - name: Delete packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -e
          IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"

          for PKG in "${PKGS[@]}"; do
            PKG=$(echo "$PKG" | xargs)
            echo ""
            echo "==================== $PKG ===================="

            if [ "$OWNER_TYPE" = "Organization" ]; then
              BASE="/orgs/${OWNER}/packages/container/${PKG}/versions"
            else
              BASE="/users/${OWNER}/packages/container/${PKG}/versions"
            fi

            PAGE=1
            TOTAL=0
            DELETED=0
            FAILED=0

            while :; do
              BATCH=$(gh api "${BASE}?per_page=100&page=${PAGE}" 2>/dev/null || echo "[]")
              COUNT=$(echo "$BATCH" | jq 'length' 2>/dev/null || echo 0)
              [ "$COUNT" -eq 0 ] && break

              echo "  page $PAGE: $COUNT versions"

              echo "$BATCH" | jq -r '.[].id' | while read -r VID; do
                [ -z "$VID" ] && continue
                if gh api -X DELETE "${BASE}/${VID}" 2>/dev/null; then
                  echo "    ✓ deleted $VID"
                else
                  echo "    ✗ failed  $VID"
                fi
              done

              TOTAL=$((TOTAL + COUNT))
              [ "$COUNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done

            echo "  total: $TOTAL versions processed"

            # Delete the package itself (container package metadata)
            if [ "$OWNER_TYPE" = "Organization" ]; then
              gh api -X DELETE "/orgs/${OWNER}/packages/container/${PKG}" 2>/dev/null \
                && echo "  ✓ package metadata deleted" \
                || echo "  (package metadata already gone or delete failed)"
            else
              gh api -X DELETE "/users/${OWNER}/packages/container/${PKG}" 2>/dev/null \
                && echo "  ✓ package metadata deleted" \
                || echo "  (package metadata already gone or delete failed)"
            fi
          done

          echo ""
          echo "===== Done ====="