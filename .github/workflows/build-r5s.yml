name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_BRANCH: 'openwrt-25.12'
  FLAVOR: 'r5s'
  TARGET_OS: 'friendlywrt25'
  MODEL_NAME: 'R5S-R5C-Series'
  FRIENDLY_VER: '25.12'
  GOPROXY: 'https://goproxy.cn,direct'
  GOFLAGS: '-mod=mod'
  GOMODCACHE: '/tmp/go-mod-cache'
  CCACHE_DIR: '/home/runner/.ccache'
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: '3G'
  ROOTFS_PARTSIZE: '1024'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then FORCE_BASE=true; fi
          if [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then FORCE_BASE=true; fi

          if [ "$FORCE_BASE" = "true" ]; then
            for tag in $(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true); do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$TAGS" ]; then TAG="$BASE_TAG"; else
              MAX=0
              for t in $TAGS; do [[ $t =~ -([0-9]+)$ ]] && [ ${BASH_REMATCH[1]} -gt $MAX ] && MAX=${BASH_REMATCH[1]}; done
              TAG="${BASE_TAG}-$((MAX+1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          allow_updates: true
          overwrite: true

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - uses: actions/checkout@v4

    - name: Reclaim disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
          /usr/local/.ghcup /opt/az || true
        sudo apt-get clean
        df -h /

    - name: Add swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile > /dev/null
        sudo swapon /swapfile
        free -h

    - name: Initialization environment
      env: { DEBIAN_FRONTEND: noninteractive }
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-dev python3-distutils python3-setuptools \
          python3-pip python3-venv python3-pyelftools rsync subversion swig time \
          xsltproc zlib1g-dev bison flex libtool libtool-bin pkg-config \
          libgmp-dev libmpc-dev libmpfr-dev gperf patch quilt cpio \
          liblzma-dev libbz2-dev device-tree-compiler u-boot-tools \
          bzip2 xz-utils zip unzip wget curl autoconf automake autopoint \
          texinfo help2man aria2 bc whiptail mercurial lib32stdc++6 \
          android-sdk-libsparse-utils e2fsprogs parted dosfstools mtools lz4
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
        python3 -c "import elftools" 2>/dev/null || pip3 install --quiet pyelftools
        mkdir -p ./artifact

    - name: Clone OpenWrt source
      run: |
        mkdir -p project
        cd project
        git clone --depth 1 -b ${{ env.OPENWRT_BRANCH }} \
          https://github.com/openwrt/openwrt.git friendlywrt > /dev/null 2>&1
        echo "[OK] source cloned"

    - name: Restore staging_dir
      uses: actions/cache@v4
      with:
        path: project/friendlywrt/staging_dir
        key: staging-${{ env.OPENWRT_BRANCH }}-${{ env.FLAVOR }}-${{ github.run_id }}
        restore-keys: |
          staging-${{ env.OPENWRT_BRANCH }}-${{ env.FLAVOR }}-
          staging-${{ env.OPENWRT_BRANCH }}-

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ env.OPENWRT_BRANCH }}-${{ env.FLAVOR }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ env.OPENWRT_BRANCH }}-${{ env.FLAVOR }}-
          ccache-${{ env.OPENWRT_BRANCH }}-

    - name: Restore dl
      uses: actions/cache@v4
      with:
        path: project/friendlywrt/dl
        key: dl-${{ env.OPENWRT_BRANCH }}-${{ github.run_id }}
        restore-keys: dl-${{ env.OPENWRT_BRANCH }}-

    - name: Restore Go mod cache
      uses: actions/cache@v4
      with:
        path: /tmp/go-mod-cache
        key: gomod-${{ env.OPENWRT_BRANCH }}-${{ github.run_id }}
        restore-keys: gomod-${{ env.OPENWRT_BRANCH }}-

    # =========================================================
    #  一行搞定：所有 OpenWrt 逻辑都在这一个脚本里
    # =========================================================
    - name: Run custom build script
      run: bash scripts/custome_kernel_config_new.sh

    - name: Show cache stats
      if: always()
      run: |
        ccache -s || true
        du -sh "$CCACHE_DIR" project/friendlywrt/staging_dir project/friendlywrt/dl 2>/dev/null || true

    - name: Upload all artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/*
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
        file_glob: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions: { actions: write, contents: read }
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}