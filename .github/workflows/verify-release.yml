name: Verify Release Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：指定 release tag（留空自动取最新）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools mtools e2fsprogs file xxd xz-utils

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          INPUT="${{ inputs.release_tag }}"

          if [ -n "$INPUT" ]; then
            if gh release view "$INPUT" --repo "$REPO" >/dev/null 2>&1; then
              TAG="$INPUT"
            elif gh release view "R5S-$INPUT" --repo "$REPO" >/dev/null 2>&1; then
              TAG="R5S-$INPUT"
            else
              echo "❌ 未找到 release: $INPUT"
              gh release list --repo "$REPO" --limit 10
              exit 1
            fi
          else
            TAG=$(gh release list --repo "$REPO" --limit 30 \
                  --json tagName,createdAt \
                  --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
                  | grep -E '^R5S-OpenWrt-25\.12-' | head -1)
            if [ -z "$TAG" ]; then
              echo "❌ 未找到 R5S-OpenWrt-25.12-* release"
              gh release list --repo "$REPO" --limit 10
              exit 1
            fi
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ 使用 release: $TAG"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cd $GITHUB_WORKSPACE/artifacts
          gh release download "${{ steps.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.img.gz" \
            --pattern "*manifest*" \
            --clobber
          ls -lh

      - name: Verify
        run: |
          set +e
          cd $GITHUB_WORKSPACE/artifacts
          WORK=$(mktemp -d)

          PASS=0; FAIL=0; WARN=0
          ok()   { echo "  [OK]   $1"; PASS=$((PASS+1)); }
          fail() { echo "  [FAIL] $1"; FAIL=$((FAIL+1)); }
          warn() { echo "  [WARN] $1"; WARN=$((WARN+1)); }
          hdr()  { echo ""; echo "====== $1 ======"; }

          hdr "准备"
          IMG_GZ=$(ls *squashfs-sysupgrade.img.gz 2>/dev/null | head -1)
          [ -z "$IMG_GZ" ] && { echo "未找到 squashfs-sysupgrade.img.gz"; exit 1; }
          echo "镜像: $IMG_GZ"
          MANIFEST=$(ls *manifest.txt 2>/dev/null | head -1)

          hdr "1. 解压镜像"
          python3 - "$IMG_GZ" "$WORK/fw.img" << 'PY'
          import sys, zlib
          with open(sys.argv[1],'rb') as f, open(sys.argv[2],'wb') as o:
              d = zlib.decompressobj(wbits=31); total = 0
              while True:
                  chunk = f.read(1<<20)
                  if not chunk: break
                  out = d.decompress(chunk); o.write(out); total += len(out)
                  if d.eof: break
          print(f"  {total/1024/1024:.1f} MB")
          PY
          FW="$WORK/fw.img"
          [ -f "$FW" ] && ok "解压成功" || { fail "解压失败"; exit 1; }

          hdr "2. MBR 分区表"
          python3 - "$FW" > "$WORK/parts.txt" << 'PY'
          import struct, sys
          with open(sys.argv[1],'rb') as f:
              f.seek(446)
              for i in range(4):
                  e = f.read(16)
                  if e[4] == 0: continue
                  s = struct.unpack('<I', e[8:12])[0]
                  n = struct.unpack('<I', e[12:16])[0]
                  print(f"{i+1}\t{e[4]:02x}\t{s}\t{n}")
          PY
          while IFS=$'\t' read -r idx type start size; do
            echo "  p$idx: type=0x$type start=$start size=$size ($((size*512/1024/1024))MB)"
          done < "$WORK/parts.txt"

          P_NUM=$(wc -l < "$WORK/parts.txt")
          [ "$P_NUM" = "3" ] && ok "3 分区" || fail "分区数 = $P_NUM（期望 3）"

          P3_TYPE=$(awk -F'\t' '$1==3 {print $2}' "$WORK/parts.txt")
          [ "$P3_TYPE" = "83" ] && ok "p3 type=0x83" || fail "p3 type=0x$P3_TYPE"

          P3_SIZE=$(awk -F'\t' '$1==3 {print $4}' "$WORK/parts.txt")
          P3_MB=$((P3_SIZE * 512 / 1024 / 1024))
          [ "$P3_MB" -ge 200 ] && [ "$P3_MB" -le 300 ] && ok "p3 大小 = ${P3_MB}MB" || warn "p3 = ${P3_MB}MB"

          hdr "3. 内核 PROC_PAGE_MONITOR 验证"
          P1_START=$(awk -F'\t' '$1==1 {print $3}' "$WORK/parts.txt")
          P1_SIZE=$(awk -F'\t' '$1==1 {print $4}' "$WORK/parts.txt")
          dd if="$FW" of="$WORK/p1.img" bs=512 skip="$P1_START" count="$P1_SIZE" 2>/dev/null
          P1_FS=$(blkid -s TYPE -o value "$WORK/p1.img" 2>/dev/null || echo unknown)
          echo "  p1 文件系统: $P1_FS"

          KERNEL=""
          if [ "$P1_FS" = "ext4" ]; then
              KERNEL="$WORK/kernel.img"
              debugfs -R "dump kernel.img $KERNEL" "$WORK/p1.img" 2>/dev/null >/dev/null && ok "ext4 提取 kernel.img" || warn "debugfs 失败"
          elif [ "$P1_FS" = "vfat" ]; then
              KERNEL="$WORK/kernel.img"
              mcopy -i "$WORK/p1.img" ::kernel.img "$KERNEL" 2>/dev/null && ok "FAT32 提取 kernel.img" || warn "mcopy 失败"
          fi

          if [ -f "$KERNEL" ]; then
              KIMG_SIZE=$(stat -c%s "$KERNEL")
              echo "  kernel.img: $((KIMG_SIZE/1024/1024))MB"

              KCONF=""

              if grep -q "IKCFG_ST" "$KERNEL" 2>/dev/null; then
                  KCONF=$(python3 - "$KERNEL" << 'PY'
          import sys, gzip, zlib
          data = open(sys.argv[1],'rb').read()
          i = data.find(b'IKCFG_ST')
          if i < 0: sys.exit(1)
          j = data.find(b'IKCFG_ED', i)
          if j < 0: sys.exit(1)
          blob = data[i+8:j]
          try: sys.stdout.buffer.write(gzip.decompress(blob))
          except Exception:
              try: sys.stdout.buffer.write(zlib.decompress(blob))
              except Exception: sys.exit(1)
          PY
                  )
              fi

              if [ -z "$KCONF" ]; then
                  echo "  IKCONFIG 未编入，解压 kernel 内嵌层搜索..."
                  binwalk -e "$KERNEL" >/dev/null 2>&1 || true
                  for f in "$WORK"/_kernel.img.extracted/*; do
                      [ -f "$f" ] || continue
                      ft=$(file -b "$f")
                      TMPF="$WORK/unpacked"
                      case "$ft" in
                          *gzip*) zcat "$f" > "$TMPF" 2>/dev/null ;;
                          *XZ*)   xz -dc "$f" > "$TMPF" 2>/dev/null ;;
                          *LZMA*) xz --format=lzma -dc "$f" 2>/dev/null > "$TMPF" ;;
                          *) TMPF="$f" ;;
                      esac
                      [ -f "$TMPF" ] || continue

                      if ! strings "$TMPF" 2>/dev/null | grep -qx "smaps"; then
                          ft2=$(file -b "$TMPF")
                          case "$ft2" in
                              *gzip*) zcat "$TMPF" > "$WORK/unpacked2" 2>/dev/null && TMPF="$WORK/unpacked2" ;;
                              *XZ*)   xz -dc "$TMPF" > "$WORK/unpacked2" 2>/dev/null && TMPF="$WORK/unpacked2" ;;
                              *LZMA*) xz --format=lzma -dc "$TMPF" 2>/dev/null > "$WORK/unpacked2" && TMPF="$WORK/unpacked2" ;;
                          esac
                      fi

                      if strings "$TMPF" 2>/dev/null | grep -qx "smaps"; then
                          ok "解压后内核二进制含 'smaps'（PROC_PAGE_MONITOR 生效）"
                          KCONF="FOUND"
                          break
                      fi
                  done
              fi

              if [ -n "$KCONF" ] && [ "$KCONF" != "FOUND" ]; then
                  PPM=$(echo "$KCONF" | grep "^CONFIG_PROC_PAGE_MONITOR=" || true)
                  [ "$PPM" = "CONFIG_PROC_PAGE_MONITOR=y" ] && ok "$PPM" || fail "PROC_PAGE_MONITOR: $PPM"

                  for k in CONFIG_CGROUP_DEVICE CONFIG_CGROUP_SCHED CONFIG_MEMCG \
                           CONFIG_BRIDGE CONFIG_PWM_ROCKCHIP CONFIG_SENSORS_PWM_FAN \
                           CONFIG_LEDS_TRIGGER_NETDEV CONFIG_LED_TRIGGER_PHY; do
                      v=$(echo "$KCONF" | grep "^${k}=" || true)
                      [ -n "$v" ] && ok "$v"
                  done
              elif [ "$KCONF" != "FOUND" ]; then
                  warn "内核二进制无法直接验证（IKCONFIG 未编入且 kernel 无明文 smaps）"
                  echo "  → CI 编译日志已打印 'CONFIG_PROC_PAGE_MONITOR=y'，视为已生效"
              fi
          fi

          hdr "4. rootfs 验证"
          P2_START=$(awk -F'\t' '$1==2 {print $3}' "$WORK/parts.txt")
          P2_SIZE=$(awk -F'\t' '$1==2 {print $4}' "$WORK/parts.txt")
          dd if="$FW" of="$WORK/p2.img" bs=512 skip="$P2_START" count="$P2_SIZE" 2>/dev/null
          P2_FS=$(blkid -s TYPE -o value "$WORK/p2.img" 2>/dev/null || echo unknown)
          echo "  p2 文件系统: $P2_FS"

          # OpenWrt squashfs 分区有 padding，截断到 superblock 的 bytes_used
          if [ "$P2_FS" = "squashfs" ]; then
              SQ_BYTES=$(python3 -c "
          import struct
          try:
              with open('$WORK/p2.img','rb') as f:
                  f.seek(40)
                  print(struct.unpack('<Q', f.read(8))[0])
          except Exception:
              print(0)
          " 2>/dev/null)
              if [ -n "$SQ_BYTES" ] && [ "$SQ_BYTES" -gt 1024 ]; then
                  echo "  squashfs 实际大小: $((SQ_BYTES/1024/1024))MB（截断后）"
                  truncate -s "$SQ_BYTES" "$WORK/p2.img"
              fi
          fi

          ROOTFS="$WORK/rootfs"; mkdir -p "$ROOTFS"
          EXTRACTED=0; MOUNTED=0
          if [ "$P2_FS" = "squashfs" ]; then
              if unsquashfs -q -f -d "$ROOTFS" "$WORK/p2.img" >/dev/null 2>&1; then
                  ok "unsquashfs 成功"
                  EXTRACTED=1
              elif unsquashfs -q -f -b 262144 -d "$ROOTFS" "$WORK/p2.img" >/dev/null 2>&1; then
                  ok "unsquashfs 成功（-b 262144）"
                  EXTRACTED=1
              else
                  fail "unsquashfs 失败"
              fi
          elif [ "$P2_FS" = "ext4" ]; then
              sudo mount -t ext4 -o loop,ro "$WORK/p2.img" "$ROOTFS" 2>/dev/null && { ok "ext4 挂载成功"; EXTRACTED=1; MOUNTED=1; } || fail "ext4 挂载失败"
          fi

          if [ "$EXTRACTED" = "1" ]; then
              F="$ROOTFS/etc/uci-defaults/99-custom"
              if [ -f "$F" ]; then
                  ok "/etc/uci-defaults/99-custom 存在"
                  if grep -q "network.docker.device" "$F" && grep -q "docker0" "$F"; then
                      ok "含 docker0 补全逻辑"
                      echo "  ---- 摘录 ----"
                      grep -E "docker0|network.docker" "$F" | sed 's/^/    /'
                  else
                      fail "99-custom 缺 docker0 补全"
                  fi
              else
                  fail "99-custom 不存在"
              fi

              for f in 90-led-setup 90-opt-partition 99-custom-ssh; do
                  [ -f "$ROOTFS/etc/uci-defaults/$f" ] && ok "uci-defaults/$f" || warn "uci-defaults/$f 缺失"
              done
              [ -f "$ROOTFS/etc/docker/daemon.json" ] && ok "/etc/docker/daemon.json" || warn "daemon.json 缺失"
              [ -f "$ROOTFS/sbin/mountpoint" ] && ok "/sbin/mountpoint" || warn "/sbin/mountpoint 缺失"

              [ "$MOUNTED" = "1" ] && sudo umount "$ROOTFS"
          fi

          hdr "5. Manifest 关键包"
          if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
              for pkg in clashoo luci-app-clashoo luci-app-amlogic docker dockerd containerd runc \
                         luci-app-dockerman ttyd openssh-sftp-server parted kmod-r8169; do
                  if grep -qE "^${pkg} " "$MANIFEST"; then
                      v=$(grep -E "^${pkg} " "$MANIFEST" | awk '{print $3}')
                      ok "$pkg ($v)"
                  else
                      fail "$pkg 未在 manifest"
                  fi
              done
          else
              warn "未找到 manifest"
          fi

          hdr "验证汇总"
          echo "  PASS: $PASS"
          echo "  FAIL: $FAIL"
          echo "  WARN: $WARN"
          if [ "$FAIL" -gt 0 ]; then
              echo "❌ 存在 $FAIL 项失败"
              exit 1
          fi
          [ "$WARN" -gt 0 ] && echo "⚠️ 通过，$WARN 项警告" || echo "✅ 全部通过"