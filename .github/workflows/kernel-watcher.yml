name: Kernel Watcher

on:
  schedule:
    # 每 6 小时检查一次（可自行调整 cron 表达式）
    - cron: '0 */6 * * *'
  workflow_dispatch:   # 也支持手动触发检查

jobs:
  check_kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于更新仓库中的版本记录文件
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 确保能获取到 .kernel-version 文件的历史

      - name: Get latest kernel release tag
        id: latest
        run: |
          # 获取 friendlyarm/kernel-rockchip 的最新 release tag
          LATEST=$(curl -s https://api.github.com/repos/friendlyarm/kernel-rockchip/releases/latest | jq -r .tag_name)
          echo "latest_tag=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest kernel tag: $LATEST"

      - name: Read current recorded kernel version
        id: current
        run: |
          if [ -f .kernel-version ]; then
            CURRENT=$(cat .kernel-version)
          else
            CURRENT="none"
          fi
          echo "current_tag=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current recorded version: $CURRENT"

      - name: Trigger main build if new version detected
        if: steps.latest.outputs.latest_tag != steps.current.outputs.current_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "New kernel version detected: ${{ steps.latest.outputs.latest_tag }}"
          echo "Triggering main build workflow..."
          # 触发主构建工作流，传入 version=both, set=both 进行全量编译
          gh workflow run build_r5s.yml -f version=both -f set=both

      - name: Update recorded kernel version
        if: steps.latest.outputs.latest_tag != steps.current.outputs.current_tag
        run: |
          echo "${{ steps.latest.outputs.latest_tag }}" > .kernel-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kernel-version
          git commit -m "Update kernel version to ${{ steps.latest.outputs.latest_tag }}"
          git push