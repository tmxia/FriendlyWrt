name: Build KRNL from PE Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.49'
      source_repo:
        description: 'Source repo'
        required: true
        default: 'ophub/kernel'
        type: choice
        options:
          - ophub/kernel
          - breakingbadboy/OpenWrt
      source_release:
        description: 'Release'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_rk35xx
          - kernel_stable

jobs:
  convert:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl python3 xxd file

    - name: Download and extract kernel
      run: |
        cd /tmp
        URL="https://github.com/${{ inputs.source_repo }}/releases/download/${{ inputs.source_release }}/${{ inputs.kernel_version }}.tar.gz"
        echo "Downloading: $URL"
        wget -q "$URL" -O kernel.tar.gz || { echo "FAILED"; exit 1; }
        tar xzf kernel.tar.gz

        KERNEL_VER="${{ inputs.kernel_version }}"
        LOCAL_DIR="$KERNEL_VER"
        if [ ! -d "$LOCAL_DIR" ]; then
          LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        fi

        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        mkdir -p boot_extract
        tar xzf "$BOOT_TAR" -C boot_extract

        echo "===== boot_extract ====="
        ls -la boot_extract/

    - name: Convert PE to KRNL
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        SYS_MAP=$(find boot_extract -name "System.map-*" | head -1)
        [ -z "$VMLINUZ" ] && { echo "vmlinuz not found"; exit 1; }

        echo "VMLINUZ: $VMLINUZ"
        echo "SYS_MAP: $SYS_MAP"

        echo ""
        echo "===== System.map 关键符号 ====="
        if [ -n "$SYS_MAP" ]; then
          grep -E " (_text|_stext|primary_entry|_data|_edata|__init_begin)$" "$SYS_MAP" | head -20
        fi

        echo ""
        echo "===== 开始转换 ====="
        python3 - "$VMLINUZ" /tmp/kernel.img <<'PYEOF'
        import sys, struct, os

        src, dst = sys.argv[1], sys.argv[2]
        data = open(src, 'rb').read()

        print("Input size: %d bytes" % len(data))
        print("First 16 bytes: %s" % data[:16].hex())

        # ---- 1. 解析 PE 头 ----
        pe_off = struct.unpack_from('<I', data, 0x3C)[0]
        assert data[pe_off:pe_off+4] == b'PE\x00\x00', "Not PE at 0x%x" % pe_off
        print("PE header at 0x%x" % pe_off)

        coff = pe_off + 4
        num_sections = struct.unpack_from('<H', data, coff + 2)[0]
        opt_hdr_size = struct.unpack_from('<H', data, coff + 16)[0]
        sec_start = coff + 20 + opt_hdr_size

        # ---- 2. 收集 sections ----
        secs = {}
        for i in range(num_sections):
            off = sec_start + i * 40
            name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
            raw_size = struct.unpack_from('<I', data, off + 16)[0]
            raw_off = struct.unpack_from('<I', data, off + 20)[0]
            secs[name] = (raw_off, raw_size)
            print("Section %s: off=0x%x size=%d" % (name, raw_off, raw_size))

        if '.text' not in secs:
            print("ERROR: no .text section")
            sys.exit(1)

        text_off, text_size = secs['.text']
        text_data = data[text_off:text_off + text_size]
        print("")
        print(".text size: %d bytes" % len(text_data))
        print(".text first 16: %s" % text_data[:16].hex())

        # .data（可选）
        data_data = b''
        if '.data' in secs:
            d_off, d_size = secs['.data']
            data_data = data[d_off:d_off + d_size]
            print(".data size: %d bytes" % len(data_data))

        # ---- 3. 构造 ARM64 Image ----
        # 布局:
        #   [0x00-0x3F] 64-byte ARM64 Image header
        #   [0x40-...]  .text
        #   [...       ] .data
        #
        # code0 = b +0x40  (从偏移 0 跳到偏移 0x40，即 .text 起始)
        # 编码: opcode=000101, imm26 = 0x40/4 = 0x10
        # = 0x14000010

        code0 = 0x14000010

        payload = text_data
        if data_data:
            # 保持 4K 对齐（可选）
            align = (0x1000 - len(text_data) % 0x1000) % 0x1000
            if align:
                print("Padding .text -> .data with %d zero bytes" % align)
                payload = text_data + b'\x00' * align + data_data
            else:
                payload = text_data + data_data

        image_size = 64 + len(payload)

        header = bytearray(64)
        struct.pack_into('<I', header, 0x00, code0)          # code0: b +0x40
        struct.pack_into('<I', header, 0x04, 0)              # code1
        struct.pack_into('<Q', header, 0x08, 0)              # text_offset = 0
        struct.pack_into('<Q', header, 0x10, image_size)     # image_size
        struct.pack_into('<Q', header, 0x18, 0x0a)           # flags = 0x0a (4K, LE)
        # res2, res3, res4 保持 0
        header[0x38:0x3c] = b'ARM\x64'                       # magic

        image = bytes(header) + payload
        print("")
        print("Image size: %d bytes" % len(image))
        print("Image header: %s" % image[:64].hex())

        # ---- 4. 构造 KRNL ----
        knl = b'KRNL' + struct.pack('<I', len(image)) + image
        print("KRNL size: %d bytes" % len(knl))
        print("KRNL first 16: %s" % knl[:16].hex())

        open(dst, 'wb').write(knl)

        # ---- 5. 验证 ----
        check = open(dst, 'rb').read(128)
        assert check[0:4] == b'KRNL', "KRNL missing"
        magic_idx = check.find(b'ARM\x64')
        print("")
        print("验证:")
        print("  KRNL magic: %s" % check[0:4].decode())
        print("  KRNL size:  %d" % struct.unpack_from('<I', check, 4)[0])
        print("  code0:      0x%08x (b +0x40)" % struct.unpack_from('<I', check, 8)[0])
        print("  text_offset:0x%x" % struct.unpack_from('<Q', check, 16)[0])
        print("  image_size: %d" % struct.unpack_from('<Q', check, 24)[0])
        print("  ARM64 magic@: 0x%x (expected 0x40)" % magic_idx)

        if magic_idx == 0x40:
            print("  ✓✓✓ 转换成功，KRNL 格式完全符合 U-Boot 期望")
        else:
            print("  ✗ ARM64 magic 位置异常")
            sys.exit(1)
        PYEOF

    - name: Verify kernel.img
      run: |
        echo "===== 最终 kernel.img ====="
        ls -la /tmp/kernel.img
        echo ""
        echo "前 128 字节:"
        xxd -l 128 /tmp/kernel.img
        echo ""
        echo "=== 反汇编前几条指令 (可选) ==="
        if command -v aarch64-linux-gnu-objdump >/dev/null 2>&1; then
          # 复制前 32 字节到裸文件并反汇编
          dd if=/tmp/kernel.img of=/tmp/head.bin bs=1 count=32 skip=8 2>/dev/null
          aarch64-linux-gnu-objdump -D -b binary -m aarch64 /tmp/head.bin 2>/dev/null | head -20
        fi

    - name: Upload kernel.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-krnl-${{ inputs.kernel_version }}
        path: /tmp/kernel.img
        retention-days: 7