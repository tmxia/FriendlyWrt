name: Build FriendlyWrt With Custom Kernel

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '24.10'
        type: choice
        options:
          - '24.10'
          - '25.12'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
      model:
        description: 'Target model'
        required: true
        default: 'r5s'
        type: choice
        options:
          - r5s
          - r5c
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.y'
        type: choice
        options:
          - '6.18.y'
          - '6.12.y'
          - '6.6.y'
          - '6.1.y'
          - 'auto'
      official_release_tag:
        description: '官方固件 Release tag（用于结构对比）'
        required: true
        default: 'FriendlyWrt-2026-09-04'
        type: string
      official_asset:
        description: '官方固件 asset 名（.img.gz）'
        required: true
        default: 'R5S-R5C-Series-FriendlyWrt-24.10-docker.img.gz'
        type: string
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      verified: ${{ steps.verify.outputs.passed }}
      img_name: ${{ env.img_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl git rsync time file unzip bc bzip2 xxd \
          python3 dosfstools e2fsprogs parted \
          android-sdk-libsparse-utils u-boot-tools \
          gzip xz-utils zstd lz4
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git clone https://github.com/friendlyarm/repo /tmp/repo
        sudo -E cp /tmp/repo/repo /usr/bin/
        mkdir -p $GITHUB_WORKSPACE/artifact
        chmod +x $GITHUB_WORKSPACE/scripts/verify-against-official.sh || true
        echo "cores: $(nproc)"

    - name: Fetch sd-fuse scripts
      run: |
        cd /tmp
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests \
          -b master-v${{ inputs.version }} -m rk3568.xml \
          --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        ls -la /tmp/scripts/sd-fuse/

    - name: Download official images tgz
      id: images
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SUFFIX=""
        [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
        PATTERN="images-R5S-R5C-Series-FriendlyWrt-${{ inputs.version }}${SUFFIX}.tgz"

        TAGS=$(gh release list --limit 50 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
        FOUND=""
        for TAG in $TAGS; do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
            FOUND="$TAG"; break
          fi
        done
        [ -z "$FOUND" ] && { echo "ERROR: not found $PATTERN"; exit 1; }
        echo "Using release: $FOUND"

        mkdir -p /tmp/inputs && cd /tmp/inputs
        gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
        echo "images_tgz=/tmp/inputs/$PATTERN" >> $GITHUB_OUTPUT

    - name: Download official reference image
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REF_TAG: ${{ inputs.official_release_tag }}
        REF_ASSET: ${{ inputs.official_asset }}
      run: |
        mkdir -p /tmp/official
        cd /tmp/official
        if gh release download "$REF_TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern "$REF_ASSET" --dir .; then
          ls -la
          gunzip -k *.img.gz 2>/dev/null || true
          IMG=$(find . -maxdepth 1 -name "*.img" | head -1)
          [ -n "$IMG" ] && echo "官方参考镜像: $IMG ($(stat -c%s "$IMG") bytes)"
        else
          echo "⚠ 官方参考固件下载失败，跳过对比验证"
          touch /tmp/official/.no_reference
        fi

    - name: Scan and select kernel
      id: kernel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        case "$KERNEL_VERSION" in
          6.18*|6.18.y) PREFIX="6.18" ;;
          6.12*|6.12.y) PREFIX="6.12" ;;
          6.6*|6.6.y)   PREFIX="6.6" ;;
          6.1*|6.1.y)   PREFIX="6.1" ;;
          auto|"")      PREFIX="" ;;
          *)            PREFIX="$KERNEL_VERSION" ;;
        esac
        echo "Version prefix: ${PREFIX:-auto}"

        declare -A VER_TO_SOURCE
        SCAN_LIST=(
          "ophub/kernel:kernel_flippy"
          "ophub/kernel:kernel_rk35xx"
          "breakingbadboy/OpenWrt:kernel_rk35xx"
          "breakingbadboy/OpenWrt:kernel_stable"
        )

        for target in "${SCAN_LIST[@]}"; do
          REPO="${target%%:*}"; RELEASE="${target##*:}"
          echo "Scanning $REPO / $RELEASE ..."
          ASSETS=$(gh release view "$RELEASE" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          [ -z "$ASSETS" ] && { echo "  (no assets)"; continue; }

          if [ -n "$PREFIX" ]; then
            VERS=$(echo "$ASSETS" | grep -E "^${PREFIX}\.[0-9]+\.tar\.gz$" | sed 's/\.tar\.gz//' | sort -V || echo "")
          else
            VERS=$(echo "$ASSETS" | grep -E '^6\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//' | sort -V || echo "")
          fi
          [ -z "$VERS" ] && { echo "  (no match)"; continue; }

          echo "  matched:"
          echo "$VERS" | sed 's/^/    /'
          for v in $VERS; do
            [ -z "${VER_TO_SOURCE[$v]:-}" ] && VER_TO_SOURCE["$v"]="$REPO:$RELEASE"
          done
        done

        if [ ${#VER_TO_SOURCE[@]} -eq 0 ]; then
          echo "ERROR: no matching kernel for $KERNEL_VERSION"
          exit 1
        fi

        SELECTED_VER=$(printf '%s\n' "${!VER_TO_SOURCE[@]}" | sort -V | tail -1)
        SELECTED_SOURCE="${VER_TO_SOURCE[$SELECTED_VER]}"
        SELECTED_REPO="${SELECTED_SOURCE%%:*}"
        SELECTED_RELEASE="${SELECTED_SOURCE##*:}"

        echo ""
        echo "Selected: $SELECTED_VER from $SELECTED_REPO/$SELECTED_RELEASE"
        echo "version=$SELECTED_VER" >> $GITHUB_OUTPUT
        echo "repo=$SELECTED_REPO" >> $GITHUB_OUTPUT
        echo "release=$SELECTED_RELEASE" >> $GITHUB_OUTPUT

    - name: Download kernel
      run: |
        cd /tmp
        URL="https://github.com/${{ steps.kernel.outputs.repo }}/releases/download/${{ steps.kernel.outputs.release }}/${{ steps.kernel.outputs.version }}.tar.gz"
        echo "URL: $URL"
        wget -q --timeout=120 "$URL" -O kernel.tar.gz || curl -L -f --max-time 300 "$URL" -o kernel.tar.gz
        tar xzf kernel.tar.gz
        KERNEL_VER="${{ steps.kernel.outputs.version }}"
        LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        [ -z "$LOCAL_DIR" ] && LOCAL_DIR="$KERNEL_VER"
        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)
        mkdir -p boot_extract dtb_extract
        tar xzf "$BOOT_TAR" -C boot_extract
        tar xzf "$DTB_TAR" -C dtb_extract
        ls -la boot_extract/
        ls dtb_extract/ | grep -E "rk3568-nanopi-r5[sc]" || echo "no r5s/r5c dtb"

    # ============================================================
    # 关键修复：PE → KRNL 转换
    # 方案：优先直接透传 PE 的 .text 段（内含完整 ARM64 Image header）
    #       fallback：按 PE 的 AddressOfEntryPoint 精确构造 code1
    # ============================================================
    - name: Convert kernel to KRNL (official-aligned, entry-accurate)
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        [ -z "$VMLINUZ" ] && { echo "vmlinuz not found"; exit 1; }
        echo "输入: $VMLINUZ ($(stat -c%s "$VMLINUZ") bytes)"
        xxd -l 64 "$VMLINUZ"

        python3 - "$VMLINUZ" /tmp/kernel.img <<'PYEOF'
        import sys, struct

        src, dst = sys.argv[1], sys.argv[2]
        raw = open(src, 'rb').read()
        ARM64_MAGIC = b'ARM\x64'

        print("输入大小: %d" % len(raw))

        if raw[:4] == b'KRNL':
            print("已是 KRNL，直接使用")
            open(dst, 'wb').write(raw)
            sys.exit(0)

        # 非 PE：直接当裸机 Image
        if raw[:2] != b'MZ':
            print("非 PE 格式")
            idx = raw.find(ARM64_MAGIC)
            if idx == 0x38 and raw[0:4] == b'\x1f\x20\x03\xd5':
                print("标准 ARM64 Image")
                knl = b'KRNL' + struct.pack('<I', len(raw)) + raw
                open(dst, 'wb').write(knl)
                sys.exit(0)
            else:
                print("未知格式"); sys.exit(1)

        # ============ PE 解析 ============
        pe_off = struct.unpack_from('<I', raw, 0x3C)[0]
        assert raw[pe_off:pe_off+4] == b'PE\x00\x00', "PE 签名错误"
        print("PE header @ 0x%x" % pe_off)

        coff = pe_off + 4
        nsec = struct.unpack_from('<H', raw, coff + 2)[0]
        opt_size = struct.unpack_from('<H', raw, coff + 16)[0]
        opt_off = coff + 20
        sec_base = opt_off + opt_size

        entry_rva = struct.unpack_from('<I', raw, opt_off + 0x10)[0]
        image_base = struct.unpack_from('<Q', raw, opt_off + 0x18)[0]
        print("ImageBase=0x%x  EntryRVA=0x%x  Sections=%d  OptSize=%d"
              % (image_base, entry_rva, nsec, opt_size))

        sections = []
        for i in range(nsec):
            o = sec_base + i * 40
            name = raw[o:o+8].rstrip(b'\x00').decode('ascii', 'ignore')
            vsize = struct.unpack_from('<I', raw, o + 8)[0]
            vaddr = struct.unpack_from('<I', raw, o + 12)[0]
            rsize = struct.unpack_from('<I', raw, o + 16)[0]
            roff  = struct.unpack_from('<I', raw, o + 20)[0]
            sections.append((name, vaddr, vsize, roff, rsize))
            print("  %-8s  RVA=0x%08x  VSize=0x%08x  FileOff=0x%08x  RawSize=0x%08x"
                  % (name, vaddr, vsize, roff, rsize))

        # ============ 取 .text ============
        text = None
        text_vaddr = text_fileoff = None
        for name, vaddr, vsize, roff, rsize in sections:
            if name == '.text':
                text = raw[roff:roff + rsize]
                text_vaddr = vaddr
                text_fileoff = roff
                break

        if text is None:
            print("找不到 .text 段"); sys.exit(1)

        print("  .text 提取: %d bytes" % len(text))

        # ============ 判断 .text 是否含完整 Image header ============
        has_image_header = (
            len(text) >= 0x40
            and text[0x38:0x3c] == ARM64_MAGIC
            and text[0:4] == b'\x1f\x20\x03\xd5'
        )

        if has_image_header:
            code0_t = struct.unpack_from('<I', text, 0x00)[0]
            code1_t = struct.unpack_from('<I', text, 0x04)[0]
            isize_t = struct.unpack_from('<Q', text, 0x10)[0]
            print("  .text 内含完整 ARM64 Image:")
            print("    code0 = 0x%08x (NOP)" % code0_t)
            print("    code1 = 0x%08x" % code1_t)
            print("    image_size = %d" % isize_t)

            # 检查 code1 是否合法 B 指令
            if (code1_t & 0xFC000000) != 0x14000000:
                print("  ⚠ code1 不是 B 指令，回退到构造模式")
                has_image_header = False

        if has_image_header:
            # ============ 方案 1：直接透传 .text ============
            print("  >>> 方案 1：直接拼接 KRNL + size + .text")
            knl_payload = text
        else:
            # ============ 方案 2：构造 header + 计算 code1 ============
            print("  >>> 方案 2：按 PE EntryPoint 构造 header")

            # 定位 entry 在哪个段
            entry_fileoff = None
            for name, vaddr, vsize, roff, rsize in sections:
                if vaddr <= entry_rva < vaddr + vsize:
                    entry_fileoff = roff + (entry_rva - vaddr)
                    print("  entry 位于 %s 段，文件偏移 0x%x" % (name, entry_fileoff))
                    break

            if entry_fileoff is None:
                print("  entry 不在任何段内，使用 .text 起点")
                entry_fileoff = text_fileoff

            entry_in_text = entry_fileoff - text_fileoff
            print("  entry 在 .text 内偏移: 0x%x" % entry_in_text)

            # KRNL 布局：
            #   0x00-0x04 KRNL magic
            #   0x04-0x08 size
            #   0x08-0x48 Image header (0x40 字节)
            #   0x48+   .text
            header_len = 0x40
            text_krnl_start = 0x08 + header_len       # = 0x48
            entry_in_krnl = text_krnl_start + entry_in_text
            code1_pos = 0x0c
            rel = entry_in_krnl - code1_pos
            assert rel % 4 == 0, "code1 相对偏移未对齐"
            imm26 = (rel // 4) & 0x03FFFFFF
            code1 = 0x14000000 | imm26

            print("  text_krnl_start=0x%x  entry_in_krnl=0x%x" % (text_krnl_start, entry_in_krnl))
            print("  code1 相对偏移=0x%x  code1=0x%08x" % (rel, code1))

            hdr = bytearray(header_len)
            struct.pack_into('<I', hdr, 0x00, 0xd503201f)   # code0=NOP
            struct.pack_into('<I', hdr, 0x04, code1)        # code1=B entry
            struct.pack_into('<Q', hdr, 0x08, 0)            # text_offset
            struct.pack_into('<Q', hdr, 0x10, len(text))    # image_size
            struct.pack_into('<Q', hdr, 0x18, 0x0a)         # flags
            hdr[0x38:0x3c] = ARM64_MAGIC
            knl_payload = bytes(hdr) + text

        # ============ 最终 KRNL ============
        knl = b'KRNL' + struct.pack('<I', len(knl_payload)) + knl_payload
        open(dst, 'wb').write(knl)

        # 校验
        out = open(dst, 'rb').read(0x80)
        assert out[0:4] == b'KRNL', "KRNL magic 缺失"
        assert out[0x08:0x0c] == b'\x1f\x20\x03\xd5', "code0 必须是 NOP"
        assert out[0x40:0x44] == ARM64_MAGIC, "magic 必须在 0x40"

        print("✓ KRNL 结构验证通过")
        print("  KRNL size @ 0x04 = %d" % struct.unpack_from('<I', out, 4)[0])
        print("  code0 @ 0x08     = %s (NOP)" % out[0x08:0x0c].hex())
        print("  code1 @ 0x0c     = %s" % out[0x0c:0x10].hex())
        print("  magic @ 0x40     = %s" % out[0x40:0x44])
        print("SUCCESS")
        PYEOF
        echo "kernel.img: $(stat -c%s /tmp/kernel.img) bytes"
        xxd -l 96 /tmp/kernel.img

    - name: Prepare sd-fuse directory (with kernel partition resize)
      run: |
        cd /tmp
        mkdir -p /tmp/work
        tar xzf "${{ steps.images.outputs.images_tgz }}" -C /tmp/work
        BASE_DIR=$(find /tmp/work -maxdepth 1 -type d -name "friendlywrt*" | head -1)
        DIST_NAME="friendlywrt$(echo ${{ inputs.version }} | awk -F . '{print $1}')$([ "${{ inputs.set }}" = "docker" ] && echo "-docker")"
        TARGET="/tmp/scripts/sd-fuse/$DIST_NAME"
        rm -rf "$TARGET"
        cp -a "$BASE_DIR" "$TARGET"

        cp /tmp/kernel.img "$TARGET/kernel.img"
        NEW_KERNEL_SIZE=$(stat -c%s "$TARGET/kernel.img")
        echo "新 kernel.img 大小: $NEW_KERNEL_SIZE bytes"

        PARAM_FILE="$TARGET/parameter.txt"
        [ -f "$PARAM_FILE" ] || { echo "缺少 parameter.txt"; exit 1; }
        echo "===== Before ====="; cat "$PARAM_FILE"
        python3 - "$PARAM_FILE" "$NEW_KERNEL_SIZE" <<'PARAM_PYEOF'
        import re, sys
        param_file, kernel_size = sys.argv[1], int(sys.argv[2])
        with open(param_file) as f:
            content = f.read()

        kernel_re = re.compile(r'0x([0-9a-fA-F]+)@(0x[0-9a-fA-F]+)\(kernel\)', re.IGNORECASE)
        m = kernel_re.search(content)
        if not m:
            print("[param] 未找到 kernel 分区"); sys.exit(0)

        old_size   = int(m.group(1), 16)
        kernel_off = int(m.group(2), 16)
        kernel_end = kernel_off + old_size

        need_sectors = (kernel_size + 511) // 512
        rounded = ((need_sectors + 0x3FFF) // 0x4000) * 0x4000
        new_size = max(rounded, old_size)

        print(f"[param] old={old_size*512/1024/1024:.1f} MiB  need={need_sectors*512/1024/1024:.1f} MiB  new={new_size*512/1024/1024:.1f} MiB")

        if new_size == old_size:
            print("[param] 无需扩容"); sys.exit(0)

        delta = new_size - old_size
        new_kernel = f'0x{new_size:08x}@{m.group(2)}(kernel)'
        content = content[:m.start()] + new_kernel + content[m.end():]

        def shift(match):
            off = int(match.group(1), 16)
            if off >= kernel_end:
                return f'@0x{off + delta:08x}'
            return match.group(0)
        content = re.sub(r'@0x([0-9a-fA-F]+)', shift, content)

        with open(param_file, 'w') as f:
            f.write(content)
        print(f"[param] 已更新 (delta={delta} sectors = {delta*512/1024/1024:.1f} MiB)")
        PARAM_PYEOF
        echo "===== After ====="; cat "$PARAM_FILE"

        mkdir -p "$TARGET/dtb/rockchip"
        DTB_R5S=$(find /tmp/dtb_extract -name "rk3568-nanopi-r5s.dtb" | head -1)
        DTB_R5C=$(find /tmp/dtb_extract -name "rk3568-nanopi-r5c.dtb" | head -1)
        [ -n "$DTB_R5S" ] && cp "$DTB_R5S" "$TARGET/dtb/rockchip/rk3568-nanopi-r5s.dtb"
        [ -n "$DTB_R5C" ] && cp "$DTB_R5C" "$TARGET/dtb/rockchip/rk3568-nanopi-r5c.dtb"
        ls -la "$TARGET/dtb/rockchip/"

        UINITRD=$(find /tmp/boot_extract -name "uInitrd-*" | head -1)
        [ -n "$UINITRD" ] && cp "$UINITRD" "$TARGET/uInitrd"

    - name: Build final image
      run: |
        cd /tmp/scripts/sd-fuse
        DIST_NAME="friendlywrt$(echo ${{ inputs.version }} | awk -F . '{print $1}')$([ "${{ inputs.set }}" = "docker" ] && echo "-docker")"
        chmod +x mk-sd-image.sh
        rm -f out/*.img
        set +e
        yes | ./mk-sd-image.sh "$DIST_NAME" > /tmp/mk-sd.log 2>&1
        MK_EXIT=$?
        set -e
        echo "mk-sd-image.sh exit=$MK_EXIT"
        tail -40 /tmp/mk-sd.log

        FOUND_IMG=$(find out -maxdepth 1 -name "*.img" -print -quit)
        [ -z "$FOUND_IMG" ] && { echo "No image"; exit 1; }

        KV_SHORT="${{ inputs.kernel_version }}"
        [ "$KV_SHORT" = "auto" ] || KV_SHORT="${KV_SHORT%.y}"
        IMG_FILE="R5S-R5C-Series-FriendlyWrt-kv${KV_SHORT}-${{ inputs.version }}$([ "${{ inputs.set }}" = "docker" ] && echo "-docker").img"
        mv "$FOUND_IMG" "$GITHUB_WORKSPACE/artifact/$IMG_FILE"
        echo "img_name=$IMG_FILE" >> $GITHUB_ENV

    - name: Verify against official firmware
      id: verify
      run: |
        set +e
        bash $GITHUB_WORKSPACE/scripts/verify-against-official.sh \
          "$GITHUB_WORKSPACE/artifact/${{ env.img_name }}" \
          "/tmp/official" \
          "${{ steps.kernel.outputs.version }}"
        RC=$?
        set -e

        if [ $RC -eq 0 ]; then
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✅ 验证通过，允许上传发布"
        else
          echo "passed=false" >> $GITHUB_OUTPUT
          echo "❌ 验证失败（exit=$RC），禁止上传"
          exit $RC
        fi

    - name: Compress image to gz
      run: |
        cd $GITHUB_WORKSPACE/artifact
        gzip -f *.img
        ls -la
        for f in *.img.gz; do
          SIZE=$(stat -c%s "$f")
          echo "$f -> $SIZE bytes"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "ERROR: $f 超过 GitHub Release 2GiB 限制"
            exit 1
          fi
        done

    - name: Upload artifact (only when verified)
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.img_name }}
        path: ./artifact/${{ env.img_name }}.gz
        retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      needs.build.outputs.verified == 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download verified artifact
      uses: actions/download-artifact@v4
      with:
        name: firmware-${{ needs.build.outputs.img_name }}
        path: ./artifact

    - name: List artifact
      run: ls -la ./artifact/

    - name: Generate unique release tag
      id: release_tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        KV="${{ github.event.inputs.kernel_version }}"
        KV_SHORT="${KV%.y}"
        [ "$KV" = "auto" ] && KV_SHORT="auto"
        BASE_TAG="FriendlyWrt-kv${KV_SHORT}-$(date +%Y-%m-%d)"
        FORCE_BASE=false
        [ "${{ github.event.inputs.replace_existing }}" = "true" ] && FORCE_BASE=true

        if [ "$FORCE_BASE" = "true" ]; then
          EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' \
            | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
          for tag in $EXISTING_TAGS; do
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
            git push origin --delete "refs/tags/$tag" || true
          done
          TAG="$BASE_TAG"
        else
          EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' \
            | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
          if [ -z "$EXISTING_TAGS" ]; then
            TAG="$BASE_TAG"
          else
            MAX_NUM=0
            for t in $EXISTING_TAGS; do
              if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                NUM=${BASH_REMATCH[1]}
                [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
              fi
            done
            TAG="${BASE_TAG}-$((MAX_NUM+1))"
          fi
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_tag.outputs.tag }}
        name: "R5S/R5C FriendlyWrt ${{ inputs.version }} + Flippy KV ${{ inputs.kernel_version }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifact/*.img.gz