name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
      kernel_track:
        description: 'Kernel track'
        required: false
        default: 'linux-stable'
        type: choice
        options:
          - 'openwrt'
          - 'linux-stable'
      kernel_version:
        description: 'Pinned version: openwrt commit SHA, or linux-stable 6.12.x'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write
  packages: write

concurrency:
  group: build-r5s-${{ inputs.kernel_track || 'default' }}
  cancel-in-progress: false

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_VER: '25.12'
  MODEL_NAME: 'R5S'
  OPENWRT_BRANCH: 'openwrt-25.12'
  OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
  CONFIG_FILE: 'scripts/r5s.config'
  DIY_SH: 'scripts/r5s_customize.sh'
  PATCH_BRANCH: 'patches'

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    concurrency:
      group: r5s-prepare-release
      cancel-in-progress: false
    if: |
      github.event.repository.owner.id == github.event.sender.id ||
      github.triggering_actor == 'github-actions[bot]'
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-$(date +%Y.%m.%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)

          if [ "$FORCE_BASE" = "true" ]; then
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: true

  build:
    name: Build r5s
    needs: prepare_release
    runs-on: ubuntu-latest
    env:
      KERNEL_TRACK: ${{ inputs.kernel_track || 'linux-stable' }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile

          sudo systemctl stop docker || true
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker || sudo service docker start
          sleep 3
          docker info | grep "Docker Root Dir" || true

          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig zstd \
            device-tree-compiler u-boot-tools e2fsprogs parted dosfstools mtools \
            android-sdk-libsparse-utils btrfs-progs

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          free -h
          df -hT

      - name: Clone OpenWrt
        working-directory: /workdir
        run: |
          git clone -b ${{ env.OPENWRT_BRANCH }} --single-branch \
            ${{ env.OPENWRT_REPO }} openwrt 2>&1 | tail -3
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Pin OpenWrt commit
        if: env.KERNEL_TRACK == 'openwrt' && env.KERNEL_VERSION != ''
        run: |
          cd /workdir/openwrt
          git fetch origin "$KERNEL_VERSION" 2>/dev/null || git fetch origin
          if git checkout "$KERNEL_VERSION" 2>/dev/null; then
            echo "Pinned to $KERNEL_VERSION"
            git log -1 --format='%H %s'
          else
            echo "::warning::Cannot checkout $KERNEL_VERSION, using branch HEAD"
          fi

      - name: Switch to linux-stable kernel
        if: env.KERNEL_TRACK == 'linux-stable'
        run: |
          cd /workdir/openwrt

          if [ -n "$KERNEL_VERSION" ]; then
            TARGET="${KERNEL_VERSION#6.12.}"
          else
            TARGET=$(wget -qO- https://cdn.kernel.org/pub/linux/kernel/v6.x/ \
                     | grep -oE 'linux-6\.12\.[0-9]+\.tar\.xz' \
                     | sort -uV | tail -1 \
                     | grep -oE '6\.12\.[0-9]+' | cut -d. -f3)
          fi
          echo "$TARGET" > /workdir/target_version.txt
          echo "Target: 6.12.$TARGET"

          CUR=$(grep -h '^LINUX_VERSION-6\.12 = ' include/kernel-version.mk | sed -E 's/.*\.([0-9]+).*/\1/')
          echo "Builtin: 6.12.$CUR"

          if [ "$CUR" = "$TARGET" ]; then
            echo "Already up-to-date, skip version bump"
            exit 0
          fi

          HASH=$(wget -qO- https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc \
                 | grep "linux-6.12.$TARGET.tar.xz" | awk '{print $1}')
          [ ${#HASH} -eq 64 ] || { echo "cannot fetch hash"; exit 1; }

          MAP=$(grep -rln '^LINUX_VERSION-6\.12' include/ target/linux/ 2>/dev/null || true)
          for FILE in $MAP; do
            echo "Patching $FILE"
            sed -i "s|^LINUX_VERSION-6.12 = .*|LINUX_VERSION-6.12 = .$TARGET|" "$FILE"
            sed -i "s|^LINUX_KERNEL_HASH-6\.12\..*|LINUX_KERNEL_HASH-6.12.$TARGET = $HASH|" "$FILE"
          done

      - name: Restore adapted patches from patch branch
        id: restore_patches
        if: env.KERNEL_TRACK == 'linux-stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "restored=false" >> "$GITHUB_OUTPUT"

          if [ ! -f /workdir/target_version.txt ]; then
            echo "no target_version.txt, skipping"
            exit 0
          fi
          TARGET=$(cat /workdir/target_version.txt)
          VERSION_DIR="6.12.$TARGET"

          cd /workdir

          set +e
          git clone --branch "$PATCH_BRANCH" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            patches-repo > /tmp/clone_patches.log 2>&1
          CLONE_RC=$?
          set -e

          if [ "$CLONE_RC" -ne 0 ]; then
            echo "patch branch '$PATCH_BRANCH' not found (rc=$CLONE_RC), will create on publish"
            tail -3 /tmp/clone_patches.log
            rm -rf patches-repo
            mkdir -p patches-repo
            cd patches-repo
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git checkout -q -b "$PATCH_BRANCH"
            exit 0
          fi

          echo "patch branch cloned"

          if [ ! -f "/workdir/patches-repo/$VERSION_DIR/READY" ]; then
            echo "$VERSION_DIR not found in patch branch, will adapt"
            exit 0
          fi

          echo "found adapted patches for $VERSION_DIR"
          cd /workdir/openwrt
          for DIR in backport-6.12 pending-6.12 hack-6.12; do
            SRC="/workdir/patches-repo/$VERSION_DIR/generic-$DIR"
            DST="target/linux/generic/$DIR"
            if [ -d "$SRC" ]; then
              rm -rf "$DST"
              mkdir -p "$DST"
              cp -r "$SRC"/. "$DST"/
              echo "restored $DIR: $(ls $DST | wc -l) files"
            fi
          done
          SRC="/workdir/patches-repo/$VERSION_DIR/rockchip-patches-6.12"
          DST="target/linux/rockchip/patches-6.12"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"
            mkdir -p "$DST"
            cp -r "$SRC"/. "$DST"/
            echo "restored rockchip-patches-6.12: $(ls $DST | wc -l) files"
          fi

          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Adapt kernel patches via 3-way merge
        if: |
          env.KERNEL_TRACK == 'linux-stable' &&
          steps.restore_patches.outputs.restored != 'true'
        run: |
          cd /workdir/openwrt

          TARGET=$(cat /workdir/target_version.txt)
          LINUX_FULL="6.12.$TARGET"
          echo "=== Adapt patches for linux-$LINUX_FULL ==="

          cd /tmp
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$LINUX_FULL.tar.xz" -O linux-src.tar.xz
          tar -xf linux-src.tar.xz
          cd "linux-$LINUX_FULL"

          git init -q
          git config user.email "ci@local"
          git config user.name "ci"
          git add -A
          git commit -q -m "base $LINUX_FULL" || true

          PATCH_DIRS="target/linux/generic/backport-6.12 target/linux/generic/pending-6.12 target/linux/generic/hack-6.12 target/linux/rockchip/patches-6.12"

          REMOVED=0
          DISABLED=0
          FIXED=0
          KEPT=0
          : > /workdir/patch_report.txt
          mkdir -p /workdir/disabled-patches

          for DIR in $PATCH_DIRS; do
            FULL_DIR="/workdir/openwrt/$DIR"
            [ -d "$FULL_DIR" ] || continue
            for PATCH in "$FULL_DIR"/*.patch; do
              [ -f "$PATCH" ] || continue
              NAME="$(basename "$PATCH")"
              REL="$DIR/$NAME"

              if git apply --check "$PATCH" 2>/dev/null; then
                git apply "$PATCH" 2>/dev/null
                git add -A
                git commit -q -m "apply $REL" || true
                echo "[OK]      $REL" >> /workdir/patch_report.txt
                KEPT=$((KEPT+1))
                continue
              fi

              if git apply -R --check "$PATCH" 2>/dev/null; then
                rm -f "$PATCH"
                echo "[REMOVE]  $REL (already upstream)" >> /workdir/patch_report.txt
                REMOVED=$((REMOVED+1))
                continue
              fi

              if git apply --3way "$PATCH" 2>/dev/null; then
                git add -A
                git commit -q -m "3way $REL" || true
                git diff --no-color "HEAD~1" HEAD -- > "$PATCH.new" 2>/dev/null || true
                if [ -s "$PATCH.new" ]; then
                  mv "$PATCH.new" "$PATCH"
                  echo "[3WAY]    $REL" >> /workdir/patch_report.txt
                  FIXED=$((FIXED+1))
                else
                  rm -f "$PATCH.new"
                  echo "[OK-3WAY] $REL" >> /workdir/patch_report.txt
                  FIXED=$((FIXED+1))
                fi
                continue
              fi

              BASE_COMMIT=$(git rev-parse HEAD)

              set +e
              patch -p1 --forward --merge --no-backup-if-mismatch < "$PATCH" > /tmp/patch_merge.log 2>&1
              PM_RC=$?
              set -e

              if ! git diff --quiet; then
                git diff > "$PATCH.new"
                if [ -s "$PATCH.new" ]; then
                  mv "$PATCH.new" "$PATCH"
                  echo "[MERGE]   $REL (partial, rc=$PM_RC)" >> /workdir/patch_report.txt
                  FIXED=$((FIXED+1))
                else
                  rm -f "$PATCH.new"
                  echo "[NOOP]    $REL (rc=$PM_RC)" >> /workdir/patch_report.txt
                  KEPT=$((KEPT+1))
                fi
                git add -A
                git commit -q -m "merge $REL" || true
                find . -name '*.rej' -delete 2>/dev/null || true
                find . -name '*.orig' -delete 2>/dev/null || true
                continue
              fi

              git reset --hard "$BASE_COMMIT" > /dev/null 2>&1 || true
              git clean -fdx > /dev/null 2>&1 || true

              mv "$PATCH" "/workdir/disabled-patches/$NAME"
              echo "[DISABLE] $REL" >> /workdir/patch_report.txt
              DISABLED=$((DISABLED+1))
            done
          done

          echo "===== Patch adaptation summary ====="
          echo "kept=$KEPT removed=$REMOVED 3way=$FIXED disabled=$DISABLED"
          cat /workdir/patch_report.txt

      - name: Publish adapted patches to patch branch
        if: |
          env.KERNEL_TRACK == 'linux-stable' &&
          steps.restore_patches.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET=$(cat /workdir/target_version.txt)
          VERSION_DIR="6.12.$TARGET"

          cd /workdir/patches-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          set +e
          git fetch origin "$PATCH_BRANCH" > /dev/null 2>&1
          FETCH_RC=$?
          set -e

          if [ "$FETCH_RC" -eq 0 ]; then
            git checkout "$PATCH_BRANCH" 2>/dev/null || git checkout -b "$PATCH_BRANCH" "origin/$PATCH_BRANCH"
            git reset --hard "origin/$PATCH_BRANCH" || true
          else
            echo "remote $PATCH_BRANCH not found, using local orphan"
            git checkout "$PATCH_BRANCH" 2>/dev/null || git checkout -b "$PATCH_BRANCH"
          fi

          mkdir -p "$VERSION_DIR"
          for DIR in backport-6.12 pending-6.12 hack-6.12; do
            SRC="/workdir/openwrt/target/linux/generic/$DIR"
            DST="$VERSION_DIR/generic-$DIR"
            if [ -d "$SRC" ]; then
              rm -rf "$DST"
              mkdir -p "$DST"
              find "$SRC" -maxdepth 1 -name '*.patch' -exec cp {} "$DST"/ \;
            fi
          done
          SRC="/workdir/openwrt/target/linux/rockchip/patches-6.12"
          DST="$VERSION_DIR/rockchip-patches-6.12"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"
            mkdir -p "$DST"
            find "$SRC" -maxdepth 1 -name '*.patch' -exec cp {} "$DST"/ \;
          fi

          if [ -d /workdir/disabled-patches ] && [ "$(ls -A /workdir/disabled-patches 2>/dev/null)" ]; then
            mkdir -p "$VERSION_DIR/disabled"
            cp /workdir/disabled-patches/* "$VERSION_DIR/disabled/" 2>/dev/null || true
          fi

          cp /workdir/patch_report.txt "$VERSION_DIR/patch-report.txt" 2>/dev/null || true
          echo "adapted at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$VERSION_DIR/READY"

          git add "$VERSION_DIR"
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -q -m "patches: adapt for 6.12.$TARGET"

          for attempt in 1 2 3; do
            echo "== push attempt $attempt =="
            if git push origin "HEAD:$PATCH_BRANCH"; then
              echo "pushed to $PATCH_BRANCH"
              exit 0
            fi
            echo "push failed, retrying"
            sleep 3
          done
          echo "::warning::failed to push patches after 3 attempts"
          exit 0

      - name: Prepare feeds
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre
          ./scripts/feeds update -a 2>&1 | tail -30

      - name: Apply customizations
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} post
          ./scripts/feeds install -a 2>&1 | tail -40

      - name: Configure build
        run: |
          cd /workdir/openwrt
          cp $GITHUB_WORKSPACE/${{ env.CONFIG_FILE }} .config
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} config
          make defconfig

          for pkg in iptables-zz-legacy ip6tables-zz-legacy iptables-legacy; do
            sed -i "s/^CONFIG_PACKAGE_${pkg}=[ym]/# CONFIG_PACKAGE_${pkg} is not set/" .config
            grep -q "^# CONFIG_PACKAGE_${pkg} is not set" .config || \
              echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done
          make defconfig

      - name: Restore cache
        env:
          OPENWRT_BRANCH: ${{ env.KERNEL_TRACK == 'linux-stable' && 'openwrt-25.12-linux-stable' || 'openwrt-25.12' }}
        run: |
          cd /workdir
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_restore

      - name: Compile base
        id: compile_base
        run: |
          cd /workdir/openwrt
          touch /workdir/base_compilation_marker

          set +e
          make tools/download -j1 > /tmp/tools_dl.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "=== tools/download failed ==="
            tail -150 /tmp/tools_dl.log
            exit 1
          fi

          set +e
          make tools/compile -j$(nproc) > /tmp/tools_build.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "=== tools/compile failed ==="
            make tools/compile -j1 V=s > /tmp/tools_verbose.log 2>&1 || true
            grep -n -A 30 -B 10 -iE 'error|fail' /tmp/tools_verbose.log | tail -200
            exit 1
          fi

          set +e
          make toolchain/download -j1 > /tmp/tc_dl.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "=== toolchain/download failed ==="
            tail -150 /tmp/tc_dl.log
            exit 1
          fi

          set +e
          make toolchain/compile -j$(nproc) > /tmp/tc_build.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "=== toolchain/compile failed, retry V=s ==="
            make toolchain/compile -j1 V=s > /tmp/tc_verbose.log 2>&1 || true
            grep -n -A 30 -B 10 -iE 'error|fail' /tmp/tc_verbose.log | tail -300
            exit 1
          fi

      - name: Checkpoint base cache
        if: steps.compile_base.outcome == 'success'
        env:
          OPENWRT_BRANCH: ${{ env.KERNEL_TRACK == 'linux-stable' && 'openwrt-25.12-linux-stable' || 'openwrt-25.12' }}
        run: |
          cd /workdir/openwrt

          IGNORE_PATTERN="staging_dir/host/stamp/\.tools_compile_|staging_dir/target-[^/]+/stamp/\.target_prereq$"

          CHANGED=$(find build_dir staging_dir -type f -newer /workdir/base_compilation_marker -path "*/stamp/*" 2>/dev/null | \
                    grep -E -v "$IGNORE_PATTERN" | wc -l)

          if [ "$CHANGED" -eq 0 ]; then
            echo "base cache up-to-date"
            exit 0
          fi

          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_save

      - name: Prepare kernel and clean
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre_build
          rm -rf bin/targets/rockchip/armv8

      - name: Compile firmware
        run: |
          cd /workdir/openwrt

          set +e
          make download -j8 > /tmp/download.log 2>&1 || true
          make -j$(nproc) V=s > /tmp/build.log 2>&1
          BUILD_RESULT=$?
          set -e

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "Build failed (exit: $BUILD_RESULT)"
            if [ "$BUILD_RESULT" -gt 128 ]; then
              SIG=$((BUILD_RESULT - 128))
              [ "$SIG" = "9" ] && echo "SIGKILL (likely OOM)"
              free -h
              sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill" | tail -20 || true
            fi

            FIRST_ERR=$(grep -n -m 1 -E "^make(\[[0-9]+\])?: \*\*\* .* Error [0-9]" /tmp/build.log | cut -d: -f1)
            if [ -n "$FIRST_ERR" ]; then
              START=$((FIRST_ERR > 150 ? FIRST_ERR - 150 : 1))
              END=$((FIRST_ERR + 30))
              sed -n "${START},${END}p" /tmp/build.log
            else
              tail -300 /tmp/build.log
            fi
            exit 1
          fi

      - name: Verify and collect artifacts
        if: success()
        run: |
          cd /workdir/openwrt
          OUT="bin/targets/rockchip/armv8"

          echo "===== Kernel version used ====="
          grep -rn '^LINUX_VERSION-6\.12' include/ target/linux/generic/kernel-6.12 2>/dev/null || true

          if [ -f /workdir/target_version.txt ]; then
            echo "===== Patch adaptation report ====="
            cat /workdir/patch_report.txt 2>/dev/null || \
              echo "(restored from patches/$PATCH_BRANCH, no in-run adaptation)"
          fi

          IMG_EXT4_GZ=$(find "$OUT" -maxdepth 1 -type f -name "*nanopi-r5s-ext4-sysupgrade.img.gz" | head -1)
          [ -n "$IMG_EXT4_GZ" ] || { echo "ext4 img missing"; exit 1; }
          file "$IMG_EXT4_GZ" | grep -q "gzip compressed data" || exit 1
          python3 -c "import zlib;d=zlib.decompressobj(wbits=31);d.decompress(open('$IMG_EXT4_GZ','rb').read());exit(0 if d.eof else 1)" || exit 1

          IMG_SQ_GZ=$(find "$OUT" -maxdepth 1 -type f -name "*nanopi-r5s-squashfs-sysupgrade.img.gz" | head -1)
          [ -n "$IMG_SQ_GZ" ] || { echo "squashfs img missing"; exit 1; }
          file "$IMG_SQ_GZ" | grep -q "gzip compressed data" || exit 1
          python3 -c "import zlib;d=zlib.decompressobj(wbits=31);d.decompress(open('$IMG_SQ_GZ','rb').read());exit(0 if d.eof else 1)" || exit 1

          python3 -c "import gzip,sys;f=gzip.open(sys.argv[1],'rb');f.seek(446);e=f.read(64);t=e[32+4];assert t!=0,'p3 missing';print(f'p3 present in MBR, type=0x{t:02x}')" "$IMG_EXT4_GZ"

          MANIFEST=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s.manifest" -type f | head -1)
          [ -n "$MANIFEST" ] || { echo "manifest missing"; exit 1; }
          grep -E "^(kmod-r8169|clashoo|luci-app-clashoo|luci-app-amlogic|docker|dockerd|containerd|runc|luci-app-dockerman|ttyd|openssh-sftp-server|parted) " "$MANIFEST" || true

          mkdir -p $GITHUB_WORKSPACE/artifact
          DATE=$(date +%Y.%m.%d)
          PREFIX="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-${DATE}"

          cp "$IMG_EXT4_GZ" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sdcard.img.gz"
          cp "$IMG_SQ_GZ" "$GITHUB_WORKSPACE/artifact/${PREFIX}-squashfs-sysupgrade.img.gz"
          cp "$MANIFEST" "$GITHUB_WORKSPACE/artifact/${PREFIX}-manifest.txt"

          SUMFILE=$(find "$OUT" -maxdepth 1 -name "sha256sums" -type f | head -1)
          [ -n "$SUMFILE" ] && cp "$SUMFILE" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sha256sums.txt"

          [ -f /workdir/patch_report.txt ] && \
            cp /workdir/patch_report.txt "$GITHUB_WORKSPACE/artifact/${PREFIX}-patch-report.txt" || true

          cd $GITHUB_WORKSPACE/artifact
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] && [ "$f" != "SHA256SUMS" ] && sha256sum "$f" >> SHA256SUMS
          done
          ls -lh

      - name: Upload artifacts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare_release.outputs.release_tag }}" \
            $GITHUB_WORKSPACE/artifact/*.gz \
            $GITHUB_WORKSPACE/artifact/*-manifest.txt \
            $GITHUB_WORKSPACE/artifact/*-sha256sums.txt \
            $GITHUB_WORKSPACE/artifact/*-patch-report.txt \
            $GITHUB_WORKSPACE/artifact/SHA256SUMS \
            --clobber || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware-${{ env.KERNEL_TRACK }}
          path: artifact/
          retention-days: 30

  cleanup_self:
    name: Cleanup workflow history
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}