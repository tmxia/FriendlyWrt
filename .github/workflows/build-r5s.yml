name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_BRANCH: 'openwrt-25.12'
  FLAVOR: 'r5s'
  TARGET_OS: 'friendlywrt25'
  GOPROXY: 'https://goproxy.cn,direct'
  GOFLAGS: '-mod=mod'
  GOMODCACHE: '/tmp/go-mod-cache'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Reclaim disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    /usr/share/swift /usr/local/.ghcup /opt/az || true
        sudo apt-get clean
        df -h /

    - name: Add swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile > /dev/null
        sudo swapon /swapfile
        free -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-dev python3-distutils python3-setuptools \
          python3-pip python3-venv python3-pyelftools rsync subversion swig time \
          xsltproc zlib1g-dev \
          bison flex libtool libtool-bin pkg-config \
          libgmp-dev libmpc-dev libmpfr-dev \
          gperf patch quilt cpio \
          liblzma-dev libbz2-dev \
          device-tree-compiler u-boot-tools \
          bzip2 xz-utils zip unzip wget curl \
          autoconf automake autopoint texinfo help2man \
          aria2 bc whiptail mercurial lib32stdc++6 \
          android-sdk-libsparse-utils e2fsprogs parted dosfstools mtools lz4
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
        python3 -c "import elftools" 2>/dev/null || pip3 install --quiet pyelftools
        mkdir -p ./artifact
        echo "CPU cores: $(nproc)"

    # ==================== A. 准备 OpenWrt 官方源码 ====================
    - name: Prepare OpenWrt workspace
      run: |
        mkdir -p project
        cd project
        git clone --depth 1 -b ${{ env.OPENWRT_BRANCH }} \
          https://github.com/openwrt/openwrt.git friendlywrt > /dev/null 2>&1
        cd friendlywrt
        ./scripts/feeds update -a > /dev/null 2>&1 || ./scripts/feeds update -a
        ./scripts/feeds install -a > /dev/null 2>&1
        rm -f feeds.conf
        cd ..
        mkdir -p configs/rockchip
        touch configs/rockchip/01-nanopi
        echo "OpenWrt workspace prepared"

    - name: Initialize .config with R5S target
      run: |
        cd project/friendlywrt
        cat > .config <<'EOF'
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y
        CONFIG_LUCI_LANG_zh_Hans=y
        EOF
        yes "" | make oldconfig > /dev/null 2>&1 || make defconfig > /dev/null 2>&1
        echo "Initial .config created"

    - name: Verify upstream kernel version
      run: |
        cd project/friendlywrt
        if [ -d target/linux/rockchip/patches-6.12 ] && [ -f target/linux/rockchip/armv8/config-6.12 ]; then
          echo "[OK] OpenWrt Rockchip target uses kernel 6.12"
        else
          echo "::error::6.12 kernel artifacts not found"
          exit 1
        fi

    - name: Bridge add_packages.sh kernel config path
      run: |
        cd project/friendlywrt/target/linux/rockchip
        if [ ! -e config-6.1 ]; then
          ln -s armv8/config-6.12 config-6.1
        fi
        ls -la config-6.1

    - name: Apply customizations (original script)
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Patch file Makefile and force libmagic dependencies
      run: |
        cd project/friendlywrt

        FILE_MK="feeds/packages/libs/file/Makefile"
        [ -f "$FILE_MK" ] || { echo "::error::$FILE_MK not found"; exit 1; }

        echo "=== [1/6] file Makefile Package/libmagic 原始定义 ==="
        awk '/^define Package\/libmagic/,/^endef/' "$FILE_MK" || true

        echo "=== [2/6] 生成 tmp/.config-package.in ==="
        yes "" | make oldconfig > /dev/null 2>&1 || make defconfig > /dev/null 2>&1 || true

        echo "=== [3/6] 探测 kconfig 符号 ==="
        for hint in libbz2 liblzma zlib; do
          echo "--- ${hint} ---"
          grep -oE "config PACKAGE_${hint}[-0-9._]*" tmp/.config-package.in 2>/dev/null \
            | awk '{print $2}' | sort -u || echo "(none)"
        done

        echo "=== [4/6] Patch file Makefile ==="
        python3 - "$FILE_MK" <<'PY'
        import re, sys, pathlib
        p = pathlib.Path(sys.argv[1])
        txt = p.read_text()
        m = re.search(r'(define Package/libmagic\b.*?DEPENDS:=)([^\n]*)', txt, flags=re.S)
        if not m:
            print("PATTERN NOT FOUND")
            sys.exit(0)
        deps = m.group(2)
        added = []
        for r in ['+libbz2', '+liblzma']:
            if r not in deps:
                deps += " " + r
                added.append(r)
        if added:
            txt = txt[:m.start(2)] + deps + txt[m.end(2):]
            p.write_text(txt)
            print(f"PATCHED: {added}")
        else:
            print("No change")
        PY

        echo "=== [5/6] 强制启用 kconfig 符号 ==="
        SYMS="PACKAGE_libbz2 PACKAGE_liblzma PACKAGE_zlib"
        for hint in libbz2 liblzma zlib; do
          found=$(grep -oE "config PACKAGE_${hint}[-0-9._]*" tmp/.config-package.in 2>/dev/null \
                    | awk '{print $2}' | sort -u || true)
          SYMS="${SYMS} ${found}"
        done
        for sym in $SYMS; do
          [ -z "$sym" ] && continue
          sed -i "/^# CONFIG_${sym} is not set/d" .config
          sed -i "/^CONFIG_${sym}=/d" .config
          echo "CONFIG_${sym}=y" >> .config
        done
        yes "" | make oldconfig > /dev/null 2>&1 || make defconfig > /dev/null 2>&1

        echo "=== [6/6] 预编译底层依赖 ==="
        for path in "package/libs/zlib" "package/utils/bzip2" \
                    "package/feeds/packages/utils/xz" "feeds/packages/utils/xz" \
                    "package/feeds/packages/libs/file" "feeds/packages/libs/file"; do
          if [ -d "$path" ]; then
            make -j1 "$path/compile" > /tmp/dep.log 2>&1 && echo "  [OK] $path" || { echo "  [WARN] $path"; tail -3 /tmp/dep.log; }
          fi
        done

    - name: Download packages
      run: |
        cd project/friendlywrt
        make download -j$(nproc) > /tmp/dl1.log 2>&1 || true
        SMALL=$(find dl -type f -size -1024c 2>/dev/null || true)
        if [ -n "$SMALL" ]; then
          find dl -type f -size -1024c -delete 2>/dev/null || true
        fi
        make download -j$(nproc) > /tmp/dl2.log 2>&1 || true
        echo "dl: $(find dl -type f | wc -l) 文件, $(du -sh dl | awk '{print $1}')"

    - name: Compile OpenWrt
      run: |
        cd project/friendlywrt
        for s in tools/compile toolchain/compile target/compile package/compile; do
          echo "========== STAGE: $s =========="
          LOG="/tmp/build_$(echo $s|tr '/' '_').log"
          if ! make -j$(nproc) "$s" > "$LOG" 2>&1; then
            echo "::error::STAGE FAILED: $s"
            FAILED=$(grep -oE "ERROR: package/[^ ]+ failed to build" "$LOG" | head -1 | awk '{print $2}')
            tail -60 "$LOG"
            [ -n "$FAILED" ] && { echo "=== Verbose rebuild ==="; make -j1 V=s "$FAILED/compile" 2>&1 | tail -150 || true; }
            exit 1
          fi
        done
        echo "=== All stages compiled ==="

    # ==================== B. 定位 OpenWrt 6.12 内核产物 ====================
    - name: Locate 6.12 kernel artifacts
      run: |
        cd project/friendlywrt

        # 定位内核编译目录
        KDIR=$(ls -d build_dir/target-aarch64_cortex-a53_musl/linux-rockchip_armv8 2>/dev/null | head -1)
        if [ -z "$KDIR" ]; then
          echo "::error::Linux build dir not found"
          ls build_dir/target-aarch64_cortex-a53_musl/ | head
          exit 1
        fi
        echo "KDIR=$KDIR" >> $GITHUB_ENV

        # 内核版本
        KV=$(cat "$KDIR/linux-6.12.*/include/config/kernel.release" 2>/dev/null | head -1)
        [ -z "$KV" ] && KV=$(ls -d "$KDIR"/linux-6.12.* 2>/dev/null | head -1 | xargs -I{} basename {} | sed 's/linux-//')
        echo "Kernel version: $KV"
        echo "KV=$KV" >> $GITHUB_ENV

        # 内核 Image
        IMG=$(find "$KDIR" -path "*/arch/arm64/boot/Image" -type f | head -1)
        if [ -z "$IMG" ]; then
          echo "::error::Kernel Image not found"
          find "$KDIR" -name "Image" -type f | head
          exit 1
        fi
        echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV
        echo "[OK] Image: $IMG ($(du -h $IMG | awk '{print $1}'))"

        # DTB 目录
        DTB_DIR=$(find "$KDIR" -path "*/arch/arm64/boot/dts/rockchip" -type d | head -1)
        if [ -z "$DTB_DIR" ]; then
          echo "::warning::DTB dir not found"
        else
          echo "DTB_DIR=$DTB_DIR" >> $GITHUB_ENV
          echo "[OK] DTB dir: $DTB_DIR"
          ls "$DTB_DIR"/*.dtb 2>/dev/null | head -20
        fi

        # 内核模块目录（staging 里的 rootfs 包含 /lib/modules/<ver>/）
        KMOD_DIR=$(find "$KDIR" -type d -name "$KV" | head -1)
        if [ -z "$KMOD_DIR" ]; then
          KMOD_DIR=$(find staging_dir -type d -path "*/lib/modules/$KV" | head -1)
        fi
        if [ -z "$KMOD_DIR" ]; then
          echo "::warning::Kernel modules dir not found"
        else
          echo "KMOD_DIR=$KMOD_DIR" >> $GITHUB_ENV
          echo "[OK] Kernel modules: $KMOD_DIR ($(find $KMOD_DIR -name '*.ko' | wc -l) .ko)"
        fi

    # ==================== C. 使用 sd-fuse 工具打包内核 ====================
    - name: Clone sd-fuse_rk3568
      run: |
        cd project
        git clone --depth 1 https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse
        cd sd-fuse
        echo "=== sd-fuse 顶层 ==="
        ls -la
        echo "=== prebuilt 内容 ==="
        ls -la prebuilt/ | head -30
        echo "=== tools 内容 ==="
        ls -la tools/

    - name: Package 6.12 kernel into Rockchip kernel.img
      run: |
        cd project
        SF="sd-fuse"

        echo "===== 用 mkkrnlimg 打包 kernel.img ====="
        # 用法: mkkrnlimg <srcImage> <desFile> [flag]
        echo "Source Image: $IMAGE_PATH"
        "$SF/tools/mkkrnlimg" "$IMAGE_PATH" "$SF/$TARGET_OS/kernel.img" 2>&1 | tee /tmp/mkkrnlimg.log
        if [ ! -f "$SF/$TARGET_OS/kernel.img" ]; then
          echo "::error::kernel.img not generated"
          cat /tmp/mkkrnlimg.log
          exit 1
        fi
        ls -lh "$SF/$TARGET_OS/kernel.img"

        echo "===== 用 resource_tool 打包 resource.img ====="
        # 从 OpenWrt 的 DTB 目录收集所有 .dtb（rk-kernel.dtb 与 R5S 相关的 dtb）
        if [ -n "$DTB_DIR" ] && [ -d "$DTB_DIR" ]; then
          # resource_tool 会在 --root 目录里找 dtb，--pack 后跟文件列表
          # 先复制一份到临时目录（避免污染 OpenWrt build_dir）
          mkdir -p /tmp/dtb-pack
          cp -a "$DTB_DIR"/*.dtb /tmp/dtb-pack/ 2>/dev/null || true
          # 只保留 R5S 及其相关
          ls /tmp/dtb-pack/ | head

          echo "=== 尝试打包 resource.img ==="
          "$SF/tools/resource_tool" --pack --root=/tmp/dtb-pack \
            /tmp/dtb-pack/rk3568-nanopi-r5s.dtb \
            -o "$SF/$TARGET_OS/resource.img" 2>&1 | tee /tmp/resource_tool.log || {
              echo "::warning::resource_tool 参数尝试 1 失败，尝试其他参数组合"
              # 备用：直接把所有 dtb 放进去
              "$SF/tools/resource_tool" --pack --root=/tmp/dtb-pack \
                $(ls /tmp/dtb-pack/*.dtb | head -30) \
                -o "$SF/$TARGET_OS/resource.img" 2>&1 | head -20 || true
            }
          ls -lh "$SF/$TARGET_OS/resource.img" 2>/dev/null || echo "::warning::resource.img 未生成，将复用 prebuilt 版本"
        fi

        # 如果 resource.img 生成失败，回退到复用 prebuilt 里的（可能是 6.1 dtb，但先保证能启动）
        if [ ! -f "$SF/$TARGET_OS/resource.img" ]; then
          echo "::warning::使用 sd-fuse prebuilt 里的 resource.img 作为兜底"
          # prebuilt 里没有 resource.img 但可以从官方模板里拿
          # 这里先跳过，让后续 step 处理
        fi

    # ==================== D. 组装 friendlywrt25/ 目录 ====================
    - name: Prepare friendlywrt25 directory
      run: |
        cd project/sd-fuse
        mkdir -p "$TARGET_OS"

        echo "=== 从 prebuilt 复制 U-Boot 及启动链文件 ==="
        for f in uboot.img idbloader.img MiniLoaderAll.bin misc.img dtbo.img; do
          if [ -f "prebuilt/$f" ]; then
            cp -v "prebuilt/$f" "$TARGET_OS/$f"
          fi
        done

        echo "=== 使用 parameter.template 生成 parameter.txt ==="
        # 模板里的 <ROOTFS_PARTITION_SIZE> 等占位符需要根据实际 rootfs 大小生成
        # 先复制一份，后面生成 rootfs.img 后再替换
        cp -v prebuilt/parameter.template "$TARGET_OS/parameter.txt" || true

        echo "=== 下载官方的 boot.img（用于 boot 分区的 ramdisk）==="
        # boot.img 8MB，包含 ramdisk 或启动脚本
        # 从官方模板中提取
        cd /tmp
        if [ ! -d /tmp/friendlywrt25-extract ]; then
          wget -q -O /tmp/fw25.tgz \
            https://downloads.friendlyelec.com/os-images/rk3568/images/friendlywrt25-images-20280806.tgz || true
          mkdir -p /tmp/friendlywrt25-extract
          if [ -f /tmp/fw25.tgz ]; then
            # 只解出 boot.img 和 parameter.txt
            tar xzf /tmp/fw25.tgz -C /tmp/friendlywrt25-extract \
              friendlywrt25/boot.img friendlywrt25/parameter.txt 2>/dev/null || true
          fi
        fi
        if [ -f /tmp/friendlywrt25-extract/friendlywrt25/boot.img ]; then
          cp -v /tmp/friendlywrt25-extract/friendlywrt25/boot.img \
            "$GITHUB_WORKSPACE/project/sd-fuse/$TARGET_OS/boot.img"
        else
          echo "::warning::官方 boot.img 未获取到，boot 分区将为空"
        fi

        echo "=== 目录现状 ==="
        ls -lh "$TARGET_OS/"

    # ==================== E. 用 OpenWrt rootfs + 6.12 模块生成 rootfs.img ====================
    - name: Extract OpenWrt rootfs and inject 6.12 kernel modules
      run: |
        cd project

        # OpenWrt 的 rootfs 目录
        ROOTFS_SRC=$(ls -d friendlywrt/build_dir/target-aarch64_cortex-a53_musl/root-* 2>/dev/null | head -1)
        if [ -z "$ROOTFS_SRC" ]; then
          echo "::error::OpenWrt rootfs not found"
          find friendlywrt/build_dir -maxdepth 3 -name "root-*" | head
          exit 1
        fi
        echo "OpenWrt rootfs: $ROOTFS_SRC ($(du -sh $ROOTFS_SRC | awk '{print $1}'))"

        # 复制到临时目录（不动原始目录）
        rm -rf /tmp/rootfs-pack
        cp -a "$ROOTFS_SRC" /tmp/rootfs-pack

        echo "=== 确认 rootfs 里已有 6.12 内核模块 ==="
        if [ -d /tmp/rootfs-pack/lib/modules ]; then
          ls /tmp/rootfs-pack/lib/modules/
          find /tmp/rootfs-pack/lib/modules -name "*.ko" | wc -l
        else
          echo "::warning::/lib/modules 不存在，尝试从 staging 目录复制"
          mkdir -p /tmp/rootfs-pack/lib/modules
          if [ -n "$KMOD_DIR" ] && [ -d "$KMOD_DIR" ]; then
            cp -a "$KMOD_DIR" /tmp/rootfs-pack/lib/modules/
          fi
        fi

        echo "=== 清理 rootfs（删除 /dev 下设备节点等）==="
        (cd /tmp/rootfs-pack/dev && find . ! -type d -exec rm -f {} \; ) 2>/dev/null || true

        echo "=== 用 mke2fs 生成 rootfs.img（Android sparse 格式）==="
        cd project/sd-fuse
        MKE2FS="$PWD/tools/mke2fs"
        [ -f "$MKE2FS" ] || { echo "::error::mke2fs not found at $MKE2FS"; exit 1; }

        MKFS_CONF="$PWD/tools/mke2fs.conf"
        ROOTFS_DIR=/tmp/rootfs-pack
        IMG_SIZE=$(( (`du -s -B64M $ROOTFS_DIR | cut -f1` + 3) * 1024 * 1024 * 64 ))
        IMG_BLK=$(( $IMG_SIZE / 4096 ))
        INODE_SIZE=$(( `find $ROOTFS_DIR | wc -l` + 128 ))

        rm -f "$TARGET_OS/rootfs.img"
        MKE2FS_CONFIG="$MKFS_CONF" \
          "$MKE2FS" -N "$INODE_SIZE" \
            -E android_sparse -t ext4 -L rootfs -M /root -b 4096 -0 \
            -d "$ROOTFS_DIR" "$TARGET_OS/rootfs.img" "$IMG_BLK" 2>&1 | tail -20

        if [ ! -f "$TARGET_OS/rootfs.img" ]; then
          echo "::error::rootfs.img 生成失败"
          exit 1
        fi
        ls -lh "$TARGET_OS/rootfs.img"

    - name: Generate parameter.txt based on rootfs size
      run: |
        cd project/sd-fuse
        # 用 sd-fuse 的 generate-partmap-txt.sh 生成 parameter.txt
        ROOTFS_IMG="$TARGET_OS/rootfs.img"
        ROOTFS_SIZE_BYTES=$(stat -c%s "$ROOTFS_IMG")
        # 向上对齐到 512KB 单位
        ROOTFS_SIZE_BLOCKS=$(( (ROOTFS_SIZE_BYTES + 512*1024 - 1) / (512*1024) ))
        echo "Rootfs size: $ROOTFS_SIZE_BYTES bytes ($ROOTFS_SIZE_BLOCKS × 512KB)"

        # sd-fuse 的 generate-partmap-txt.sh 第一个参数是 rootfs 的字节大小
        PARAMETER_TPL="$PWD/prebuilt/parameter.template" \
          ./tools/generate-partmap-txt.sh "$ROOTFS_SIZE_BYTES" "$TARGET_OS" 2>&1 | tail -20 || {
            echo "::warning::generate-partmap-txt.sh 失败，手工替换占位符"
            sed -i "s/<ROOTFS_PARTITION_SIZE>/0x$(printf %x $ROOTFS_SIZE_BLOCKS)/" "$TARGET_OS/parameter.txt" || true
            sed -i "s/<USERDATA_PARTITION_ADDR>/0x$(printf %x $((0x46000 + ROOTFS_SIZE_BLOCKS)))/" "$TARGET_OS/parameter.txt" || true
          }

        echo "=== 最终 parameter.txt ==="
        cat "$TARGET_OS/parameter.txt"

    # ==================== F. 用 sd-fuse 生成最终镜像 ====================
    - name: Build SD image
      run: |
        cd project/sd-fuse
        echo "=== 目录最终状态 ==="
        ls -lh "$TARGET_OS/"

        # 设置非交互模式
        export SDFUSE_NONINTERACTIVE=y
        # 因为我们的 $TARGET_OS 目录已经存在完整文件，mk-sd-image.sh 不会去下载
        sudo -E ./mk-sd-image.sh "$TARGET_OS" 2>&1 | tee /tmp/sd-image.log | tail -60 || {
          echo "::warning::mk-sd-image.sh 返回非零"
          tail -80 /tmp/sd-image.log
        }
        echo "=== out/ ==="
        ls -lh out/ 2>/dev/null || echo "(no out/)"

    - name: Build eMMC flasher image
      run: |
        cd project/sd-fuse
        export SDFUSE_NONINTERACTIVE=y
        sudo -E ./mk-emmc-image.sh "$TARGET_OS" autostart=yes 2>&1 | tee /tmp/emmc-image.log | tail -60 || {
          echo "::warning::mk-emmc-image.sh 返回非零"
          tail -80 /tmp/emmc-image.log
        }
        echo "=== out/ 最终 ==="
        ls -lh out/ 2>/dev/null || true
        ls -lh out/images-for-eflasher/ 2>/dev/null || true

    # ==================== G. 产物收集 ====================
    - name: Collect artifacts
      run: |
        cd project/sd-fuse

        echo "=== sd-fuse out/ 产物 ==="
        find out -maxdepth 3 -type f \( -name "*.img" -o -name "*.img.gz" -o -name "*.tgz" \) \
          -exec cp -v {} ../../artifact/ \; 2>/dev/null || true

        echo "=== OpenWrt 官方 sysupgrade 产物（兜底）==="
        find ../friendlywrt/bin/targets/rockchip/armv8/ -maxdepth 1 -type f \
          \( -name "*nanopi-r5s*.img.gz" -o -name "*nanopi-r5s*.manifest" \) \
          -exec cp -v {} ../../artifact/ \; 2>/dev/null || true

        echo "=== 上传目录 ==="
        ls -lh ../../artifact/ || { echo "::error::No artifacts"; exit 1; }

    - name: Upload artifacts to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/*
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
        file_glob: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}