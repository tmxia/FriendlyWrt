name: Build FriendlyWrt With Flippy Kernel (Full)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag with auto-increment or overwrite
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-flippy-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              NEXT=$((MAX_NUM + 1))
              TAG="${BASE_TAG}-${NEXT}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          dosfstools e2fsprogs parted
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        make -j$(nproc)

    # ---------- 获取 flippy 内核 ----------
    - name: Get latest flippy kernel version
      id: flippy_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Fetching latest flippy kernel version from ophub/kernel release kernel_flippy..."
        ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
        VERSIONS=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//')
        if [ -z "$VERSIONS" ]; then
          echo "ERROR: No kernel tarballs found in kernel_flippy release"
          exit 1
        fi
        LATEST=$(echo "$VERSIONS" | sort -V | tail -1)
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest flippy kernel version: $LATEST"

    - name: Download and extract flippy kernel
      run: |
        cd project
        KERNEL_VER="${{ steps.flippy_version.outputs.version }}"
        echo "Downloading flippy kernel $KERNEL_VER from ophub/kernel (kernel_flippy release)"
        wget -q https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VER}.tar.gz -O /tmp/kernel_all.tar.gz

        mkdir -p /tmp/flippy_extract
        tar xzf /tmp/kernel_all.tar.gz -C /tmp/flippy_extract

        KERNEL_DIR="/tmp/flippy_extract/$KERNEL_VER"
        if [ ! -d "$KERNEL_DIR" ]; then
          KERNEL_DIR=$(find /tmp/flippy_extract -maxdepth 1 -type d -name "*$KERNEL_VER*" | head -1)
        fi
        if [ -z "$KERNEL_DIR" ] || [ ! -d "$KERNEL_DIR" ]; then
          echo "ERROR: Kernel directory not found"
          ls -la /tmp/flippy_extract
          exit 1
        fi
        echo "Kernel directory: $KERNEL_DIR"

        BOOT_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)
        MODULES_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "modules-*.tar.gz" | head -1)

        if [ -z "$BOOT_TAR" ] || [ -z "$DTB_TAR" ] || [ -z "$MODULES_TAR" ]; then
          echo "ERROR: Could not find boot, dtb, or modules archives. Listing contents:"
          ls -laR "$KERNEL_DIR"
          exit 1
        fi

        echo "Found boot: $BOOT_TAR, dtb: $DTB_TAR, modules: $MODULES_TAR"

        # 解压模块，用于注入 rootfs
        mkdir -p /tmp/flippy_modules
        tar xzf "$MODULES_TAR" -C /tmp/flippy_modules

        # 保存 boot/dtb 路径供后续使用
        echo "BOOT_TAR=$BOOT_TAR" >> $GITHUB_ENV
        echo "DTB_TAR=$DTB_TAR" >> $GITHUB_ENV

    # ---------- 替换 rootfs 中的内核模块 ----------
    - name: Inject flippy modules into rootfs before packaging
      run: |
        cd project
        source .current_config.mk
        ROOTFS_DIR="${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS}"

        if [ -d /tmp/flippy_modules ]; then
          MODULES_DIR_NAME=$(ls /tmp/flippy_modules | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-flippy-[0-9]+\+?$' | head -1)
          if [ -n "$MODULES_DIR_NAME" ]; then
            echo "Injecting flippy modules to $ROOTFS_DIR/lib/modules ..."
            rm -rf "$ROOTFS_DIR/lib/modules"
            mkdir -p "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME"
            cp -r /tmp/flippy_modules/$MODULES_DIR_NAME/* "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME/"
            find "$ROOTFS_DIR/lib/modules" -type f -exec chmod 644 {} \;
            echo "Flippy modules injected."
          else
            echo "WARNING: Could not determine modules directory name, skipping injection."
          fi
        else
          echo "WARNING: /tmp/flippy_modules not found, skipping module injection."
        fi

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-friendlywrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        if [ -z "$PM_BIN" ]; then
          echo "ERROR: neither apk nor opkg found under ${FRIENDLYWRT_SRC}/staging_dir/host/bin/"
          exit 1
        fi
        echo "Detected host package manager: $PM_BIN"

        ldd_out=$(ldd "$PM_BIN" 2>&1 || true)
        echo "$ldd_out"
        if ! echo "$ldd_out" | grep -q "not a dynamic executable"; then
          bad_paths=$(echo "$ldd_out" | grep -oE '=> /[^ ]+' | sed 's|=> ||' \
                       | grep -vE '^/(lib|lib64|usr/lib)/' || true)
          not_found=$(echo "$ldd_out" | grep -F "not found" || true)
          if [ -n "$bad_paths" ] || [ -n "$not_found" ]; then
            echo "ERROR: $PM_BIN has non-portable dynamic dependencies:"
            [ -n "$bad_paths" ] && { echo "non-system paths:"; echo "$bad_paths"; }
            [ -n "$not_found" ] && { echo "unresolved:"; echo "$not_found"; }
            exit 1
          fi
        fi

        host_pm_filename="host-pm-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    # ---------- 构建 SD 镜像（使用 flippy 内核） ----------
    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-flippy-${{ matrix.VERSION }}.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-flippy-${{ matrix.VERSION }}-docker.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568)
          MODEL=R5S-R5C-Series
          ;;
        *)
          echo "unknow cpu"
          exit 1
          ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        tar xzf "../rootfs-friendlywrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}.tgz"

    # ---------- 编译 uboot 并注入 flippy boot/dtb ----------
    - name: Compile uboot and prepare flippy kernel
      run: |
        cd project
        ./build.sh uboot

        # 创建 kernel 标记（可能不需要，但保留以防某些脚本检查）
        mkdir -p friendlywrt/kernel
        touch friendlywrt/kernel/.built

        # 获取变量
        source .current_config.mk
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        ROOTFS_SRC="${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS}"
        TARGET_ROOTFS="scripts/sd-fuse/${DIST_DIR}/rootfs"
        rm -rf "$TARGET_ROOTFS"
        mkdir -p "$TARGET_ROOTFS"
        cp -a "$ROOTFS_SRC"/. "$TARGET_ROOTFS/"
        echo "Rootfs copied to $TARGET_ROOTFS"

        # 注入 flippy boot 和 dtb
        BOOT_TAR="${{ env.BOOT_TAR }}"
        DTB_TAR="${{ env.DTB_TAR }}"
        if [ -n "$BOOT_TAR" ] && [ -n "$DTB_TAR" ]; then
          echo "Deploying flippy kernel boot/dtb to scripts/sd-fuse/${DIST_DIR} ..."
          mkdir -p scripts/sd-fuse/${DIST_DIR}/boot/
          tar xzf "$BOOT_TAR" -C scripts/sd-fuse/${DIST_DIR}/boot/ --strip-components=1
          mkdir -p scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/
          tar xzf "$DTB_TAR" -C scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ --strip-components=1
          echo "Flippy boot/dtb deployed."
        else
          echo "WARNING: flippy kernel boot/dtb not found, skipping deployment."
        fi

    # ---------- 使用 mk-sd-image.sh 生成镜像（提前打包 tgz） ----------
    - name: Build sd image with mk-sd-image.sh
      id: build_sd_image
      run: |
        cd project/scripts/sd-fuse
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        IMG_FILE="${{ steps.config.outputs.img_filename }}"
        ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"

        # 1. 在运行 mk-sd-image.sh 之前打包 tgz
        if [ -d "$DIST_DIR" ]; then
          archive_dir="${DIST_DIR}-rk3568"
          mv "$DIST_DIR" "$archive_dir"
          tar czf "$ARTIFACT_DIR/${{ steps.config.outputs.archive_filename }}" "$archive_dir"
          echo "tgz created"
          # 打包后将目录名恢复，供 mk-sd-image.sh 使用
          mv "$archive_dir" "$DIST_DIR"
        else
          echo "ERROR: directory $DIST_DIR not found before mk-sd-image.sh"
          ls -la
          exit 1
        fi

        # 2. 运行 mk-sd-image.sh 生成 RAW 镜像
        echo "=== Running mk-sd-image.sh ${DIST_DIR} ==="
        yes | ./mk-sd-image.sh "${DIST_DIR}" 2>&1 | tee /tmp/mk-sd.log
        BUILD_EXIT=${PIPESTATUS[0]}
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "mk-sd-image.sh failed with exit code $BUILD_EXIT"
          cat /tmp/mk-sd.log
          exit 1
        fi

        # 3. 重命名并移动镜像
        cd out
        ORIG_IMG=$(find . -maxdepth 1 -name "*.img" -print -quit)
        if [ -z "$ORIG_IMG" ]; then
          echo "ERROR: No .img file found in out/"
          ls -la
          exit 1
        fi
        mv "$ORIG_IMG" "$IMG_FILE"
        echo "Renamed to $IMG_FILE"
        cd ..

        mv "out/$IMG_FILE" "$ARTIFACT_DIR/"
        echo "Image moved to $ARTIFACT_DIR/$IMG_FILE"

        # 4. 压缩 img
        cd "$ARTIFACT_DIR"
        gzip -f "$IMG_FILE"
        echo "Compressed image: $IMG_FILE.gz"
        ls -la "$ARTIFACT_DIR"

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ---------- 自动触发构建 ----------
  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          dosfstools e2fsprogs parted
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        make -j$(nproc)

    - name: Get latest flippy kernel version
      id: flippy_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Fetching latest flippy kernel version from ophub/kernel release kernel_flippy..."
        ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
        VERSIONS=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//')
        if [ -z "$VERSIONS" ]; then
          echo "ERROR: No kernel tarballs found in kernel_flippy release"
          exit 1
        fi
        LATEST=$(echo "$VERSIONS" | sort -V | tail -1)
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest flippy kernel version: $LATEST"

    - name: Download and extract flippy kernel
      run: |
        cd project
        KERNEL_VER="${{ steps.flippy_version.outputs.version }}"
        echo "Downloading flippy kernel $KERNEL_VER from ophub/kernel (kernel_flippy release)"
        wget -q https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VER}.tar.gz -O /tmp/kernel_all.tar.gz

        mkdir -p /tmp/flippy_extract
        tar xzf /tmp/kernel_all.tar.gz -C /tmp/flippy_extract

        KERNEL_DIR="/tmp/flippy_extract/$KERNEL_VER"
        if [ ! -d "$KERNEL_DIR" ]; then
          KERNEL_DIR=$(find /tmp/flippy_extract -maxdepth 1 -type d -name "*$KERNEL_VER*" | head -1)
        fi
        if [ -z "$KERNEL_DIR" ] || [ ! -d "$KERNEL_DIR" ]; then
          echo "ERROR: Kernel directory not found"
          ls -la /tmp/flippy_extract
          exit 1
        fi
        echo "Kernel directory: $KERNEL_DIR"

        BOOT_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)
        MODULES_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "modules-*.tar.gz" | head -1)

        if [ -z "$BOOT_TAR" ] || [ -z "$DTB_TAR" ] || [ -z "$MODULES_TAR" ]; then
          echo "ERROR: Could not find boot, dtb, or modules archives. Listing contents:"
          ls -laR "$KERNEL_DIR"
          exit 1
        fi

        echo "Found boot: $BOOT_TAR, dtb: $DTB_TAR, modules: $MODULES_TAR"

        mkdir -p /tmp/flippy_modules
        tar xzf "$MODULES_TAR" -C /tmp/flippy_modules

        echo "BOOT_TAR=$BOOT_TAR" >> $GITHUB_ENV
        echo "DTB_TAR=$DTB_TAR" >> $GITHUB_ENV

    - name: Inject flippy modules into rootfs before packaging
      run: |
        cd project
        source .current_config.mk
        ROOTFS_DIR="${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS}"

        if [ -d /tmp/flippy_modules ]; then
          MODULES_DIR_NAME=$(ls /tmp/flippy_modules | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-flippy-[0-9]+\+?$' | head -1)
          if [ -n "$MODULES_DIR_NAME" ]; then
            echo "Injecting flippy modules to $ROOTFS_DIR/lib/modules ..."
            rm -rf "$ROOTFS_DIR/lib/modules"
            mkdir -p "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME"
            cp -r /tmp/flippy_modules/$MODULES_DIR_NAME/* "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME/"
            find "$ROOTFS_DIR/lib/modules" -type f -exec chmod 644 {} \;
            echo "Flippy modules injected."
          else
            echo "WARNING: Could not determine modules directory name, skipping injection."
          fi
        else
          echo "WARNING: /tmp/flippy_modules not found, skipping module injection."
        fi

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-friendlywrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        if [ -z "$PM_BIN" ]; then
          echo "ERROR: neither apk nor opkg found under ${FRIENDLYWRT_SRC}/staging_dir/host/bin/"
          exit 1
        fi
        echo "Detected host package manager: $PM_BIN"

        ldd_out=$(ldd "$PM_BIN" 2>&1 || true)
        echo "$ldd_out"
        if ! echo "$ldd_out" | grep -q "not a dynamic executable"; then
          bad_paths=$(echo "$ldd_out" | grep -oE '=> /[^ ]+' | sed 's|=> ||' \
                       | grep -vE '^/(lib|lib64|usr/lib)/' || true)
          not_found=$(echo "$ldd_out" | grep -F "not found" || true)
          if [ -n "$bad_paths" ] || [ -n "$not_found" ]; then
            echo "ERROR: $PM_BIN has non-portable dynamic dependencies:"
            [ -n "$bad_paths" ] && { echo "non-system paths:"; echo "$bad_paths"; }
            [ -n "$not_found" ] && { echo "unresolved:"; echo "$not_found"; }
            exit 1
          fi
        fi

        host_pm_filename="host-pm-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-flippy-${{ matrix.VERSION }}.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-flippy-${{ matrix.VERSION }}-docker.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568)
          MODEL=R5S-R5C-Series
          ;;
        *)
          echo "unknow cpu"
          exit 1
          ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        tar xzf "../rootfs-friendlywrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}.tgz"

    - name: Compile uboot and prepare flippy kernel
      run: |
        cd project
        ./build.sh uboot

        # 创建 kernel 标记
        mkdir -p friendlywrt/kernel
        touch friendlywrt/kernel/.built

        # 获取变量
        source .current_config.mk
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        ROOTFS_SRC="${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS}"
        TARGET_ROOTFS="scripts/sd-fuse/${DIST_DIR}/rootfs"
        rm -rf "$TARGET_ROOTFS"
        mkdir -p "$TARGET_ROOTFS"
        cp -a "$ROOTFS_SRC"/. "$TARGET_ROOTFS/"
        echo "Rootfs copied to $TARGET_ROOTFS"

        # 注入 flippy boot 和 dtb
        BOOT_TAR="${{ env.BOOT_TAR }}"
        DTB_TAR="${{ env.DTB_TAR }}"
        if [ -n "$BOOT_TAR" ] && [ -n "$DTB_TAR" ]; then
          echo "Deploying flippy kernel boot/dtb to scripts/sd-fuse/${DIST_DIR} ..."
          mkdir -p scripts/sd-fuse/${DIST_DIR}/boot/
          tar xzf "$BOOT_TAR" -C scripts/sd-fuse/${DIST_DIR}/boot/ --strip-components=1
          mkdir -p scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/
          tar xzf "$DTB_TAR" -C scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ --strip-components=1
          echo "Flippy boot/dtb deployed."
        else
          echo "WARNING: flippy kernel boot/dtb not found, skipping deployment."
        fi

    - name: Build sd image with mk-sd-image.sh
      id: build_sd_image
      run: |
        cd project/scripts/sd-fuse
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        IMG_FILE="${{ steps.config.outputs.img_filename }}"
        ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"

        # 1. 提前打包 tgz
        if [ -d "$DIST_DIR" ]; then
          archive_dir="${DIST_DIR}-rk3568"
          mv "$DIST_DIR" "$archive_dir"
          tar czf "$ARTIFACT_DIR/${{ steps.config.outputs.archive_filename }}" "$archive_dir"
          echo "tgz created"
          mv "$archive_dir" "$DIST_DIR"
        else
          echo "ERROR: directory $DIST_DIR not found before mk-sd-image.sh"
          ls -la
          exit 1
        fi

        # 2. 运行 mk-sd-image.sh
        echo "=== Running mk-sd-image.sh ${DIST_DIR} ==="
        yes | ./mk-sd-image.sh "${DIST_DIR}" 2>&1 | tee /tmp/mk-sd.log
        BUILD_EXIT=${PIPESTATUS[0]}
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "mk-sd-image.sh failed with exit code $BUILD_EXIT"
          cat /tmp/mk-sd.log
          exit 1
        fi

        # 3. 重命名并移动镜像
        cd out
        ORIG_IMG=$(find . -maxdepth 1 -name "*.img" -print -quit)
        if [ -z "$ORIG_IMG" ]; then
          echo "ERROR: No .img file found in out/"
          ls -la
          exit 1
        fi
        mv "$ORIG_IMG" "$IMG_FILE"
        echo "Renamed to $IMG_FILE"
        cd ..

        mv "out/$IMG_FILE" "$ARTIFACT_DIR/"
        echo "Image moved to $ARTIFACT_DIR/$IMG_FILE"

        # 4. 压缩 img
        cd "$ARTIFACT_DIR"
        gzip -f "$IMG_FILE"
        echo "Compressed image: $IMG_FILE.gz"
        ls -la "$ARTIFACT_DIR"

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate_assets:
    needs: [prepare_release, build_manual, build_auto]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-friendlywrt-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build_manual, build_auto, cleanup_intermediate_assets]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build FriendlyWrt With Flippy Kernel (Full)"
          repository: ${{ github.repository }}