name: Kernel Watcher

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit SHA for nanopi6-v6.1.y
        id: sha
        run: |
          RESP=$(curl -sS -H "Accept: application/vnd.github+json" \
            -H "User-Agent: kernel-watcher" \
            "https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/nanopi6-v6.1.y" \
            || true)
          SHA=$(printf '%s' "$RESP" | jq -r '.sha // empty' 2>/dev/null || true)
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::warning::Cannot fetch upstream SHA, skipping this cycle."
            echo "--- GitHub API response (head) ---"
            printf '%s' "$RESP" | head -c 500
            echo
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current SHA: $SHA"

      - name: Read recorded SHA
        id: recorded
        run: |
          if [ -f .kernel-version ]; then
            RECORDED=$(head -n1 .kernel-version | tr -d '[:space:]')
          else
            RECORDED="none"
          fi
          if [ -z "$RECORDED" ]; then
            RECORDED="none"
          fi
          echo "recorded=$RECORDED" >> $GITHUB_OUTPUT
          echo "Recorded SHA: $RECORDED"

      - name: Fetch upstream commit titles
        id: commits
        if: |
          steps.sha.outputs.ok == 'true' &&
          steps.sha.outputs.sha != steps.recorded.outputs.recorded
        run: |
          if [ "${{ steps.recorded.outputs.recorded }}" = "none" ]; then
            URL="https://api.github.com/repos/friendlyarm/kernel-rockchip/commits?sha=${{ steps.sha.outputs.sha }}&per_page=50"
            TITLES=$(curl -sS -H "Accept: application/vnd.github+json" \
              -H "User-Agent: kernel-watcher" "$URL" \
              | jq -r 'if type=="array" then (.[] | .commit.message | split("\n")[0]) else empty end' \
              2>/dev/null || true)
          else
            URL="https://api.github.com/repos/friendlyarm/kernel-rockchip/compare/${{ steps.recorded.outputs.recorded }}...${{ steps.sha.outputs.sha }}"
            TITLES=$(curl -sS -H "Accept: application/vnd.github+json" \
              -H "User-Agent: kernel-watcher" "$URL" \
              | jq -r 'if type=="object" and .commits then (.commits[] | .commit.message | split("\n")[0]) else empty end' \
              2>/dev/null || true)
          fi
          TITLES=$(printf '%s\n' "$TITLES" | awk 'NF' | head -n 50 | cut -c1-250)
          if [ -z "$TITLES" ]; then
            echo "::warning::No titles fetched from GitHub API."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          {
            echo "titles<<__EOF__"
            echo "$TITLES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Commit titles count: $(printf '%s\n' "$TITLES" | wc -l)"

      - name: Cache HuggingFace models
        if: |
          steps.sha.outputs.ok == 'true' &&
          steps.commits.outputs.ok == 'true' &&
          steps.sha.outputs.sha != steps.recorded.outputs.recorded
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-opus-mt-en-zh-v2

      - name: Translate titles with opus-mt-en-zh
        id: translate
        if: |
          steps.sha.outputs.ok == 'true' &&
          steps.commits.outputs.ok == 'true' &&
          steps.sha.outputs.sha != steps.recorded.outputs.recorded
        timeout-minutes: 20
        env:
          TITLES: ${{ steps.commits.outputs.titles }}
          PY_TRANSLATE: |
            import os, re, sys
            os.environ["TRANSFORMERS_VERBOSITY"] = "error"
            os.environ["TOKENIZERS_PARALLELISM"] = "false"
            os.environ["HF_HUB_DISABLE_TELEMETRY"] = "1"

            try:
                import torch
                from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
            except Exception as e:
                sys.stderr.write(f"IMPORT_FAIL: {e}\n")
                sys.exit(1)

            MODEL = "Helsinki-NLP/opus-mt-en-zh"

            try:
                sys.stderr.write(f"Loading {MODEL}\n")
                tok = AutoTokenizer.from_pretrained(MODEL)
                model = AutoModelForSeq2SeqLM.from_pretrained(MODEL)
                model.eval()
            except Exception as e:
                sys.stderr.write(f"LOAD_FAIL: {e}\n")
                sys.exit(2)

            TERM_RE = re.compile(r'[A-Za-z0-9_./-]*[0-9_/.-][A-Za-z0-9_./-]*|[A-Z][A-Z0-9_]{3,}')

            def protect(text):
                terms = []
                def repl(m):
                    terms.append(m.group(0))
                    return f'__T{len(terms)-1}__'
                return TERM_RE.sub(repl, text), terms

            def restore(text, terms):
                for i, t in enumerate(terms):
                    text = text.replace(f'__T{i}__', t)
                return text

            titles = [l.rstrip("\n") for l in sys.stdin if l.strip()]
            sys.stderr.write(f"Input titles: {len(titles)}\n")

            ok = 0
            fail = 0
            with torch.no_grad():
                for i, t in enumerate(titles, 1):
                    try:
                        masked, terms = protect(t)
                        enc = tok(masked, return_tensors="pt", truncation=True, max_length=256)
                        out = model.generate(
                            **enc,
                            max_length=256,
                            num_beams=4,
                            no_repeat_ngram_size=3,
                            repetition_penalty=1.3,
                            length_penalty=1.0,
                            early_stopping=True,
                        )
                        zh = tok.batch_decode(out, skip_special_tokens=True)[0].strip()
                        zh = restore(zh, terms)
                        if re.search(r'(\S)\1{3,}', zh) or not zh:
                            zh = t
                            fail += 1
                        else:
                            ok += 1
                    except Exception as e:
                        sys.stderr.write(f"TR_FAIL[{i}]: {type(e).__name__}: {e}\n")
                        zh = t
                        fail += 1
                    print("- " + zh, flush=True)

            sys.stderr.write(f"DONE: ok={ok} fail={fail} total={len(titles)}\n")
        run: |
          if [ -z "$TITLES" ]; then
            echo "summary=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$TITLES" > /tmp/titles.txt
          INPUT_COUNT=$(awk 'NF' /tmp/titles.txt | wc -l | tr -d ' ')
          echo "Input titles: $INPUT_COUNT"

          echo "== Installing CPU-only torch and transformers =="
          python3 -m pip install --quiet --no-cache-dir --upgrade pip
          python3 -m pip install --quiet --no-cache-dir \
            torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet --no-cache-dir \
            transformers sentencepiece sacremoses

          printf '%s\n' "$PY_TRANSLATE" > /tmp/translate.py

          echo "== Running opus-mt-en-zh translation =="
          timeout 900 python3 /tmp/translate.py < /tmp/titles.txt > /tmp/summary.txt 2>/tmp/trans.log || true

          echo "---- translator stderr ----"
          cat /tmp/trans.log || true
          echo "---- translator stdout head ----"
          head -n 8 /tmp/summary.txt || true
          echo "---- end ----"

          SUMMARY=""
          if [ -s /tmp/summary.txt ]; then
            BULLETS=$(grep -c '^- ' /tmp/summary.txt || true)
            CN=$(grep -oP '[\x{4e00}-\x{9fff}]' /tmp/summary.txt | wc -l | tr -d ' ')
            echo "Translator output: bullets=$BULLETS CN=$CN"
            if [ "$CN" -ge 20 ] && [ "$BULLETS" -ge "$(( INPUT_COUNT * 2 / 3 ))" ]; then
              SUMMARY=$(cat /tmp/summary.txt)
              echo "Translator output accepted."
            else
              echo "Translator output rejected by quality check."
            fi
          else
            echo "Translator produced empty stdout."
          fi

          if [ -z "$SUMMARY" ]; then
            echo "== Translation failed; listing original titles =="
            SUMMARY=$(awk 'NF {print "- " $0}' /tmp/titles.txt)
          fi

          {
            echo "summary<<__EOF__"
            echo "$SUMMARY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Compare and trigger build if changed
        if: |
          steps.sha.outputs.ok == 'true' &&
          steps.commits.outputs.ok == 'true' &&
          steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kernel updated, triggering build..."
          gh workflow run build.yml -f version=both -f set=both --repo ${{ github.repository }}

      - name: Update recorded SHA with summary
        if: |
          steps.sha.outputs.ok == 'true' &&
          steps.commits.outputs.ok == 'true' &&
          steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          SUMMARY: ${{ steps.translate.outputs.summary }}
        run: |
          {
            echo "$SHA"
            echo ""
            echo "# 上游更新摘要（UTC $(date -u +%Y-%m-%d)）"
            echo ""
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "- （本次未生成摘要）"
            fi
          } > .kernel-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kernel-version
          git commit -m "chore: update kernel SHA $(echo $SHA | cut -c1-8)"
          git push

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [check_kernel]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs of exactly this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_NAME="Kernel Watcher"
          KEEP=1
          CURRENT_RUN_ID="${{ github.run_id }}"

          WF_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq ".workflows[] | select(.name == \"$TARGET_NAME\") | .id" | head -n1)
          if [ -z "$WF_ID" ]; then
            echo "Workflow '$TARGET_NAME' not found. Skip."
            exit 0
          fi

          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_ID/runs?per_page=100" \
            --jq '.workflow_runs[].id')

          i=0
          for run_id in $RUNS; do
            i=$((i+1))
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then continue; fi
            if [ "$i" -le "$KEEP" ]; then continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done