name: Extract FriendlyWrt Info

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (留空=最新)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download official rootfs tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/fw && cd /tmp/fw
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          fi
          echo "Release: $TAG"

          # 只下载 rootfs-friendlywrt-<ver>-docker.tgz，避开其它板子/资源
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "rootfs-friendlywrt-*-docker.tgz" \
            --dir .

          ls -lh

      - name: Extract info
        run: |
          cd /tmp/fw
          {
            echo "## FriendlyWrt 官方固件架构信息"
            echo ""
            echo "| 源文件 | DISTRIB_ID | DISTRIB_RELEASE | DISTRIB_ARCH | DISTRIB_TARGET |"
            echo "|---|---|---|---|---|"
          } > /tmp/result.md

          for tgz in rootfs-friendlywrt-*-docker.tgz; do
            [ -f "$tgz" ] || continue
            echo "=== $tgz ==="

            # 只抽取 openwrt_release，避免解压整个 200MB
            REL_FILE=$(tar -tzf "$tgz" 2>/dev/null | grep '/etc/openwrt_release$' | head -1)
            if [ -z "$REL_FILE" ]; then
              echo "  ❌ 未找到 etc/openwrt_release"
              continue
            fi

            CONTENT=$(tar -xzf "$tgz" -O "$REL_FILE" 2>/dev/null)
            ID=$(echo    "$CONTENT" | sed -n "s/^DISTRIB_ID=['\"]\([^'\"]*\)['\"].*/\1/p")
            REL=$(echo   "$CONTENT" | sed -n "s/^DISTRIB_RELEASE=['\"]\([^'\"]*\)['\"].*/\1/p")
            ARCH=$(echo  "$CONTENT" | sed -n "s/^DISTRIB_ARCH=['\"]\([^'\"]*\)['\"].*/\1/p")
            TGT=$(echo   "$CONTENT" | sed -n "s/^DISTRIB_TARGET=['\"]\([^'\"]*\)['\"].*/\1/p")

            echo "  ID      = $ID"
            echo "  RELEASE = $REL"
            echo "  ARCH    = $ARCH"
            echo "  TARGET  = $TGT"
            echo ""

            echo "| $tgz | $ID | $REL | $ARCH | $TGT |" >> /tmp/result.md
          done

          echo "----- 结果 -----"
          cat /tmp/result.md
          cat /tmp/result.md >> $GITHUB_STEP_SUMMARY