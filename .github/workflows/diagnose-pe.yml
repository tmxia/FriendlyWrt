name: Diagnose PE Kernel Structure

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.49'
      source_repo:
        description: 'Source repo'
        required: true
        default: 'ophub/kernel'
        type: choice
        options:
          - ophub/kernel
          - breakingbadboy/OpenWrt
      source_release:
        description: 'Release'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_rk35xx
          - kernel_stable

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl python3 xxd file gzip xz-utils zstd lz4

    - name: Download kernel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd /tmp
        URL="https://github.com/${{ inputs.source_repo }}/releases/download/${{ inputs.source_release }}/${{ inputs.kernel_version }}.tar.gz"
        echo "Downloading: $URL"
        wget -q "$URL" -O kernel.tar.gz || { echo "FAILED"; exit 1; }
        tar xzf kernel.tar.gz

    - name: Extract boot
      run: |
        cd /tmp
        KERNEL_VER="${{ inputs.kernel_version }}"
        LOCAL_DIR="$KERNEL_VER"
        if [ ! -d "$LOCAL_DIR" ]; then
          LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        fi
        echo "LOCAL_DIR=$LOCAL_DIR"
        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        echo "BOOT_TAR=$BOOT_TAR"
        mkdir -p boot_extract
        tar xzf "$BOOT_TAR" -C boot_extract
        ls -la boot_extract/

    - name: Analyze vmlinuz
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        [ -z "$VMLINUZ" ] && { echo "vmlinuz not found"; ls -la boot_extract/; exit 1; }
        echo "Analyzing: $VMLINUZ"
        echo "Size: $(stat -c%s "$VMLINUZ") bytes"
        echo "Type: $(file -b "$VMLINUZ")"

        echo ""
        echo "########## 前 128 字节 ##########"
        xxd -l 128 "$VMLINUZ"

        echo ""
        echo "########## PE 结构解析 ##########"
        python3 - "$VMLINUZ" <<'PYEOF'
        import sys, struct, os, gzip, lzma, subprocess

        src = sys.argv[1]
        outdir = "/tmp/sections"
        os.makedirs(outdir, exist_ok=True)
        data = open(src, 'rb').read()

        print(f"File size: {len(data)} bytes")

        if data[0:2] != b'MZ':
            print(f"Not PE (no MZ). ARM64 magic@{data.find(b'ARM\x64'):x}")
            sys.exit(0)

        pe_off = struct.unpack_from('<I', data, 0x3C)[0]
        print(f"PE header offset: 0x{pe_off:x}")
        if data[pe_off:pe_off+4] != b'PE\x00\x00':
            print(f"Bad PE sig: {data[pe_off:pe_off+4].hex()}")
            sys.exit(1)

        coff = pe_off + 4
        machine = struct.unpack_from('<H', data, coff)[0]
        num_sections = struct.unpack_from('<H', data, coff + 2)[0]
        opt_hdr_size = struct.unpack_from('<H', data, coff + 16)[0]

        print(f"Machine: 0x{machine:04x}")
        print(f"Num sections: {num_sections}")
        print(f"Opt hdr size: {opt_hdr_size}")

        sec_start = coff + 20 + opt_hdr_size
        print(f"\nSections:")
        print(f"{'#':<3} {'Name':<12} {'RawOff':>10} {'RawSize':>10} {'VAddr':>10}")
        print("-" * 55)

        sections = []
        for i in range(num_sections):
            off = sec_start + i * 40
            name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
            vsize = struct.unpack_from('<I', data, off + 8)[0]
            vaddr = struct.unpack_from('<I', data, off + 12)[0]
            raw_size = struct.unpack_from('<I', data, off + 16)[0]
            raw_off = struct.unpack_from('<I', data, off + 20)[0]
            sections.append({'name': name, 'off': raw_off, 'size': raw_size})
            print(f"{i:<3} {name:<12} 0x{raw_off:08x} 0x{raw_size:08x} 0x{vaddr:08x}")

        print(f"\n前 32 字节 + 格式:")
        for i, s in enumerate(sections):
            if s['size'] == 0 or s['off'] + 32 > len(data):
                continue
            chunk = data[s['off']:s['off']+32]
            fmt = ""
            sig = chunk[:6]
            if sig[:2] == b'\x1f\x8b': fmt = "gzip"
            elif sig[:6] == b'\xfd7zXZ\x00': fmt = "xz"
            elif sig[:4] == b'\x28\xb5\x2f\xfd': fmt = "zstd"
            elif sig[:4] == b'\x04\x22\x4d\x18': fmt = "lz4"
            elif sig[:2] == b'BZ': fmt = "bzip2"
            elif sig[:4] == b'\x7fELF': fmt = "ELF"
            elif chunk.find(b'ARM\x64') >= 0: fmt = "ARM64-Image"
            print(f"[{i}] {s['name']:<12} {chunk.hex()}")
            if fmt: print(f"    格式: {fmt}")
            sd = data[s['off']:s['off']+min(s['size'], 1<<20)]
            for m in range(len(sd)-4):
                if sd[m:m+4] == b'ARM\x64':
                    print(f"    ARM64 magic@+0x{m:x}")
                    break

        print(f"\n尝试解压各 section:")
        for i, s in enumerate(sections):
            name = s['name']
            off, size = s['off'], s['size']
            if size == 0 or size > 100*1024*1024 or off + size > len(data):
                continue
            sd = data[off:off+size]
            safe = name.replace('.', '_').lstrip('_') or f"sec{i}"
            base = os.path.join(outdir, safe)
            open(base + ".raw", 'wb').write(sd)
            result = None
            try:
                if sd[:2] == b'\x1f\x8b':
                    result = gzip.decompress(sd)
                elif sd[:6] == b'\xfd7zXZ\x00':
                    result = lzma.decompress(sd)
                elif sd[:4] == b'\x28\xb5\x2f\xfd':
                    r = subprocess.run(['zstd', '-d', '-c'], input=sd, capture_output=True)
                    if r.returncode == 0: result = r.stdout
                elif sd[:4] == b'\x04\x22\x4d\x18':
                    r = subprocess.run(['lz4', '-d', '-c'], input=sd, capture_output=True)
                    if r.returncode == 0: result = r.stdout
                elif sd[:2] == b'\x5d\x00':
                    result = lzma.decompress(sd)
            except Exception as e:
                print(f"[{i}] {name}: err {e}")

            if result:
                open(base + ".decompressed", 'wb').write(result)
                magic = result.find(b'ARM\x64')
                print(f"[{i}] {name}: ✓ 解压 {len(result)} bytes, magic@0x{magic:x}")
                print(f"    前 32: {result[:32].hex()}")
            else:
                magic = sd.find(b'ARM\x64')
                if magic >= 0:
                    print(f"[{i}] {name}: raw 含 magic@0x{magic:x}")

        print("\n===== 解压结果目录 =====")
        for f in sorted(os.listdir(outdir)):
            fp = os.path.join(outdir, f)
            print(f"  {f} ({os.path.getsize(fp)} bytes)")
        PYEOF

    - name: Summary
      run: |
        echo "=========================================="
        echo "诊断完成"
        echo "=========================================="