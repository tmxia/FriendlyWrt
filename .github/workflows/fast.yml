name: Quick Verify Kernel Replacement

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '24.10'
        type: choice
        options:
          - '24.10'
          - '25.12'
      build_set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
      model:
        description: 'Target model'
        required: true
        default: 'r5s'
        type: choice
        options:
          - r5s
          - r5c
      slim:
        description: 'Slim mode'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.y'
        type: choice
        options:
          - '6.18.y'
          - '6.12.y'
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KERNEL_SHORT="${{ inputs.kernel_version }}"
          BASE_TAG="FriendlyWrt-bbb-${KERNEL_SHORT}-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' \
              | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' \
              | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM+1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  quick_verify:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      KERNEL_REPO: 'breakingbadboy/OpenWrt'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl git rsync time file unzip bc bzip2 xxd \
          python3 dosfstools e2fsprogs parted \
          android-sdk-libsparse-utils u-boot-tools
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git clone https://github.com/friendlyarm/repo /tmp/repo
        sudo -E cp /tmp/repo/repo /usr/bin/
        mkdir -p $GITHUB_WORKSPACE/artifact
        chmod +x scripts/*.sh
        echo "=== 工具检查 ==="
        which xxd simg2img img2simg mkfs.ext4 mkimage curl
        echo "cores: $(nproc)"

    - name: Fetch sd-fuse scripts
      run: |
        cd /tmp
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests \
          -b master-v${{ inputs.version }} -m rk3568.xml \
          --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        ls -la /tmp/scripts/sd-fuse/

    - name: Find and download images tgz
      id: images
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SUFFIX=""
        [ "${{ inputs.build_set }}" == "docker" ] && SUFFIX="-docker"
        PATTERN="images-R5S-R5C-Series-FriendlyWrt-${{ inputs.version }}${SUFFIX}.tgz"
        echo "查找: $PATTERN"

        TAGS=$(gh release list --limit 50 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
        FOUND=""
        for TAG in $TAGS; do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
            FOUND="$TAG"; break
          fi
        done
        [ -z "$FOUND" ] && { echo "ERROR: 找不到 $PATTERN"; exit 1; }
        echo "使用 release: $FOUND"

        mkdir -p /tmp/inputs
        cd /tmp/inputs
        gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
        ls -la
        echo "images_tgz=/tmp/inputs/$PATTERN" >> $GITHUB_OUTPUT

    - name: Replace kernel and build image
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET_MODEL: ${{ inputs.model }}
        SLIM_MODE: ${{ inputs.slim }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
      run: |
        SUFFIX=""
        [ "${{ inputs.build_set }}" == "docker" ] && SUFFIX="-docker"
        DIST_NAME="friendlywrt$(echo ${{ inputs.version }} | awk -F . '{print $1}')${SUFFIX}"

        KERNEL_SHORT="${{ inputs.kernel_version }}"
        IMG_NAME="R5S-R5C-Series-FriendlyWrt-bbb-${KERNEL_SHORT}-${{ inputs.version }}${SUFFIX}.img"

        bash $GITHUB_WORKSPACE/scripts/replace-kernel.sh \
          "${{ steps.images.outputs.images_tgz }}" \
          "/tmp/scripts/sd-fuse" \
          "$DIST_NAME" \
          "$GITHUB_WORKSPACE/artifact/$IMG_NAME"

        echo "img_name=$IMG_NAME" >> $GITHUB_ENV

    - name: Compress image
      run: |
        cd $GITHUB_WORKSPACE/artifact
        echo "=== 压缩前 ==="
        ls -la
        gzip -f *.img
        echo "=== 压缩后 ==="
        ls -la

    - name: Upload img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ env.img_name }}.gz
        asset_name: ${{ env.img_name }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload img.gz as workflow artifact (backup)
      uses: actions/upload-artifact@v4
      with:
        name: img-bbb-${{ inputs.kernel_version }}-${{ inputs.version }}-${{ inputs.build_set }}-${{ inputs.model }}
        path: ${{ github.workspace }}/artifact/*.img.gz
        retention-days: 7