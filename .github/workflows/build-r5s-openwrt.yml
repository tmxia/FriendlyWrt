name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_VER: '25.12'
  MODEL_NAME: 'R5S'
  ROOTFS_PARTSIZE: '1024'
  OPENWRT_BRANCH: 'openwrt-25.12'

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate build matrix
        id: set-matrix
        run: bash scripts/platforms.sh

  prepare_release:
    runs-on: ubuntu-latest
    needs: init
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-$(date +%Y.%m.%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    name: Build ${{ matrix.platform }}
    needs: [init, prepare_release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.init.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile
          df -hT

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig \
            device-tree-compiler u-boot-tools e2fsprogs parted dosfstools mtools

      - name: Clone OpenWrt source
        run: |
          git clone -b ${{ matrix.value.REPO_BRANCH }} --single-branch \
            ${{ matrix.value.REPO_URL }} openwrt 2>&1 | tail -3

      - name: Configure custom feeds
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} pre

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tail -20

      - name: Apply custom modifications
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} post

      - name: Install feed packages
        run: |
          cd openwrt
          ./scripts/feeds install -a 2>&1 | tail -20

      - name: Load R5S configuration
        run: |
          cp $GITHUB_WORKSPACE/${{ matrix.value.CONFIG_FILE }} openwrt/.config

      - name: Adjust package configuration
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} config
          make defconfig

      - name: Compile OpenWrt firmware
        run: |
          cd openwrt

          set +e
          make -j$(nproc) 2>&1 | tee /tmp/build.log | \
            grep --line-buffered -E \
              "(^make\[[0-9]+\]: (Entering|Leaving)|^make: \*\*\*|^make\[[0-9]+\]: \*\*\*|error:|Error [0-9]|ERROR|failed|Failed|FAILED|undefined reference|collect2|No rule to make target|Package/[^ ]+ is not available)" \
            || true
          BUILD_RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "Build failed (exit code: $BUILD_RESULT)"
            echo "=========================================="
            echo ""
            echo "----- Error lines -----"
            grep -n -E "(^make\[[0-9]+\]: \*\*\*|^make: \*\*\*|Error [0-9]|error:|ERROR:|No rule to make target|undefined reference)" /tmp/build.log | head -40 || true

            FIRST_ERR_LINE=$(grep -n -m 1 -E "(^make\[[0-9]+\]: \*\*\*|^make: \*\*\*|Error [0-9]|error:|No rule to make target)" /tmp/build.log | cut -d: -f1 || true)
            if [ -n "$FIRST_ERR_LINE" ]; then
              START=$((FIRST_ERR_LINE > 150 ? FIRST_ERR_LINE - 150 : 1))
              END=$((FIRST_ERR_LINE + 80))
              echo ""
              echo "----- Error context (lines $START-$END) -----"
              sed -n "${START},${END}p" /tmp/build.log
            fi

            exit 1
          fi

          echo "Build succeeded"
          tail -10 /tmp/build.log
          ls -lh bin/targets/rockchip/armv8/*.img.gz 2>/dev/null || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Locate kernel build artifacts
        run: |
          cd openwrt

          TRIPLE_DIR=$(find build_dir -maxdepth 1 -type d -name "target-*_musl" | head -1)
          [ -z "$TRIPLE_DIR" ] && { echo "::error::target triple not found"; exit 1; }
          TRIPLE_DIR=$(realpath "$TRIPLE_DIR")
          echo "TRIPLE_DIR=$TRIPLE_DIR" >> $GITHUB_ENV

          KDIR=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "linux-rockchip*" | head -1)
          [ -z "$KDIR" ] && { echo "::error::linux-rockchip dir not found"; exit 1; }
          KDIR=$(realpath "$KDIR")
          echo "KDIR=$KDIR" >> $GITHUB_ENV

          IMG=$(find "$KDIR" -path "*/arch/arm64/boot/Image" -type f 2>/dev/null | head -1)
          [ -z "$IMG" ] && { echo "::error::Kernel Image not found"; exit 1; }
          IMG=$(realpath "$IMG")
          echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV

          DTB_DIR=$(find "$KDIR" -path "*/arch/arm64/boot/dts/rockchip" -type d 2>/dev/null | head -1)
          [ -z "$DTB_DIR" ] && { echo "::error::DTB dir not found"; exit 1; }
          DTB_DIR=$(realpath "$DTB_DIR")
          echo "DTB_DIR=$DTB_DIR" >> $GITHUB_ENV

          ROOTFS_SRC=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "root-*" | head -1)
          [ -z "$ROOTFS_SRC" ] && { echo "::error::Rootfs dir not found"; exit 1; }
          ROOTFS_SRC=$(realpath "$ROOTFS_SRC")
          echo "ROOTFS_SRC=$ROOTFS_SRC" >> $GITHUB_ENV

          KV=$(ls "$ROOTFS_SRC/lib/modules/" 2>/dev/null | head -1)
          echo "KV=$KV" >> $GITHUB_ENV
          [[ "$KV" == 6.12* ]] || { echo "::error::kernel modules not 6.12, got: $KV"; exit 1; }

      - name: Setup sd-fuse packaging tools
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf sd-fuse
          git clone --depth 1 -b master https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse 2>&1 | tail -2
          cd sd-fuse
          [ -f mk-emmc-image.sh ] || { echo "::error::mk-emmc-image.sh missing"; exit 1; }

          TGT="friendlywrt25"
          mkdir -p "$TGT"
          wget -q http://112.124.9.243/dvdfiles/rk3568/images-for-eflasher/emmc-flasher-images.tgz -O /tmp/emmc-flasher-images.tgz
          tar xzf /tmp/emmc-flasher-images.tgz

      - name: Package kernel and resource images
        run: |
          cd $GITHUB_WORKSPACE/sd-fuse
          TGT="friendlywrt25"

          [ -f "$IMAGE_PATH" ] || { echo "::error::Image not found: $IMAGE_PATH"; exit 1; }
          ./tools/mkkrnlimg "$IMAGE_PATH" "$TGT/kernel.img"
          [ -f "$TGT/kernel.img" ] || { echo "::error::kernel.img not generated"; exit 1; }
          cp "$TGT/kernel.img" "$TGT/boot.img"

          [ -d "$DTB_DIR" ] || { echo "::error::DTB dir not found: $DTB_DIR"; exit 1; }
          rm -rf /tmp/dtb-pack
          mkdir -p /tmp/dtb-pack

          R5S_DTB=""
          for cand in rk3568-nanopi-r5s.dtb rk3568-nanopi-r5c.dtb; do
            [ -f "$DTB_DIR/$cand" ] && { R5S_DTB="$cand"; break; }
          done
          [ -z "$R5S_DTB" ] && { echo "::error::rk3568-nanopi-r5s.dtb not found"; exit 1; }

          cp "$DTB_DIR/$R5S_DTB" /tmp/dtb-pack/rk-kernel.dtb
          for cand in rk3568-nanopi-r5s.dtb rk3568-nanopi-r5c.dtb; do
            [ -f "$DTB_DIR/$cand" ] && cp "$DTB_DIR/$cand" /tmp/dtb-pack/
          done

          cd /tmp/dtb-pack
          DTB_LIST=$(find . -maxdepth 1 -type f -name "*.dtb" -printf "%f\n" | sort)
          [ -z "$DTB_LIST" ] && { echo "::error::no dtb files"; exit 1; }

          "$OLDPWD/tools/resource_tool" --pack \
            --root=. \
            --image="$OLDPWD/$TGT/resource.img" \
            $DTB_LIST
          cd "$OLDPWD"

          [ -f "$TGT/resource.img" ] || { echo "::error::resource.img not generated"; exit 1; }

          for f in uboot.img idbloader.img MiniLoaderAll.bin misc.img dtbo.img; do
            [ -f "prebuilt/$f" ] && cp "prebuilt/$f" "$TGT/$f"
          done

          ls -lh "$TGT"/kernel.img "$TGT"/resource.img

      - name: Build rootfs image
        run: |
          cd $GITHUB_WORKSPACE/sd-fuse
          TGT="friendlywrt25"

          [ -d "$ROOTFS_SRC" ] || { echo "::error::Rootfs src not found"; exit 1; }

          rm -rf /tmp/rootfs-pack
          cp -a "$ROOTFS_SRC" /tmp/rootfs-pack
          (cd /tmp/rootfs-pack/dev && find . ! -type d -exec rm -f {} \; ) 2>/dev/null || true

          ACTUAL_MB=$(du -sm /tmp/rootfs-pack | awk '{print $1}')
          echo "rootfs: ${ACTUAL_MB} MB / ${ROOTFS_PARTSIZE} MB"
          if [ "$ACTUAL_MB" -gt "$ROOTFS_PARTSIZE" ]; then
            echo "::error::rootfs content exceeds ROOTFS_PARTSIZE"
            exit 1
          fi

          LOGICAL_SIZE=$(( ROOTFS_PARTSIZE * 1024 * 1024 ))
          IMG_BLK=$(( LOGICAL_SIZE / 4096 ))
          INODE_SIZE=$(( $(find /tmp/rootfs-pack | wc -l) + 128 ))

          rm -f "$TGT/rootfs.img"
          MKE2FS_CONFIG="$PWD/tools/mke2fs.conf" \
            "$PWD/tools/mke2fs" -N "$INODE_SIZE" \
              -E android_sparse -t ext4 -L rootfs -M /root -b 4096 -0 \
              -d /tmp/rootfs-pack "$TGT/rootfs.img" "$IMG_BLK"

          [ -f "$TGT/rootfs.img" ] || { echo "::error::rootfs.img generation failed"; exit 1; }

          PARAMETER_TPL="$PWD/prebuilt/parameter.template" \
            ./tools/generate-partmap-txt.sh "$LOGICAL_SIZE" "$TGT"

          echo "ROOTFS_SIZE_BYTES=$LOGICAL_SIZE" >> $GITHUB_ENV
          ls -lh "$TGT/rootfs.img"
          cat "$TGT/parameter.txt"

      - name: Build SD card and eMMC images
        run: |
          cd $GITHUB_WORKSPACE/sd-fuse
          export SDFUSE_NONINTERACTIVE=y

          sudo -E ./mk-sd-image.sh friendlywrt25 > /tmp/sd-image.log 2>&1 || {
            tail -80 /tmp/sd-image.log
            exit 1
          }
          tail -20 /tmp/sd-image.log

          if grep -q "more than capacity" /tmp/sd-image.log; then
            echo "::error::mk-sd-image.sh skipped rootfs write"
            exit 1
          fi

          sudo -E ./mk-emmc-image.sh friendlywrt25 autostart=yes > /tmp/emmc-image.log 2>&1 || {
            tail -80 /tmp/emmc-image.log
            exit 1
          }
          tail -20 /tmp/emmc-image.log

          sudo chown -R "$(id -u):$(id -g)" out/ friendlywrt25/ 2>/dev/null || true
          ls -lh out/ out/images-for-eflasher/ 2>/dev/null || true

      - name: Collect and checksum artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifact
          cd $GITHUB_WORKSPACE/sd-fuse

          DATE=$(date +%Y.%m.%d)
          PREFIX="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-${DATE}"

          SRC_IMG=$(find out -maxdepth 1 -name "*.img" -type f 2>/dev/null | head -1)
          if [ -n "$SRC_IMG" ] && [ -s "$SRC_IMG" ]; then
            SRC_SIZE_MB=$(( $(stat -c%s "$SRC_IMG") / 1024 / 1024 ))
            if [ "$SRC_SIZE_MB" -lt 200 ]; then
              echo "::error::SD image only ${SRC_SIZE_MB} MB, rootfs may not be written"
              exit 1
            fi
            cp "$SRC_IMG" "/tmp/${PREFIX}-sdcard.img"
            gzip -f "/tmp/${PREFIX}-sdcard.img"
            cp "/tmp/${PREFIX}-sdcard.img.gz" $GITHUB_WORKSPACE/artifact/
            echo "SD image: ${PREFIX}-sdcard.img.gz"
          else
            echo "::error::no .img found from sd-fuse"
            exit 1
          fi

          SRC_TGZ=$(find out -maxdepth 3 -name "*-images.tgz" -type f 2>/dev/null | head -1)
          if [ -n "$SRC_TGZ" ] && [ -s "$SRC_TGZ" ]; then
            cp "$SRC_TGZ" "$GITHUB_WORKSPACE/artifact/${PREFIX}-emmc-flasher.tgz"
            echo "eMMC pack: ${PREFIX}-emmc-flasher.tgz"
          else
            echo "::warning::eMMC flasher pack not found"
          fi

          OPENWRT_SYSUP=$(find openwrt/bin/targets/rockchip/armv8 -maxdepth 1 \
            -name "*nanopi-r5s*sysupgrade.img.gz" -type f 2>/dev/null | head -1)
          if [ -n "$OPENWRT_SYSUP" ]; then
            cp "$OPENWRT_SYSUP" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sysupgrade.img.gz"
            echo "sysupgrade: ${PREFIX}-sysupgrade.img.gz"
          fi

          OPENWRT_MANIFEST=$(find openwrt/bin/targets/rockchip/armv8 -maxdepth 1 \
            -name "*nanopi-r5s*.manifest" -type f 2>/dev/null | head -1)
          [ -n "$OPENWRT_MANIFEST" ] && cp "$OPENWRT_MANIFEST" "$GITHUB_WORKSPACE/artifact/${PREFIX}-manifest.txt"

          cd $GITHUB_WORKSPACE/artifact
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] && [ "$f" != "SHA256SUMS" ] && sha256sum "$f" >> SHA256SUMS
          done
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware
          path: artifact/
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            artifact/*.gz
            artifact/*.tgz
            artifact/*-manifest.txt
            artifact/SHA256SUMS
          overwrite: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}