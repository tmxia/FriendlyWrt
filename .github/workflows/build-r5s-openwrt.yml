name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write
  packages: write

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_VER: '25.12'
  MODEL_NAME: 'R5S'
  OPENWRT_BRANCH: 'openwrt-25.12'
  OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
  CONFIG_FILE: 'scripts/r5s.config'
  DIY_SH: 'scripts/r5s_customize.sh'

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-$(date +%Y.%m.%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: true

  build:
    name: Build r5s
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile

          echo "--- memory ---"
          free -h
          echo "--- disk ---"
          df -hT

      - name: Relocate Docker to /workdir
        run: |
          sudo systemctl stop docker || true
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker || sudo service docker start
          sleep 3
          docker info | grep "Docker Root Dir" || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig zstd \
            device-tree-compiler u-boot-tools e2fsprogs parted dosfstools mtools \
            android-sdk-libsparse-utils btrfs-progs

      - name: Clone OpenWrt source
        working-directory: /workdir
        run: |
          git clone -b ${{ env.OPENWRT_BRANCH }} --single-branch \
            ${{ env.OPENWRT_REPO }} openwrt 2>&1 | tail -3
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Configure custom feeds
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tail -30

      - name: Apply custom modifications
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} post

      - name: Install feed packages
        run: |
          cd openwrt
          ./scripts/feeds install -a 2>&1 | tail -40

          echo "===== 已安装的 clashoo / docker 相关包 ====="
          find package/feeds -maxdepth 3 -type d \( -name 'clashoo' -o -name 'luci-app-dockerman' \) 2>/dev/null | head -20 || true

      - name: Load R5S configuration
        run: |
          cp $GITHUB_WORKSPACE/${{ env.CONFIG_FILE }} openwrt/.config

      - name: Adjust package configuration
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} config
          make defconfig

          for pkg in iptables-zz-legacy ip6tables-zz-legacy iptables-legacy; do
            sed -i "s/^CONFIG_PACKAGE_${pkg}=y/# CONFIG_PACKAGE_${pkg} is not set/" .config
            sed -i "s/^CONFIG_PACKAGE_${pkg}=m/# CONFIG_PACKAGE_${pkg} is not set/" .config
            grep -q "^# CONFIG_PACKAGE_${pkg} is not set" .config || \
              echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done
          make defconfig

          echo "===== Docker 相关 config ====="
          grep -E "^CONFIG_PACKAGE_(docker|dockerd|docker-compose|containerd|runc|tini|libnetwork|luci-app-dockerman|luci-lib-docker)" .config || echo "  (无)"
          echo "=============================="

          echo "===== 网卡驱动 config ====="
          grep -E "CONFIG_PACKAGE_kmod-(r8169|r8125|r8168)" .config || echo "  (无)"

      - name: Restore base build cache
        id: restore_cache
        run: |
          cd /workdir
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_restore

      - name: Compile base (tools + toolchain)
        id: compile_base
        run: |
          cd /workdir/openwrt
          touch /workdir/base_compilation_marker

          echo "==== Tools download ===="
          make tools/download -j1 || exit 1
          echo "==== Tools compile ===="
          time make tools/compile -j$(nproc) || exit 1

          echo "==== Toolchain download ===="
          make toolchain/download -j1 || exit 1
          echo "==== Toolchain compile ===="
          time make toolchain/compile -j$(nproc) || exit 1

      - name: Checkpoint base cache
        if: steps.compile_base.outcome == 'success'
        run: |
          cd /workdir/openwrt

          IGNORE_PATTERN="staging_dir/host/stamp/\.tools_compile_|staging_dir/target-[^/]+/stamp/\.target_prereq$"

          CHANGED=$(find build_dir staging_dir -type f -newer /workdir/base_compilation_marker -path "*/stamp/*" 2>/dev/null | \
                    grep -E -v "$IGNORE_PATTERN" | wc -l)

          echo "--- Found $CHANGED newer stamp files ---"

          if [ "$CHANGED" -eq 0 ]; then
            echo "Base cache is up-to-date, skipping checkpoint."
            exit 0
          fi

          echo "Base cache changed, saving..."
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_save

      - name: Compile OpenWrt firmware
        run: |
          cd /workdir/openwrt

          set +e
          make download -j8 > /tmp/download.log 2>&1 || true
          make -j$(nproc) V=s > /tmp/build.log 2>&1
          BUILD_RESULT=$?
          set -e

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "Build failed (exit code: $BUILD_RESULT)"

            if [ "$BUILD_RESULT" -gt 128 ]; then
              SIG=$((BUILD_RESULT - 128))
              echo "Process killed by signal $SIG"
              [ "$SIG" = "9" ] && echo "  -> SIGKILL (likely OOM)"
              free -h
              sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill" | tail -20 || true
            fi

            FIRST_ERR=$(grep -n -m 1 -E "^make(\[[0-9]+\])?: \*\*\* .* Error [0-9]" /tmp/build.log | cut -d: -f1)
            if [ -n "$FIRST_ERR" ]; then
              START=$((FIRST_ERR > 150 ? FIRST_ERR - 150 : 1))
              END=$((FIRST_ERR + 30))
              echo "----- Error context (lines $START-$END) -----"
              sed -n "${START},${END}p" /tmp/build.log
            else
              echo "----- Last 300 lines -----"
              tail -300 /tmp/build.log
            fi
            exit 1
          fi

          echo "Build succeeded"

      - name: Verify OpenWrt official outputs
        if: success()
        run: |
          cd /workdir/openwrt
          OUT="bin/targets/rockchip/armv8"

          echo "===== $OUT/ 目录内容 ====="
          ls -lh "$OUT"/*nanopi-r5s* 2>/dev/null || true

          SDIMG=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s-ext4-sysupgrade.img.gz" -type f | head -1)
          [ -n "$SDIMG" ] || { echo "::error::未找到 *nanopi-r5s-ext4-sysupgrade.img.gz（SD 卡镜像）"; exit 1; }
          echo "[OK] SD 卡镜像: $SDIMG ($(stat -c%s "$SDIMG") 字节)"

          SYSUP_SQ=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s-squashfs-sysupgrade.img.gz" -type f | head -1)
          [ -n "$SYSUP_SQ" ] || { echo "::error::未找到 *nanopi-r5s-squashfs-sysupgrade.img.gz"; exit 1; }
          echo "[OK] squashfs sysupgrade: $SYSUP_SQ ($(stat -c%s "$SYSUP_SQ") 字节)"

          MANIFEST=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s.manifest" -type f | head -1)
          [ -n "$MANIFEST" ] || { echo "::error::未找到 *nanopi-r5s.manifest"; exit 1; }
          echo "[OK] manifest: $MANIFEST"

          echo "===== manifest 中的关键包 ====="
          grep -E "^(kmod-r8169|clashoo|luci-app-clashoo|luci-app-amlogic|docker|dockerd|containerd|runc|luci-app-dockerman|ttyd) " "$MANIFEST" || true

      - name: Collect and checksum artifacts
        if: success()
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifact
          cd /workdir/openwrt
          OUT="bin/targets/rockchip/armv8"

          DATE=$(date +%Y.%m.%d)
          PREFIX="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-${DATE}"

          SDIMG=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s-ext4-sysupgrade.img.gz" -type f | head -1)
          if [ -n "$SDIMG" ] && [ -s "$SDIMG" ]; then
            cp "$SDIMG" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sdcard.img.gz"
            echo "SD image: ${PREFIX}-sdcard.img.gz"
          else
            echo "::error::SD image not found"
            exit 1
          fi

          SYSUP_SQ=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s-squashfs-sysupgrade.img.gz" -type f | head -1)
          if [ -n "$SYSUP_SQ" ] && [ -s "$SYSUP_SQ" ]; then
            cp "$SYSUP_SQ" "$GITHUB_WORKSPACE/artifact/${PREFIX}-squashfs-sysupgrade.img.gz"
            echo "squashfs sysupgrade: ${PREFIX}-squashfs-sysupgrade.img.gz"
          fi

          MANIFEST=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s.manifest" -type f | head -1)
          [ -n "$MANIFEST" ] && cp "$MANIFEST" "$GITHUB_WORKSPACE/artifact/${PREFIX}-manifest.txt"

          SUMFILE=$(find "$OUT" -maxdepth 1 -name "sha256sums" -type f | head -1)
          [ -n "$SUMFILE" ] && cp "$SUMFILE" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sha256sums.txt"

          cd $GITHUB_WORKSPACE/artifact
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] && [ "$f" != "SHA256SUMS" ] && sha256sum "$f" >> SHA256SUMS
          done
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware
          path: artifact/
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            artifact/*.gz
            artifact/*-manifest.txt
            artifact/*-sha256sums.txt
            artifact/SHA256SUMS
          overwrite_files: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}