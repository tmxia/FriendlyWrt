name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  # ============================================================
  # 唯一内核版本：24.10 / 25.12 都强制使用 6.12
  # ============================================================
  KERNEL_VERSION: '6.12'
  # OpenWrt 官方内核来源（main 分支已包含完整 6.12 支持）
  OPENWRT_KERNEL_REPO: 'https://github.com/openwrt/openwrt.git'
  OPENWRT_KERNEL_BRANCH: 'main'

jobs:
  # ============================================================
  # 准备 Release
  # ============================================================
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag with auto-increment or overwrite
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="OpenWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            echo "Force overwrite mode: deleting all existing releases with tag prefix $BASE_TAG"
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  # ============================================================
  # 手动触发构建
  # ============================================================
  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}, kernel: ${{ env.KERNEL_VERSION }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    # ============================================================
    # 核心步骤：用 OpenWrt 官方 6.12 内核替换 FriendlyWrt 内核
    # ============================================================
    - name: Replace FriendlyWrt kernel with OpenWrt official ${{ env.KERNEL_VERSION }}
      run: |
        set -euo pipefail
        FW_DIR="$(pwd)/project/friendlywrt"
        KV="${{ env.KERNEL_VERSION }}"
        cd "$FW_DIR"

        echo "===== [1/5] Sparse clone OpenWrt official repo ====="
        rm -rf /tmp/openwrt-kernel
        git clone --depth=1 --branch "${{ env.OPENWRT_KERNEL_BRANCH }}" \
          --filter=blob:none --sparse \
          "${{ env.OPENWRT_KERNEL_REPO }}" /tmp/openwrt-kernel

        pushd /tmp/openwrt-kernel > /dev/null
        git sparse-checkout set target/linux/generic target/linux/rockchip
        git checkout HEAD -- . 2>/dev/null || true
        popd > /dev/null

        echo "===== [2/5] Verify official kernel sources exist ====="
        for d in patches backport hack pending; do
          if [ ! -d "/tmp/openwrt-kernel/target/linux/generic/${d}-${KV}" ]; then
            echo "ERROR: official generic/${d}-${KV} missing in openwrt@main"
            ls -la /tmp/openwrt-kernel/target/linux/generic/ | head -40 || true
            exit 1
          fi
        done
        if [ ! -f "/tmp/openwrt-kernel/target/linux/generic/config-${KV}" ]; then
          echo "ERROR: official generic/config-${KV} missing"; exit 1
        fi

        echo "===== [3/5] Replace generic kernel files ====="
        for d in patches backport hack pending; do
          echo "  -> target/linux/generic/${d}-${KV}"
          rm -rf "target/linux/generic/${d}-${KV}"
          cp -a "/tmp/openwrt-kernel/target/linux/generic/${d}-${KV}" \
                "target/linux/generic/"
        done
        cp -f "/tmp/openwrt-kernel/target/linux/generic/config-${KV}" \
              "target/linux/generic/config-${KV}"

        echo "===== [4/5] Replace rockchip kernel files ====="
        if [ -d "/tmp/openwrt-kernel/target/linux/rockchip/patches-${KV}" ]; then
          echo "  -> target/linux/rockchip/patches-${KV}"
          rm -rf "target/linux/rockchip/patches-${KV}"
          cp -a "/tmp/openwrt-kernel/target/linux/rockchip/patches-${KV}" \
                "target/linux/rockchip/"
        else
          echo "WARN: official rockchip/patches-${KV} not found, keeping FriendlyWrt's"
        fi
        if [ -f "/tmp/openwrt-kernel/target/linux/rockchip/config-${KV}" ]; then
          echo "  -> target/linux/rockchip/config-${KV}"
          cp -f "/tmp/openwrt-kernel/target/linux/rockchip/config-${KV}" \
                "target/linux/rockchip/config-${KV}"
        fi
        if [ -f "/tmp/openwrt-kernel/target/linux/rockchip/armv8/config-${KV}" ]; then
          echo "  -> target/linux/rockchip/armv8/config-${KV}"
          mkdir -p "target/linux/rockchip/armv8"
          cp -f "/tmp/openwrt-kernel/target/linux/rockchip/armv8/config-${KV}" \
                "target/linux/rockchip/armv8/config-${KV}"
        fi

        echo "===== [5/5] Final verification ====="
        for d in patches backport hack pending; do
          [ -d "target/linux/generic/${d}-${KV}" ] || { echo "FAIL: generic/${d}-${KV}"; exit 1; }
        done
        [ -f "target/linux/generic/config-${KV}" ]        || { echo "FAIL: generic/config-${KV}"; exit 1; }
        [ -d "target/linux/rockchip/patches-${KV}" ]      || { echo "FAIL: rockchip/patches-${KV}"; exit 1; }
        [ -f "target/linux/rockchip/config-${KV}" ]       || { echo "FAIL: rockchip/config-${KV}"; exit 1; }
        [ -f "target/linux/rockchip/armv8/config-${KV}" ] || { echo "FAIL: rockchip/armv8/config-${KV}"; exit 1; }

        echo "[OK] Kernel ${KV} replaced with OpenWrt official successfully"

    - name: Force KERNEL_PATCHVER to 6.12
      run: |
        set -euo pipefail
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"

        [ -f "$MAKEFILE" ] || { echo "ERROR: $MAKEFILE not found"; exit 1; }

        echo "===== Before ====="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

        sed -i '/^KERNEL_PATCHVER[[:space:]]*:/d'         "$MAKEFILE"
        sed -i '/^KERNEL_TESTING_PATCHVER[[:space:]]*:/d' "$MAKEFILE"

        echo "KERNEL_PATCHVER := ${KV}" >> "$MAKEFILE"

        echo "===== After ====="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds (build.sh #1)
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    # ============================================================
    # 修复：直接用 make oldconfig 非交互刷新 .config（不再空跑 build.sh）
    # ============================================================
    - name: Update config after custom packages
      run: |
        set -euo pipefail
        cd project/friendlywrt

        yes "" | make oldconfig

        set_kconfig() {
          local key="$1" val="$2"
          if grep -q "^${key}=" .config; then
            sed -i "s|^${key}=.*|${key}=${val}|" .config
          elif grep -q "^# ${key} is not set$" .config; then
            sed -i "s|^# ${key} is not set$|${key}=${val}|" .config
          else
            echo "${key}=${val}" >> .config
          fi
          grep -q "^${key}=${val}$" .config || { echo "ERROR: failed to set ${key}=${val}"; exit 1; }
        }

        echo "Enabling Clashoo & theme packages in .config..."
        set_kconfig CONFIG_PACKAGE_clashoo                 y
        set_kconfig CONFIG_PACKAGE_luci-app-clashoo        y
        set_kconfig CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn y
        set_kconfig CONFIG_PACKAGE_luci-theme-bootstrap    y

        yes "" | make oldconfig

        echo "===== Final custom package state ====="
        for k in CONFIG_PACKAGE_clashoo CONFIG_PACKAGE_luci-app-clashoo \
                 CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn CONFIG_PACKAGE_luci-theme-bootstrap; do
          grep -q "^${k}=y$" .config && echo "[OK] ${k}" || { echo "[FAIL] ${k}"; exit 1; }
        done

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

        echo "=== Verify kernel 6.12 resources are present ==="
        KV="${{ env.KERNEL_VERSION }}"
        ls -d  target/linux/generic/patches-${KV} \
               target/linux/generic/backport-${KV} \
               target/linux/generic/hack-${KV} \
               target/linux/generic/pending-${KV} \
               target/linux/rockchip/patches-${KV}
        ls -f  target/linux/generic/config-${KV} \
               target/linux/rockchip/config-${KV} \
               target/linux/rockchip/armv8/config-${KV}

        echo "=== Verify KERNEL_PATCHVER ==="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || true

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        set +e
        make -j$(nproc) > /tmp/build.log 2>&1
        BUILD_EXIT=$?
        set -e
        echo "===== exit code: $BUILD_EXIT ====="
        if [ $BUILD_EXIT -ne 0 ]; then tail -300 /tmp/build.log; else tail -30 /tmp/build.log; fi
        exit $BUILD_EXIT

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        if [ -z "$PM_BIN" ]; then
          echo "ERROR: neither apk nor opkg found under ${FRIENDLYWRT_SRC}/staging_dir/host/bin/"
          exit 1
        fi
        echo "Detected host package manager: $PM_BIN"

        ldd_out=$(ldd "$PM_BIN" 2>&1 || true)
        echo "$ldd_out"
        if ! echo "$ldd_out" | grep -q "not a dynamic executable"; then
          bad_paths=$(echo "$ldd_out" | grep -oE '=> /[^ ]+' | sed 's|=> ||' \
                       | grep -vE '^/(lib|lib64|usr/lib)/' || true)
          not_found=$(echo "$ldd_out" | grep -F "not found" || true)
          if [ -n "$bad_paths" ] || [ -n "$not_found" ]; then
            echo "ERROR: $PM_BIN has non-portable dynamic dependencies:"
            [ -n "$bad_paths" ] && { echo "non-system paths:"; echo "$bad_paths"; }
            [ -n "$not_found" ] && { echo "unresolved:"; echo "$not_found"; }
            exit 1
          fi
        fi

        host_pm_filename="host-pm-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}-docker.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568) MODEL=R5S-R5C-Series ;;
        *) echo "unknown cpu"; exit 1 ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-OpenWrt-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-OpenWrt-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        tar xzf "../rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}.tgz"

    - name: Re-assert KERNEL_PATCHVER before uboot/kernel build
      run: |
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"
        sed -i '/^KERNEL_PATCHVER[[:space:]]*:/d'         "$MAKEFILE"
        sed -i '/^KERNEL_TESTING_PATCHVER[[:space:]]*:/d' "$MAKEFILE"
        echo "KERNEL_PATCHVER := ${KV}" >> "$MAKEFILE"
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

    - name: Compile uboot and kernel
      run: |
        cd project
        ./build.sh uboot
        ./build.sh kernel

    - name: Build sd image
      id: build_sd_image
      run: |
        cd project
        ./build.sh sd-img
        mv out/${{ steps.config.outputs.img_filename }} ../artifact/

        pushd scripts/sd-fuse/ > /dev/null
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
            echo "ERROR: image directory ${{ steps.config.outputs.dist_dir }} not found under scripts/sd-fuse/"
            ls -la
            exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null

        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ============================================================
  # Watch 自动触发构建
  # ============================================================
  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
        CPU: [rk3568]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Replace FriendlyWrt kernel with OpenWrt official ${{ env.KERNEL_VERSION }}
      run: |
        set -euo pipefail
        FW_DIR="$(pwd)/project/friendlywrt"
        KV="${{ env.KERNEL_VERSION }}"
        cd "$FW_DIR"

        echo "===== [1/5] Sparse clone OpenWrt official repo ====="
        rm -rf /tmp/openwrt-kernel
        git clone --depth=1 --branch "${{ env.OPENWRT_KERNEL_BRANCH }}" \
          --filter=blob:none --sparse \
          "${{ env.OPENWRT_KERNEL_REPO }}" /tmp/openwrt-kernel

        pushd /tmp/openwrt-kernel > /dev/null
        git sparse-checkout set target/linux/generic target/linux/rockchip
        git checkout HEAD -- . 2>/dev/null || true
        popd > /dev/null

        echo "===== [2/5] Verify official kernel sources ====="
        for d in patches backport hack pending; do
          if [ ! -d "/tmp/openwrt-kernel/target/linux/generic/${d}-${KV}" ]; then
            echo "ERROR: generic/${d}-${KV} missing in openwrt@main"; exit 1
          fi
        done
        [ -f "/tmp/openwrt-kernel/target/linux/generic/config-${KV}" ] || \
          { echo "ERROR: generic/config-${KV} missing"; exit 1; }

        echo "===== [3/5] Replace generic ====="
        for d in patches backport hack pending; do
          rm -rf "target/linux/generic/${d}-${KV}"
          cp -a "/tmp/openwrt-kernel/target/linux/generic/${d}-${KV}" "target/linux/generic/"
        done
        cp -f "/tmp/openwrt-kernel/target/linux/generic/config-${KV}" "target/linux/generic/"

        echo "===== [4/5] Replace rockchip ====="
        if [ -d "/tmp/openwrt-kernel/target/linux/rockchip/patches-${KV}" ]; then
          rm -rf "target/linux/rockchip/patches-${KV}"
          cp -a "/tmp/openwrt-kernel/target/linux/rockchip/patches-${KV}" "target/linux/rockchip/"
        fi
        [ -f "/tmp/openwrt-kernel/target/linux/rockchip/config-${KV}" ] && \
          cp -f "/tmp/openwrt-kernel/target/linux/rockchip/config-${KV}" "target/linux/rockchip/"
        if [ -f "/tmp/openwrt-kernel/target/linux/rockchip/armv8/config-${KV}" ]; then
          mkdir -p "target/linux/rockchip/armv8"
          cp -f "/tmp/openwrt-kernel/target/linux/rockchip/armv8/config-${KV}" "target/linux/rockchip/armv8/"
        fi

        echo "===== [5/5] Verify ====="
        for d in patches backport hack pending; do
          [ -d "target/linux/generic/${d}-${KV}" ] || { echo "FAIL: generic/${d}-${KV}"; exit 1; }
        done
        [ -f "target/linux/generic/config-${KV}" ]        || { echo "FAIL: generic/config-${KV}"; exit 1; }
        [ -d "target/linux/rockchip/patches-${KV}" ]      || { echo "FAIL: rockchip/patches-${KV}"; exit 1; }
        [ -f "target/linux/rockchip/config-${KV}" ]       || { echo "FAIL: rockchip/config-${KV}"; exit 1; }
        [ -f "target/linux/rockchip/armv8/config-${KV}" ] || { echo "FAIL: armv8/config-${KV}"; exit 1; }
        echo "[OK] Kernel ${KV} replaced"

    - name: Force KERNEL_PATCHVER to 6.12
      run: |
        set -euo pipefail
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"
        [ -f "$MAKEFILE" ] || { echo "ERROR: $MAKEFILE not found"; exit 1; }
        sed -i '/^KERNEL_PATCHVER[[:space:]]*:/d'         "$MAKEFILE"
        sed -i '/^KERNEL_TESTING_PATCHVER[[:space:]]*:/d' "$MAKEFILE"
        echo "KERNEL_PATCHVER := ${KV}" >> "$MAKEFILE"
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds (build.sh #1)
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        set -euo pipefail
        cd project/friendlywrt
        yes "" | make oldconfig

        set_kconfig() {
          local key="$1" val="$2"
          if grep -q "^${key}=" .config; then
            sed -i "s|^${key}=.*|${key}=${val}|" .config
          elif grep -q "^# ${key} is not set$" .config; then
            sed -i "s|^# ${key} is not set$|${key}=${val}|" .config
          else
            echo "${key}=${val}" >> .config
          fi
          grep -q "^${key}=${val}$" .config || { echo "ERROR: failed to set ${key}=${val}"; exit 1; }
        }

        set_kconfig CONFIG_PACKAGE_clashoo                 y
        set_kconfig CONFIG_PACKAGE_luci-app-clashoo        y
        set_kconfig CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn y
        set_kconfig CONFIG_PACKAGE_luci-theme-bootstrap    y

        yes "" | make oldconfig

        for k in CONFIG_PACKAGE_clashoo CONFIG_PACKAGE_luci-app-clashoo \
                 CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn CONFIG_PACKAGE_luci-theme-bootstrap; do
          grep -q "^${k}=y$" .config && echo "[OK] ${k}" || { echo "[FAIL] ${k}"; exit 1; }
        done

    - name: Verify config
      run: |
        cd project/friendlywrt
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"
        KV="${{ env.KERNEL_VERSION }}"
        ls -d  target/linux/generic/patches-${KV} \
               target/linux/generic/backport-${KV} \
               target/linux/generic/hack-${KV} \
               target/linux/generic/pending-${KV} \
               target/linux/rockchip/patches-${KV}
        ls -f  target/linux/generic/config-${KV} \
               target/linux/rockchip/config-${KV} \
               target/linux/rockchip/armv8/config-${KV}

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        set +e
        make -j$(nproc) > /tmp/build.log 2>&1
        BUILD_EXIT=$?
        set -e
        echo "===== exit code: $BUILD_EXIT ====="
        if [ $BUILD_EXIT -ne 0 ]; then tail -300 /tmp/build.log; else tail -30 /tmp/build.log; fi
        exit $BUILD_EXIT

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        [ -z "$PM_BIN" ] && { echo "ERROR: no apk/opkg"; exit 1; }
        ldd_out=$(ldd "$PM_BIN" 2>&1 || true)
        echo "$ldd_out"
        if ! echo "$ldd_out" | grep -q "not a dynamic executable"; then
          bad_paths=$(echo "$ldd_out" | grep -oE '=> /[^ ]+' | sed 's|=> ||' | grep -vE '^/(lib|lib64|usr/lib)/' || true)
          not_found=$(echo "$ldd_out" | grep -F "not found" || true)
          if [ -n "$bad_paths" ] || [ -n "$not_found" ]; then
            echo "ERROR: $PM_BIN has non-portable dynamic dependencies"
            [ -n "$bad_paths" ] && echo "$bad_paths"
            [ -n "$not_found" ] && echo "$not_found"
            exit 1
          fi
        fi
        host_pm_filename="host-pm-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}-docker.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        case ${{ matrix.CPU }} in
        rk3568) MODEL=R5S-R5C-Series ;;
        *) echo "unknown cpu"; exit 1 ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-OpenWrt-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-OpenWrt-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/${{ matrix.CPU }}/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL
        echo "img_filename=$IMG_FILE"     >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR"         >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX"             >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        tar xzf "../rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}.tgz"

    - name: Re-assert KERNEL_PATCHVER before uboot/kernel build
      run: |
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"
        sed -i '/^KERNEL_PATCHVER[[:space:]]*:/d'         "$MAKEFILE"
        sed -i '/^KERNEL_TESTING_PATCHVER[[:space:]]*:/d' "$MAKEFILE"
        echo "KERNEL_PATCHVER := ${KV}" >> "$MAKEFILE"
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

    - name: Compile uboot and kernel
      run: |
        cd project
        ./build.sh uboot
        ./build.sh kernel

    - name: Build sd image
      id: build_sd_image
      run: |
        cd project
        ./build.sh sd-img
        mv out/${{ steps.config.outputs.img_filename }} ../artifact/

        pushd scripts/sd-fuse/ > /dev/null
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
            echo "ERROR: image directory not found"; ls -la; exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-${{ matrix.CPU }}"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null

        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ============================================================
  # 清理
  # ============================================================
  cleanup_intermediate_assets:
    needs: [prepare_release, build_manual, build_auto]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-friendlywrt-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build_manual, build_auto, cleanup_intermediate_assets]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}