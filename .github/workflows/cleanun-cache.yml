name: Cleanup GHCR All Cache

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -e
          PKGS="r5s-base-cache r5s-cache"

          for PKG in $PKGS; do
            echo ""
            echo "==================== $PKG ===================="

            if [ "$OWNER_TYPE" = "Organization" ]; then
              BASE="/orgs/${OWNER}/packages/container/${PKG}/versions"
              PKG_URL="/orgs/${OWNER}/packages/container/${PKG}"
            else
              BASE="/users/${OWNER}/packages/container/${PKG}/versions"
              PKG_URL="/users/${OWNER}/packages/container/${PKG}"
            fi

            PAGE=1
            while :; do
              BATCH=$(gh api "${BASE}?per_page=100&page=${PAGE}" 2>/dev/null || echo "[]")
              COUNT=$(echo "$BATCH" | jq 'length' 2>/dev/null || echo 0)
              [ "$COUNT" -eq 0 ] && break

              echo "  page $PAGE: $COUNT versions"

              echo "$BATCH" | jq -r '.[].id' | while read -r VID; do
                [ -z "$VID" ] && continue
                gh api -X DELETE "${BASE}/${VID}" >/dev/null 2>&1 \
                  && echo "    ✓ $VID" \
                  || echo "    ✗ $VID"
              done

              [ "$COUNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done

            gh api -X DELETE "$PKG_URL" >/dev/null 2>&1 \
              && echo "  ✓ package deleted" \
              || echo "  (package metadata already gone)"
          done

          echo ""
          echo "Done"