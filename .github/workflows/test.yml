name: Diagnostic - Inspect Kernel Image Structure

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to diagnose'
        required: true
        default: '24.10'
        type: choice
        options:
          - '24.10'
          - '25.12'
      set:
        description: 'Type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: Install diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            file xxd binwalk p7zip-full u-boot-tools \
            device-tree-compiler cpio gzip xz-utils lz4 zstd

      - name: Find latest release with images tgz
        id: find_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUFFIX=""
          [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
          PATTERN="images-R5S-R5C-Series-FriendlyWrt-flippy-${{ inputs.version }}${SUFFIX}.tgz"
          echo "Looking for: $PATTERN"

          # 遍历最近 30 个 release，找到包含该文件的最新一个
          TAGS=$(gh release list --limit 30 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
          FOUND=""
          for TAG in $TAGS; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
              FOUND="$TAG"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "ERROR: No release found containing $PATTERN"
            echo "List of recent assets:"
            for TAG in $TAGS; do
              echo "=== $TAG ==="
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true
            done
            exit 1
          fi
          echo "release_tag=$FOUND" >> $GITHUB_OUTPUT
          echo "pattern=$PATTERN" >> $GITHUB_OUTPUT

      - name: Download existing images tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/existing
          cd /tmp/existing
          gh release download "${{ steps.find_release.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.find_release.outputs.pattern }}" \
            --dir .
          ls -la

      - name: Extract and inspect images tgz
        run: |
          cd /tmp/existing
          TGZ="${{ steps.find_release.outputs.pattern }}"
          tar xzf "$TGZ"
          echo "########## Top-level contents ##########"
          ls -la

          # 找到解压出来的顶层目录
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          echo "IMG_DIR=$IMG_DIR"
          echo "########## Contents of $IMG_DIR ##########"
          ls -la "$IMG_DIR/"

          echo ""
          echo "########## File types of every file ##########"
          for f in "$IMG_DIR"/*; do
            echo "--- $(basename $f)"
            file "$f"
          done

      - name: Deep inspect kernel.img
        run: |
          cd /tmp/existing
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          KIMG="$IMG_DIR/kernel.img"
          echo "########## kernel.img size ##########"
          ls -la "$KIMG"
          echo "########## kernel.img first 256 bytes (hex) ##########"
          xxd "$KIMG" | head -16
          echo "########## kernel.img strings (first 40 lines) ##########"
          strings "$KIMG" | head -40
          echo "########## kernel.img FIT header check ##########"
          # FIT image magic is 0xd00dfeed
          MAGIC=$(xxd -l 4 -p "$KIMG")
          echo "Magic: $MAGIC"
          if [ "$MAGIC" = "d00dfeed" ]; then
            echo ">>> This is a FIT image (Device Tree format)"
            echo "########## FIT structure ##########"
            fdtdump "$KIMG" 2>/dev/null | head -100 || true
            echo "########## Fit image content with dumpimage ##########"
            dumpimage -l "$KIMG" 2>&1 | head -50 || true
          elif [[ "$MAGIC" == 1f8b* ]]; then
            echo ">>> This is gzip compressed"
          elif [[ "$MAGIC" == fd377a58* ]]; then
            echo ">>> This is xz compressed"
          else
            echo ">>> Unknown format, trying binwalk"
            binwalk "$KIMG" | head -30
          fi

      - name: Deep inspect boot.img
        run: |
          cd /tmp/existing
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          BIMG="$IMG_DIR/boot.img"
          echo "########## boot.img size ##########"
          ls -la "$BIMG"
          echo "########## boot.img first 256 bytes ##########"
          xxd "$BIMG" | head -16
          echo "########## boot.img strings ##########"
          strings "$BIMG" | head -20
          echo "########## Try 7z listing ##########"
          7z l "$BIMG" 2>&1 | head -40 || true
          echo "########## Try binwalk ##########"
          binwalk "$BIMG" | head -30 || true

      - name: Deep inspect resource.img and dtbo.img
        run: |
          cd /tmp/existing
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          for name in resource.img dtbo.img; do
            F="$IMG_DIR/$name"
            [ -f "$F" ] || continue
            echo "########## $name ##########"
            ls -la "$F"
            file "$F"
            xxd "$F" | head -8
            strings "$F" | head -10
          done

      - name: Download and inspect flippy kernel package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/flippy
          cd /tmp/flippy
          ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
          VERSIONS=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//' | sort -V)
          LATEST=$(echo "$VERSIONS" | tail -1)
          echo "Latest flippy kernel: $LATEST"
          wget -q "https://github.com/ophub/kernel/releases/download/kernel_flippy/${LATEST}.tar.gz" -O flippy.tar.gz
          tar xzf flippy.tar.gz
          KDIR="$LATEST"
          echo "########## Contents of $KDIR ##########"
          ls -la "$KDIR"

          BOOT_TAR=$(find "$KDIR" -name "boot-*.tar.gz" | head -1)
          DTB_TAR=$(find "$KDIR" -name "dtb-rockchip-*.tar.gz" | head -1)
          MODULES_TAR=$(find "$KDIR" -name "modules-*.tar.gz" | head -1)

          echo ""
          echo "########## Extracting boot package ##########"
          mkdir -p boot
          tar xzf "$BOOT_TAR" -C boot
          echo "Contents:"
          ls -la boot/
          echo ""
          echo "########## File types ##########"
          for f in boot/*; do
            echo "--- $(basename $f)"
            file "$f"
          done
          echo ""
          echo "########## vmlinuz first 256 bytes ##########"
          VMLINUZ=$(find boot -name "vmlinuz-*" | head -1)
          xxd "$VMLINUZ" | head -16
          echo "########## vmlinuz strings (first 20) ##########"
          strings "$VMLINUZ" | head -20
          echo "########## vmlinuz decompressed first bytes ##########"
          # 尝试解压
          VMLINUZ_MAGIC=$(xxd -l 4 -p "$VMLINUZ")
          echo "Magic: $VMLINUZ_MAGIC"
          if [[ "$VMLINUZ_MAGIC" == 1f8b* ]]; then
            echo ">>> gzip compressed, decompressing first 1MB to check"
            zcat "$VMLINUZ" 2>/dev/null | head -c 65536 | xxd | head -8
          fi

          echo ""
          echo "########## uInitrd first 256 bytes ##########"
          UINITRD=$(find boot -name "uInitrd-*" | head -1)
          xxd "$UINITRD" | head -16
          echo "########## uInitrd file type ##########"
          file "$UINITRD"

          echo ""
          echo "########## Extracting dtb package ##########"
          mkdir -p dtb
          tar xzf "$DTB_TAR" -C dtb
          echo "Total dtb files: $(ls dtb/*.dtb 2>/dev/null | wc -l)"
          echo "R5S/R5C related dtb files:"
          ls dtb/ | grep -iE "r5s|r5c|rk3568" | head -30

      - name: Check if flippy kernel can be converted to FIT
        run: |
          cd /tmp/flippy
          echo "########## Check for mkimage tool ##########"
          which mkimage
          mkimage -V 2>&1 || true
          
          echo ""
          echo "########## Try to convert flippy vmlinuz to FIT ##########"
          KDIR=$(find . -maxdepth 1 -type d -name "6.*" | head -1)
          VMLINUZ=$(find "$KDIR/boot" -name "vmlinuz-*" | head -1)
          echo "vmlinuz: $VMLINUZ"
          
          # 尝试解压 vmlinuz（如果是 gzip）
          if [[ "$(xxd -l 2 -p "$VMLINUZ")" == "1f8b" ]]; then
            echo ">>> vmlinuz is gzip compressed, decompressing..."
            zcat "$VMLINUZ" > /tmp/Image 2>/dev/null || true
            file /tmp/Image
            ls -la /tmp/Image
            echo "########## Decompressed Image first 32 bytes ##########"
            xxd /tmp/Image | head -2
            # ARM64 Image magic is "ARM\x64" at offset 0x38
            echo "########## ARM64 Image magic at offset 0x38 ##########"
            xxd -s 0x38 -l 4 /tmp/Image
          fi

      - name: Summary report
        run: |
          echo ""
          echo "==================================================================="
          echo "                       DIAGNOSTIC SUMMARY"
          echo "==================================================================="
          echo ""
          echo "This diagnostic run has collected information about:"
          echo "  1. Existing FriendlyWrt image structure (from release)"
          echo "  2. kernel.img format (FIT / raw / compressed)"
          echo "  3. boot.img format (ext4 / FIT / other)"
          echo "  4. flippy kernel package contents"
          echo "  5. Whether flippy vmlinuz can be converted to FIT"
          echo ""
          echo "Please provide the full log output to determine the correct"
          echo "kernel replacement strategy."