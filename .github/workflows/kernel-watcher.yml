name: Kernel Watcher

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-watcher
  cancel-in-progress: false

jobs:
  check_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit SHA for nanopi6-v6.1.y
        id: sha
        run: |
          RESP=$(curl -sS -H "Accept: application/vnd.github+json" \
            -H "User-Agent: kernel-watcher" \
            "https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/nanopi6-v6.1.y" \
            || true)
          SHA=$(printf '%s' "$RESP" | jq -r '.sha // empty' 2>/dev/null || true)
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::warning::Cannot fetch upstream SHA, skipping this cycle."
            printf '%s' "$RESP" | head -c 500
            echo
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current SHA: $SHA"

      - name: Check if SHA already processed
        id: check
        if: steps.sha.outputs.ok == 'true'
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          SHA8="${SHA:0:8}"

          # 确保拿到远端 master 最新历史
          git fetch origin master || true

          echo "== Searching git log for existing processing record =="
          # 主要判据：git log 中是否已有处理该 SHA 的提交
          MATCH=$(git log origin/master --pretty=format:'%H %s' | grep "update kernel SHA ${SHA8}" || true)
          if [ -n "$MATCH" ]; then
            echo "Found existing commit: $MATCH"
            echo "Already processed SHA ${SHA8}, skip."
            echo "processed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "== Fallback: check .kernel-version on origin/master =="
          if git cat-file -e origin/master:.kernel-version 2>/dev/null; then
            RECORDED=$(git show origin/master:.kernel-version 2>/dev/null | head -n1 | tr -d '[:space:]' || true)
            echo "origin/master:.kernel-version first line = '$RECORDED'"
            if [ -n "$RECORDED" ] && [ "$RECORDED" != "none" ]; then
              if [ "$RECORDED" = "$SHA" ]; then
                echo "SHA matches .kernel-version, skip."
                echo "processed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          else
            echo "origin/master:.kernel-version does not exist."
          fi

          echo "SHA ${SHA8} not processed yet, proceeding."
          echo "processed=false" >> "$GITHUB_OUTPUT"

      - name: Fetch latest upstream commit message
        id: commits
        if: steps.check.outputs.processed == 'false'
        run: |
          MSG=$(curl -sS -H "Accept: application/vnd.github+json" \
                -H "User-Agent: kernel-watcher" \
                "https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/${{ steps.sha.outputs.sha }}" \
                | jq -r '.commit.message // empty')
          [ -z "$MSG" ] && MSG="(no message)"
          echo "Commit message length: ${#MSG}"
          {
            echo "msg<<__EOF__"
            echo "$MSG"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Compare and trigger build if changed
        if: steps.check.outputs.processed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kernel updated, triggering build..."
          gh workflow run build.yml -f version=both -f set=both --repo ${{ github.repository }}

      - name: Update recorded SHA with latest commit log
        if: steps.check.outputs.processed == 'false'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          MSG: ${{ steps.commits.outputs.msg }}
        run: |
          git fetch origin master || true

          {
            echo "$SHA"
            echo ""
            echo "# 上游更新日志（UTC $(date -u +%Y-%m-%d)）"
            echo ""
            if [ -n "$MSG" ]; then
              echo "$MSG"
            else
              echo "(no message)"
            fi
          } > .kernel-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kernel-version

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update kernel SHA $(echo $SHA | cut -c1-8)"

          for attempt in 1 2 3; do
            echo "== Push attempt $attempt =="
            if git push origin HEAD:master; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed, syncing with remote..."
            git fetch origin master
            git rebase origin/master || {
              echo "Rebase conflict, aborting."
              git rebase --abort || true
              exit 1
            }
            sleep 3
          done
          echo "::error::Push failed after 3 attempts."
          exit 1

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [check_kernel]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs of exactly this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_NAME="Kernel Watcher"
          KEEP=1
          CURRENT_RUN_ID="${{ github.run_id }}"

          WF_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq ".workflows[] | select(.name == \"$TARGET_NAME\") | .id" | head -n1)

          if [ -z "$WF_ID" ]; then
            echo "Workflow '$TARGET_NAME' not found. Skip."
            exit 0
          fi
          echo "Workflow '$TARGET_NAME' ID: $WF_ID"

          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_ID/runs?per_page=100" \
            --jq '.workflow_runs[].id')

          i=0
          for run_id in $RUNS; do
            i=$((i+1))
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              echo "Keep current run: $run_id"
              continue
            fi
            if [ "$i" -le "$KEEP" ]; then
              echo "Keep recent run: $run_id"
              continue
            fi
            echo "Deleting run: $run_id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done