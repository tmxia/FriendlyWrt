name: Build OpenWrt Mainline (Kernel 6.18)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version (label)'
        required: true
        default: 'both'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Get release tag
      id: release_tag
      run: |
        release_tag="OpenWrt-$(date +%Y-%m-%d)"
        echo "release_tag=$release_tag" >> $GITHUB_OUTPUT

    - name: Create empty release
      id: release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_tag.outputs.release_tag }}
        draft: false
        prerelease: false
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}

  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id && github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison libncurses-dev libssl-dev \
          zlib1g-dev gawk git ccache gettext libelf-dev xsltproc rsync wget \
          unzip python3 python3-distutils python3-setuptools python3-dev \
          file libxml2-dev libxslt1-dev
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Clone OpenWrt mainline source
      run: |
        git clone --depth=1 -b main https://github.com/openwrt/openwrt.git project
        cd project
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Prepare base config (target: rockchip/rk3568, NanoPi R5S)
      run: |
        cd project
        echo "CONFIG_TARGET_rockchip=y" >> .config
        echo "CONFIG_TARGET_rockchip_rk3568=y" >> .config
        echo "CONFIG_TARGET_rockchip_rk3568_DEVICE_friendlyarm_nanopi-r5s=y" >> .config
        echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        make defconfig

    - name: Add custom packages (Clashoo, theme, uci-defaults)
      run: |
        cd project
        bash ../scripts/add_packages.sh ${{ matrix.SET }}

    - name: Finalize config and resolve dependencies
      run: |
        cd project
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project
        echo "=== Check custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|docker|dockerd)" .config || true
        echo "=== Kernel version ==="
        grep CONFIG_LINUX_.*_VERSION .config || true

    - name: Download package sources
      run: |
        cd project
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile OpenWrt
      id: compile
      continue-on-error: true
      run: |
        cd project
        if ! make -j$(nproc); then
          echo "::warning::parallel build failed, retrying with V=s"
          make -j1 V=s
        fi

    - name: Retry compile if failed
      if: steps.compile.outcome == 'failure'
      run: |
        cd project
        make -j1 V=s

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.VERSION }}-${{ matrix.SET }}
        path: project/logs/
        retention-days: 7

    - name: Locate built images
      id: locate_images
      run: |
        cd project
        IMG_DIR="bin/targets/rockchip/rk3568"
        if [ ! -d "$IMG_DIR" ]; then
          echo "ERROR: Image directory not found!"
          exit 1
        fi
        IMG_FILE=$(ls $IMG_DIR/*-nanopi-r5s-*.img.gz 2>/dev/null | head -n1)
        if [ -z "$IMG_FILE" ]; then
          IMG_FILE=$(ls $IMG_DIR/*-friendlyarm_nanopi-r5s-*.img.gz 2>/dev/null | head -n1)
        fi
        if [ -z "$IMG_FILE" ]; then
          echo "ERROR: No R5S image found!"
          exit 1
        fi
        echo "img_file=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "img_filename=$(basename $IMG_FILE)" >> $GITHUB_OUTPUT

    - name: Upload image to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: project/${{ steps.locate_images.outputs.img_file }}
        asset_name: ${{ steps.locate_images.outputs.img_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id && github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison libncurses-dev libssl-dev \
          zlib1g-dev gawk git ccache gettext libelf-dev xsltproc rsync wget \
          unzip python3 python3-distutils python3-setuptools python3-dev \
          file libxml2-dev libxslt1-dev
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Clone OpenWrt mainline source
      run: |
        git clone --depth=1 -b main https://github.com/openwrt/openwrt.git project
        cd project
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Prepare base config (target: rockchip/rk3568, NanoPi R5S)
      run: |
        cd project
        echo "CONFIG_TARGET_rockchip=y" >> .config
        echo "CONFIG_TARGET_rockchip_rk3568=y" >> .config
        echo "CONFIG_TARGET_rockchip_rk3568_DEVICE_friendlyarm_nanopi-r5s=y" >> .config
        echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        make defconfig

    - name: Add custom packages (Clashoo, theme, uci-defaults)
      run: |
        cd project
        bash ../scripts/add_packages.sh ${{ matrix.SET }}

    - name: Finalize config and resolve dependencies
      run: |
        cd project
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project
        echo "=== Check custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|docker|dockerd)" .config || true
        echo "=== Kernel version ==="
        grep CONFIG_LINUX_.*_VERSION .config || true

    - name: Download package sources
      run: |
        cd project
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile OpenWrt
      id: compile
      continue-on-error: true
      run: |
        cd project
        if ! make -j$(nproc); then
          echo "::warning::parallel build failed, retrying with V=s"
          make -j1 V=s
        fi

    - name: Retry compile if failed
      if: steps.compile.outcome == 'failure'
      run: |
        cd project
        make -j1 V=s

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.VERSION }}-${{ matrix.SET }}
        path: project/logs/
        retention-days: 7

    - name: Locate built images
      id: locate_images
      run: |
        cd project
        IMG_DIR="bin/targets/rockchip/rk3568"
        if [ ! -d "$IMG_DIR" ]; then
          echo "ERROR: Image directory not found!"
          exit 1
        fi
        IMG_FILE=$(ls $IMG_DIR/*-nanopi-r5s-*.img.gz 2>/dev/null | head -n1)
        if [ -z "$IMG_FILE" ]; then
          IMG_FILE=$(ls $IMG_DIR/*-friendlyarm_nanopi-r5s-*.img.gz 2>/dev/null | head -n1)
        fi
        if [ -z "$IMG_FILE" ]; then
          echo "ERROR: No R5S image found!"
          exit 1
        fi
        echo "img_file=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "img_filename=$(basename $IMG_FILE)" >> $GITHUB_OUTPUT

    - name: Upload image to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: project/${{ steps.locate_images.outputs.img_file }}
        asset_name: ${{ steps.locate_images.outputs.img_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate_assets:
    needs: [prepare_release, build_manual, build_auto]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build_manual, build_auto, cleanup_intermediate_assets]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt Mainline"
          repository: ${{ github.repository }}