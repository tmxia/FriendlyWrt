name: Build R5S Custom Firmware

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_VER: '25.12'
  MODEL_NAME: 'R5S'

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix
        id: set-matrix
        run: bash scripts/platforms.sh

  prepare_release:
    runs-on: ubuntu-latest
    needs: init
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-$(date +%Y.%m.%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: R5S OpenWrt ${{ env.OPENWRT_VER }} (${{ steps.release_tag.outputs.tag }})
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    needs: [init, prepare_release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.init.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -hT

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig

      - name: Clone OpenWrt source
        run: |
          git clone -b ${{ matrix.value.REPO_BRANCH }} --single-branch \
            ${{ matrix.value.REPO_URL }} openwrt

      - name: DIY pre (feeds 更新前)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} pre

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: DIY post (feeds 更新后)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} post

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Load R5S config
        run: |
          cp $GITHUB_WORKSPACE/${{ matrix.value.CONFIG_FILE }} openwrt/.config

      - name: DIY config (.config 调整)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} config
          make defconfig

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Rename artifacts
        if: success()
        run: |
          cd openwrt/bin/targets/rockchip/armv8
          DATE=$(date +%Y.%m.%d)
          PREFIX="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-${DATE}"

          for f in *friendlyarm_nanopi-r5s*sysupgrade.img.gz; do
            [ -f "$f" ] && mv "$f" "${PREFIX}-sysupgrade.img.gz"
          done
          for f in *friendlyarm_nanopi-r5s*.manifest; do
            [ -f "$f" ] && mv "$f" "${PREFIX}-manifest.txt"
          done

          echo "=== 重命名后的产物 ==="
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware
          path: openwrt/bin/targets/rockchip/armv8/*.gz
          retention-days: 30

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            openwrt/bin/targets/rockchip/armv8/*.img.gz
            openwrt/bin/targets/rockchip/armv8/*-manifest.txt
          overwrite: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build R5S Custom Firmware"
          repository: ${{ github.repository }}