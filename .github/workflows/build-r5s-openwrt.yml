name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write
  packages: write

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_VER: '25.12'
  MODEL_NAME: 'R5S'
  ROOTFS_PARTSIZE: '1024'
  OPENWRT_BRANCH: 'openwrt-25.12'
  OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
  CONFIG_FILE: 'scripts/r5s.config'
  DIY_SH: 'scripts/r5s_customize.sh'

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-$(date +%Y.%m.%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    name: Build r5s
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile

          echo "--- memory ---"
          free -h
          echo "--- disk ---"
          df -hT

      - name: Relocate Docker to /workdir
        run: |
          sudo systemctl stop docker || true
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker || sudo service docker start
          sleep 3
          docker info | grep "Docker Root Dir" || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig zstd \
            device-tree-compiler u-boot-tools e2fsprogs parted dosfstools mtools \
            exfatprogs exfat-fuse fuse \
            android-sdk-libsparse-utils btrfs-progs

      - name: Fix exfat mount helper
        run: |
          echo "===== exfat 环境诊断 ====="
          uname -r
          echo "--- 内核 exfat 支持 ---"
          grep exfat /proc/filesystems || echo "  内核无 exfat（将用 FUSE）"
          sudo modprobe exfat 2>/dev/null || true
          sudo modprobe fuse 2>/dev/null || true
          grep exfat /proc/filesystems || echo "  modprobe 后仍无 exfat"

          echo "--- exfat-fuse 包内容 ---"
          dpkg -L exfat-fuse 2>/dev/null | grep -E "mount" || echo "  (无 mount 相关文件)"

          echo "--- 查找 mount.exfat-fuse 二进制 ---"
          HELPER=""
          for f in /usr/sbin/mount.exfat-fuse /sbin/mount.exfat-fuse /usr/bin/mount.exfat-fuse /bin/mount.exfat-fuse; do
              if [ -x "$f" ]; then
                  HELPER="$f"
                  echo "  找到: $f"
                  break
              fi
          done

          if [ -z "$HELPER" ]; then
              echo "  dpkg 未找到，尝试 find"
              HELPER=$(find /usr /sbin /bin -name 'mount.exfat-fuse' -type f -executable 2>/dev/null | head -1)
          fi

          if [ -n "$HELPER" ]; then
              echo "使用 helper: $HELPER"
              for target in /sbin/mount.exfat /usr/sbin/mount.exfat /bin/mount.exfat /usr/bin/mount.exfat; do
                  sudo ln -sf "$HELPER" "$target"
              done
              echo "  已创建所有符号链接"
          else
              echo "::error::未找到 mount.exfat-fuse，无法建立 helper"
              exit 1
          fi

          echo "--- 最终 helper ---"
          ls -la /sbin/mount.exfat /usr/sbin/mount.exfat 2>/dev/null || true

          echo "--- 挂载测试 ---"
          dd if=/dev/zero of=/tmp/test.img bs=1M count=10 2>/dev/null
          mkfs.exfat /tmp/test.img > /dev/null 2>&1
          sudo mkdir -p /tmp/test-mnt
          if sudo mount -t exfat /tmp/test.img /tmp/test-mnt; then
              echo "  [OK] mount -t exfat 成功"
              sudo umount /tmp/test-mnt
          else
              echo "::error::mount -t exfat 依然失败"
              exit 1
          fi
          sudo rmdir /tmp/test-mnt
          rm -f /tmp/test.img

      - name: Clone OpenWrt source
        working-directory: /workdir
        run: |
          git clone -b ${{ env.OPENWRT_BRANCH }} --single-branch \
            ${{ env.OPENWRT_REPO }} openwrt 2>&1 | tail -3
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Configure custom feeds
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tail -20

      - name: Apply custom modifications
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} post

      - name: Install feed packages
        run: |
          cd openwrt
          ./scripts/feeds install -a 2>&1 | tail -20

      - name: Load R5S configuration
        run: |
          cp $GITHUB_WORKSPACE/${{ env.CONFIG_FILE }} openwrt/.config

      - name: Adjust package configuration
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} config
          make defconfig

          for pkg in iptables-zz-legacy ip6tables-zz-legacy iptables-legacy; do
            sed -i "s/^CONFIG_PACKAGE_${pkg}=y/# CONFIG_PACKAGE_${pkg} is not set/" .config
            sed -i "s/^CONFIG_PACKAGE_${pkg}=m/# CONFIG_PACKAGE_${pkg} is not set/" .config
            grep -q "^# CONFIG_PACKAGE_${pkg} is not set" .config || \
              echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done
          make defconfig

          echo "===== iptables related config ====="
          grep -E "^CONFIG_PACKAGE_(i|ip6)tables" .config || true

          echo "===== r8125 / r8169 相关 config ====="
          grep -E "CONFIG_PACKAGE_kmod-r81(25|68|69)" .config || true

      - name: Restore base build cache
        id: restore_cache
        run: |
          cd /workdir
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_restore

      - name: Compile base (tools + toolchain)
        id: compile_base
        run: |
          cd /workdir/openwrt
          touch /workdir/base_compilation_marker

          echo "==== Tools download ===="
          make tools/download -j1 || exit 1
          echo "==== Tools compile ===="
          time make tools/compile -j$(nproc) || exit 1

          echo "==== Toolchain download ===="
          make toolchain/download -j1 || exit 1
          echo "==== Toolchain compile ===="
          time make toolchain/compile -j$(nproc) || exit 1

      - name: Checkpoint base cache
        if: steps.compile_base.outcome == 'success'
        run: |
          cd /workdir/openwrt

          IGNORE_PATTERN="staging_dir/host/stamp/\.tools_compile_|staging_dir/target-[^/]+/stamp/\.target_prereq$"

          CHANGED=$(find build_dir staging_dir -type f -newer /workdir/base_compilation_marker -path "*/stamp/*" 2>/dev/null | \
                    grep -E -v "$IGNORE_PATTERN" | wc -l)

          echo "--- Found $CHANGED newer stamp files ---"

          if [ "$CHANGED" -eq 0 ]; then
            echo "Base cache is up-to-date, skipping checkpoint."
            exit 0
          fi

          echo "Base cache changed, saving..."
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_save

      - name: Compile OpenWrt firmware
        run: |
          cd /workdir/openwrt

          set +e
          make download -j8 > /tmp/download.log 2>&1 || true
          make -j$(nproc) V=s > /tmp/build.log 2>&1
          BUILD_RESULT=$?
          set -e

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "Build failed (exit code: $BUILD_RESULT)"

            if [ "$BUILD_RESULT" -gt 128 ]; then
              SIG=$((BUILD_RESULT - 128))
              echo "Process killed by signal $SIG"
              [ "$SIG" = "9" ] && echo "  -> SIGKILL (likely OOM)"
              free -h
              sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill" | tail -20 || true
            fi

            FIRST_ERR=$(grep -n -m 1 -E "^make(\[[0-9]+\])?: \*\*\* .* Error [0-9]" /tmp/build.log | cut -d: -f1)
            if [ -n "$FIRST_ERR" ]; then
              START=$((FIRST_ERR > 150 ? FIRST_ERR - 150 : 1))
              END=$((FIRST_ERR + 30))
              echo "----- Error context (lines $START-$END) -----"
              sed -n "${START},${END}p" /tmp/build.log
            else
              echo "----- Last 300 lines -----"
              tail -300 /tmp/build.log
            fi
            exit 1
          fi

          echo "Build succeeded"
          ls -lh bin/targets/rockchip/armv8/*.img.gz 2>/dev/null || true

      - name: Locate kernel build artifacts
        if: success()
        run: |
          cd /workdir/openwrt

          TRIPLE_DIR=$(find build_dir -maxdepth 1 -type d -name "target-*_musl" | head -1)
          [ -z "$TRIPLE_DIR" ] && { echo "::error::target triple not found"; exit 1; }
          TRIPLE_DIR=$(realpath "$TRIPLE_DIR")
          echo "TRIPLE_DIR=$TRIPLE_DIR" >> $GITHUB_ENV

          KDIR=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "linux-rockchip*" | head -1)
          [ -z "$KDIR" ] && { echo "::error::linux-rockchip dir not found"; exit 1; }
          KDIR=$(realpath "$KDIR")
          echo "KDIR=$KDIR" >> $GITHUB_ENV

          IMG=$(find "$KDIR" -path "*/arch/arm64/boot/Image" -type f 2>/dev/null | head -1)
          [ -z "$IMG" ] && { echo "::error::Kernel Image not found"; exit 1; }
          IMG=$(realpath "$IMG")
          echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV

          DTB_DIR=$(find "$KDIR" -path "*/arch/arm64/boot/dts/rockchip" -type d 2>/dev/null | head -1)
          [ -z "$DTB_DIR" ] && { echo "::error::DTB dir not found"; exit 1; }
          DTB_DIR=$(realpath "$DTB_DIR")
          echo "DTB_DIR=$DTB_DIR" >> $GITHUB_ENV

          ROOTFS_SRC=$(find "$TRIPLE_DIR" -maxdepth 1 -type d -name "root-*" | head -1)
          [ -z "$ROOTFS_SRC" ] && { echo "::error::Rootfs dir not found"; exit 1; }
          ROOTFS_SRC=$(realpath "$ROOTFS_SRC")
          echo "ROOTFS_SRC=$ROOTFS_SRC" >> $GITHUB_ENV

          KV=$(ls "$ROOTFS_SRC/lib/modules/" 2>/dev/null | head -1)
          echo "KV=$KV" >> $GITHUB_ENV
          [[ "$KV" == 6.12* ]] || { echo "::error::kernel modules not 6.12, got: $KV"; exit 1; }

          echo "===== r8125 in rootfs-src ====="
          ls "$ROOTFS_SRC/lib/modules/$KV/kernel/drivers/net/ethernet/realtek/" 2>/dev/null || \
              echo "  (realtek 目录不存在)"
          if ls "$ROOTFS_SRC/lib/modules/$KV/kernel/drivers/net/ethernet/realtek/" 2>/dev/null | grep -q r8125; then
              echo "  [OK] r8125 found in compiled rootfs"
          else
              echo "::error::r8125 未编译进 OpenWrt rootfs（2.5G 网口无法工作）"
              exit 1
          fi

      # ============================================================
      # 修复：移除 emmc-flasher-images.tgz 下载，仅使用 sd-fuse 自带 prebuilt
      # ============================================================
      - name: Setup sd-fuse packaging tools
        if: success()
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf sd-fuse
          git clone --depth 1 -b master https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse 2>&1 | tail -2
          cd sd-fuse
          [ -f mk-sd-image.sh ] || { echo "::error::mk-sd-image.sh missing"; exit 1; }
          [ -f mk-emmc-image.sh ] || { echo "::error::mk-emmc-image.sh missing"; exit 1; }
          [ -d prebuilt ] || { echo "::error::prebuilt missing"; exit 1; }

          TGT="friendlywrt25"
          rm -rf "$TGT"
          mkdir -p "$TGT"

          echo "===== prebuilt/ 内容 ====="
          ls -la prebuilt/ | head -30

          echo "===== parameter.template ====="
          cat prebuilt/parameter.template 2>/dev/null || echo "  (缺失)"

          echo "===== 拷贝启动二进制到 $TGT/ ====="
          for f in uboot.img idbloader.img MiniLoaderAll.bin misc.img dtbo.img; do
            if [ -f "prebuilt/$f" ]; then
              cp "prebuilt/$f" "$TGT/$f"
              echo "  copied $f"
            else
              echo "  [WARN] prebuilt/$f 不存在，跳过"
            fi
          done

      - name: Package kernel and resource images
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/sd-fuse
          TGT="friendlywrt25"

          [ -f "$IMAGE_PATH" ] || { echo "::error::Image not found: $IMAGE_PATH"; exit 1; }
          ./tools/mkkrnlimg "$IMAGE_PATH" "$TGT/kernel.img"
          [ -f "$TGT/kernel.img" ] || { echo "::error::kernel.img not generated"; exit 1; }
          cp "$TGT/kernel.img" "$TGT/boot.img"

          [ -d "$DTB_DIR" ] || { echo "::error::DTB dir not found: $DTB_DIR"; exit 1; }
          rm -rf /tmp/dtb-pack
          mkdir -p /tmp/dtb-pack

          R5S_DTB=""
          for cand in rk3568-nanopi-r5s.dtb rk3568-nanopi-r5c.dtb; do
            [ -f "$DTB_DIR/$cand" ] && { R5S_DTB="$cand"; break; }
          done
          [ -z "$R5S_DTB" ] && { echo "::error::rk3568-nanopi-r5s.dtb not found"; exit 1; }

          cp "$DTB_DIR/$R5S_DTB" /tmp/dtb-pack/rk-kernel.dtb
          for cand in rk3568-nanopi-r5s.dtb rk3568-nanopi-r5c.dtb; do
            [ -f "$DTB_DIR/$cand" ] && cp "$DTB_DIR/$cand" /tmp/dtb-pack/
          done

          cd /tmp/dtb-pack
          DTB_LIST=$(find . -maxdepth 1 -type f -name "*.dtb" -printf "%f\n" | sort)
          [ -z "$DTB_LIST" ] && { echo "::error::no dtb files"; exit 1; }

          "$OLDPWD/tools/resource_tool" --pack \
            --root=. \
            --image="$OLDPWD/$TGT/resource.img" \
            $DTB_LIST
          cd "$OLDPWD"

          [ -f "$TGT/resource.img" ] || { echo "::error::resource.img not generated"; exit 1; }

          ls -lh "$TGT"/kernel.img "$TGT"/resource.img

      - name: Build rootfs image
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/sd-fuse
          TGT="friendlywrt25"

          [ -d "$ROOTFS_SRC" ] || { echo "::error::Rootfs src not found"; exit 1; }

          rm -rf /tmp/rootfs-pack
          cp -a "$ROOTFS_SRC" /tmp/rootfs-pack
          (cd /tmp/rootfs-pack/dev && find . ! -type d -exec rm -f {} \; ) 2>/dev/null || true

          ACTUAL_MB=$(du -sm /tmp/rootfs-pack | awk '{print $1}')
          echo "rootfs: ${ACTUAL_MB} MB / ${ROOTFS_PARTSIZE} MB"
          if [ "$ACTUAL_MB" -gt "$ROOTFS_PARTSIZE" ]; then
            echo "::error::rootfs content exceeds ROOTFS_PARTSIZE"
            exit 1
          fi

          LOGICAL_SIZE=$(( ROOTFS_PARTSIZE * 1024 * 1024 ))
          IMG_BLK=$(( LOGICAL_SIZE / 4096 ))
          INODE_SIZE=$(( $(find /tmp/rootfs-pack | wc -l) + 128 ))

          rm -f "$TGT/rootfs.img"
          MKE2FS_CONFIG="$PWD/tools/mke2fs.conf" \
            "$PWD/tools/mke2fs" -N "$INODE_SIZE" \
              -E android_sparse -t ext4 -L rootfs -M /root -b 4096 -0 \
              -d /tmp/rootfs-pack "$TGT/rootfs.img" "$IMG_BLK"

          [ -f "$TGT/rootfs.img" ] || { echo "::error::rootfs.img generation failed"; exit 1; }

          # ---- 直接挂载校验 rootfs.img 内容 ----
          echo "===== 校验 rootfs.img 内容 ====="
          mkdir -p /tmp/verify-rootfs
          sudo mount -o loop,ro "$TGT/rootfs.img" /tmp/verify-rootfs

          [ -d /tmp/verify-rootfs/etc/config ] || { echo "::error::rootfs.img 不是 OpenWrt（缺 /etc/config/）"; sudo umount /tmp/verify-rootfs; exit 1; }
          [ -f /tmp/verify-rootfs/etc/config/network ] || { echo "::error::缺 /etc/config/network"; sudo umount /tmp/verify-rootfs; exit 1; }
          [ -f /tmp/verify-rootfs/etc/uci-defaults/99-custom ] || { echo "::error::缺 99-custom"; sudo umount /tmp/verify-rootfs; exit 1; }

          KVER=$(ls /tmp/verify-rootfs/lib/modules/ | head -1)
          echo "kernel: $KVER"
          case "$KVER" in
            6.12*) echo "  [OK] kernel 6.12" ;;
            *) echo "::error::kernel 不是 6.12"; sudo umount /tmp/verify-rootfs; exit 1 ;;
          esac

          if ls /tmp/verify-rootfs/lib/modules/$KVER/kernel/drivers/net/ethernet/realtek/ 2>/dev/null | grep -q r8125; then
            echo "  [OK] r8125 found"
          else
            echo "::error::r8125 缺失（2.5G 网口无法工作）"
            sudo umount /tmp/verify-rootfs; exit 1
          fi

          if [ -f /tmp/verify-rootfs/etc/debian_version ]; then
            echo "::error::rootfs 是 Debian"
            sudo umount /tmp/verify-rootfs; exit 1
          fi

          echo "[OK] rootfs.img 校验通过"
          sudo umount /tmp/verify-rootfs
          sudo rmdir /tmp/verify-rootfs
          # ---- 校验结束 ----

          PARAMETER_TPL="$PWD/prebuilt/parameter.template" \
            ./tools/generate-partmap-txt.sh "$LOGICAL_SIZE" "$TGT"

          echo "ROOTFS_SIZE_BYTES=$LOGICAL_SIZE" >> $GITHUB_ENV

          echo "===== $TGT/ 内容 ====="
          ls -lh "$TGT/"

          echo "===== parameter.txt ====="
          cat "$TGT/parameter.txt"

      - name: Build SD card and eMMC images
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/sd-fuse
          TGT="friendlywrt25"

          [ -f "$TGT/kernel.img" ]    || { echo "::error::kernel.img missing"; exit 1; }
          [ -f "$TGT/rootfs.img" ]    || { echo "::error::rootfs.img missing"; exit 1; }
          [ -f "$TGT/resource.img" ]  || { echo "::error::resource.img missing"; exit 1; }
          [ -f "$TGT/parameter.txt" ] || { echo "::error::parameter.txt missing"; exit 1; }

          export SDFUSE_NONINTERACTIVE=y

          sudo -E ./mk-sd-image.sh "$TGT" > /tmp/sd-image.log 2>&1 || {
            tail -80 /tmp/sd-image.log
            exit 1
          }
          tail -20 /tmp/sd-image.log

          if grep -q "more than capacity" /tmp/sd-image.log; then
            echo "::error::mk-sd-image.sh skipped rootfs write"
            exit 1
          fi

          sudo -E ./mk-emmc-image.sh "$TGT" autostart=yes > /tmp/emmc-image.log 2>&1 || {
            tail -80 /tmp/emmc-image.log
            exit 1
          }
          tail -20 /tmp/emmc-image.log

          sudo chown -R "$(id -u):$(id -g)" out/ friendlywrt25/ 2>/dev/null || true
          ls -lh out/ out/images-for-eflasher/ 2>/dev/null || true

      # ============================================================
      # 新增：校验最终生成的 SD 镜像，防止打包污染
      # ============================================================
      - name: Verify generated SD image contains OpenWrt
        if: success()
        run: |
          set -e
          cd $GITHUB_WORKSPACE/sd-fuse

          IMG=$(find out -maxdepth 1 -name "*.img" -type f | head -1)
          [ -n "$IMG" ] || { echo "::error::no SD image produced"; exit 1; }
          echo "SD image: $IMG ($(stat -c%s "$IMG") bytes)"

          LOOP=$(sudo losetup -Pf --show "$IMG")
          echo "loop: $LOOP"
          sleep 2

          ROOT_PART=""
          for p in ${LOOP}p*; do
              FS=$(sudo file -s "$p" | sed 's/.*: //')
              echo "  $p: $FS"
              if echo "$FS" | grep -qi 'ext4'; then
                  ROOT_PART="$p"
              fi
          done

          [ -n "$ROOT_PART" ] || { echo "::error::no ext4 partition in SD image"; sudo losetup -d "$LOOP"; exit 1; }

          mkdir -p /tmp/verify-sd
          sudo mount -o ro "$ROOT_PART" /tmp/verify-sd

          echo "===== 校验 1: OpenWrt 布局 ====="
          if [ ! -d /tmp/verify-sd/etc/config ]; then
              echo "::error::rootfs 不是 OpenWrt（缺 /etc/config/）"
              sudo umount /tmp/verify-sd; sudo losetup -d "$LOOP"; exit 1
          fi
          [ -f /tmp/verify-sd/etc/config/network ] || { echo "::error::no /etc/config/network"; sudo umount /tmp/verify-sd; sudo losetup -d "$LOOP"; exit 1; }
          [ -f /tmp/verify-sd/etc/uci-defaults/99-custom ] || { echo "::error::99-custom missing"; sudo umount /tmp/verify-sd; sudo losetup -d "$LOOP"; exit 1; }

          echo "===== 校验 2: 内核版本 ====="
          KVER=$(ls /tmp/verify-sd/lib/modules/ | head -1)
          echo "kernel modules: $KVER"
          case "$KVER" in
            6.12*) echo "  [OK] 6.12" ;;
            *) echo "::error::kernel is NOT 6.12 (got $KVER)"; sudo umount /tmp/verify-sd; sudo losetup -d "$LOOP"; exit 1 ;;
          esac

          echo "===== 校验 3: r8125 驱动 ====="
          if ls /tmp/verify-sd/lib/modules/$KVER/kernel/drivers/net/ethernet/realtek/ 2>/dev/null | grep -q r8125; then
              echo "  [OK] r8125 found"
          else
              echo "::error::r8125 missing (R5S 2.5G 网口将无法工作)"
              sudo umount /tmp/verify-sd; sudo losetup -d "$LOOP"; exit 1
          fi

          echo "===== 校验 4: 确认不是 FriendlyElec Debian ====="
          if [ -f /tmp/verify-sd/etc/debian_version ]; then
              echo "::error::rootfs is Debian, not OpenWrt"
              sudo umount /tmp/verify-sd; sudo losetup -d "$LOOP"; exit 1
          fi
          if [ -f /tmp/verify-sd/etc/init.d/friendlyelec_firstuse.sh ]; then
              echo "::error::FriendlyElec firstuse 脚本存在"
              sudo umount /tmp/verify-sd; sudo losetup -d "$LOOP"; exit 1
          fi

          echo "===== 校验 5: 分区大小 ====="
          ROOT_MB=$(( $(sudo blockdev --getsize64 "$ROOT_PART") / 1024 / 1024 ))
          echo "rootfs partition: ${ROOT_MB} MB (expect 1024)"
          if [ "$ROOT_MB" -lt 900 ] || [ "$ROOT_MB" -gt 1200 ]; then
              echo "::warning::rootfs partition ${ROOT_MB}MB 与 1024MB 不匹配"
          fi

          echo "===== 校验 6: 网络接口映射 ====="
          if [ -f /tmp/verify-sd/etc/board.d/02_network ]; then
              grep -n -A3 'nanopi-r5s' /tmp/verify-sd/etc/board.d/02_network || true
          fi
          echo "--- /etc/config/network 前 40 行 ---"
          head -40 /tmp/verify-sd/etc/config/network || true

          sudo umount /tmp/verify-sd
          sudo losetup -d "$LOOP"
          sudo rmdir /tmp/verify-sd
          echo "===== SD image verification passed ====="

      - name: Collect and checksum artifacts
        if: success()
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifact
          cd $GITHUB_WORKSPACE/sd-fuse

          DATE=$(date +%Y.%m.%d)
          PREFIX="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-${DATE}"

          SRC_IMG=$(find out -maxdepth 1 -name "*.img" -type f 2>/dev/null | head -1)
          if [ -n "$SRC_IMG" ] && [ -s "$SRC_IMG" ]; then
            SRC_SIZE_MB=$(( $(stat -c%s "$SRC_IMG") / 1024 / 1024 ))
            if [ "$SRC_SIZE_MB" -lt 200 ]; then
              echo "::error::SD image only ${SRC_SIZE_MB} MB, rootfs may not be written"
              exit 1
            fi
            cp "$SRC_IMG" "/tmp/${PREFIX}-sdcard.img"
            gzip -f "/tmp/${PREFIX}-sdcard.img"
            cp "/tmp/${PREFIX}-sdcard.img.gz" $GITHUB_WORKSPACE/artifact/
            echo "SD image: ${PREFIX}-sdcard.img.gz"
          else
            echo "::error::no .img found from sd-fuse"
            exit 1
          fi

          SRC_TGZ=$(find out -maxdepth 3 -name "*-images.tgz" -type f 2>/dev/null | head -1)
          if [ -n "$SRC_TGZ" ] && [ -s "$SRC_TGZ" ]; then
            cp "$SRC_TGZ" "$GITHUB_WORKSPACE/artifact/${PREFIX}-emmc-flasher.tgz"
            echo "eMMC pack: ${PREFIX}-emmc-flasher.tgz"
          else
            echo "::warning::eMMC flasher pack not found"
          fi

          OPENWRT_SYSUP=$(find openwrt/bin/targets/rockchip/armv8 -maxdepth 1 \
            -name "*nanopi-r5s*sysupgrade.img.gz" -type f 2>/dev/null | head -1)
          if [ -n "$OPENWRT_SYSUP" ]; then
            cp "$OPENWRT_SYSUP" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sysupgrade.img.gz"
            echo "sysupgrade: ${PREFIX}-sysupgrade.img.gz"
          fi

          OPENWRT_MANIFEST=$(find openwrt/bin/targets/rockchip/armv8 -maxdepth 1 \
            -name "*nanopi-r5s*.manifest" -type f 2>/dev/null | head -1)
          [ -n "$OPENWRT_MANIFEST" ] && cp "$OPENWRT_MANIFEST" "$GITHUB_WORKSPACE/artifact/${PREFIX}-manifest.txt"

          cd $GITHUB_WORKSPACE/artifact
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] && [ "$f" != "SHA256SUMS" ] && sha256sum "$f" >> SHA256SUMS
          done
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware
          path: artifact/
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            artifact/*.gz
            artifact/*.tgz
            artifact/*-manifest.txt
            artifact/SHA256SUMS
          overwrite: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}