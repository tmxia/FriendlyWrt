name: Build R5S Flippy Image (official toolchain)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (建议 6.1.y 最稳)'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - '6.1.y'
          - '6.6.y'
          - '6.12.y'
          - '6.18.y'
      rootfs_release_tag:
        description: 'Rootfs 所在的 Release tag'
        required: true
        default: 'FriendlyWrt-2026-09-04'
        type: string
      rootfs_asset:
        description: 'Rootfs 资产名 (tgz/tar.gz)'
        required: true
        default: 'images-R5S-R5C-Series-FriendlyWrt-24.10-docker.tgz'
        type: string
      flippy_kernel_repo:
        description: '内核来源仓库'
        required: true
        default: 'ophub/kernel'
        type: string
      package_soc:
        description: '打包目标 SoC'
        required: true
        default: 'rk35xx'
        type: choice
        options:
          - 'rk35xx'
          - 'all'

env:
  WORKSPACE: /home/runner/work/_temp/flippy-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl git rsync time file unzip bc bzip2 xxd \
          python3 dosfstools e2fsprogs parted \
          android-sdk-libsparse-utils u-boot-tools \
          gzip xz-utils zstd lz4 squashfs-tools

    - name: Prepare workspace
      run: |
        sudo mkdir -p $WORKSPACE
        sudo chown -R runner:runner $WORKSPACE
        mkdir -p $WORKSPACE/input $WORKSPACE/output $WORKSPACE/extract
        echo "WORKSPACE: $WORKSPACE"

    # ============================================================
    # 1. 下载 rootfs tgz
    # ============================================================
    - name: Download rootfs tgz from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd $WORKSPACE/input
        gh release download "${{ inputs.rootfs_release_tag }}" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "${{ inputs.rootfs_asset }}" \
          --dir .
        ls -la

    # ============================================================
    # 2. 解压 tgz，取出 rootfs.img
    # ============================================================
    - name: Extract images tgz
      run: |
        cd $WORKSPACE/input
        TGZ=$(find . -maxdepth 1 -name "*.tgz" | head -1)
        echo "输入: $TGZ"
        tar xzf "$TGZ" -C $WORKSPACE/extract

        echo "=== 解压后结构 ==="
        find $WORKSPACE/extract -maxdepth 2 -type f | head -30

        # 定位 rootfs.img
        ROOTFS_IMG=$(find $WORKSPACE/extract -maxdepth 3 -name "rootfs.img" | head -1)
        [ -z "$ROOTFS_IMG" ] && { echo "ERROR: 找不到 rootfs.img"; exit 1; }
        echo "rootfs.img: $ROOTFS_IMG"
        ls -la "$ROOTFS_IMG"
        file "$ROOTFS_IMG"

    # ============================================================
    # 3. 挂载 rootfs.img 提取文件系统内容
    # ============================================================
    - name: Mount rootfs.img and extract filesystem
      run: |
        ROOTFS_IMG=$(find $WORKSPACE/extract -maxdepth 3 -name "rootfs.img" | head -1)
        MNT=$WORKSPACE/mnt
        sudo mkdir -p "$MNT"

        # 检测文件系统类型
        FS_TYPE=$(sudo file -b "$ROOTFS_IMG" 2>/dev/null)
        echo "文件系统类型: $FS_TYPE"

        MOUNTED=false

        # 尝试 mount ext4
        if sudo mount -o loop,ro "$ROOTFS_IMG" "$MNT" 2>/dev/null; then
          echo "✓ 已挂载 (ext4/其他)"
          MOUNTED=true
        fi

        # 若失败, 尝试用 offset 探测 (有些 rootfs.img 带分区表)
        if [ "$MOUNTED" != "true" ]; then
          echo "直接 mount 失败, 尝试探测分区偏移..."
          # 尝试 512 字节对齐的常见偏移
          for OFFSET in 1048576 2097152 4194304 8388608; do
            if sudo mount -o loop,ro,offset=$OFFSET "$ROOTFS_IMG" "$MNT" 2>/dev/null; then
              echo "✓ 已挂载 @ offset=$OFFSET"
              MOUNTED=true
              break
            fi
          done
        fi

        if [ "$MOUNTED" != "true" ]; then
          # 尝试用 unsquashfs (若是 squashfs)
          if unsquashfs -l "$ROOTFS_IMG" >/dev/null 2>&1; then
            echo "✓ 检测到 squashfs, 使用 unsquashfs 解压"
            sudo unsquashfs -d "$MNT" "$ROOTFS_IMG"
            MOUNTED=true
            # 注意: unsquashfs 后不需要 umount
            echo "MOUNT_TYPE=squashfs" >> $GITHUB_ENV
          fi
        else
          echo "MOUNT_TYPE=loop" >> $GITHUB_ENV
        fi

        if [ "$MOUNTED" != "true" ]; then
          echo "ERROR: 无法挂载或解压 rootfs.img"
          echo "尝试 file 命令:"
          file "$ROOTFS_IMG"
          echo ""
          echo "尝试 hexdump 前 512 字节:"
          xxd -l 512 "$ROOTFS_IMG"
          exit 1
        fi

        echo ""
        echo "=== rootfs 内容检查 ==="
        sudo ls -la "$MNT/" | head -30
        sudo ls "$MNT/bin/" 2>/dev/null | head -10
        sudo ls "$MNT/etc/" 2>/dev/null | head -10

        # 检查是否是有效 rootfs
        if [ ! -d "$MNT/bin" ] || [ ! -d "$MNT/etc" ]; then
          echo "ERROR: 挂载的内容看起来不是有效 rootfs"
          exit 1
        fi

        echo "✓ 有效 rootfs"

    # ============================================================
    # 4. 打包为 rootfs.tar.gz
    # ============================================================
    - name: Repack rootfs as tar.gz
      run: |
        MNT=$WORKSPACE/mnt
        cd "$MNT"
        sudo tar czf $WORKSPACE/input/rootfs.tar.gz --numeric-owner --owner=0 --group=0 .

        echo ""
        echo "=== rootfs.tar.gz 信息 ==="
        ls -la $WORKSPACE/input/rootfs.tar.gz
        SIZE=$(stat -c%s $WORKSPACE/input/rootfs.tar.gz)
        echo "大小: $SIZE bytes ($((SIZE/1024/1024)) MiB)"

        echo ""
        echo "=== tarball 前 20 项 ==="
        tar tzf $WORKSPACE/input/rootfs.tar.gz | head -20

        # 卸载
        if [ "$MOUNT_TYPE" = "loop" ]; then
          sudo umount "$MNT" || true
        fi

    # ============================================================
    # 5. 使用 flippy 官方 action 打包（修复分支名）
    # ============================================================
    - name: Build Flippy image (official action)
      id: pack
      uses: ophub/flippy-openwrt-actions@main
      env:
        OPENWRT_ARMSR: ${{ env.WORKSPACE }}/input/rootfs.tar.gz
        PACKAGE_SOC: ${{ inputs.package_soc }}
        KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
        KERNEL_AUTO_LATEST: 'true'
        KERNEL_REPO_URL: ${{ inputs.flippy_kernel_repo }}
        SCRIPT_REPO_URL: unifreq/openwrt_packit
        SCRIPT_REPO_BRANCH: master         # ← 修复: main → master
        OUTPUT_DIR: ${{ env.WORKSPACE }}/output

    # ============================================================
    # 6. 收集输出
    # ============================================================
    - name: Locate output images
      if: always()
      run: |
        echo "=== workspace 输出 ==="
        ls -la $WORKSPACE/output/ 2>/dev/null || true

        echo ""
        echo "=== 全局搜索 .img.gz ==="
        FOUND=$(find / -maxdepth 8 -type f -name "*.img.gz" -newer $WORKSPACE/input/rootfs.tar.gz 2>/dev/null | head -20)
        echo "$FOUND"
        for f in $FOUND; do
          cp "$f" $WORKSPACE/output/ 2>/dev/null || true
        done

        echo ""
        echo "=== 最终 output ==="
        ls -la $WORKSPACE/output/

    # ============================================================
    # 7. 上传 artifact
    # ============================================================
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flippy-r5s-${{ inputs.kernel_version }}
        path: |
          ${{ env.WORKSPACE }}/output/*.img.gz
          ${{ env.WORKSPACE }}/output/*.img
        retention-days: 7
        if-no-files-found: warn