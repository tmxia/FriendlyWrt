name: Convert PE Kernel to KRNL

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.49'
      source_repo:
        description: 'Source repo'
        required: true
        default: 'ophub/kernel'
        type: choice
        options:
          - ophub/kernel
          - breakingbadboy/OpenWrt
      source_release:
        description: 'Release'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_rk35xx
          - kernel_stable

jobs:
  convert:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl python3 xxd file

    - name: Download and extract kernel
      run: |
        cd /tmp
        URL="https://github.com/${{ inputs.source_repo }}/releases/download/${{ inputs.source_release }}/${{ inputs.kernel_version }}.tar.gz"
        echo "Downloading: $URL"
        wget -q "$URL" -O kernel.tar.gz || { echo "FAILED"; exit 1; }
        tar xzf kernel.tar.gz

        KERNEL_VER="${{ inputs.kernel_version }}"
        LOCAL_DIR="$KERNEL_VER"
        if [ ! -d "$LOCAL_DIR" ]; then
          LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        fi

        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        mkdir -p boot_extract
        tar xzf "$BOOT_TAR" -C boot_extract

        echo "===== boot_extract ====="
        ls -la boot_extract/

    - name: Convert PE to KRNL (preserve layout)
      run: |
        cd /tmp
        VMLINUZ=$(find boot_extract -name "vmlinuz-*" | head -1)
        [ -z "$VMLINUZ" ] && { echo "vmlinuz not found"; exit 1; }

        echo "VMLINUZ: $VMLINUZ"
        echo "Size: $(stat -c%s "$VMLINUZ") bytes"

        python3 - "$VMLINUZ" /tmp/kernel.img <<'PYEOF'
        import sys, struct

        src, dst = sys.argv[1], sys.argv[2]
        data = bytearray(open(src, 'rb').read())
        ARM64_MAGIC = bytes([0x41, 0x52, 0x4d, 0x64])  # "ARMd"

        print("Input size: %d bytes" % len(data))
        print("First 16 bytes: %s" % data[:16].hex())

        # ---- 1. 解析 PE 头（诊断用） ----
        pe_off = struct.unpack_from('<I', data, 0x3C)[0]
        assert data[pe_off:pe_off+4] == b'PE\x00\x00', "Not PE at 0x%x" % pe_off
        print("PE header at 0x%x" % pe_off)

        coff = pe_off + 4
        num_sections = struct.unpack_from('<H', data, coff + 2)[0]
        opt_hdr_size = struct.unpack_from('<H', data, coff + 16)[0]
        sec_start = coff + 20 + opt_hdr_size

        for i in range(num_sections):
            off = sec_start + i * 40
            name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
            raw_size = struct.unpack_from('<I', data, off + 16)[0]
            raw_off = struct.unpack_from('<I', data, off + 20)[0]
            print("Section %s: raw_off=0x%x size=%d" % (name, raw_off, raw_size))

        # ---- 2. 关键：检测 _stext 位置 ----
        # System.map 显示 _stext = _text + 0x10000
        # PE .text 段 raw offset 也是 0x10000（如果匹配）
        # 我们从 .text section 的 raw_off 推导

        text_section_off = None
        for i in range(num_sections):
            off = sec_start + i * 40
            name = data[off:off+8].rstrip(b'\x00').decode('ascii', 'ignore')
            if name == '.text':
                text_section_off = struct.unpack_from('<I', data, off + 20)[0]
                break

        assert text_section_off is not None, "no .text section"
        print("")
        print("_stext offset (from PE .text section): 0x%x" % text_section_off)

        # ---- 3. 计算 code0 (b +_stext_offset) ----
        offset = text_section_off
        assert offset % 4 == 0, "offset not 4-byte aligned"
        imm26 = offset // 4
        assert imm26 <= 0x03FFFFFF, "offset too large for B instruction"

        code0 = 0x14000000 | imm26

        print("code0 = 0x%08x (b +0x%x)" % (code0, offset))

        # ---- 4. 构造新 ARM64 Image 头（保留原文件其余字节） ----
        file_size = len(data)

        new_header = bytearray(64)
        struct.pack_into('<I', new_header, 0x00, code0)          # code0: b to _stext
        struct.pack_into('<I', new_header, 0x04, 0)              # code1
        struct.pack_into('<Q', new_header, 0x08, 0)              # text_offset = 0
        struct.pack_into('<Q', new_header, 0x10, file_size)      # image_size
        struct.pack_into('<Q', new_header, 0x18, 0x0a)           # flags = 0x0a
        new_header[0x38:0x3c] = ARM64_MAGIC

        # 替换前 64 字节
        data[0:0x40] = new_header

        print("")
        print("New header:")
        for i in range(0, 64, 16):
            print("  %04x: %s" % (i, bytes(data[i:i+16]).hex()))

        # ---- 5. 构造 KRNL ----
        knl = b'KRNL' + struct.pack('<I', file_size) + bytes(data)
        open(dst, 'wb').write(knl)
        print("")
        print("KRNL size: %d bytes" % len(knl))

        # ---- 6. 验证 ----
        check = open(dst, 'rb').read(256)
        assert check[0:4] == b'KRNL', "KRNL magic missing"
        magic_idx = check.find(ARM64_MAGIC)
        code0_read = struct.unpack_from('<I', check, 8)[0]

        print("")
        print("验证:")
        print("  KRNL magic:    %s" % check[0:4].decode())
        print("  KRNL size:     %d" % struct.unpack_from('<I', check, 4)[0])
        print("  code0:         0x%08x" % code0_read)
        print("  text_offset:   %d" % struct.unpack_from('<Q', check, 16)[0])
        print("  image_size:    %d" % struct.unpack_from('<Q', check, 24)[0])
        print("  ARM64 magic@:  0x%x" % magic_idx)
        print("  Bytes@0x40:    %s (原 PE 头残留)" % check[0x40:0x48].hex())
        print("  Bytes@0x10000: %s (应为 PACIASP: 3f2303d5)" % check[0x10000:0x10004].hex())

        assert magic_idx == 0x40, "magic misplaced"
        # 检查 0x10000 处是否为 PACIASP
        at_stext = check[0x10000:0x10004].hex()
        if at_stext == "3f2303d5":
            print("")
            print("  ✓✓✓ 转换成功！_stext 处代码正确")
        else:
            print("")
            print("  ⚠ 0x10000 处不是 PACIASP，实际为 %s" % at_stext)
        PYEOF

    - name: Verify kernel.img structure
      run: |
        echo "===== kernel.img ====="
        ls -la /tmp/kernel.img
        echo ""
        echo "偏移 0x00（新头）:"
        xxd -l 64 /tmp/kernel.img
        echo ""
        echo "偏移 0x40（原 PE 头残留，可忽略）:"
        xxd -s 0x40 -l 64 /tmp/kernel.img
        echo ""
        echo "偏移 0x10000（_stext 入口，应为 PACIASP）:"
        xxd -s 0x10000 -l 64 /tmp/kernel.img

    - name: Upload kernel.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-krnl-${{ inputs.kernel_version }}
        path: /tmp/kernel.img
        retention-days: 7