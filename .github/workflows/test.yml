name: Diagnostic - Inspect Kernel Image Structure

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to diagnose'
        required: true
        default: '24.10'
        type: choice
        options:
          - '24.10'
          - '25.12'
      set:
        description: 'Type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: Install diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            file xxd binwalk p7zip-full u-boot-tools \
            device-tree-compiler cpio gzip xz-utils lz4 zstd

      - name: Find latest release with any images tgz
        id: find_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUFFIX=""
          [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
          # 只匹配 images- 开头、包含版本、包含类型后缀
          PATTERN="images-R5S-R5C-Series-FriendlyWrt-${{ inputs.version }}${SUFFIX}.tgz"
          echo "Looking for: $PATTERN"

          TAGS=$(gh release list --limit 30 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
          FOUND=""
          for TAG in $TAGS; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
              FOUND="$TAG"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "ERROR: No release found containing $PATTERN"
            echo "List of recent assets:"
            for TAG in $TAGS; do
              echo "=== $TAG ==="
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true
            done
            exit 1
          fi
          echo "release_tag=$FOUND" >> $GITHUB_OUTPUT
          echo "pattern=$PATTERN" >> $GITHUB_OUTPUT

      - name: Download existing images tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/existing
          cd /tmp/existing
          gh release download "${{ steps.find_release.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.find_release.outputs.pattern }}" \
            --dir .
          ls -la

      - name: Extract and inspect images tgz
        run: |
          cd /tmp/existing
          TGZ="${{ steps.find_release.outputs.pattern }}"
          tar xzf "$TGZ"
          echo "########## Top-level contents ##########"
          ls -la

          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          echo "IMG_DIR=$IMG_DIR"
          echo "########## Contents of $IMG_DIR ##########"
          ls -la "$IMG_DIR/"

          echo ""
          echo "########## File types of every file ##########"
          for f in "$IMG_DIR"/*; do
            echo "--- $(basename $f)"
            file "$f"
          done

      - name: Deep inspect kernel.img
        run: |
          cd /tmp/existing
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          KIMG="$IMG_DIR/kernel.img"
          echo "########## kernel.img size ##########"
          ls -la "$KIMG"
          echo "########## kernel.img first 512 bytes (hex) ##########"
          xxd "$KIMG" | head -32
          echo "########## kernel.img strings (first 40 lines) ##########"
          strings "$KIMG" | head -40
          echo "########## kernel.img magic check ##########"
          MAGIC=$(xxd -l 4 -p "$KIMG")
          echo "Magic: $MAGIC"
          if [ "$MAGIC" = "d00dfeed" ]; then
            echo ">>> FIT image (Device Tree format)"
            echo "########## FIT structure via fdtdump ##########"
            fdtdump "$KIMG" 2>/dev/null | head -150 || true
            echo "########## FIT content via dumpimage -l ##########"
            dumpimage -l "$KIMG" 2>&1 | head -80 || true
          elif [[ "$MAGIC" == 1f8b* ]]; then
            echo ">>> gzip compressed"
            echo "Try decompress and inspect:"
            zcat "$KIMG" 2>/dev/null | head -c 128 | xxd | head -8
          elif [[ "$MAGIC" == fd377a58* ]]; then
            echo ">>> xz compressed"
          else
            echo ">>> Unknown, running binwalk"
            binwalk "$KIMG" | head -40 || true
          fi

      - name: Deep inspect boot.img
        run: |
          cd /tmp/existing
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          BIMG="$IMG_DIR/boot.img"
          echo "########## boot.img size ##########"
          ls -la "$BIMG"
          echo "########## boot.img first 256 bytes ##########"
          xxd "$BIMG" | head -16
          echo "########## boot.img strings (first 20) ##########"
          strings "$BIMG" | head -20
          echo "########## 7z list ##########"
          7z l "$BIMG" 2>&1 | head -40 || true
          echo "########## binwalk ##########"
          binwalk "$BIMG" | head -30 || true

      - name: Deep inspect resource.img and dtbo.img
        run: |
          cd /tmp/existing
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          for name in resource.img dtbo.img parameter.txt; do
            F="$IMG_DIR/$name"
            [ -f "$F" ] || continue
            echo "########## $name ##########"
            ls -la "$F"
            file "$F"
            if [[ "$name" == "parameter.txt" ]]; then
              cat "$F"
            else
              xxd "$F" | head -8
              strings "$F" | head -10
            fi
          done

      - name: Download and inspect flippy kernel package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/flippy
          cd /tmp/flippy
          ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
          VERSIONS=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//' | sort -V)
          LATEST=$(echo "$VERSIONS" | tail -1)
          echo "Latest flippy kernel: $LATEST"
          wget -q "https://github.com/ophub/kernel/releases/download/kernel_flippy/${LATEST}.tar.gz" -O flippy.tar.gz
          tar xzf flippy.tar.gz
          KDIR="$LATEST"
          echo "########## Contents of $KDIR ##########"
          ls -la "$KDIR"

          BOOT_TAR=$(find "$KDIR" -name "boot-*.tar.gz" | head -1)
          DTB_TAR=$(find "$KDIR" -name "dtb-rockchip-*.tar.gz" | head -1)

          echo ""
          echo "########## Extracting boot package ##########"
          mkdir -p boot
          tar xzf "$BOOT_TAR" -C boot
          echo "Contents:"
          ls -la boot/
          echo ""
          echo "########## File types ##########"
          for f in boot/*; do
            echo "--- $(basename $f)"
            file "$f"
          done
          echo ""
          VMLINUZ=$(find boot -name "vmlinuz-*" | head -1)
          echo "########## vmlinuz size ##########"
          ls -la "$VMLINUZ"
          echo "########## vmlinuz first 256 bytes ##########"
          xxd "$VMLINUZ" | head -16
          echo "########## vmlinuz strings (first 20) ##########"
          strings "$VMLINUZ" | head -20
          VMLINUZ_MAGIC=$(xxd -l 4 -p "$VMLINUZ")
          echo "vmlinuz magic: $VMLINUZ_MAGIC"
          if [[ "$VMLINUZ_MAGIC" == 1f8b* ]]; then
            echo ">>> gzip compressed, decompressing to check ARM64 header"
            zcat "$VMLINUZ" > /tmp/Image_decomp 2>/dev/null || true
            ls -la /tmp/Image_decomp
            echo "########## Decompressed Image first 64 bytes ##########"
            xxd /tmp/Image_decomp | head -4
            echo "########## ARM64 Image magic at 0x38 ##########"
            xxd -s 0x38 -l 16 /tmp/Image_decomp
          fi

          echo ""
          UINITRD=$(find boot -name "uInitrd-*" | head -1)
          echo "########## uInitrd info ##########"
          ls -la "$UINITRD"
          file "$UINITRD"
          xxd "$UINITRD" | head -8

          echo ""
          echo "########## Extracting dtb package ##########"
          mkdir -p dtb
          tar xzf "$DTB_TAR" -C dtb
          echo "Total dtb files: $(ls dtb/*.dtb 2>/dev/null | wc -l)"
          echo "R5S/R5C related dtb files:"
          ls dtb/ | grep -iE "r5s|r5c|rk3568" | head -30

      - name: Compare and generate recommendation
        run: |
          echo ""
          echo "==================================================================="
          echo "                       FINAL DIAGNOSTIC SUMMARY"
          echo "==================================================================="
          
          cd /tmp/existing
          IMG_DIR=$(find . -maxdepth 1 -type d -name "friendlywrt*" | head -1)
          KIMG="$IMG_DIR/kernel.img"
          
          echo ""
          echo "FriendlyWrt kernel.img magic: $(xxd -l 4 -p "$KIMG")"
          echo "FriendlyWrt kernel.img size:  $(stat -c%s "$KIMG")"
          
          cd /tmp/flippy
          VMLINUZ=$(find boot -name "vmlinuz-*" | head -1)
          echo "flippy vmlinuz magic:         $(xxd -l 4 -p "$VMLINUZ")"
          echo "flippy vmlinuz size:          $(stat -c%s "$VMLINUZ")"
          echo ""
          
          echo "Please copy the FULL log output back to determine the exact"
          echo "kernel replacement strategy."