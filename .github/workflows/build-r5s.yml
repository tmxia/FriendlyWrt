name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  # === 唯一内核版本：不管选 24.10 / 25.12 / both，都用这个 ===
  KERNEL_VERSION: '6.12'
  # === 发行信息 ===
  DISTRO_NAME: 'OpenWrt'
  # === 唯一 target 三元组 ===
  TARGET_PLATFORM: 'rockchip'
  TARGET_SUBTARGET: 'rockchip_armv8'
  TARGET_DEVICE: 'friendlyarm_nanopi-r5s'
  # === 补丁/配置缺失时的补源分支（默认 25.12 有 6.12 的完整补丁） ===
  PATCH_SOURCE_BRANCH: 'master-v25.12'
  PATCH_SOURCE_REPO: 'https://github.com/friendlyarm/friendlywrt.git'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag with auto-increment or overwrite
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="OpenWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi
          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}; [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Version=${{ matrix.VERSION }} Set=${{ matrix.SET }} Kernel=${{ env.KERNEL_VERSION }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    # ============================================================
    # 写两个 helper 脚本到 $GITHUB_WORKSPACE
    # ============================================================
    - name: Write helper scripts
      run: |
        # ---------- enforce-target.sh ----------
        cat > "$GITHUB_WORKSPACE/enforce-target.sh" <<'SCRIPT'
        #!/bin/bash
        set -euo pipefail
        FW_DIR="$1"; PLAT="$2"; SUB="$3"; DEV="$4"
        CFG="$FW_DIR/.config"
        [ -f "$CFG" ] || { echo "WARN: no $CFG"; exit 0; }

        mapfile -t OTHERS < <(
          grep -E "^CONFIG_TARGET_[a-z0-9_]+=y$" "$CFG" 2>/dev/null \
            | grep -v "DEVICE" \
            | grep -v "^CONFIG_TARGET_${PLAT}=y$" \
            || true
        )
        for entry in "${OTHERS[@]}"; do
          [ -z "$entry" ] && continue
          T="${entry#CONFIG_TARGET_}"; T="${T%=y}"
          echo ">>> disabling extra target: $T"
          sed -i "/^CONFIG_TARGET_${T}=y$/d"            "$CFG"
          sed -i "/^CONFIG_TARGET_${T}_/d"              "$CFG"
          sed -i "/^# CONFIG_TARGET_${T} is not set$/d" "$CFG"
          sed -i "/^# CONFIG_TARGET_${T} /d"            "$CFG"
          echo "# CONFIG_TARGET_${T} is not set" >> "$CFG"
        done

        sed -i "/^CONFIG_TARGET_${PLAT}=y$/d"     "$CFG"
        sed -i "/^CONFIG_TARGET_${SUB}=y$/d"      "$CFG"
        sed -i "/^CONFIG_TARGET_${SUB}_DEVICE_/d" "$CFG"
        sed -i "/^# CONFIG_TARGET_${PLAT} /d"     "$CFG"
        sed -i "/^# CONFIG_TARGET_${SUB} /d"      "$CFG"

        {
          echo ""
          echo "# === Enforced by CI: only ${PLAT} ==="
          echo "CONFIG_TARGET_${PLAT}=y"
          echo "CONFIG_TARGET_${SUB}=y"
          echo "CONFIG_TARGET_${SUB}_DEVICE_${DEV}=y"
        } >> "$CFG"

        echo "===== enabled targets ====="
        grep -E "^CONFIG_TARGET_[a-z0-9_]+=y$" "$CFG" | sort || echo "(none)"
        SCRIPT
        chmod +x "$GITHUB_WORKSPACE/enforce-target.sh"

        # ---------- ensure-kernel-support.sh ----------
        cat > "$GITHUB_WORKSPACE/ensure-kernel-support.sh" <<'SCRIPT'
        #!/bin/bash
        # 用法: ensure-kernel-support.sh <friendlywrt_dir> <kernel_version> <source_repo> <source_branch>
        set -euo pipefail
        FW_DIR="$1"; KV="$2"; SRC_REPO="$3"; SRC_BRANCH="$4"
        RK_DIR="${FW_DIR}/target/linux/rockchip"
        GEN_DIR="${FW_DIR}/target/linux/generic"

        if [ ! -d "$RK_DIR" ]; then
          echo "ERROR: $RK_DIR not found"; exit 1
        fi

        need_source=false
        [ ! -d  "${RK_DIR}/patches-${KV}" ]        && need_source=true
        [ ! -f  "${RK_DIR}/config-${KV}" ]         && need_source=true
        [ ! -f  "${RK_DIR}/armv8/config-${KV}" ]   && need_source=true

        if [ "$need_source" = "true" ]; then
          echo "===== 目标内核 ${KV} 部分资源缺失，尝试从 ${SRC_BRANCH} 拉取 ====="
          TMP_DIR="/tmp/fw-patch-src"
          rm -rf "$TMP_DIR"
          set +e
          git clone --depth=1 --branch "$SRC_BRANCH" --filter=blob:none --sparse \
            "$SRC_REPO" "$TMP_DIR"
          CLONE_EXIT=$?
          set -e

          if [ $CLONE_EXIT -eq 0 ] && [ -d "$TMP_DIR" ]; then
            pushd "$TMP_DIR" > /dev/null
            git sparse-checkout set target/linux/rockchip target/linux/generic >/dev/null 2>&1 || true
            popd > /dev/null

            if [ ! -d "${RK_DIR}/patches-${KV}" ] && [ -d "${TMP_DIR}/target/linux/rockchip/patches-${KV}" ]; then
              echo ">>> 拷贝 patches-${KV}"
              cp -r "${TMP_DIR}/target/linux/rockchip/patches-${KV}" "${RK_DIR}/"
            fi
            if [ ! -f "${RK_DIR}/config-${KV}" ] && [ -f "${TMP_DIR}/target/linux/rockchip/config-${KV}" ]; then
              echo ">>> 拷贝 config-${KV}"
              cp "${TMP_DIR}/target/linux/rockchip/config-${KV}" "${RK_DIR}/"
            fi
            if [ ! -f "${RK_DIR}/armv8/config-${KV}" ] && [ -f "${TMP_DIR}/target/linux/rockchip/armv8/config-${KV}" ]; then
              echo ">>> 拷贝 armv8/config-${KV}"
              mkdir -p "${RK_DIR}/armv8"
              cp "${TMP_DIR}/target/linux/rockchip/armv8/config-${KV}" "${RK_DIR}/armv8/"
            fi
          else
            echo "WARN: 从 ${SRC_BRANCH} 拉取失败（exit=$CLONE_EXIT），继续使用本地可能存在的资源"
          fi
        fi

        # 兜底：config-${KV} 缺失时从 generic 借一份
        if [ ! -f "${RK_DIR}/config-${KV}" ] && [ -f "${GEN_DIR}/config-${KV}" ]; then
          echo ">>> 从 generic 借一份 config-${KV}"
          cp "${GEN_DIR}/config-${KV}" "${RK_DIR}/config-${KV}"
        fi

        # 最后硬校验
        if [ ! -d "${RK_DIR}/patches-${KV}" ]; then
          echo "ERROR: patches-${KV} 仍然缺失，无法继续"
          ls -la "$RK_DIR" || true
          exit 1
        fi

        echo "===== 内核 ${KV} 资源最终状态 ====="
        ls -la "${RK_DIR}/config-${KV}"       2>/dev/null || echo "(no config-${KV})"
        ls -la "${RK_DIR}/armv8/config-${KV}" 2>/dev/null || echo "(no armv8/config-${KV})"
        ls -d  "${RK_DIR}/patches-${KV}"      2>/dev/null || echo "(no patches-${KV})"
        SCRIPT
        chmod +x "$GITHUB_WORKSPACE/ensure-kernel-support.sh"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    # ============================================================
    # 强制内核（写 Makefile + 补齐补丁/config）
    # ============================================================
    - name: Force kernel version (single KV for all branches)
      run: |
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"

        if [ ! -f "$MAKEFILE" ]; then
          echo "ERROR: $MAKEFILE not found"; exit 1
        fi

        echo "===== 1. 修改前 ====="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

        sed -i 's/^KERNEL_PATCHVER:=/KERNEL_PATCHVER := /' "$MAKEFILE"
        sed -i "s/^KERNEL_PATCHVER[[:space:]]*:=.*/KERNEL_PATCHVER := ${KV}/" "$MAKEFILE"
        grep -qE "^KERNEL_PATCHVER[[:space:]]*:=" "$MAKEFILE" || \
          echo "KERNEL_PATCHVER := ${KV}" >> "$MAKEFILE"
        sed -i 's/^KERNEL_TESTING_PATCHVER.*/# &/' "$MAKEFILE" 2>/dev/null || true

        echo "===== 2. 修改后 ====="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

        echo "===== 3. 补齐内核资源 ====="
        bash "$GITHUB_WORKSPACE/ensure-kernel-support.sh" \
          "$(pwd)" \
          "${KV}" \
          "${{ env.PATCH_SOURCE_REPO }}" \
          "${{ env.PATCH_SOURCE_BRANCH }}"

    - name: Prepare dot config and feeds (build.sh #1)
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Enforce target (after build.sh #1)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Enforce target (after add_packages.sh)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

    - name: Update config after custom packages (build.sh #2 + oldconfig)
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Enforce target (after oldconfig)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

    - name: Re-assert kernel version
      run: |
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"
        sed -i "s/^KERNEL_PATCHVER[[:space:]]*:=.*/KERNEL_PATCHVER := ${KV}/" "$MAKEFILE"
        echo "===== kernel re-check ====="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true
        echo "===== CONFIG_TESTING_KERNEL ====="
        grep -E "CONFIG_TESTING_KERNEL" .config || echo "(none)"

    - name: Final enforce + verify (before download)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

        cd project/friendlywrt
        PLAT="${{ env.TARGET_PLATFORM }}"
        SUB="${{ env.TARGET_SUBTARGET }}"
        DEV="${{ env.TARGET_DEVICE }}"
        KV="${{ env.KERNEL_VERSION }}"

        echo "=== Kernel version ==="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || { echo "ERROR: kernel missing"; exit 1; }

        echo "=== Kernel ${KV} resources ==="
        [ -d "target/linux/rockchip/patches-${KV}" ]      || { echo "ERROR: patches-${KV} missing"; exit 1; }
        [ -f "target/linux/rockchip/config-${KV}" ]       || { echo "ERROR: config-${KV} missing"; exit 1; }
        echo "[OK] kernel ${KV} resources present"

        echo "=== Target uniqueness ==="
        OTHERS=$(grep -E "^CONFIG_TARGET_[a-z0-9_]+=y$" .config \
                  | grep -v "DEVICE" \
                  | grep -v "^CONFIG_TARGET_${PLAT}=y$" \
                  || true)
        if [ -n "$OTHERS" ]; then
          echo "ERROR: unexpected targets:"; echo "$OTHERS"; exit 1
        fi
        echo "[OK] only ${PLAT} enabled"

        for k in "CONFIG_TARGET_${PLAT}=y" "CONFIG_TARGET_${SUB}=y" "CONFIG_TARGET_${SUB}_DEVICE_${DEV}=y"; do
          grep -q "^${k}$" .config && echo "[OK] $k" || { echo "ERROR: missing $k"; exit 1; }
        done

        echo "=== Custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config \
          || echo "WARNING: custom packages missing"

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
        find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        set +e
        make -j$(nproc) > /tmp/build.log 2>&1
        BUILD_EXIT=$?
        set -e
        echo "===== exit code: $BUILD_EXIT ====="
        if [ $BUILD_EXIT -ne 0 ]; then tail -300 /tmp/build.log; else tail -30 /tmp/build.log; fi
        exit $BUILD_EXIT

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-openwrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        [ -z "$PM_BIN" ] && { echo "ERROR: no apk/opkg"; exit 1; }
        ldd_out=$(ldd "$PM_BIN" 2>&1 || true)
        if ! echo "$ldd_out" | grep -q "not a dynamic executable"; then
          bad_paths=$(echo "$ldd_out" | grep -oE '=> /[^ ]+' | sed 's|=> ||' | grep -vE '^/(lib|lib64|usr/lib)/' || true)
          not_found=$(echo "$ldd_out" | grep -F "not found" || true)
          if [ -n "$bad_paths" ] || [ -n "$not_found" ]; then
            echo "ERROR: non-portable deps"; exit 1
          fi
        fi
        host_pm_filename="host-pm-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-openwrt-${{ matrix.VERSION }}.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-openwrt-${{ matrix.VERSION }}-docker.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in rk3568) MODEL=R5S-R5C-Series ;; *) echo "unknown cpu"; exit 1 ;; esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        KV="${{ env.KERNEL_VERSION }}"
        DN="${{ env.DISTRO_NAME }}"
        IMG_FILE=${MODEL}-${DN}-K${KV}-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-${DN}-K${KV}-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE"         >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE"     >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR"             >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX"                 >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        tar xzf "../rootfs-openwrt-${{ matrix.VERSION }}${SUFFIX}.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}.tgz"

    - name: Re-assert kernel version before kernel build
      run: |
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"
        sed -i "s/^KERNEL_PATCHVER[[:space:]]*:=.*/KERNEL_PATCHVER := ${KV}/" "$MAKEFILE"
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

    - name: Compile uboot and kernel
      run: |
        cd project
        ./build.sh uboot
        ./build.sh kernel

    - name: Build sd image
      id: build_sd_image
      run: |
        cd project
        ./build.sh sd-img
        mv out/${{ steps.config.outputs.img_filename }} ../artifact/

        pushd scripts/sd-fuse/ > /dev/null
        [ -d "${{ steps.config.outputs.dist_dir }}" ] || { echo "ERROR: dist_dir missing"; ls -la; exit 1; }
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null

        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ============================================================
  # 自动构建
  # ============================================================
  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
        CPU: [rk3568]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Write helper scripts
      run: |
        cat > "$GITHUB_WORKSPACE/enforce-target.sh" <<'SCRIPT'
        #!/bin/bash
        set -euo pipefail
        FW_DIR="$1"; PLAT="$2"; SUB="$3"; DEV="$4"
        CFG="$FW_DIR/.config"
        [ -f "$CFG" ] || { echo "WARN: no $CFG"; exit 0; }
        mapfile -t OTHERS < <(
          grep -E "^CONFIG_TARGET_[a-z0-9_]+=y$" "$CFG" 2>/dev/null \
            | grep -v "DEVICE" | grep -v "^CONFIG_TARGET_${PLAT}=y$" || true
        )
        for entry in "${OTHERS[@]}"; do
          [ -z "$entry" ] && continue
          T="${entry#CONFIG_TARGET_}"; T="${T%=y}"
          echo ">>> disabling extra target: $T"
          sed -i "/^CONFIG_TARGET_${T}=y$/d"            "$CFG"
          sed -i "/^CONFIG_TARGET_${T}_/d"              "$CFG"
          sed -i "/^# CONFIG_TARGET_${T} is not set$/d" "$CFG"
          sed -i "/^# CONFIG_TARGET_${T} /d"            "$CFG"
          echo "# CONFIG_TARGET_${T} is not set" >> "$CFG"
        done
        sed -i "/^CONFIG_TARGET_${PLAT}=y$/d"     "$CFG"
        sed -i "/^CONFIG_TARGET_${SUB}=y$/d"      "$CFG"
        sed -i "/^CONFIG_TARGET_${SUB}_DEVICE_/d" "$CFG"
        sed -i "/^# CONFIG_TARGET_${PLAT} /d"     "$CFG"
        sed -i "/^# CONFIG_TARGET_${SUB} /d"      "$CFG"
        {
          echo ""; echo "# === Enforced by CI: only ${PLAT} ==="
          echo "CONFIG_TARGET_${PLAT}=y"
          echo "CONFIG_TARGET_${SUB}=y"
          echo "CONFIG_TARGET_${SUB}_DEVICE_${DEV}=y"
        } >> "$CFG"
        grep -E "^CONFIG_TARGET_[a-z0-9_]+=y$" "$CFG" | sort || echo "(none)"
        SCRIPT
        chmod +x "$GITHUB_WORKSPACE/enforce-target.sh"

        cat > "$GITHUB_WORKSPACE/ensure-kernel-support.sh" <<'SCRIPT'
        #!/bin/bash
        set -euo pipefail
        FW_DIR="$1"; KV="$2"; SRC_REPO="$3"; SRC_BRANCH="$4"
        RK_DIR="${FW_DIR}/target/linux/rockchip"
        GEN_DIR="${FW_DIR}/target/linux/generic"
        [ -d "$RK_DIR" ] || { echo "ERROR: $RK_DIR not found"; exit 1; }

        need_source=false
        [ ! -d "${RK_DIR}/patches-${KV}" ]      && need_source=true
        [ ! -f "${RK_DIR}/config-${KV}" ]       && need_source=true
        [ ! -f "${RK_DIR}/armv8/config-${KV}" ] && need_source=true

        if [ "$need_source" = "true" ]; then
          echo "===== 拉取内核 ${KV} 资源 (from ${SRC_BRANCH}) ====="
          TMP_DIR="/tmp/fw-patch-src"; rm -rf "$TMP_DIR"
          set +e
          git clone --depth=1 --branch "$SRC_BRANCH" --filter=blob:none --sparse \
            "$SRC_REPO" "$TMP_DIR"
          CLONE_EXIT=$?
          set -e
          if [ $CLONE_EXIT -eq 0 ]; then
            pushd "$TMP_DIR" >/dev/null
            git sparse-checkout set target/linux/rockchip target/linux/generic >/dev/null 2>&1 || true
            popd >/dev/null
            [ ! -d "${RK_DIR}/patches-${KV}" ] && [ -d "${TMP_DIR}/target/linux/rockchip/patches-${KV}" ] && \
              cp -r "${TMP_DIR}/target/linux/rockchip/patches-${KV}" "${RK_DIR}/"
            [ ! -f "${RK_DIR}/config-${KV}" ] && [ -f "${TMP_DIR}/target/linux/rockchip/config-${KV}" ] && \
              cp "${TMP_DIR}/target/linux/rockchip/config-${KV}" "${RK_DIR}/"
            [ ! -f "${RK_DIR}/armv8/config-${KV}" ] && [ -f "${TMP_DIR}/target/linux/rockchip/armv8/config-${KV}" ] && {
              mkdir -p "${RK_DIR}/armv8"
              cp "${TMP_DIR}/target/linux/rockchip/armv8/config-${KV}" "${RK_DIR}/armv8/"
            }
          fi
        fi

        [ ! -f "${RK_DIR}/config-${KV}" ] && [ -f "${GEN_DIR}/config-${KV}" ] && \
          cp "${GEN_DIR}/config-${KV}" "${RK_DIR}/config-${KV}"

        [ -d "${RK_DIR}/patches-${KV}" ] || { echo "ERROR: patches-${KV} missing"; ls -la "$RK_DIR"; exit 1; }
        echo "[OK] kernel ${KV} ready"
        SCRIPT
        chmod +x "$GITHUB_WORKSPACE/ensure-kernel-support.sh"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle
        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Force kernel version (single KV for all branches)
      run: |
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"
        [ -f "$MAKEFILE" ] || { echo "ERROR: $MAKEFILE not found"; exit 1; }
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true
        sed -i 's/^KERNEL_PATCHVER:=/KERNEL_PATCHVER := /' "$MAKEFILE"
        sed -i "s/^KERNEL_PATCHVER[[:space:]]*:=.*/KERNEL_PATCHVER := ${KV}/" "$MAKEFILE"
        grep -qE "^KERNEL_PATCHVER[[:space:]]*:=" "$MAKEFILE" || echo "KERNEL_PATCHVER := ${KV}" >> "$MAKEFILE"
        sed -i 's/^KERNEL_TESTING_PATCHVER.*/# &/' "$MAKEFILE" 2>/dev/null || true
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

        bash "$GITHUB_WORKSPACE/ensure-kernel-support.sh" \
          "$(pwd)" "${KV}" \
          "${{ env.PATCH_SOURCE_REPO }}" "${{ env.PATCH_SOURCE_BRANCH }}"

    - name: Prepare dot config and feeds (build.sh #1)
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Enforce target (after build.sh #1)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Enforce target (after add_packages.sh)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Enforce target (after oldconfig)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

    - name: Re-assert kernel version
      run: |
        cd project/friendlywrt
        MAKEFILE="target/linux/rockchip/Makefile"
        KV="${{ env.KERNEL_VERSION }}"
        sed -i "s/^KERNEL_PATCHVER[[:space:]]*:=.*/KERNEL_PATCHVER := ${KV}/" "$MAKEFILE"
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' "$MAKEFILE" || true

    - name: Final enforce + verify (before download)
      run: |
        bash "$GITHUB_WORKSPACE/enforce-target.sh" \
          project/friendlywrt \
          "${{ env.TARGET_PLATFORM }}" \
          "${{ env.TARGET_SUBTARGET }}" \
          "${{ env.TARGET_DEVICE }}"

        cd project/friendlywrt
        PLAT="${{ env.TARGET_PLATFORM }}"; SUB="${{ env.TARGET_SUBTARGET }}"; DEV="${{ env.TARGET_DEVICE }}"; KV="${{ env.KERNEL_VERSION }}"

        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || { echo "ERROR: kernel missing"; exit 1; }
        [ -d "target/linux/rockchip/patches-${KV}" ] || { echo "ERROR: patches-${KV} missing"; exit 1; }
        [ -f "target/linux/rockchip/config-${KV}" ]  || { echo "ERROR: config-${KV} missing"; exit 1; }

        OTHERS=$(grep -E "^CONFIG_TARGET_[a-z0-9_]+=y$" .config | grep -v "DEVICE" | grep -v "^CONFIG_TARGET_${PLAT}=y$" || true)
        [ -n "$OTHERS" ] && { echo "ERROR: unexpected targets:"; echo "$OTHERS"; exit 1; }

        for k in "CONFIG_TARGET_${PLAT}=y" "CONFIG_TARGET_${SUB}=y" "CONFIG_TARGET_${SUB}_DEVICE_${DEV}=y"; do
          grep -q "^${k}$" .config && echo "[OK] $k" || { echo "ERROR: missing $k"; exit 1; }
        done

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
        find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        set +e
        make -j$(nproc) > /tmp/build.log 2>&1
        BUILD_EXIT=$?
        set -e
        echo "===== exit code: $BUILD_EXIT ====="
        if [ $BUILD_EXIT -ne 0 ]; then tail -300 /tmp/build.log; else tail -30 /tmp/build.log; fi
        exit $BUILD_EXIT

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        rootfs_filename="rootfs-openwrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ]  && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        [ -z "$PM_BIN" ] && { echo "ERROR: no apk/opkg"; exit 1; }
        ldd_out=$(ldd "$PM_BIN" 2>&1 || true)
        if ! echo "$ldd_out" | grep -q "not a dynamic executable"; then
          bad_paths=$(echo "$ldd_out" | grep -oE '=> /[^ ]+' | sed 's|=> ||' | grep -vE '^/(lib|lib64|usr/lib)/' || true)
          not_found=$(echo "$ldd_out" | grep -F "not found" || true)
          [ -n "$bad_paths" ] || [ -n "$not_found" ] && { echo "ERROR: non-portable"; exit 1; }
        fi
        host_pm_filename="host-pm-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Download friendlywrt rootfs (non-docker)
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-openwrt-${{ matrix.VERSION }}.tgz"

    - name: Download friendlywrt rootfs (docker)
      if: matrix.SET == 'docker'
      uses: robinraju/release-downloader@v1.6
      env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-openwrt-${{ matrix.VERSION }}-docker.tgz"

    - name: Download host package-manager bundle
      if: matrix.SET == 'non-docker'
      uses: robinraju/release-downloader@v1.6
      env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}.tgz"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        case ${{ matrix.CPU }} in rk3568) MODEL=R5S-R5C-Series ;; *) echo "unknown cpu"; exit 1 ;; esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        KV="${{ env.KERNEL_VERSION }}"; DN="${{ env.DISTRO_NAME }}"
        IMG_FILE=${MODEL}-${DN}-K${KV}-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-${DN}-K${KV}-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/${{ matrix.CPU }}/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE"     >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR"         >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX"             >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        tar xzf "../rootfs-openwrt-${{ matrix.VERSION }}${{ steps.config.outputs.suffix }}.tgz"

    - name: Unpack host package-manager bundle
      if: matrix.SET == 'non-docker'
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}.tgz"

    - name: Re-assert kernel version before kernel build
      run: |
        cd project/friendlywrt
        KV="${{ env.KERNEL_VERSION }}"
        sed -i "s/^KERNEL_PATCHVER[[:space:]]*:=.*/KERNEL_PATCHVER := ${KV}/" target/linux/rockchip/Makefile
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || true

    - name: Compile uboot and kernel
      run: |
        cd project
        ./build.sh uboot
        ./build.sh kernel

    - name: Build sd image
      id: build_sd_image
      run: |
        cd project
        ./build.sh sd-img
        mv out/${{ steps.config.outputs.img_filename }} ../artifact/

        pushd scripts/sd-fuse/ > /dev/null
        [ -d "${{ steps.config.outputs.dist_dir }}" ] || { echo "ERROR: dist_dir missing"; ls -la; exit 1; }
        archive_dir="${{ steps.config.outputs.dist_dir }}-${{ matrix.CPU }}"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../../artifact/
        popd > /dev/null

        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate_assets:
    needs: [prepare_release, build_manual, build_auto]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-openwrt-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build_manual, build_auto, cleanup_intermediate_assets]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}