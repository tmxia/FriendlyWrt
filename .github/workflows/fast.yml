name: Build FriendlyWrt With Custom Kernel

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '24.10'
        type: choice
        options: ['24.10', '25.12']
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options: ['docker', 'non-docker']
      kernel_version:
        description: 'Kernel version'
        required: true
        default: '6.18.y'
        type: choice
        options: ['6.18.y', '6.12.y', '6.6.y', '6.1.y']
      official_release_tag:
        description: '官方固件 Release tag'
        required: true
        default: 'FriendlyWrt-2026-09-04'
        type: string
      official_asset:
        description: '官方固件 asset 名'
        required: true
        default: 'R5S-R5C-Series-FriendlyWrt-24.10-docker.img.gz'
        type: string
      replace_existing:
        description: 'Replace existing release tag'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      verified: ${{ steps.verify.outputs.passed }}
      img_name: ${{ env.img_name }}
    steps:
    - uses: actions/checkout@v4

    # ============================================================
    # 1. 环境初始化
    # ============================================================
    - name: Init env
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          wget curl git rsync time file unzip bc bzip2 xxd \
          python3 python3-pip dosfstools e2fsprogs parted \
          android-sdk-libsparse-utils u-boot-tools \
          gzip xz-utils zstd lz4 binutils-aarch64-linux-gnu
        pip3 install --quiet zstandard lz4
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git clone https://github.com/friendlyarm/repo /tmp/repo
        sudo -E cp /tmp/repo/repo /usr/bin/
        mkdir -p $GITHUB_WORKSPACE/artifact
        chmod +x $GITHUB_WORKSPACE/scripts/*.sh || true
        echo "cores: $(nproc)"

    # ============================================================
    # 2. 获取 sd-fuse
    # ============================================================
    - name: Fetch sd-fuse
      run: |
        cd /tmp
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests \
          -b master-v${{ inputs.version }} -m rk3568.xml \
          --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        ls -la /tmp/scripts/sd-fuse/

    # ============================================================
    # 3. 下载 images.tgz
    # ============================================================
    - name: Download tgz
      id: images
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SUFFIX=""
        [ "${{ inputs.set }}" == "docker" ] && SUFFIX="-docker"
        PATTERN="images-R5S-R5C-Series-FriendlyWrt-${{ inputs.version }}${SUFFIX}.tgz"
        TAGS=$(gh release list --limit 50 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
        FOUND=""
        for TAG in $TAGS; do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qF "$PATTERN"; then
            FOUND="$TAG"; break
          fi
        done
        [ -z "$FOUND" ] && { echo "ERROR: not found"; exit 1; }
        mkdir -p /tmp/inputs && cd /tmp/inputs
        gh release download "$FOUND" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir .
        echo "images_tgz=/tmp/inputs/$PATTERN" >> $GITHUB_OUTPUT

    # ============================================================
    # 4. 下载官方参考
    # ============================================================
    - name: Download official
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REF_TAG: ${{ inputs.official_release_tag }}
        REF_ASSET: ${{ inputs.official_asset }}
      run: |
        mkdir -p /tmp/official && cd /tmp/official
        if gh release download "$REF_TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern "$REF_ASSET" --dir .; then
          gunzip -k *.img.gz 2>/dev/null || true
          IMG=$(find . -maxdepth 1 -name "*.img" | head -1)
          [ -n "$IMG" ] && echo "官方参考: $IMG"
        else
          touch /tmp/official/.no_reference
        fi

    # ============================================================
    # 5. 扫描 + 下载内核
    # ============================================================
    - name: Scan kernel
      id: kernel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        case "$KERNEL_VERSION" in
          6.18*|6.18.y) PREFIX="6.18" ;;
          6.12*|6.12.y) PREFIX="6.12" ;;
          6.6*|6.6.y)   PREFIX="6.6" ;;
          6.1*|6.1.y)   PREFIX="6.1" ;;
          *)            PREFIX="$KERNEL_VERSION" ;;
        esac
        declare -A VER_TO_SOURCE
        for target in \
          "ophub/kernel:kernel_flippy" \
          "ophub/kernel:kernel_rk35xx" \
          "breakingbadboy/OpenWrt:kernel_rk35xx"; do
          REPO="${target%%:*}"; RELEASE="${target##*:}"
          ASSETS=$(gh release view "$RELEASE" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          [ -z "$ASSETS" ] && continue
          VERS=$(echo "$ASSETS" | grep -E "^${PREFIX}\.[0-9]+\.tar\.gz$" | sed 's/\.tar\.gz//' | sort -V || echo "")
          [ -z "$VERS" ] && continue
          for v in $VERS; do
            [ -z "${VER_TO_SOURCE[$v]:-}" ] && VER_TO_SOURCE["$v"]="$REPO:$RELEASE"
          done
        done
        [ ${#VER_TO_SOURCE[@]} -eq 0 ] && { echo "ERROR: no kernel"; exit 1; }
        SELECTED_VER=$(printf '%s\n' "${!VER_TO_SOURCE[@]}" | sort -V | tail -1)
        SELECTED_SOURCE="${VER_TO_SOURCE[$SELECTED_VER]}"
        SELECTED_REPO="${SELECTED_SOURCE%%:*}"
        SELECTED_RELEASE="${SELECTED_SOURCE##*:}"
        echo "Selected: $SELECTED_VER from $SELECTED_REPO/$SELECTED_RELEASE"
        echo "version=$SELECTED_VER" >> $GITHUB_OUTPUT
        echo "repo=$SELECTED_REPO" >> $GITHUB_OUTPUT
        echo "release=$SELECTED_RELEASE" >> $GITHUB_OUTPUT

    - name: Download kernel
      run: |
        cd /tmp
        URL="https://github.com/${{ steps.kernel.outputs.repo }}/releases/download/${{ steps.kernel.outputs.release }}/${{ steps.kernel.outputs.version }}.tar.gz"
        wget -q --timeout=120 "$URL" -O kernel.tar.gz || curl -L -f --max-time 300 "$URL" -o kernel.tar.gz
        tar xzf kernel.tar.gz
        KERNEL_VER="${{ steps.kernel.outputs.version }}"
        LOCAL_DIR=$(find . -maxdepth 1 -type d -name "*${KERNEL_VER}*" | head -1)
        [ -z "$LOCAL_DIR" ] && LOCAL_DIR="$KERNEL_VER"
        BOOT_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$LOCAL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)
        mkdir -p boot_extract dtb_extract
        tar xzf "$BOOT_TAR" -C boot_extract
        tar xzf "$DTB_TAR" -C dtb_extract
        # 顺便提取官方 KRNL 头用于对比
        OFF_IMG=$(find /tmp/official -maxdepth 1 -name "*.img" 2>/dev/null | head -1 || true)
        if [ -n "$OFF_IMG" ]; then
          python3 - "$OFF_IMG" /tmp/official_krnl_head.bin <<'PYEOF'
import sys
img, out = sys.argv[1], sys.argv[2]
with open(img, 'rb') as f:
    buf = f.read(4 * 1024 * 1024)
idx = buf.find(b'KRNL')
if idx >= 0:
    open(out, 'wb').write(buf[idx:idx + 0x10000])
    print(f"官方 KRNL @ 0x{idx:x}")
else:
    sys.exit(1)
PYEOF
        fi

    # ============================================================
    # 6. 替换内核 + 生成镜像（单一实现，调用 replace-kernel.sh）
    # ============================================================
    - name: Replace kernel & build image
      env:
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        OFFICIAL_DIR: /tmp/official
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        chmod +x $GITHUB_WORKSPACE/scripts/replace-kernel.sh
        DIST_NAME="friendlywrt$(echo ${{ inputs.version }} | awk -F . '{print $1}')$([ "${{ inputs.set }}" = "docker" ] && echo "-docker")"
        KV_SHORT="${{ inputs.kernel_version }}"; KV_SHORT="${KV_SHORT%.y}"
        IMG_FILE="R5S-R5C-Series-FriendlyWrt-kv${KV_SHORT}-${{ inputs.version }}$([ "${{ inputs.set }}" = "docker" ] && echo "-docker").img"
        bash $GITHUB_WORKSPACE/scripts/replace-kernel.sh \
          "${{ steps.images.outputs.images_tgz }}" \
          /tmp/scripts/sd-fuse \
          "$DIST_NAME" \
          "$GITHUB_WORKSPACE/artifact/$IMG_FILE"
        echo "img_name=$IMG_FILE" >> $GITHUB_ENV

    # ============================================================
    # 7. 验证
    # ============================================================
    - name: Verify
      id: verify
      run: |
        set +e
        bash $GITHUB_WORKSPACE/scripts/verify-against-official.sh \
          "$GITHUB_WORKSPACE/artifact/${{ env.img_name }}" \
          "/tmp/official" "${{ steps.kernel.outputs.version }}"
        RC=$?
        set -e
        if [ $RC -eq 0 ]; then
          echo "passed=true" >> $GITHUB_OUTPUT
        else
          echo "passed=false" >> $GITHUB_OUTPUT
          exit $RC
        fi

    # ============================================================
    # 8. 压缩 + 上传
    # ============================================================
    - name: Compress
      run: |
        cd $GITHUB_WORKSPACE/artifact
        gzip -f *.img
        ls -la
        set +e
        for f in *.img.gz; do
          SIZE=$(stat -c%s "$f")
          echo "$f -> $SIZE bytes"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "ERROR: $f 超过 2GiB"; exit 1
          fi
        done
        set -e
        echo "压缩完成"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.img_name }}
        path: ./artifact/${{ env.img_name }}.gz
        retention-days: 7

  # ============================================================
  # 发布 + 清理
  # ============================================================
  publish:
    needs: build
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      needs.build.outputs.verified == 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: firmware-${{ needs.build.outputs.img_name }}
        path: ./artifact
    - name: Tag
      id: tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        KV="${{ github.event.inputs.kernel_version }}"
        KV_SHORT="${KV%.y}"
        BASE_TAG="FriendlyWrt-kv${KV_SHORT}-$(date +%Y-%m-%d)"
        if [ "${{ github.event.inputs.replace_existing }}" = "true" ]; then
          EXISTING=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' \
            | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
          for tag in $EXISTING; do
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
            git push origin --delete "refs/tags/$tag" || true
          done
        fi
        echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
    - name: Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "R5S/R5C FriendlyWrt ${{ inputs.version }} + Flippy KV ${{ inputs.kernel_version }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: ./artifact/*.img.gz

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 1
          retain_days: 0
          delete_workflow_pattern: "Build FriendlyWrt With Custom Kernel"
          repository: ${{ github.repository }}

      - name: Clean old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '2 days'
          skip-recent: 1
        continue-on-error: true