name: Build FriendlyWrt With Flippy Kernel (Full)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag with auto-increment or overwrite
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-flippy-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              NEXT=$((MAX_NUM + 1))
              TAG="${BASE_TAG}-${NEXT}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          dosfstools e2fsprogs parted
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        make -j$(nproc)

    # ---------- 构建 SD 镜像（使用 flippy 内核） ----------
    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568)
          MODEL=R5S-R5C-Series
          ;;
        *)
          echo "unknow cpu"
          exit 1
          ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Compile uboot and kernel (FriendlyWrt default)
      run: |
        cd $GITHUB_WORKSPACE/project
        ./build.sh uboot
        # 重新同步 device/friendlyelec，防止 uboot 编译删除
        repo sync -c device/friendlyelec --no-clone-bundle
        # 重新生成 .current_config.mk
        source .current_config.mk 2>/dev/null || {
          CPU=rk3568
          [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
          DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
          CONFIG=rockchip${SUFFIX}
          cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        }
        # 编译内核，生成必要的辅助文件（resource.img, boot.img 等）
        ./build.sh kernel

    - name: Get latest flippy kernel version
      id: flippy_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Fetching latest flippy kernel version from ophub/kernel release kernel_flippy..."
        ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
        VERSIONS=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//')
        if [ -z "$VERSIONS" ]; then
          echo "ERROR: No kernel tarballs found in kernel_flippy release"
          exit 1
        fi
        LATEST=$(echo "$VERSIONS" | sort -V | tail -1)
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest flippy kernel version: $LATEST"

    - name: Download and extract flippy kernel
      run: |
        cd $GITHUB_WORKSPACE/project
        KERNEL_VER="${{ steps.flippy_version.outputs.version }}"
        wget -q https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VER}.tar.gz -O /tmp/kernel_all.tar.gz

        mkdir -p /tmp/flippy_extract
        tar xzf /tmp/kernel_all.tar.gz -C /tmp/flippy_extract

        KERNEL_DIR="/tmp/flippy_extract/$KERNEL_VER"
        if [ ! -d "$KERNEL_DIR" ]; then
          KERNEL_DIR=$(find /tmp/flippy_extract -maxdepth 1 -type d -name "*$KERNEL_VER*" | head -1)
        fi
        echo "Kernel directory: $KERNEL_DIR"

        BOOT_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)

        mkdir -p /tmp/flippy_boot /tmp/flippy_dtb
        tar xzf "$BOOT_TAR" -C /tmp/flippy_boot
        tar xzf "$DTB_TAR" -C /tmp/flippy_dtb

        echo "BOOT_DIR=/tmp/flippy_boot" >> $GITHUB_ENV
        echo "DTB_DIR=/tmp/flippy_dtb" >> $GITHUB_ENV

    - name: Replace default kernel with flippy
      run: |
        cd $GITHUB_WORKSPACE/project
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        BOOT_DIR="/tmp/flippy_boot"
        DTB_DIR="/tmp/flippy_dtb"

        # 复制 flippy 的 boot.img 和 kernel.img 到 sd-fuse 目录
        if [ -f "$BOOT_DIR/boot.img" ]; then
          cp -f "$BOOT_DIR/boot.img" "scripts/sd-fuse/${DIST_DIR}/"
          echo "boot.img replaced"
        fi
        if [ -f "$BOOT_DIR/kernel.img" ]; then
          cp -f "$BOOT_DIR/kernel.img" "scripts/sd-fuse/${DIST_DIR}/"
          echo "kernel.img replaced"
        fi

        # 替换 dtb 目录
        rm -rf "scripts/sd-fuse/${DIST_DIR}/dtb"
        mkdir -p "scripts/sd-fuse/${DIST_DIR}/dtb/rockchip"
        cp -f "$DTB_DIR"/*.dtb "scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/" 2>/dev/null || true
        echo "dtb replaced"

    - name: Build sd image and package artifacts
      id: build_sd_image
      run: |
        cd $GITHUB_WORKSPACE/project/scripts/sd-fuse
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        IMG_FILE="${{ steps.config.outputs.img_filename }}"
        ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"

        # 打包 tgz（提前）
        tar czf "$ARTIFACT_DIR/${{ steps.config.outputs.archive_filename }}" \
            -C . "$DIST_DIR"
        echo "tgz created"

        # 运行 mk-sd-image.sh 重新生成镜像（目录已完整，不会下载）
        set +e
        yes | ./mk-sd-image.sh "$DIST_DIR" > /tmp/mk-sd.log 2>&1
        MK_EXIT=$?
        set -e
        echo "mk-sd-image.sh exit code: $MK_EXIT"
        cat /tmp/mk-sd.log

        # 查找并重命名镜像
        if [ ! -f "out/${IMG_FILE}" ]; then
          ORIG_IMG=$(find out -maxdepth 1 -name "*.img" -print -quit)
          if [ -n "$ORIG_IMG" ]; then
            mv "$ORIG_IMG" "out/$IMG_FILE"
          else
            echo "ERROR: No .img found"
            ls -la out || true
            exit 1
          fi
        fi

        # 移动并压缩
        mv "out/$IMG_FILE" "$ARTIFACT_DIR/"
        cd "$ARTIFACT_DIR"
        gzip -f "$IMG_FILE"
        echo "Compressed: $ARTIFACT_DIR/$IMG_FILE.gz"
        ls -la "$ARTIFACT_DIR"

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ---------- 自动触发构建 ----------
  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          dosfstools e2fsprogs parted
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt
      id: compile
      run: |
        cd project/friendlywrt
        make -j$(nproc)

    # ---------- 构建 SD 镜像 ----------
    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568)
          MODEL=R5S-R5C-Series
          ;;
        *)
          echo "unknow cpu"
          exit 1
          ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Compile uboot and kernel (FriendlyWrt default)
      run: |
        cd $GITHUB_WORKSPACE/project
        ./build.sh uboot
        repo sync -c device/friendlyelec --no-clone-bundle
        source .current_config.mk 2>/dev/null || {
          CPU=rk3568
          [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
          DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
          CONFIG=rockchip${SUFFIX}
          cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        }
        ./build.sh kernel

    - name: Get latest flippy kernel version
