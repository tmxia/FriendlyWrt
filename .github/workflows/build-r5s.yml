name: Build OpenWrt for NanoPi R5S (FriendlyWrt-style)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_BRANCH: 'openwrt-25.12'
  FLAVOR: 'r5s'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-dev python3-distutils python3-setuptools \
          python3-pip python3-venv python3-pyelftools rsync subversion swig time \
          xsltproc zlib1g-dev \
          bison flex libtool libtool-bin pkg-config \
          libgmp-dev libmpc-dev libmpfr-dev \
          gperf patch quilt cpio \
          liblzma-dev libbz2-dev \
          device-tree-compiler u-boot-tools \
          bzip2 xz-utils zip unzip wget curl \
          autoconf automake autopoint texinfo help2man \
          android-sdk-libsparse-utils e2fsprogs parted dosfstools mtools
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
        python3 -c "import elftools" 2>/dev/null || pip3 install --quiet pyelftools
        mkdir -p ./artifact
        echo "CPU cores: $(nproc)"

    # ---------- 1. 准备 OpenWrt 官方源码 ----------
    - name: Prepare OpenWrt workspace
      run: |
        mkdir -p project
        cd project
        git clone --depth 1 -b ${{ env.OPENWRT_BRANCH }} \
          https://github.com/openwrt/openwrt.git friendlywrt > /dev/null 2>&1
        cd friendlywrt
        ./scripts/feeds update -a > /dev/null 2>&1
        ./scripts/feeds install -a > /dev/null 2>&1
        rm -f feeds.conf
        cd ..
        mkdir -p configs/rockchip
        touch configs/rockchip/01-nanopi
        echo "OpenWrt workspace prepared"

    - name: Initialize .config with R5S target
      run: |
        cd project/friendlywrt
        cat > .config <<'EOF'
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y
        CONFIG_LUCI_LANG_zh_Hans=y
        EOF
        make defconfig > /dev/null 2>&1
        echo "Initial .config created"

    - name: Verify upstream kernel version (must be 6.12)
      run: |
        cd project/friendlywrt
        if [ -d target/linux/rockchip/patches-6.12 ] && [ -f target/linux/rockchip/armv8/config-6.12 ]; then
          echo "[OK] OpenWrt Rockchip target uses kernel 6.12"
        else
          echo "ERROR: 6.12 kernel artifacts not found"
          exit 1
        fi

    - name: Bridge add_packages.sh kernel config path
      run: |
        cd project/friendlywrt/target/linux/rockchip
        if [ ! -e config-6.1 ]; then
          ln -s armv8/config-6.12 config-6.1
        fi
        ls -la config-6.1

    - name: Apply customizations (original script)
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Final config check
      run: |
        cd project/friendlywrt
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-i18n-clashoo-zh-cn|kmod-inet-diag)=y" .config || true

    # ---------- 2. 编译 OpenWrt ----------
    - name: Download packages
      run: |
        cd project/friendlywrt
        if ! make download -j$(nproc) > /tmp/dl.log 2>&1; then
          echo "::error::make download failed"
          grep -iE "error|fail|404|not found|unable|denied|timeout|refused" /tmp/dl.log | head -30 || true
          exit 1
        fi
        echo "Package download completed"

    - name: Compile OpenWrt (kernel 6.12 + rootfs)
      run: |
        cd project/friendlywrt
        if ! make -j$(nproc) > /tmp/build.log 2>&1; then
          echo "Build failed. Last 100 lines:"
          tail -100 /tmp/build.log
          exit 1
        fi
        echo "OpenWrt compile finished"

    # ---------- 3. 准备 sd-fuse 打包工作区 ----------
    - name: Clone sd-fuse_rk3568
      run: |
        cd project
        git clone --depth 1 https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse
        cd sd-fuse
        # sd-fuse 需要一个 prebuilt 目录来存放内核和 rootfs
        mkdir -p prebuilt
        echo "sd-fuse cloned"

    - name: Stage OpenWrt outputs into sd-fuse prebuilt
      run: |
        cd project

        # --- 内核 Image ---
        KERNEL_IMAGE=""
        for cand in \
          friendlywrt/bin/targets/rockchip/armv8/*Image* \
          friendlywrt/bin/targets/rockchip/armv8/*itb* \
          friendlywrt/build_dir/target-aarch64_cortex-a53_musl/linux-rockchip_armv8/Image ; do
          if [ -f "$cand" ]; then KERNEL_IMAGE="$cand"; break; fi
        done

        if [ -z "$KERNEL_IMAGE" ]; then
          echo "::error::Kernel Image not found"
          find friendlywrt/bin -type f | head -50
          exit 1
        fi
        cp "$KERNEL_IMAGE" sd-fuse/prebuilt/Image
        echo "Kernel: $KERNEL_IMAGE"

        # --- Rootfs 目录 ---
        ROOTFS_DIR=$(ls -d friendlywrt/build_dir/target-aarch64_cortex-a53_musl/root-* 2>/dev/null | head -1)
        if [ -z "$ROOTFS_DIR" ]; then
          echo "::error::Rootfs build dir not found"
          exit 1
        fi
        # sd-fuse 期望 rootfs.img（ext4 镜像）
        # OpenWrt 已构建出 rootfs 目录，直接用 mkfs.ext4 打成镜像
        ROOTFS_SIZE_MB=$(du -sm "$ROOTFS_DIR" | awk '{print $1+80}')
        rm -f sd-fuse/prebuilt/rootfs.img
        dd if=/dev/zero of=sd-fuse/prebuilt/rootfs.img bs=1M count=${ROOTFS_SIZE_MB} status=none
        mkfs.ext4 -q -F -L rootfs sd-fuse/prebuilt/rootfs.img
        mkdir -p /tmp/rootfs_mnt
        sudo mount -o loop sd-fuse/prebuilt/rootfs.img /tmp/rootfs_mnt
        sudo cp -a "$ROOTFS_DIR"/. /tmp/rootfs_mnt/
        sudo umount /tmp/rootfs_mnt
        echo "Rootfs image built: $(du -h sd-fuse/prebuilt/rootfs.img | awk '{print $1}')"

        echo "--- sd-fuse prebuilt ---"
        ls -lh sd-fuse/prebuilt/

    # ---------- 4. 用 sd-fuse 生成可刷写镜像 ----------
    - name: Build SD image with sd-fuse
      run: |
        cd project/sd-fuse
        ls -la
        echo "=== Looking for build scripts ==="
        ls -1 *.sh 2>/dev/null || true

        # sd-fuse_rk3568 的主脚本通常是 mk-sd-image.sh
        if [ ! -f ./mk-sd-image.sh ]; then
          echo "::error::mk-sd-image.sh not found"
          exit 1
        fi

        # 检查 prebuilt 目录结构
        echo "=== prebuilt content ==="
        ls -la prebuilt/ || true

        # 执行打包（需要 sudo 因为要 mount loop 设备）
        sudo ./mk-sd-image.sh rk3568 2>&1 | tee /tmp/sd-fuse.log || {
          echo "::warning::mk-sd-image.sh returned non-zero, checking output"
          tail -50 /tmp/sd-fuse.log
        }

        echo "=== output directory ==="
        ls -lh out/ 2>/dev/null || echo "no out/ directory"
        find . -maxdepth 2 -name "*.img" -o -maxdepth 2 -name "*.img.gz" 2>/dev/null | head

    - name: Collect artifacts
      run: |
        cd project

        # 优先收集 sd-fuse 生成的完整镜像
        find sd-fuse -maxdepth 2 -type f \( -name "*.img" -o -name "*.img.gz" \) \
          -exec cp {} ../artifact/ \; 2>/dev/null || true

        # 同时收集 OpenWrt 原生产物作为备用
        find friendlywrt/bin/targets/rockchip/armv8/ -maxdepth 1 -type f \
          \( -name "*nanopi-r5s*.img.gz" -o -name "*nanopi-r5s*.tar.gz" -o -name "*nanopi-r5s*.manifest" \) \
          -exec cp {} ../artifact/ \; 2>/dev/null || true

        echo "--- Collected artifacts ---"
        ls -lh ../artifact/

    - name: Upload artifacts to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/*
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
        file_glob: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S (FriendlyWrt-style)"
          repository: ${{ github.repository }}