name: Build R5S Custom Firmware

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix
        id: set-matrix
        run: bash scripts/platforms.sh

  build:
    needs: init
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.init.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          df -hT

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig

      - name: Clone OpenWrt source
        run: |
          git clone -b ${{ matrix.value.REPO_BRANCH }} --single-branch \
            ${{ matrix.value.REPO_URL }} openwrt

      - name: DIY pre (feeds 更新前)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} pre

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: DIY post (feeds 更新后)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} post

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Load R5S config
        run: |
          cp $GITHUB_WORKSPACE/${{ matrix.value.CONFIG_FILE }} openwrt/.config

      - name: DIY config (.config 调整)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ matrix.value.DIY_SH }} config
          make defconfig

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware
          path: openwrt/bin/targets/rockchip/armv8/
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: r5s-custom_${{ github.run_number }}
          name: R5S Custom Firmware #${{ github.run_number }}
          files: |
            openwrt/bin/targets/rockchip/armv8/*.img.gz
            openwrt/bin/targets/rockchip/armv8/*.manifest