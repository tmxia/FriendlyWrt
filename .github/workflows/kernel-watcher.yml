name: Kernel Watcher

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  models: read

jobs:
  check_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit SHA for nanopi6-v6.1.y
        id: sha
        run: |
          SHA=$(curl -s https://api.github.com/repos/friendlyarm/kernel-rockchip/commits/nanopi6-v6.1.y | jq -r .sha)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current SHA: $SHA"

      - name: Read recorded SHA
        id: recorded
        run: |
          if [ -f .kernel-version ]; then
            RECORDED=$(head -n1 .kernel-version | tr -d '[:space:]')
          else
            RECORDED="none"
          fi
          echo "recorded=$RECORDED" >> $GITHUB_OUTPUT
          echo "Recorded SHA: $RECORDED"

      - name: Fetch upstream commit messages
        id: commits
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        run: |
          if [ "${{ steps.recorded.outputs.recorded }}" = "none" ]; then
            RAW=$(curl -s "https://api.github.com/repos/friendlyarm/kernel-rockchip/commits?sha=${{ steps.sha.outputs.sha }}&per_page=30" \
                   | jq -r '.[].commit.message')
          else
            RAW=$(curl -s "https://api.github.com/repos/friendlyarm/kernel-rockchip/compare/${{ steps.recorded.outputs.recorded }}...${{ steps.sha.outputs.sha }}" \
                   | jq -r '.commits[].commit.message')
          fi

          # 过滤掉签核/链接/上游 SHA 等噪音行，只保留标题与关键描述
          MSGS=$(printf '%s\n' "$RAW" \
                   | grep -vE '^(Signed-off-by:|Reviewed-by:|Acked-by:|Tested-by:|Reported-by:|Suggested-by:|Link:|\[ Upstream commit|commit [0-9a-f]{40})' \
                   | grep -vE '^[[:space:]]+Signed-off-by' \
                   | awk 'NF' \
                   | head -n 60 \
                   | cut -c1-300)

          {
            echo "msgs<<__EOF__"
            echo "$MSGS"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Filtered message lines: $(printf '%s\n' "$MSGS" | wc -l)"

      - name: Generate Chinese summary
        id: summary
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_MSGS: ${{ steps.commits.outputs.msgs }}
        run: |
          if [ -z "$UPSTREAM_MSGS" ]; then
            echo "No upstream messages to summarize."
            echo "summary=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------- 规则式中文兜底 ----------
          fallback_summary() {
            printf '%s\n' "$1" | awk 'NF' | grep -E '^[A-Za-z]' | head -n 20 \
            | while IFS= read -r line; do
                prefix="${line%%:*}"
                subject="${line#*:}"
                if [ "$subject" = "$line" ]; then
                  subject=""
                fi
                subject="${subject# }"

                case "$prefix" in
                  *Bluetooth*|*hci*|*BT*)       cn="蓝牙";;
                  *dts*|*DTS*)                  cn="设备树";;
                  *arm64*|*ARM64*)              cn="ARM64";;
                  *configs*|*config*)           cn="内核配置";;
                  *drm*|*panfrost*|*mali*)      cn="图形驱动";;
                  *net*|*stmmac*|*gmac*)        cn="网络";;
                  *usb*|*USB*)                  cn="USB";;
                  *pci*|*PCI*)                  cn="PCI";;
                  *mmc*|*MMC*)                  cn="MMC";;
                  *firmware*|*fw*)              cn="固件";;
                  *i2c*|*spi*)                  cn="I2C/SPI";;
                  "")                           cn="";;
                  *)                            cn="$prefix";;
                esac

                subject=$(printf '%s' "$subject" | sed -E \
                  -e 's/^Add /新增 /I' \
                  -e 's/^enable /启用 /I' \
                  -e 's/^use /使用 /I' \
                  -e 's/^Set /设置 /I' \
                  -e 's/^detect /检测 /I' \
                  -e 's/^support /支持 /I' \
                  -e 's/^fix /修复 /I' \
                  -e 's/^update /更新 /I' \
                  -e 's/^remove /移除 /I' \
                  -e 's/^make /将 /I' \
                  -e 's/^revert /回退 /I')

                if [ -n "$subject" ]; then
                  if [ -n "$cn" ]; then
                    echo "- 【${cn}】${subject}"
                  else
                    echo "- ${subject}"
                  fi
                else
                  echo "- ${line}"
                fi
              done
          }

          PROMPT="请把下面 Linux 内核上游提交信息用中文总结。要求：
          - 输出 3-8 条要点，每行以 - 开头
          - 保留模块名/驱动名/子系统名等必要英文术语（如 Bluetooth、hci_uart、dts、drm、panfrost）
          - 按功能归类（例如 蓝牙 / 设备树 / 内核配置 / 图形驱动 / 网络 / USB）
          - 不要编造未出现的信息
          - 不要输出 Signed-off-by、Reviewed-by、Link 等元信息
          - 直接输出中文要点列表，不要任何前后缀说明

          上游提交信息：
          $UPSTREAM_MSGS"

          SUMMARY=""
          for MODEL in "gpt-4o-mini" "gpt-4o" "meta-llama-3.1-70b-instruct"; do
            for EP in "https://models.github.ai/inference/chat/completions" \
                      "https://models.inference.ai.azure.com/chat/completions"; do
              echo "Trying model=$MODEL endpoint=$EP"
              BODY=$(jq -n --arg p "$PROMPT" --arg m "$MODEL" \
                '{model:$m,temperature:0.2,messages:[{role:"user",content:$p}]}')
              RESP=$(curl -s "$EP" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$BODY" || true)
              SUMMARY=$(printf '%s' "$RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
              if [ -n "$SUMMARY" ]; then
                echo "Summary generated via $MODEL @ $EP"
                break 2
              fi
            done
          done

          # 若模型返回中文太少（或为空），改用规则式中文兜底
          CN_COUNT=0
          if [ -n "$SUMMARY" ]; then
            CN_COUNT=$(printf '%s' "$SUMMARY" | grep -oP '[\p{Han}]' | wc -l | tr -d ' ')
          fi
          echo "Chinese char count in model output: $CN_COUNT"

          if [ -z "$SUMMARY" ] || [ "$CN_COUNT" -lt 10 ]; then
            echo "Model output unusable, using rule-based Chinese fallback."
            SUMMARY=$(fallback_summary "$UPSTREAM_MSGS")
          fi

          {
            echo "summary<<__EOF__"
            echo "$SUMMARY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Compare and trigger build if changed
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kernel updated, triggering build..."
          gh workflow run build.yml -f version=both -f set=both --repo ${{ github.repository }}

      - name: Update recorded SHA with summary
        if: steps.sha.outputs.sha != steps.recorded.outputs.recorded
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          {
            echo "$SHA"
            echo ""
            echo "# 上游更新摘要（UTC $(date -u +%Y-%m-%d)）"
            echo ""
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "- （本次未生成摘要）"
            fi
          } > .kernel-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kernel-version
          git commit -m "chore: update kernel SHA $(echo $SHA | cut -c1-8)"
          git push

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [check_kernel]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs of exactly this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_NAME="Kernel Watcher"
          KEEP=1
          CURRENT_RUN_ID="${{ github.run_id }}"

          WF_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq ".workflows[] | select(.name == \"$TARGET_NAME\") | .id" | head -n1)

          if [ -z "$WF_ID" ]; then
            echo "Workflow '$TARGET_NAME' not found. Skip."
            exit 0
          fi
          echo "Workflow '$TARGET_NAME' ID: $WF_ID"

          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_ID/runs?per_page=100" \
            --jq '.workflow_runs[].id')

          echo "Runs found:"
          echo "$RUNS"

          i=0
          for run_id in $RUNS; do
            i=$((i+1))
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              echo "Keep current run: $run_id"
              continue
            fi
            if [ "$i" -le "$KEEP" ]; then
              echo "Keep recent run: $run_id"
              continue
            fi
            echo "Deleting run: $run_id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done