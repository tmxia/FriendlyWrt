name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
      kernel_track:
        description: 'Kernel track'
        required: false
        default: 'linux-stable'
        type: choice
        options:
          - 'openwrt'
          - 'linux-stable'
      kernel_version:
        description: 'Pinned version (empty = auto)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write
  packages: write

concurrency:
  group: build-r5s
  cancel-in-progress: false

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_VER: '25.12'
  MODEL_NAME: 'R5S'
  OPENWRT_BRANCH: 'openwrt-25.12'
  OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
  CONFIG_FILE: 'scripts/r5s.config'
  DIY_SH: 'scripts/r5s_customize.sh'
  PATCH_BRANCH: 'patches'
  CACHE_KEEP_VERSIONS: '2'
  PATCH_KEEP_VERSIONS: '2'

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    concurrency:
      group: r5s-prepare-release
      cancel-in-progress: false
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Generate release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="${MODEL_NAME}-OpenWrt-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)

          if [ "$FORCE_BASE" = "true" ]; then
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: true

  build:
    name: Build r5s
    needs: prepare_release
    runs-on: ubuntu-latest
    env:
      KERNEL_TRACK: ${{ inputs.kernel_track || 'linux-stable' }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/az \
                      /usr/local/share/powershell /opt/microsoft /opt/google \
                      /opt/pipx /usr/lib/jvm /usr/local/sdkman /usr/local/go \
                      /usr/local/share/chromium /opt/conda || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile

          sudo systemctl stop docker || true
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker || sudo service docker start
          sleep 3
          docker info | grep "Docker Root Dir" || true

          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-pip python3-setuptools python3-pyelftools \
            unzip wget zip zlib1g-dev libelf-dev \
            subversion flex bison libtool autoconf automake cmake \
            rsync quilt time jq swig zstd \
            device-tree-compiler u-boot-tools e2fsprogs parted dosfstools mtools \
            android-sdk-libsparse-utils btrfs-progs

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          free -h
          df -hT

      - name: Clone OpenWrt
        working-directory: /workdir
        run: |
          git clone -b ${{ env.OPENWRT_BRANCH }} --single-branch \
            ${{ env.OPENWRT_REPO }} openwrt 2>&1 | tail -3
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Pin OpenWrt commit
        if: env.KERNEL_TRACK == 'openwrt' && env.KERNEL_VERSION != ''
        run: |
          cd /workdir/openwrt
          git fetch origin "$KERNEL_VERSION" 2>/dev/null || git fetch origin
          if git checkout "$KERNEL_VERSION" 2>/dev/null; then
            echo "Pinned to $KERNEL_VERSION"
            git log -1 --format='%H %s'
          else
            echo "::warning::Cannot checkout $KERNEL_VERSION, using branch HEAD"
          fi

      - name: Switch to linux-stable kernel
        if: env.KERNEL_TRACK == 'linux-stable'
        run: |
          cd /workdir/openwrt
          if [ -n "$KERNEL_VERSION" ]; then
            TARGET="${KERNEL_VERSION#6.12.}"
          else
            TARGET=$(wget -qO- https://cdn.kernel.org/pub/linux/kernel/v6.x/ \
                     | grep -oE 'linux-6\.12\.[0-9]+\.tar\.xz' \
                     | sort -uV | tail -1 \
                     | grep -oE '6\.12\.[0-9]+' | cut -d. -f3)
          fi
          echo "$TARGET" > /workdir/target_version.txt
          echo "Target: 6.12.$TARGET"

          CUR=$(grep -h '^LINUX_VERSION-6\.12 = ' include/kernel-version.mk \
                | head -1 | awk -F'= ' '{print $2}' | tr -d '.')
          echo "Builtin: 6.12.$CUR"

          if [ "$CUR" = "$TARGET" ]; then
            echo "Already up-to-date, skip version bump"
            exit 0
          fi

          HASH=$(wget -qO- https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc \
                 | grep "linux-6.12.$TARGET.tar.xz" | awk '{print $1}')
          [ ${#HASH} -eq 64 ] || { echo "cannot fetch hash"; exit 1; }

          MAP=$(grep -rln '^LINUX_VERSION-6\.12' include/ target/linux/ 2>/dev/null || true)
          for FILE in $MAP; do
            echo "Patching $FILE"
            sed -i "s%^LINUX_VERSION-6.12 = .*%LINUX_VERSION-6.12 = .$TARGET%" "$FILE"
            sed -i "s%^LINUX_KERNEL_HASH-6\.12\..*%LINUX_KERNEL_HASH-6.12.$TARGET = $HASH%" "$FILE"
          done

      - name: Restore adapted patches
        id: restore_patches
        if: env.KERNEL_TRACK == 'linux-stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "restored=false" >> "$GITHUB_OUTPUT"
          [ -f /workdir/target_version.txt ] || { echo "no target_version"; exit 0; }
          TARGET=$(cat /workdir/target_version.txt)
          VERSION_DIR="6.12.$TARGET"
          cd /workdir

          set +e
          git clone --branch "$PATCH_BRANCH" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            patches-repo > /tmp/clone_patches.log 2>&1
          CLONE_RC=$?
          set -e

          if [ "$CLONE_RC" -ne 0 ]; then
            echo "patch branch not found, will create on publish"
            rm -rf patches-repo && mkdir -p patches-repo && cd patches-repo
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git checkout -q -b "$PATCH_BRANCH"
            exit 0
          fi

          if [ -f "/workdir/patches-repo/$VERSION_DIR/READY" ]; then
            echo "restore patches for $VERSION_DIR"
            cd /workdir/openwrt
            for DIR in backport-6.12 pending-6.12 hack-6.12; do
              SRC="/workdir/patches-repo/$VERSION_DIR/generic-$DIR"
              DST="target/linux/generic/$DIR"
              if [ -d "$SRC" ]; then
                rm -rf "$DST"; mkdir -p "$DST"; cp -r "$SRC"/. "$DST"/
                echo "restored $DIR: $(ls $DST | wc -l) files"
              fi
            done
            SRC="/workdir/patches-repo/$VERSION_DIR/rockchip-patches-6.12"
            DST="target/linux/rockchip/patches-6.12"
            if [ -d "$SRC" ]; then
              rm -rf "$DST"; mkdir -p "$DST"; cp -r "$SRC"/. "$DST"/
              echo "restored rockchip-patches-6.12: $(ls $DST | wc -l) files"
            fi
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "no adapted patches for $VERSION_DIR, will adapt"
          fi

      - name: Prepare feeds
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre
          ./scripts/feeds update -a 2>&1 | tail -30

      - name: Apply customizations
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} post
          ./scripts/feeds install -a 2>&1 | tail -40

      - name: Configure build
        run: |
          cd /workdir/openwrt
          cp $GITHUB_WORKSPACE/${{ env.CONFIG_FILE }} .config
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} config
          make defconfig

          for pkg in iptables-zz-legacy ip6tables-zz-legacy iptables-legacy; do
            sed -i "s/^CONFIG_PACKAGE_${pkg}=[ym]/# CONFIG_PACKAGE_${pkg} is not set/" .config
            grep -q "^# CONFIG_PACKAGE_${pkg} is not set" .config || \
              echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done
          make defconfig

      # =====================================================================
      # 通用补丁适配：4 阶段
      #   Phase 1: 反向扫描（干净内核上做，找冗余补丁）
      #   Phase 2: 删除冗余补丁
      #   Phase 3: make target/linux/prepare（让 OpenWrt 自己验证）
      #   Phase 4: 失败时输出结构化诊断
      #
      # 不假设：内核版本 / 平台 / 补丁前缀 / 目录结构 / 补丁数量
      # 只做两件事：删冗余 / 报冲突
      # =====================================================================
      - name: Adapt kernel patches via OpenWrt
        id: adapt_patches
        if: |
          env.KERNEL_TRACK == 'linux-stable'
          && steps.restore_patches.outputs.restored != 'true'
        run: |
          set -e
          cd /workdir/openwrt
          TARGET=$(cat /workdir/target_version.txt)
          echo "=== adapt patches for linux-6.12.$TARGET ==="

          # ---------- Phase 0: 确保 kernel tarball ----------
          TAR="dl/linux-6.12.$TARGET.tar.xz"
          if [ ! -s "$TAR" ]; then
            echo "downloading kernel tarball"
            wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.$TARGET.tar.xz" -O "$TAR"
          fi
          [ -s "$TAR" ] || { echo "::error::cannot obtain kernel tarball"; exit 1; }

          # ---------- Phase 1: 反向扫描（干净内核） ----------
          echo ""
          echo ">>> Phase 1: reverse-scan all patches for redundancy"

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          xzcat "$TAR" | tar -C "$TMP_DIR" -xf -
          KSCAN="$TMP_DIR/linux-6.12.$TARGET"
          [ -d "$KSCAN" ] || { echo "::error::unexpected tarball layout"; ls "$TMP_DIR"; exit 1; }

          : > /tmp/redundant.txt
          SCAN=0
          cd "$KSCAN"
          for PD in /workdir/openwrt/target/linux/generic/backport-6.12 \
                    /workdir/openwrt/target/linux/generic/pending-6.12 \
                    /workdir/openwrt/target/linux/generic/hack-6.12 \
                    /workdir/openwrt/target/linux/rockchip/patches-6.12; do
            [ -d "$PD" ] || continue
            for P in "$PD"/*.patch; do
              [ -f "$P" ] || continue
              SCAN=$((SCAN + 1))
              if patch -p1 --dry-run -R --fuzz=3 -i "$P" > /dev/null 2>&1; then
                echo "  [REDUNDANT] $P"
                echo "$P" >> /tmp/redundant.txt
              fi
            done
          done
          cd /workdir/openwrt

          R_COUNT=$(wc -l < /tmp/redundant.txt | tr -d ' ')
          echo "scanned=$SCAN redundant=$R_COUNT"

          # ---------- Phase 2: 删除冗余补丁 ----------
          if [ "$R_COUNT" -gt 0 ]; then
            echo ""
            echo ">>> Phase 2: removing redundant patches"
            mkdir -p /workdir/disabled-patches
            while read -r P; do
              [ -z "$P" ] && continue
              [ -f "$P" ] || continue
              DEST="/workdir/disabled-patches/$(echo "$P" | sed 's|/workdir/openwrt/||; s|/|_|g')"
              mv "$P" "$DEST"
              echo "  removed: $P"
            done < /tmp/redundant.txt
          fi

          # ---------- Phase 3: 让 OpenWrt 自己验证 ----------
          echo ""
          echo ">>> Phase 3: make target/linux/prepare"
          rm -rf build_dir/toolchain-*/linux-* build_dir/target-*/linux-* 2>/dev/null || true
          rm -f staging_dir/target-*/.prepared 2>/dev/null || true

          set +e
          make target/linux/prepare V=s > /tmp/prepare.log 2>&1
          RC=$?
          set -e

          if [ $RC -eq 0 ]; then
            echo "========== prepare OK =========="
            if [ "$R_COUNT" -gt 0 ]; then
              echo "adapted=true" >> "$GITHUB_OUTPUT"
            else
              echo "adapted=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # ---------- Phase 4: 失败诊断 ----------
          echo "========== prepare failed (rc=$RC) =========="
          echo ""

          # 4.1 失败上下文
          echo "=== last failure context (from prepare log) ==="
          grep -B 8 -A 25 -iE 'Patch failed|No file to patch|can.t find file|does not apply|Error [0-9]' \
            /tmp/prepare.log | tail -120 || true

          # 4.2 解析失败补丁名
          echo ""
          echo "=== failing patches (parsed from log) ==="
          FP1=$(grep -oE 'Please fix [^ !]+\.patch' /tmp/prepare.log | awk '{print $3}' | sort -u || true)
          FP2=$(grep -oE 'Patch [^ ]+\.patch does not apply' /tmp/prepare.log | awk '{print $2}' | sort -u || true)
          FAILED_PATCHES=$(printf '%s\n%s\n' "$FP1" "$FP2" | grep -v '^$' | sort -u || true)
          if [ -n "$FAILED_PATCHES" ]; then
            echo "$FAILED_PATCHES" | sed 's/^/  /'
          else
            echo "  (could not parse, see context above)"
          fi

          # 4.3 .rej 内容
          echo ""
          echo "=== .rej files ==="
          REJ_LIST=$(find build_dir -name '*.rej' 2>/dev/null | head -30 || true)
          if [ -n "$REJ_LIST" ]; then
            echo "$REJ_LIST" | while read -r f; do
              echo "--- $f ---"
              head -80 "$f" 2>/dev/null || true
              echo ""
            done
          else
            echo "  (no .rej found — likely 'file not found' or 'patch already applied')"
          fi

          # 4.4 缺失文件诊断
          KERNEL_DIR=$(ls -d build_dir/target-*/linux-*/linux-*/ 2>/dev/null | head -1 || true)
          if [ -n "$KERNEL_DIR" ] && [ -n "$FAILED_PATCHES" ]; then
            echo ""
            echo "=== missing-file diagnosis ==="
            echo "kernel dir: $KERNEL_DIR"
            echo "$FAILED_PATCHES" | while read -r P; do
              [ -f "$P" ] || continue
              echo "patch: $P"
              grep -E '^\+\+\+ b/' "$P" 2>/dev/null | sed 's|^+++ b/||' | sort -u | while read -r TF; do
                [ -z "$TF" ] && continue
                if [ -e "$KERNEL_DIR$TF" ]; then
                  echo "    [ok]      $TF"
                else
                  echo "    [MISSING] $TF"
                  base=$(basename "$TF")
                  alt=$(find "$KERNEL_DIR" -name "$base" 2>/dev/null | head -3 || true)
                  if [ -n "$alt" ]; then
                    echo "      possible alternatives:"
                    echo "$alt" | sed 's|^|        |'
                  fi
                fi
              done
            done
          fi

          echo ""
          echo "::error::patches need manual fix"
          echo "::notice::Automatic resolution summary:"
          echo "::notice::  - redundant patches auto-removed this run: $R_COUNT"
          echo "::notice::  - remaining failure: real conflict (needs human)"
          echo "::notice::Fix steps:"
          echo "::notice::  1. git clone -b $PATCH_BRANCH <repo> patches-repo"
          echo "::notice::  2. mkdir -p patches-repo/6.12.$TARGET/generic-backport-6.12"
          echo "::notice::  3. Fix the failing patches (paths listed above)"
          echo "::notice::  4. touch patches-repo/6.12.$TARGET/READY"
          echo "::notice::  5. git add . && git commit && git push"
          echo "::notice::  6. Re-run this workflow"
          exit 1

      - name: Publish adapted patches
        if: |
          env.KERNEL_TRACK == 'linux-stable'
          && steps.restore_patches.outputs.restored != 'true'
          && steps.adapt_patches.outputs.adapted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET=$(cat /workdir/target_version.txt)
          VERSION_DIR="6.12.$TARGET"
          cd /workdir/patches-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          set +e
          git fetch origin "$PATCH_BRANCH" > /dev/null 2>&1
          FETCH_RC=$?
          set -e
          if [ "$FETCH_RC" -eq 0 ]; then
            git checkout "$PATCH_BRANCH" 2>/dev/null || git checkout -b "$PATCH_BRANCH" "origin/$PATCH_BRANCH"
            git reset --hard "origin/$PATCH_BRANCH" || true
          else
            git checkout "$PATCH_BRANCH" 2>/dev/null || git checkout -b "$PATCH_BRANCH"
          fi

          mkdir -p "$VERSION_DIR"
          for DIR in backport-6.12 pending-6.12 hack-6.12; do
            SRC="/workdir/openwrt/target/linux/generic/$DIR"
            DST="$VERSION_DIR/generic-$DIR"
            if [ -d "$SRC" ]; then
              rm -rf "$DST"; mkdir -p "$DST"
              find "$SRC" -maxdepth 1 -name '*.patch' -exec cp {} "$DST"/ \;
            fi
          done
          SRC="/workdir/openwrt/target/linux/rockchip/patches-6.12"
          DST="$VERSION_DIR/rockchip-patches-6.12"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"; mkdir -p "$DST"
            find "$SRC" -maxdepth 1 -name '*.patch' -exec cp {} "$DST"/ \;
          fi
          echo "adapted at $(date -u +%Y-%m-%dT%H:%M:%SZ) (auto-removed $R_COUNT redundant)" > "$VERSION_DIR/READY"

          git add "$VERSION_DIR"
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -q -m "patches: adapt for 6.12.$TARGET (auto: redundant removed)"
          for attempt in 1 2 3; do
            echo "push attempt $attempt"
            git push origin "HEAD:$PATCH_BRANCH" && { echo "pushed"; exit 0; }
            sleep 3
          done
          echo "::warning::push failed after 3 attempts"; exit 0

      - name: Prune old patch versions
        if: |
          always()
          && env.KERNEL_TRACK == 'linux-stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.PATCH_KEEP_VERSIONS }}
        run: |
          set -e

          KEEP="${PATCH_KEEP_VERSIONS:-2}"
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]] || [ "$KEEP" -lt 1 ]; then
            KEEP=2
          fi

          cd /workdir
          if [ ! -d patches-repo/.git ]; then
            git clone --branch "$PATCH_BRANCH" --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              patches-repo-prune > /tmp/clone_prune.log 2>&1 || {
                echo "patch branch not found, nothing to prune"
                exit 0
              }
            cd patches-repo-prune
          else
            cd patches-repo
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          set +e
          git fetch origin "$PATCH_BRANCH" > /dev/null 2>&1
          FETCH_RC=$?
          set -e
          if [ "$FETCH_RC" -eq 0 ]; then
            git checkout "$PATCH_BRANCH" 2>/dev/null || git checkout -b "$PATCH_BRANCH" "origin/$PATCH_BRANCH"
            git reset --hard "origin/$PATCH_BRANCH" >/dev/null 2>&1 || true
          else
            git checkout "$PATCH_BRANCH" 2>/dev/null || git checkout -b "$PATCH_BRANCH"
          fi

          echo "=== prune patch version dirs (keep latest $KEEP) ==="

          ALL=$(ls -d 6.12.* 2>/dev/null | sed 's:/$::' \
                | grep -E '^6\.12\.[0-9]+$' \
                | sort -V || true)
          COUNT=$(printf '%s\n' "$ALL" | grep -c . || echo 0)
          echo "existing version dirs: $COUNT, keep: $KEEP"

          if [ "$COUNT" -le "$KEEP" ]; then
            echo "nothing to prune"
            exit 0
          fi

          TO_DELETE=$(printf '%s\n' "$ALL" | head -n -"$KEEP")
          echo "will delete:"
          printf '%s\n' "$TO_DELETE" | sed 's/^/  - /'

          while IFS= read -r v; do
            [ -z "$v" ] && continue
            git rm -r --ignore-unmatch "$v" >/dev/null 2>&1 || echo "  (rm failed: $v)"
          done <<< "$TO_DELETE"

          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi

          git commit -q -m "patches: prune old versions (keep $KEEP)"
          for attempt in 1 2 3; do
            echo "push attempt $attempt"
            if git push origin "HEAD:$PATCH_BRANCH"; then
              echo "pruned and pushed"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::prune push failed after 3 attempts"
          exit 0

      - name: Alias cache tag by track
        run: |
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${REPO_LOWER}/r5s-base-cache"
          TEMP="${BASE}:openwrt-25.12"

          docker rmi "$TEMP" 2>/dev/null || true

          if [ "${KERNEL_TRACK}" = "linux-stable" ]; then
            if [ -f /workdir/target_version.txt ]; then
              KV=$(cat /workdir/target_version.txt)
              if docker pull "${BASE}:openwrt-25.12-linux-stable-6.12.${KV}" 2>/dev/null; then
                docker tag "${BASE}:openwrt-25.12-linux-stable-6.12.${KV}" "$TEMP"
                docker push "$TEMP" >/dev/null 2>&1 || true
                echo "alias from openwrt-25.12-linux-stable-6.12.${KV}"
              else
                echo "no cache for 6.12.${KV}, full rebuild"
              fi
            fi
          else
            if docker pull "${BASE}:openwrt-25.12-openwrt" 2>/dev/null; then
              docker tag "${BASE}:openwrt-25.12-openwrt" "$TEMP"
              docker push "$TEMP" >/dev/null 2>&1 || true
              echo "alias from openwrt-25.12-openwrt"
            else
              echo "no openwrt cache"
            fi
          fi

          docker rmi "$TEMP" 2>/dev/null || true

      - name: Restore cache
        run: |
          cd /workdir
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_restore

      - name: Compile base
        id: compile_base
        run: |
          cd /workdir/openwrt
          touch /workdir/base_compilation_marker

          MAX_ATTEMPTS=2
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "=========== compile-base attempt $ATTEMPT/$MAX_ATTEMPTS ==========="

            FAILED=0
            for STAGE in tools/download tools/compile toolchain/download toolchain/compile; do
              echo "===== $STAGE ====="
              set +e
              make $STAGE -j$(nproc) > /tmp/stage.log 2>&1
              RC=$?
              set -e
              if [ "$RC" -ne 0 ]; then
                echo "===== $STAGE failed (rc=$RC), retry V=s ====="
                make $STAGE -j1 V=s > /tmp/stage_verbose.log 2>&1 || true
                echo ""
                echo "===== error context ====="
                grep -n -B 20 -A 60 -iE 'error|fail' /tmp/stage_verbose.log | tail -300
                echo ""
                echo "===== last 200 lines ====="
                tail -200 /tmp/stage_verbose.log
                FAILED=1
                break
              fi
            done

            if [ $FAILED -eq 0 ]; then
              echo "===== compile-base OK on attempt $ATTEMPT ====="
              exit 0
            fi

            if grep -qE 'Patch failed|No file to patch|can.t find file' /tmp/stage_verbose.log; then
              echo ">>> patch issue detected in compile-base, cannot auto-recover"
              exit 1
            fi

            echo ">>> cannot auto-recover, aborting"
            exit 1
          done

          echo ">>> reached max attempts ($MAX_ATTEMPTS)"
          exit 1

      - name: Checkpoint base cache
        if: steps.compile_base.outcome == 'success'
        run: |
          cd /workdir/openwrt

          IGNORE_PATTERN="staging_dir/host/stamp/\.tools_compile_|staging_dir/target-[^/]+/stamp/\.target_prereq$"

          CHANGED=$(find build_dir staging_dir -type f -newer /workdir/base_compilation_marker -path "*/stamp/*" 2>/dev/null | \
                    grep -E -v "$IGNORE_PATTERN" | wc -l)

          if [ "$CHANGED" -eq 0 ]; then
            echo "base cache up-to-date"
            exit 0
          fi

          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} cache_save

      - name: Publish cache tag by track
        if: steps.compile_base.outcome == 'success'
        run: |
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${REPO_LOWER}/r5s-base-cache"
          TEMP="${BASE}:openwrt-25.12"

          docker rmi "$TEMP" 2>/dev/null || true

          if ! docker pull "$TEMP" 2>/dev/null; then
            echo "no image pushed by cache_save, skip"
            exit 0
          fi

          if [ "${KERNEL_TRACK}" = "linux-stable" ]; then
            if [ -f /workdir/target_version.txt ]; then
              KV=$(cat /workdir/target_version.txt)
              docker tag "$TEMP" "${BASE}:openwrt-25.12-linux-stable-6.12.${KV}"
              docker push "${BASE}:openwrt-25.12-linux-stable-6.12.${KV}" >/dev/null 2>&1 || true
              echo "pushed: openwrt-25.12-linux-stable-6.12.${KV}"
              docker rmi "${BASE}:openwrt-25.12-linux-stable-6.12.${KV}" 2>/dev/null || true
            fi
          else
            docker tag "$TEMP" "${BASE}:openwrt-25.12-openwrt"
            docker push "${BASE}:openwrt-25.12-openwrt" >/dev/null 2>&1 || true
            echo "pushed: openwrt-25.12-openwrt"
            docker rmi "${BASE}:openwrt-25.12-openwrt" 2>/dev/null || true
          fi

          docker rmi "$TEMP" 2>/dev/null || true

      - name: Prune old cache versions
        if: steps.compile_base.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.CACHE_KEEP_VERSIONS }}
        run: |
          set -e
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          PKG="r5s-base-cache"

          echo "=== Cache prune for $PKG (keep latest ${KEEP} per prefix) ==="

          OWNER_TYPE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                       "https://api.github.com/users/$OWNER" | jq -r .type 2>/dev/null || echo "User")
          if [ "$OWNER_TYPE" = "Organization" ]; then
            BASE="/orgs/$OWNER/packages/container/$PKG/versions"
          else
            BASE="/users/$OWNER/packages/container/$PKG/versions"
          fi
          echo "owner type: $OWNER_TYPE"

          ALL=$(mktemp)
          PAGE=1
          while :; do
            RESP=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                   "https://api.github.com${BASE}?per_page=100&page=$PAGE")
            COUNT=$(echo "$RESP" | jq 'if type=="array" then length else 0 end')
            [ "$COUNT" = "0" ] && break
            echo "$RESP" | jq -c '.[]' >> "$ALL"
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          TOTAL=$(wc -l < "$ALL" | tr -d ' ')
          echo "total versions: $TOTAL"
          [ "$TOTAL" = "0" ] && { rm -f "$ALL"; exit 0; }

          for PREFIX in "openwrt-25.12-linux-stable-6.12." "openwrt-25.12-6.12."; do
            echo ""
            echo "--- ${PREFIX}* keep latest ${KEEP} ---"

            PLAN=$(jq -r --arg p "$PREFIX" '
              select((.metadata.container.tags // []) | any(startswith($p)))
              | [.id, .created_at] | @tsv
            ' "$ALL" | sort -k2 -r | awk -v keep="$KEEP" 'NR>keep {print $1}')

            if [ -z "$PLAN" ]; then
              echo "  (nothing to prune)"
              continue
            fi

            N=$(echo "$PLAN" | wc -l | tr -d ' ')
            echo "  pruning $N versions..."

            echo "$PLAN" | while read -r VID; do
              [ -z "$VID" ] && continue
              if curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com${BASE}/$VID" >/dev/null 2>&1; then
                echo "    ✓ deleted $VID"
              else
                echo "    ✗ failed  $VID"
              fi
            done
          done

          rm -f "$ALL"
          echo ""
          echo "=== prune done ==="

      - name: Prepare kernel and clean
        run: |
          cd /workdir/openwrt
          bash $GITHUB_WORKSPACE/${{ env.DIY_SH }} pre_build
          rm -rf bin/targets/rockchip/armv8

      - name: Compile firmware
        run: |
          cd /workdir/openwrt

          set +e
          make download -j8 > /tmp/download.log 2>&1 || true
          make -j$(nproc) V=s > /tmp/build.log 2>&1
          BUILD_RESULT=$?
          set -e

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "Build failed (exit: $BUILD_RESULT)"
            if [ "$BUILD_RESULT" -gt 128 ]; then
              SIG=$((BUILD_RESULT - 128))
              [ "$SIG" = "9" ] && echo "SIGKILL (likely OOM)"
              free -h
              sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill" | tail -20 || true
            fi

            FIRST_ERR=$(grep -n -m 1 -E "^make(\[[0-9]+\])?: \*\*\* .* Error [0-9]" /tmp/build.log | cut -d: -f1)
            if [ -n "$FIRST_ERR" ]; then
              START=$((FIRST_ERR > 150 ? FIRST_ERR - 150 : 1))
              END=$((FIRST_ERR + 30))
              sed -n "${START},${END}p" /tmp/build.log
            else
              tail -300 /tmp/build.log
            fi
            exit 1
          fi

      - name: Verify and collect artifacts
        if: success()
        run: |
          cd /workdir/openwrt
          OUT="bin/targets/rockchip/armv8"

          echo "===== kernel version ====="
          grep -rn '^LINUX_VERSION-6\.12' include/ target/linux/generic/kernel-6.12 2>/dev/null || true

          IMG_EXT4_GZ=$(find "$OUT" -maxdepth 1 -type f -name "*nanopi-r5s-ext4-sysupgrade.img.gz" | head -1)
          [ -n "$IMG_EXT4_GZ" ] || { echo "ext4 img missing"; exit 1; }
          file "$IMG_EXT4_GZ" | grep -q "gzip compressed data" || exit 1
          python3 -c "import zlib;d=zlib.decompressobj(wbits=31);d.decompress(open('$IMG_EXT4_GZ','rb').read());exit(0 if d.eof else 1)" || exit 1

          IMG_SQ_GZ=$(find "$OUT" -maxdepth 1 -type f -name "*nanopi-r5s-squashfs-sysupgrade.img.gz" | head -1)
          [ -n "$IMG_SQ_GZ" ] || { echo "squashfs img missing"; exit 1; }
          file "$IMG_SQ_GZ" | grep -q "gzip compressed data" || exit 1
          python3 -c "import zlib;d=zlib.decompressobj(wbits=31);d.decompress(open('$IMG_SQ_GZ','rb').read());exit(0 if d.eof else 1)" || exit 1

          python3 -c "import gzip,sys;f=gzip.open(sys.argv[1],'rb');f.seek(446);e=f.read(64);t=e[32+4];assert t!=0,'p3 missing';print(f'p3 present MBR type=0x{t:02x}')" "$IMG_EXT4_GZ"

          MANIFEST=$(find "$OUT" -maxdepth 1 -name "*nanopi-r5s.manifest" -type f | head -1)
          [ -n "$MANIFEST" ] || { echo "manifest missing"; exit 1; }
          grep -E "^(kmod-r8125|kmod-r8169|clashoo|luci-app-clashoo|luci-app-amlogic|docker|dockerd|containerd|runc|luci-app-dockerman|ttyd|openssh-sftp-server|parted) " "$MANIFEST" || true

          mkdir -p $GITHUB_WORKSPACE/artifact
          DATE=$(date +%Y-%m-%d)
          PREFIX="${MODEL_NAME}-OpenWrt-${OPENWRT_VER}-${DATE}"

          cp "$IMG_EXT4_GZ" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sdcard.img.gz"
          cp "$IMG_SQ_GZ" "$GITHUB_WORKSPACE/artifact/${PREFIX}-squashfs-sysupgrade.img.gz"
          cp "$MANIFEST" "$GITHUB_WORKSPACE/artifact/${PREFIX}-manifest.txt"

          SUMFILE=$(find "$OUT" -maxdepth 1 -name "sha256sums" -type f | head -1)
          [ -n "$SUMFILE" ] && cp "$SUMFILE" "$GITHUB_WORKSPACE/artifact/${PREFIX}-sha256sums.txt"
          [ -f /workdir/patch_report.txt ] && cp /workdir/patch_report.txt "$GITHUB_WORKSPACE/artifact/${PREFIX}-patch-report.txt"

          cd $GITHUB_WORKSPACE/artifact
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] && [ "$f" != "SHA256SUMS" ] && sha256sum "$f" >> SHA256SUMS
          done
          ls -lh

      - name: Upload to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/artifact
          shopt -s nullglob
          FILES=(*.gz *-manifest.txt *-sha256sums.txt *-patch-report.txt SHA256SUMS)
          shopt -u nullglob
          [ ${#FILES[@]} -eq 0 ] && { echo "no files"; exit 0; }
          echo "upload ${#FILES[@]} files"
          printf '  %s\n' "${FILES[@]}"
          gh release upload "${{ needs.prepare_release.outputs.release_tag }}" "${FILES[@]}" --clobber

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r5s-firmware-${{ env.KERNEL_TRACK }}
          path: artifact/
          retention-days: 3

  cleanup_self:
    name: Cleanup runs and artifacts
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs and orphan artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEP=1
          CURRENT_RUN="${{ github.run_id }}"

          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
                 --jq '.workflow_runs[] | select(.name == "Build OpenWrt for NanoPi R5S") | .id' || echo "")

          IDX=0
          for RID in $RUNS; do
            IDX=$((IDX + 1))
            if [ "$RID" = "$CURRENT_RUN" ]; then
              echo "keep current: $RID"
              continue
            fi
            if [ "$IDX" -le "$KEEP" ]; then
              echo "keep recent: $RID"
              continue
            fi
            echo "delete run: $RID"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$RID" 2>/dev/null || true
          done

          echo ""
          echo "===== remaining artifacts ====="
          LIVE_RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
                      --jq '.workflow_runs[].id' 2>/dev/null || echo "")

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id)\t\(.workflow_run.id)\t\(.name)\t\(.size_in_bytes)"' 2>/dev/null | \
          while IFS=$'\t' read -r AID RUNID NAME SIZE; do
            [ -z "$AID" ] && continue
            if echo "$LIVE_RUNS" | grep -q "^${RUNID}$"; then
              echo "  keep   $NAME  ${SIZE}B"
              continue
            fi
            echo "  delete $NAME  ${SIZE}B"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}" 2>/dev/null || true
          done