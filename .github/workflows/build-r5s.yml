name: Build OpenWrt for NanoPi R5S

on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  OPENWRT_REPO: 'https://github.com/openwrt/openwrt.git'
  OPENWRT_BRANCH: 'openwrt-25.12'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag with auto-increment or overwrite
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="OpenWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          fi
          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python3 python3-distutils file time ccache \
            python3-pyelftools python3-setuptools swig
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Clone OpenWrt official source into project/friendlywrt
      run: |
        mkdir -p project
        cd project
        git clone --depth=1 -b ${OPENWRT_BRANCH} ${OPENWRT_REPO} friendlywrt
        cd friendlywrt
        git log -1 --oneline

        echo "--- 原始 Makefile 内核配置 ---"
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || true

        sed -i 's/^KERNEL_PATCHVER:=/KERNEL_PATCHVER := /' target/linux/rockchip/Makefile
        echo "--- 临时调整后 ---"
        grep -E '^KERNEL_PATCHVER' target/linux/rockchip/Makefile

        cat > .config <<'EOF'
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y
        EOF

        cd ..
        mkdir -p configs/rockchip
        ln -sf "$(pwd)/friendlywrt/.config" configs/rockchip/01-nanopi
        echo "--- 符号链接确认 ---"
        ls -la configs/rockchip/
        readlink -f configs/rockchip/01-nanopi

    - name: Update all standard feeds
      run: |
        cd project/friendlywrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "--- 确认关键依赖存在 ---"
        ls feeds/packages/lang/golang 2>/dev/null && echo "[OK] golang feed present" || echo "[WARN] golang missing"
        ls feeds/packages/utils/yq 2>/dev/null && echo "[OK] yq present" || echo "[WARN] yq missing"

    - name: Apply customizations (scripts/custome_config.sh)
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Add customize packages (scripts/add_packages.sh)
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Fix packages and restore Makefile format
      run: |
        cd project/friendlywrt

        echo "===== 1. 恢复 KERNEL_PATCHVER 官方格式 ====="
        sed -i 's/^KERNEL_PATCHVER := /KERNEL_PATCHVER:=/' target/linux/rockchip/Makefile
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || true

        echo "===== 2. 禁用会编译失败的非核心包 ====="
        for pkg in file libmagic logrotate vsftpd; do
          sed -i "/^CONFIG_PACKAGE_${pkg}=/d" .config
          sed -i "/^# CONFIG_PACKAGE_${pkg} is not set/d" .config
          echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
        done

        echo "===== 3. 确保 TESTING_KERNEL 未启用 ====="
        sed -i '/^CONFIG_TESTING_KERNEL=/d' .config
        sed -i '/^# CONFIG_TESTING_KERNEL is not set/d' .config
        echo "# CONFIG_TESTING_KERNEL is not set" >> .config

        echo "===== 4. make defconfig ====="
        make defconfig

        echo "===== 5. defconfig 后二次强制 ====="
        for pkg in file libmagic logrotate vsftpd; do
          sed -i "/^CONFIG_PACKAGE_${pkg}=/d" .config
          sed -i "/^# CONFIG_PACKAGE_${pkg} is not set/d" .config
          echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
        done
        sed -i '/^CONFIG_TESTING_KERNEL=/d' .config
        sed -i '/^# CONFIG_TESTING_KERNEL is not set/d' .config
        echo "# CONFIG_TESTING_KERNEL is not set" >> .config

        echo "===== 6. 从源码树移除问题包 ====="
        rm -rf feeds/packages/libs/file       2>/dev/null || true
        rm -rf feeds/packages/utils/logrotate 2>/dev/null || true
        rm -rf feeds/packages/net/vsftpd      2>/dev/null || true

        echo "===== 7. 最终状态 ====="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || true
        grep -E "CONFIG_TESTING_KERNEL" .config || echo "(TESTING_KERNEL none)"
        grep -E "CONFIG_PACKAGE_(file|libmagic|logrotate|vsftpd) " .config || echo "(no problem pkgs config)"

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== 内核版本 ==="
        grep -E '^KERNEL_(PATCHVER|TESTING_PATCHVER)' target/linux/rockchip/Makefile || true
        echo "=== TESTING_KERNEL 状态 ==="
        grep -E "CONFIG_TESTING_KERNEL" .config || echo "(none)"
        echo "=== Clashoo 相关 ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-i18n-clashoo-zh-cn|kmod-inet-diag)=y" .config || echo "WARNING"
        echo "=== 屏蔽包 ==="
        for pkg in luci-app-cpufreq luci-app-hd-idle luci-app-nlbwmon luci-app-smartdns; do
          grep -q "^# CONFIG_PACKAGE_${pkg} is not set" .config && echo "[OK] $pkg disabled" || echo "[WARN] $pkg"
        done
        echo "=== 问题包状态 ==="
        for pkg in file libmagic logrotate vsftpd; do
          grep -q "^# CONFIG_PACKAGE_${pkg} is not set" .config && echo "[OK] $pkg disabled" || echo "[WARN] $pkg"
        done
        echo "=== config-6.12 文件 ==="
        ls -la target/linux/rockchip/config-6.12* 2>/dev/null || echo "(no config-6.12 file)"
        echo "=== config-6.12 内容 ==="
        cat target/linux/rockchip/config-6.12 2>/dev/null || true
        echo "=== UCI defaults ==="
        ls -la files/etc/uci-defaults/ || true

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8 || true
        find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
        find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

    - name: Compile firmware
      id: compile
      run: |
        cd project/friendlywrt

        # 第一次：正常并行编译
        set +e
        make -j$(nproc) > /tmp/build.log 2>&1
        BUILD_EXIT=$?
        set -e

        echo "===== 首次编译退出码: $BUILD_EXIT ====="
        tail -50 /tmp/build.log

        if [ $BUILD_EXIT -ne 0 ]; then
          echo ""
          echo "===== 编译失败，用 V=s -j1 重跑 target/linux/install 抓详细错误 ====="
          set +e
          make target/linux/install V=s -j1 > /tmp/install.log 2>&1
          INSTALL_EXIT=$?
          set -e
          echo "install 退出码: $INSTALL_EXIT"
          echo "===== install.log 最后 300 行 ====="
          tail -300 /tmp/install.log
        fi

        exit $BUILD_EXIT

    - name: Collect artifacts
      id: collect
      if: success()
      run: |
        cd project/friendlywrt
        BIN_DIR="bin/targets/rockchip/armv8"
        echo "=== 编译产物 ==="
        ls -la ${BIN_DIR}/ || { echo "产物目录不存在，编译失败"; exit 1; }

        mkdir -p ../../artifact
        cp ${BIN_DIR}/*sysupgrade*.img.gz ../../artifact/ 2>/dev/null || true
        cp ${BIN_DIR}/*ext4*.img.gz        ../../artifact/ 2>/dev/null || true
        cp ${BIN_DIR}/kernel                ../../artifact/ 2>/dev/null || true
        cp ${BIN_DIR}/sha256sums           ../../artifact/ 2>/dev/null || true

        tar czf ../../artifact/openwrt-rockchip-armv8-k6.12-${{ github.run_number }}.tar.gz -C bin/targets/rockchip armv8/

        echo "=== artifact ==="
        ls -la ../../artifact/

    - name: Upload to release
      if: success()
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/*
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}