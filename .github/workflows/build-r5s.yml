name: Build OpenWrt for NanoPi R5S

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'
  OPENWRT_BRANCH: 'openwrt-25.12'
  FLAVOR: 'r5s'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="OpenWrt-R5S-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              TAG="${BASE_TAG}-$((MAX_NUM + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  build:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-dev python3-distutils python3-setuptools \
          python3-pip python3-venv rsync subversion swig time xsltproc zlib1g-dev \
          bison flex libtool libtool-bin pkg-config \
          libgmp-dev libmpc-dev libmpfr-dev \
          gperf patch quilt cpio \
          liblzma-dev libbz2-dev \
          device-tree-compiler u-boot-tools \
          bzip2 xz-utils zip unzip wget curl \
          autoconf automake autopoint texinfo help2man
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
        mkdir -p ./artifact
        echo "CPU cores: $(nproc)"

    - name: Prepare FriendlyWrt-style workspace using OpenWrt official source
      run: |
        mkdir -p project
        cd project
        git clone --depth 1 -b ${{ env.OPENWRT_BRANCH }} \
          https://github.com/openwrt/openwrt.git friendlywrt > /dev/null 2>&1
        cd friendlywrt
        ./scripts/feeds update -a > /dev/null 2>&1
        ./scripts/feeds install -a > /dev/null 2>&1
        rm -f feeds.conf
        cd ..
        mkdir -p configs/rockchip
        touch configs/rockchip/01-nanopi
        echo "Workspace prepared with OpenWrt ${{ env.OPENWRT_BRANCH }}"

    - name: Initialize .config with R5S target
      run: |
        cd project/friendlywrt
        cat > .config <<'EOF'
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y
        CONFIG_LUCI_LANG_zh_Hans=y
        EOF
        make defconfig > /dev/null 2>&1
        echo "Initial .config created"

    - name: Verify upstream kernel version (must be 6.12)
      run: |
        cd project/friendlywrt
        if [ -d target/linux/rockchip/patches-6.12 ] && [ -f target/linux/rockchip/armv8/config-6.12 ]; then
          echo "[OK] OpenWrt Rockchip target uses kernel 6.12"
        else
          echo "ERROR: 6.12 kernel artifacts not found"
          find target/linux/rockchip/ -maxdepth 2 -name "*6.12*"
          exit 1
        fi

    - name: Bridge add_packages.sh kernel config path
      run: |
        cd project/friendlywrt/target/linux/rockchip
        if [ ! -e config-6.1 ]; then
          ln -s armv8/config-6.12 config-6.1
        fi
        ls -la config-6.1

    - name: Apply customizations (original script, unmodified)
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Final config check
      run: |
        cd project/friendlywrt
        echo "--- Clashoo packages ---"
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-i18n-clashoo-zh-cn|kmod-inet-diag)=y" .config || true
        echo "--- Kernel INET_DIAG (from armv8/config-6.12) ---"
        grep -E "CONFIG_INET_DIAG|CONFIG_INET_TCP_DIAG|CONFIG_INET_UDP_DIAG|CONFIG_INET_RAW_DIAG" target/linux/rockchip/armv8/config-6.12 || true

    - name: Download packages
      run: |
        cd project/friendlywrt
        if make download -j$(nproc) > /tmp/dl.log 2>&1; then
          echo "Package download completed"
        else
          echo "::warning::make download reported errors, showing context:"
          grep -iE "error|fail|404|not found|unable|invalid|denied|timeout|refused|missing" /tmp/dl.log | head -30 || true
          echo "Continuing; make will retry missing sources during compile."
        fi

    - name: Compile OpenWrt
      run: |
        cd project/friendlywrt
        if ! make -j$(nproc) > /tmp/build.log 2>&1; then
          echo "Build failed. Last 100 lines:"
          tail -100 /tmp/build.log
          echo "--- Errors summary ---"
          grep -iE "error:|ERROR|failed" /tmp/build.log | tail -30 || true
          exit 1
        fi
        echo "Compile finished"

    - name: Collect artifacts
      run: |
        cd project/friendlywrt
        find bin/targets/rockchip/armv8/ -maxdepth 1 -type f \
          \( -name "*nanopi-r5s*.img.gz" -o -name "*nanopi-r5s*.manifest" \
             -o -name "*nanopi-r5s*.tar.gz" \) \
          -exec cp {} ../../artifact/ \;
        echo "--- Collected artifacts ---"
        ls -lh ../../artifact/

    - name: Upload artifacts to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/*
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
        file_glob: true

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build OpenWrt for NanoPi R5S"
          repository: ${{ github.repository }}