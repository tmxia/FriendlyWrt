name: Build FriendlyWrt With Flippy Kernel (Fast)

on:
  watch:
    types: started
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version'
        required: true
        default: '25.12'
        type: choice
        options:
          - '24.10'
          - '25.12'
          - 'both'
      set:
        description: 'Build type'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - non-docker
          - both
      replace_existing:
        description: 'Replace existing release tag (overwrite)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AUTO_REPLACE_TAG: 'false'

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Generate unique release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="FriendlyWrt-flippy-$(date +%Y-%m-%d)"
          FORCE_BASE=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.replace_existing }}" == "true" ]; then
            FORCE_BASE=true
          elif [ "${{ github.event_name }}" == "watch" ] && [ "${{ env.AUTO_REPLACE_TAG }}" == "true" ]; then
            FORCE_BASE=true
          fi

          if [ "$FORCE_BASE" = "true" ]; then
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            for tag in $EXISTING_TAGS; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || true
              git push origin --delete "refs/tags/$tag" || true
            done
            TAG="$BASE_TAG"
          else
            EXISTING_TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" || true)
            if [ -z "$EXISTING_TAGS" ]; then
              TAG="$BASE_TAG"
            else
              MAX_NUM=0
              for t in $EXISTING_TAGS; do
                if [[ $t =~ ^${BASE_TAG}-([0-9]+)$ ]]; then
                  NUM=${BASH_REMATCH[1]}
                  [ $NUM -gt $MAX_NUM ] && MAX_NUM=$NUM
                fi
              done
              NEXT=$((MAX_NUM + 1))
              TAG="${BASE_TAG}-${NEXT}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          allow_updates: true
          overwrite: true

  # ---------- 手动触发构建 ----------
  build_manual:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        VERSION: ${{ fromJSON(github.event.inputs.version == 'both' && '["24.10","25.12"]' || format('["{0}"]', github.event.inputs.version)) }}
        SET: ${{ fromJSON(github.event.inputs.set == 'both' && '["docker","non-docker"]' || format('["{0}"]', github.event.inputs.set)) }}
    steps:
    - name: Show build configuration
      run: |
        echo "Building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment (lightweight)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          genimage   # 必须安装
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568)
          MODEL=R5S-R5C-Series
          ;;
        *)
          echo "unknow cpu"
          exit 1
          ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Download rootfs package (required)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        DATES=(
          $(date +%Y-%m-%d)
          $(date -d "1 day ago" +%Y-%m-%d)
          $(date -d "2 days ago" +%Y-%m-%d)
        )
        FOUND=false
        for DATE in "${DATES[@]}"; do
          BASE_TAG="FriendlyWrt-flippy-${DATE}"
          if gh release view "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "^${ROOTFS_FILE}$"; then
            echo "Found $ROOTFS_FILE in release $BASE_TAG, downloading..."
            gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ROOTFS_FILE" --dir ../artifact/
            FOUND=true
            break
          fi
          TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" | sort -V -r || true)
          for tag in $TAGS; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q "^${ROOTFS_FILE}$"; then
              echo "Found $ROOTFS_FILE in release $tag, downloading..."
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$ROOTFS_FILE" --dir ../artifact/
              FOUND=true
              break 2
            fi
          done
        done
        if [ "$FOUND" = "false" ]; then
          echo "ERROR: No rootfs package found in any release (checked dates: ${DATES[*]}). Please run a full build first to generate rootfs-friendlywrt-*.tgz."
          exit 1
        fi

    - name: Prepare official rootfs for sd-img
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        mkdir -p friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip
        tar xzf "../artifact/$ROOTFS_FILE" --strip-components=3 -C friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip
        mkdir -p friendlywrt/bin/targets/rockchip/armv8/packages
        if [ ! -f friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip/usr/lib/os-release ]; then
          mkdir -p friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip/usr/lib
          echo "ID=openwrt" > friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip/usr/lib/os-release
        fi
        echo "Official rootfs prepared"

    - name: Compile uboot and disable kernel check
      run: |
        cd project
        ./build.sh uboot
        sed -i '/please build kernel first/d' build.sh
        mkdir -p friendlywrt/kernel
        touch friendlywrt/kernel/.built
        echo "U-boot compiled and kernel check completely disabled."

    - name: Get latest flippy kernel version
      id: flippy_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Fetching latest flippy kernel version from ophub/kernel release kernel_flippy..."
        ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
        VERSIONS=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//')
        if [ -z "$VERSIONS" ]; then
          echo "ERROR: No kernel tarballs found in kernel_flippy release"
          exit 1
        fi
        LATEST=$(echo "$VERSIONS" | sort -V | tail -1)
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest flippy kernel version: $LATEST"

    - name: Download and deploy flippy kernel
      run: |
        cd project
        KERNEL_VER="${{ steps.flippy_version.outputs.version }}"
        echo "Downloading flippy kernel $KERNEL_VER from ophub/kernel (kernel_flippy release)"
        wget -q https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VER}.tar.gz -O /tmp/kernel_all.tar.gz

        mkdir -p /tmp/flippy_extract
        tar xzf /tmp/kernel_all.tar.gz -C /tmp/flippy_extract

        KERNEL_DIR="/tmp/flippy_extract/$KERNEL_VER"
        if [ ! -d "$KERNEL_DIR" ]; then
          KERNEL_DIR=$(find /tmp/flippy_extract -maxdepth 1 -type d -name "*$KERNEL_VER*" | head -1)
        fi
        if [ -z "$KERNEL_DIR" ] || [ ! -d "$KERNEL_DIR" ]; then
          echo "ERROR: Kernel directory not found"
          ls -la /tmp/flippy_extract
          exit 1
        fi
        echo "Kernel directory: $KERNEL_DIR"

        BOOT_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)
        MODULES_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "modules-*.tar.gz" | head -1)

        if [ -z "$BOOT_TAR" ] || [ -z "$DTB_TAR" ] || [ -z "$MODULES_TAR" ]; then
          echo "ERROR: Could not find boot, dtb, or modules archives. Listing contents:"
          ls -laR "$KERNEL_DIR"
          exit 1
        fi

        echo "Found boot: $BOOT_TAR, dtb: $DTB_TAR, modules: $MODULES_TAR"

        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        echo "Deploying flippy kernel to scripts/sd-fuse/${DIST_DIR}"

        mkdir -p scripts/sd-fuse/${DIST_DIR}/boot/
        tar xzf "$BOOT_TAR" -C scripts/sd-fuse/${DIST_DIR}/boot/ --strip-components=1

        mkdir -p scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/
        tar xzf "$DTB_TAR" -C scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ --strip-components=1

        mkdir -p /tmp/flippy_modules
        tar xzf "$MODULES_TAR" -C /tmp/flippy_modules

        echo "Flippy kernel deployed."

    - name: Inject flippy modules into official rootfs
      run: |
        cd project
        ROOTFS_DIR="friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip"
        if [ ! -d "$ROOTFS_DIR" ]; then
          echo "ERROR: Official rootfs directory $ROOTFS_DIR not found"
          exit 1
        fi
        MODULES_DIR_NAME=$(ls /tmp/flippy_modules | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-flippy-[0-9]+\+?$' | head -1)
        if [ -z "$MODULES_DIR_NAME" ]; then
          echo "ERROR: Could not determine modules directory name"
          ls -la /tmp/flippy_modules
          exit 1
        fi
        echo "Modules directory name: $MODULES_DIR_NAME"
        rm -rf "$ROOTFS_DIR/lib/modules" 2>/dev/null || true
        mkdir -p "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME"
        cp -r /tmp/flippy_modules/$MODULES_DIR_NAME/* "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME/"
        find "$ROOTFS_DIR/lib/modules" -type f -exec chmod 644 {} \;
        echo "Modules injected to $ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME"

    # ---------- 准备 sd-img 环境（包含 genimage.cfg 复制） ----------
    - name: Prepare sd-img environment
      run: |
        cd project
        TOPDIR=$(pwd)
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${{ steps.config.outputs.suffix }}.tgz"

        # 复制辅助文件
        find scripts/sd-fuse -type d > /tmp/sd_fuse_dirs.txt
        cp -r device configs .current_config.mk friendlywrt/.config scripts/sd-fuse/
        while read -r dir; do
          if [ "$dir" != "scripts/sd-fuse" ]; then
            cp -r device configs .current_config.mk friendlywrt/.config "$dir/"
          fi
        done < /tmp/sd_fuse_dirs.txt

        mkdir -p friendlywrt/kernel friendlywrt/u-boot friendlywrt/toolchain
        touch friendlywrt/kernel/.built friendlywrt/u-boot/.built friendlywrt/toolchain/.built

        rm -rf scripts/sd-fuse/${DIST_DIR}
        mkdir -p scripts/sd-fuse/${DIST_DIR}

        # 解压 rootfs 到 rootfs 子目录
        echo "Extracting rootfs..."
        mkdir -p /tmp/rootfs_extract
        tar xzf "../artifact/${ROOTFS_FILE}" -C /tmp/rootfs_extract

        # 扁平化处理（如果只有一个子目录）
        EXTRACTED_ITEMS=(/tmp/rootfs_extract/*)
        if [ ${#EXTRACTED_ITEMS[@]} -eq 1 ] && [ -d "${EXTRACTED_ITEMS[0]}" ]; then
          SUBDIR="${EXTRACTED_ITEMS[0]}"
          mv "$SUBDIR"/* /tmp/rootfs_extract/
          rmdir "$SUBDIR"
        fi

        mkdir -p scripts/sd-fuse/${DIST_DIR}/rootfs
        mv /tmp/rootfs_extract/* scripts/sd-fuse/${DIST_DIR}/rootfs/
        mv /tmp/rootfs_extract/.[!.]* scripts/sd-fuse/${DIST_DIR}/rootfs/ 2>/dev/null || true
        rm -rf /tmp/rootfs_extract

        # 验证
        if [ ! -d "scripts/sd-fuse/${DIST_DIR}/rootfs/bin" ]; then
          echo "ERROR: /bin not found in rootfs. Extraction failed."
          ls -la scripts/sd-fuse/${DIST_DIR}/rootfs || true
          exit 1
        fi
        echo "Rootfs prepared."

        # 部署 flippy kernel boot/dtb
        BOOT_TAR=$(find /tmp/flippy_extract -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find /tmp/flippy_extract -name "dtb-rockchip-*.tar.gz" | head -1)
        if [ -n "$BOOT_TAR" ] && [ -n "$DTB_TAR" ]; then
          echo "Deploying flippy kernel boot/dtb..."
          mkdir -p scripts/sd-fuse/${DIST_DIR}/boot/
          tar xzf "$BOOT_TAR" -C scripts/sd-fuse/${DIST_DIR}/boot/ --strip-components=1
          mkdir -p scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/
          tar xzf "$DTB_TAR" -C scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ --strip-components=1
        else
          echo "WARNING: flippy kernel boot/dtb not found, skipping deployment."
        fi

        # 清理无关目录
        rm -rf scripts/sd-fuse/${DIST_DIR}/build_dir 2>/dev/null || true
        rm -rf scripts/sd-fuse/${DIST_DIR}/tmp 2>/dev/null || true

        # 复制 genimage.cfg（如果不存在）
        if [ ! -f "scripts/sd-fuse/genimage.cfg" ]; then
          echo "genimage.cfg not found, searching..."
          GENIMAGE_CFG=$(find . -name "genimage.cfg" | head -1)
          if [ -n "$GENIMAGE_CFG" ]; then
            echo "Found $GENIMAGE_CFG, copying to scripts/sd-fuse/"
            cp "$GENIMAGE_CFG" scripts/sd-fuse/genimage.cfg
          else
            echo "WARNING: genimage.cfg not found."
          fi
        fi

        echo "Final directory structure of scripts/sd-fuse/${DIST_DIR}:"
        ls -la scripts/sd-fuse/${DIST_DIR} || true
        echo "Prepared sd-img environment"

    # ---------- 构建镜像（带详细调试） ----------
    - name: Build sd image with flippy kernel
      id: build_sd_image
      run: |
        cd project
        export TOPDIR=$(pwd)
        export FRIENDLYWRT_SRC=$TOPDIR
        export BOARD=rk3568
        export TARGET_IMAGE_DIRNAME="${{ steps.config.outputs.dist_dir }}"

        # 调试信息
        echo "=== Environment ==="
        env | sort
        echo "=== Checking genimage ==="
        which genimage || echo "genimage not found!"
        genimage --version || echo "genimage version failed"
        echo "=== Checking target directory ==="
        ls -la scripts/sd-fuse/${{ steps.config.outputs.dist_dir }}/
        echo "=== Checking boot contents ==="
        ls -la scripts/sd-fuse/${{ steps.config.outputs.dist_dir }}/boot/ || echo "boot empty"
        echo "=== Checking genimage.cfg ==="
        cat scripts/sd-fuse/genimage.cfg || echo "genimage.cfg missing"

        mkdir -p out
        cd scripts/sd-fuse
        echo "Running mk-sd-image.sh with bash -x for verbose trace..."
        if ! bash -x ./mk-sd-image.sh "${{ steps.config.outputs.dist_dir }}" "${TOPDIR}/out/${{ steps.config.outputs.img_filename }}" > /tmp/mk.log 2>&1; then
          echo "mk-sd-image.sh failed with exit code $?."
          echo "=== Full output (stdout+stderr) ==="
          cat /tmp/mk.log
          exit 1
        else
          echo "mk-sd-image.sh succeeded."
          echo "=== Output ==="
          cat /tmp/mk.log
        fi

        cd ${TOPDIR}
        if [ -f "out/${{ steps.config.outputs.img_filename }}" ]; then
          echo "Image generated successfully: out/${{ steps.config.outputs.img_filename }}"
          mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        else
          echo "ERROR: Image file not found: out/${{ steps.config.outputs.img_filename }}"
          ls -la out/ || true
          exit 1
        fi

        # 打包 tgz
        cd scripts/sd-fuse
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
          echo "ERROR: image directory ${{ steps.config.outputs.dist_dir }} not found"
          ls -la
          exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../artifact/
        cd ../..
        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ---------- 自动触发构建（watch 事件） ----------
  build_auto:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: |
      github.event.repository.owner.id == github.event.sender.id &&
      github.event_name == 'watch'
    strategy:
      matrix:
        VERSION: ['24.10', '25.12']
        SET: [docker, non-docker]
    steps:
    - name: Show build configuration
      run: |
        echo "Auto building version: ${{ matrix.VERSION }}, type: ${{ matrix.SET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends \
          build-essential libncurses5-dev libncursesw5-dev \
          gawk git rsync wget time file unzip bc bzip2 \
          cpio python3 python3-pyelftools device-tree-compiler \
          flex bison qemu-user-static debootstrap \
          genimage
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3568.xml --repo-url=https://github.com/friendlyarm/repo  --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse  --no-clone-bundle
        repo sync -c toolchain  --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh

    - name: Prepare dot config and feeds
      run: |
        cd project
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}
        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3568/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Add customize packages
      run: |
        cd project
        bash ../scripts/add_packages.sh

    - name: Update config after custom packages
      run: |
        cd project
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt
        cd friendlywrt
        echo "Enabling Clashoo packages in .config..."
        sed -i 's/^# CONFIG_PACKAGE_clashoo is not set$/CONFIG_PACKAGE_clashoo=y/' .config || echo "CONFIG_PACKAGE_clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-clashoo is not set$/CONFIG_PACKAGE_luci-app-clashoo=y/' .config || echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set$/CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y/' .config || echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
        sed -i 's/^# CONFIG_PACKAGE_luci-theme-bootstrap is not set$/CONFIG_PACKAGE_luci-theme-bootstrap=y/' .config || echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        make oldconfig

    - name: Verify config
      run: |
        cd project/friendlywrt
        echo "=== Checking .config for custom packages ==="
        grep -E "CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-theme-bootstrap|kmod-inet-diag)" .config || echo "WARNING: Some packages not found"

    - name: Prepare config for img
      id: config
      run: |
        cd project
        CPU=rk3568
        case $CPU in
        rk3568)
          MODEL=R5S-R5C-Series
          ;;
        *)
          echo "unknow cpu"
          exit 1
          ;;
        esac
        [ "${{ matrix.SET }}" == "docker" ] && SUFFIX="-docker"
        IMG_FILE=${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.img
        TGZ_FILE=images-${MODEL}-FriendlyWrt-flippy-${{ matrix.VERSION }}${SUFFIX}.tgz
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }}|awk -F . '{print $1}')${SUFFIX}

        CONFIG=rockchip${SUFFIX}
        cat > .current_config.mk <<EOL
        . device/friendlyelec/$CPU/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=${CONFIG}
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT
        echo "archive_filename=$TGZ_FILE" >> $GITHUB_OUTPUT
        echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Download rootfs package
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        DATES=(
          $(date +%Y-%m-%d)
          $(date -d "1 day ago" +%Y-%m-%d)
          $(date -d "2 days ago" +%Y-%m-%d)
        )
        FOUND=false
        for DATE in "${DATES[@]}"; do
          BASE_TAG="FriendlyWrt-flippy-${DATE}"
          if gh release view "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "^${ROOTFS_FILE}$"; then
            echo "Found $ROOTFS_FILE in release $BASE_TAG, downloading..."
            gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ROOTFS_FILE" --dir ../artifact/
            FOUND=true
            break
          fi
          TAGS=$(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${BASE_TAG}(-[0-9]+)?$" | sort -V -r || true)
          for tag in $TAGS; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q "^${ROOTFS_FILE}$"; then
              echo "Found $ROOTFS_FILE in release $tag, downloading..."
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$ROOTFS_FILE" --dir ../artifact/
              FOUND=true
              break 2
            fi
          done
        done
        if [ "$FOUND" = "false" ]; then
          echo "ERROR: No rootfs package found in any release (checked dates: ${DATES[*]}). Please run a full build first to generate rootfs-friendlywrt-*.tgz."
          exit 1
        fi

    - name: Prepare official rootfs for sd-img
      run: |
        cd project
        SUFFIX="${{ steps.config.outputs.suffix }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${SUFFIX}.tgz"
        mkdir -p friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip
        tar xzf "../artifact/$ROOTFS_FILE" --strip-components=3 -C friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip
        mkdir -p friendlywrt/bin/targets/rockchip/armv8/packages
        if [ ! -f friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip/usr/lib/os-release ]; then
          mkdir -p friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip/usr/lib
          echo "ID=openwrt" > friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip/usr/lib/os-release
        fi
        echo "Official rootfs prepared"

    - name: Compile uboot and disable kernel check
      run: |
        cd project
        ./build.sh uboot
        sed -i '/please build kernel first/d' build.sh
        mkdir -p friendlywrt/kernel
        touch friendlywrt/kernel/.built
        echo "U-boot compiled and kernel check completely disabled."

    - name: Get latest flippy kernel version
      id: flippy_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Fetching latest flippy kernel version from ophub/kernel release kernel_flippy..."
        ASSETS=$(gh release view kernel_flippy --repo ophub/kernel --json assets --jq '.assets[].name')
        VERSIONS=$(echo "$ASSETS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz//')
        if [ -z "$VERSIONS" ]; then
          echo "ERROR: No kernel tarballs found in kernel_flippy release"
          exit 1
        fi
        LATEST=$(echo "$VERSIONS" | sort -V | tail -1)
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest flippy kernel version: $LATEST"

    - name: Download and deploy flippy kernel
      run: |
        cd project
        KERNEL_VER="${{ steps.flippy_version.outputs.version }}"
        echo "Downloading flippy kernel $KERNEL_VER from ophub/kernel (kernel_flippy release)"
        wget -q https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VER}.tar.gz -O /tmp/kernel_all.tar.gz

        mkdir -p /tmp/flippy_extract
        tar xzf /tmp/kernel_all.tar.gz -C /tmp/flippy_extract

        KERNEL_DIR="/tmp/flippy_extract/$KERNEL_VER"
        if [ ! -d "$KERNEL_DIR" ]; then
          KERNEL_DIR=$(find /tmp/flippy_extract -maxdepth 1 -type d -name "*$KERNEL_VER*" | head -1)
        fi
        if [ -z "$KERNEL_DIR" ] || [ ! -d "$KERNEL_DIR" ]; then
          echo "ERROR: Kernel directory not found"
          ls -la /tmp/flippy_extract
          exit 1
        fi
        echo "Kernel directory: $KERNEL_DIR"

        BOOT_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "dtb-rockchip-*.tar.gz" | head -1)
        MODULES_TAR=$(find "$KERNEL_DIR" -maxdepth 1 -name "modules-*.tar.gz" | head -1)

        if [ -z "$BOOT_TAR" ] || [ -z "$DTB_TAR" ] || [ -z "$MODULES_TAR" ]; then
          echo "ERROR: Could not find boot, dtb, or modules archives. Listing contents:"
          ls -laR "$KERNEL_DIR"
          exit 1
        fi

        echo "Found boot: $BOOT_TAR, dtb: $DTB_TAR, modules: $MODULES_TAR"

        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        echo "Deploying flippy kernel to scripts/sd-fuse/${DIST_DIR}"

        mkdir -p scripts/sd-fuse/${DIST_DIR}/boot/
        tar xzf "$BOOT_TAR" -C scripts/sd-fuse/${DIST_DIR}/boot/ --strip-components=1

        mkdir -p scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/
        tar xzf "$DTB_TAR" -C scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ --strip-components=1

        mkdir -p /tmp/flippy_modules
        tar xzf "$MODULES_TAR" -C /tmp/flippy_modules

        echo "Flippy kernel deployed."

    - name: Inject flippy modules into official rootfs
      run: |
        cd project
        ROOTFS_DIR="friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip"
        if [ ! -d "$ROOTFS_DIR" ]; then
          echo "ERROR: Official rootfs directory $ROOTFS_DIR not found"
          exit 1
        fi
        MODULES_DIR_NAME=$(ls /tmp/flippy_modules | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-flippy-[0-9]+\+?$' | head -1)
        if [ -z "$MODULES_DIR_NAME" ]; then
          echo "ERROR: Could not determine modules directory name"
          ls -la /tmp/flippy_modules
          exit 1
        fi
        echo "Modules directory name: $MODULES_DIR_NAME"
        rm -rf "$ROOTFS_DIR/lib/modules" 2>/dev/null || true
        mkdir -p "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME"
        cp -r /tmp/flippy_modules/$MODULES_DIR_NAME/* "$ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME/"
        find "$ROOTFS_DIR/lib/modules" -type f -exec chmod 644 {} \;
        echo "Modules injected to $ROOTFS_DIR/lib/modules/$MODULES_DIR_NAME"

    # ---------- 准备 sd-img 环境（自动任务） ----------
    - name: Prepare sd-img environment
      run: |
        cd project
        TOPDIR=$(pwd)
        DIST_DIR="${{ steps.config.outputs.dist_dir }}"
        ROOTFS_FILE="rootfs-friendlywrt-${{ matrix.VERSION }}${{ steps.config.outputs.suffix }}.tgz"

        find scripts/sd-fuse -type d > /tmp/sd_fuse_dirs.txt
        cp -r device configs .current_config.mk friendlywrt/.config scripts/sd-fuse/
        while read -r dir; do
          if [ "$dir" != "scripts/sd-fuse" ]; then
            cp -r device configs .current_config.mk friendlywrt/.config "$dir/"
          fi
        done < /tmp/sd_fuse_dirs.txt

        mkdir -p friendlywrt/kernel friendlywrt/u-boot friendlywrt/toolchain
        touch friendlywrt/kernel/.built friendlywrt/u-boot/.built friendlywrt/toolchain/.built

        rm -rf scripts/sd-fuse/${DIST_DIR}
        mkdir -p scripts/sd-fuse/${DIST_DIR}

        echo "Extracting rootfs..."
        mkdir -p /tmp/rootfs_extract
        tar xzf "../artifact/${ROOTFS_FILE}" -C /tmp/rootfs_extract

        EXTRACTED_ITEMS=(/tmp/rootfs_extract/*)
        if [ ${#EXTRACTED_ITEMS[@]} -eq 1 ] && [ -d "${EXTRACTED_ITEMS[0]}" ]; then
          SUBDIR="${EXTRACTED_ITEMS[0]}"
          mv "$SUBDIR"/* /tmp/rootfs_extract/
          rmdir "$SUBDIR"
        fi

        mkdir -p scripts/sd-fuse/${DIST_DIR}/rootfs
        mv /tmp/rootfs_extract/* scripts/sd-fuse/${DIST_DIR}/rootfs/
        mv /tmp/rootfs_extract/.[!.]* scripts/sd-fuse/${DIST_DIR}/rootfs/ 2>/dev/null || true
        rm -rf /tmp/rootfs_extract

        if [ ! -d "scripts/sd-fuse/${DIST_DIR}/rootfs/bin" ]; then
          echo "ERROR: /bin not found in rootfs. Extraction failed."
          ls -la scripts/sd-fuse/${DIST_DIR}/rootfs || true
          exit 1
        fi
        echo "Rootfs prepared."

        BOOT_TAR=$(find /tmp/flippy_extract -name "boot-*.tar.gz" | head -1)
        DTB_TAR=$(find /tmp/flippy_extract -name "dtb-rockchip-*.tar.gz" | head -1)
        if [ -n "$BOOT_TAR" ] && [ -n "$DTB_TAR" ]; then
          echo "Deploying flippy kernel boot/dtb..."
          mkdir -p scripts/sd-fuse/${DIST_DIR}/boot/
          tar xzf "$BOOT_TAR" -C scripts/sd-fuse/${DIST_DIR}/boot/ --strip-components=1
          mkdir -p scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/
          tar xzf "$DTB_TAR" -C scripts/sd-fuse/${DIST_DIR}/dtb/rockchip/ --strip-components=1
        else
          echo "WARNING: flippy kernel boot/dtb not found, skipping deployment."
        fi

        rm -rf scripts/sd-fuse/${DIST_DIR}/build_dir 2>/dev/null || true
        rm -rf scripts/sd-fuse/${DIST_DIR}/tmp 2>/dev/null || true

        if [ ! -f "scripts/sd-fuse/genimage.cfg" ]; then
          echo "genimage.cfg not found, searching..."
          GENIMAGE_CFG=$(find . -name "genimage.cfg" | head -1)
          if [ -n "$GENIMAGE_CFG" ]; then
            echo "Found $GENIMAGE_CFG, copying to scripts/sd-fuse/"
            cp "$GENIMAGE_CFG" scripts/sd-fuse/genimage.cfg
          else
            echo "WARNING: genimage.cfg not found."
          fi
        fi

        echo "Final directory structure of scripts/sd-fuse/${DIST_DIR}:"
        ls -la scripts/sd-fuse/${DIST_DIR} || true
        echo "Prepared sd-img environment"

    # ---------- 构建镜像（自动任务） ----------
    - name: Build sd image with flippy kernel
      id: build_sd_image
      run: |
        cd project
        export TOPDIR=$(pwd)
        export FRIENDLYWRT_SRC=$TOPDIR
        export BOARD=rk3568
        export TARGET_IMAGE_DIRNAME="${{ steps.config.outputs.dist_dir }}"

        echo "=== Environment ==="
        env | sort
        echo "=== Checking genimage ==="
        which genimage || echo "genimage not found!"
        genimage --version || echo "genimage version failed"
        echo "=== Checking target directory ==="
        ls -la scripts/sd-fuse/${{ steps.config.outputs.dist_dir }}/
        echo "=== Checking boot contents ==="
        ls -la scripts/sd-fuse/${{ steps.config.outputs.dist_dir }}/boot/ || echo "boot empty"
        echo "=== Checking genimage.cfg ==="
        cat scripts/sd-fuse/genimage.cfg || echo "genimage.cfg missing"

        mkdir -p out
        cd scripts/sd-fuse
        echo "Running mk-sd-image.sh with bash -x..."
        if ! bash -x ./mk-sd-image.sh "${{ steps.config.outputs.dist_dir }}" "${TOPDIR}/out/${{ steps.config.outputs.img_filename }}" > /tmp/mk.log 2>&1; then
          echo "mk-sd-image.sh failed with exit code $?."
          echo "=== Full output ==="
          cat /tmp/mk.log
          exit 1
        else
          echo "mk-sd-image.sh succeeded."
          echo "=== Output ==="
          cat /tmp/mk.log
        fi

        cd ${TOPDIR}
        if [ -f "out/${{ steps.config.outputs.img_filename }}" ]; then
          echo "Image generated successfully: out/${{ steps.config.outputs.img_filename }}"
          mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        else
          echo "ERROR: Image file not found: out/${{ steps.config.outputs.img_filename }}"
          ls -la out/ || true
          exit 1
        fi

        cd scripts/sd-fuse
        if [ ! -d "${{ steps.config.outputs.dist_dir }}" ]; then
          echo "ERROR: image directory ${{ steps.config.outputs.dist_dir }} not found"
          ls -la
          exit 1
        fi
        archive_dir="${{ steps.config.outputs.dist_dir }}-rk3568"
        mv "${{ steps.config.outputs.dist_dir }}" "${archive_dir}"
        tar czf "${{ steps.config.outputs.archive_filename }}" "${archive_dir}"
        mv ${{ steps.config.outputs.archive_filename }} ../../artifact/
        cd ../..
        cd ../artifact/
        gzip *.img

    - name: Upload images-XYZ.tgz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.archive_filename }}
        asset_name: ${{ steps.config.outputs.archive_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  # ---------- 清理中间产物 ----------
  cleanup_intermediate_assets:
    needs: [prepare_release, build_manual, build_auto]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-friendlywrt-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done

  cleanup_self:
    name: Cleanup Self Workflow History
    runs-on: ubuntu-latest
    needs: [prepare_release, build_manual, build_auto, cleanup_intermediate_assets]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 0
          retain_days: 0
          delete_workflow_pattern: "Build FriendlyWrt With Flippy Kernel (Fast)"
          repository: ${{ github.repository }}