name: Extract FriendlyWrt OS Info

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (留空则用官方仓库最新 release)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # 官方固件镜像仓库（不是自编译仓库）
  SOURCE_REPO: 'tmxia/FriendlyWrt'

jobs:
  resolve_tag:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Pick release tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            echo "Using user-provided tag: $TAG"
          else
            TAG=$(gh release list --repo "$SOURCE_REPO" --limit 1 --json tagName --jq '.[0].tagName')
            echo "Auto-selected latest tag from $SOURCE_REPO: $TAG"
          fi
          [ -n "$TAG" ] || { echo "ERROR: no release tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: List available assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.pick.outputs.tag }}
        run: |
          echo "Assets in $SOURCE_REPO @ $RELEASE_TAG:"
          gh release view "$RELEASE_TAG" --repo "$SOURCE_REPO" --json assets \
            --jq '.assets[].name' | sort

  extract:
    needs: resolve_tag
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version: ['24.10', '25.12']
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y kpartx

      - name: Download img.gz (${{ matrix.version }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve_tag.outputs.tag }}
        run: |
          IMG="R5S-R5C-Series-FriendlyWrt-${{ matrix.version }}-docker.img.gz"
          echo "Source:  $SOURCE_REPO"
          echo "Release: $RELEASE_TAG"
          echo "Asset:   $IMG"
          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPO" \
            --pattern "$IMG" \
            --output firmware.img.gz \
            --clobber
          ls -lh firmware.img.gz

      - name: Extract openwrt_release (${{ matrix.version }})
        id: extract
        run: |
          gunzip -f firmware.img.gz

          sudo kpartx -av firmware.img

          ID=""; REL=""; ARCH=""; TGT=""; FOUND=""
          for dev in /dev/mapper/loop*p*; do
            [ -e "$dev" ] || continue
            MNT=$(mktemp -d)
            for fstype in "" "-t ext4" "-t squashfs"; do
              if sudo mount -o ro $fstype "$dev" "$MNT" 2>/dev/null; then
                if [ -f "$MNT/etc/openwrt_release" ]; then
                  ID=$(  sed -n "s/^DISTRIB_ID=['\"]\([^'\"]*\)['\"].*/\1/p"       "$MNT/etc/openwrt_release")
                  REL=$( sed -n "s/^DISTRIB_RELEASE=['\"]\([^'\"]*\)['\"].*/\1/p"  "$MNT/etc/openwrt_release")
                  ARCH=$(sed -n "s/^DISTRIB_ARCH=['\"]\([^'\"]*\)['\"].*/\1/p"     "$MNT/etc/openwrt_release")
                  TGT=$( sed -n "s/^DISTRIB_TARGET=['\"]\([^'\"]*\)['\"].*/\1/p"   "$MNT/etc/openwrt_release")
                  FOUND="$dev"
                  sudo umount "$MNT"
                  break 2
                fi
                sudo umount "$MNT"
              fi
            done
            rmdir "$MNT" 2>/dev/null || true
          done

          sudo kpartx -d firmware.img
          rm -f firmware.img

          echo "===== [${{ matrix.version }}] $FOUND ====="
          echo "DISTRIB_ID      = $ID"
          echo "DISTRIB_RELEASE = $REL"
          echo "DISTRIB_ARCH    = $ARCH"
          echo "DISTRIB_TARGET  = $TGT"

          [ -n "$ARCH" ] || { echo "❌ openwrt_release 提取失败"; exit 1; }

          {
            echo "id=$ID"
            echo "release=$REL"
            echo "arch=$ARCH"
            echo "target=$TGT"
          } >> "$GITHUB_OUTPUT"

      - name: Summary (${{ matrix.version }})
        run: |
          {
            echo "### ${{ matrix.version }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| DISTRIB_ID | \`${{ steps.extract.outputs.id }}\` |"
            echo "| DISTRIB_RELEASE | \`${{ steps.extract.outputs.release }}\` |"
            echo "| DISTRIB_ARCH | \`${{ steps.extract.outputs.arch }}\` |"
            echo "| DISTRIB_TARGET | \`${{ steps.extract.outputs.target }}\` |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY